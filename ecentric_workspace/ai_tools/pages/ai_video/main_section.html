<script>
/* AI Live - Phien live + Lich live + Lich su phien (18/10, fix10d): route #/lives, #/live/<ma>, #/schedule[/<ngay>],
   #/history. Script rieng; window.ecAiLive.load goi window.ecAiLiveSess.load. Nguon goc phien + lich = ERP
   (DocType EC AI Live Session); chi tiet "dang phat / sap phat / hang cau hoi" do app gui kem tin hieu. */
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_live.controllers.api.";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ST = { problem: ["Có vấn đề", "p-bad"], on_air: ["Đang live", "p-ok"], scheduled: ["Có lịch", "p-navy"], off: ["Tắt / chưa có lịch", "p-idle"] };
  const APP = { live: "Đang live", preflight: "Kiểm tra trước giờ", ending: "Đang kết thúc", idle: "Chờ", stopped: "Đã dừng", error: "Lỗi app" };
  const ACT = { pause_ai: "Tạm dừng AI", resume_ai: "Tiếp tục AI", skip_clip: "Bỏ clip đang phát", play_faq: "Phát FAQ ngay", start_race: "Bắt đầu đua vịt", stop_race: "Dừng đua vịt" };
  const CMD_ST = { Queued: ["Chờ app nhận", "p-idle"], Sent: ["App đã nhận", "p-run"], Done: ["Xong", "p-ok"], Failed: ["Lỗi", "p-bad"], Expired: ["Hết hạn", "p-warn"] };
  const KIND = { main: "Video chính", faq: "FAQ", answer: "Trả lời", greet: "Chào", readback: "Đọc câu hỏi", generic: "Clip chung", putdown: "Hạ SP", pickup: "Nâng SP" };
  const REASON = { schedule_end: "Hết giờ theo lịch", manual: "Dừng tay", error: "Lỗi", restart: "Khởi động lại", other: "Khác" };
  const WD = ["", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ nhật"];
  const P = { list: null, f: { brand: "", platform: "", machine: "", status: "" }, sel: new Set(), detail: null, week: null, wk: "", by: "machine",
    hist: null, hf: { brand: "", days: 7 }, timer: null, tick: null, failed: 0, thumbs: new Map(), drag: null, skew: 0,
    day: "", dayData: null, mo: "", moData: null, sync: null, syncSel: null, syncKnown: null, syncUrg: new Set(), syncPoll: 0, sc: { a: 0, b: 1440 } };  /* fix10g */
  const hash = () => location.hash.replace(/^#\/?/, "");
  const on = () => /^(lives|live\/|schedule|history|watch)/.test(hash());
  const view = () => $("av-view");

  const serverMsg = (b) => { try { const a = JSON.parse(b._server_messages || "[]"); if (a.length) return JSON.parse(a[0]).message || ""; } catch (e) { /* bo qua */ } return ""; };
  async function call(method, args, http) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (http === "GET") { const qs = new URLSearchParams(Object.entries(args || {}).filter(([, v]) => v != null && v !== "")).toString(); if (qs) url += "?" + qs; }
    else { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = (window.frappe && window.frappe.csrf_token) || ""; opts.body = JSON.stringify(args || {}); }
    let res;
    try { res = await fetch(url, opts); } catch (e) { return { success: false, message: "Mất kết nối mạng.", data: null }; }
    if (res.status === 401) return { success: false, message: "Phiên đăng nhập hết hạn – tải lại trang.", data: null };
    let body = {}; try { body = await res.json(); } catch (e) { /* khong phai JSON */ }
    const m = body.message; if (m && typeof m === "object" && typeof m.success === "boolean") return m;
    if (!res.ok) return { success: false, message: serverMsg(body) || ("Máy chủ báo lỗi (" + res.status + ")."), data: null };
    return { success: true, message: "", data: m };
  }
  let tt; function toast(msg, err) { const t = $("av-toast"); if (!t) return; t.textContent = msg; t.className = "av-toast show" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 2600); }
  const vn = (ts) => new Date((ts + 7 * 3600) * 1000);
  const hhmm = (ts) => { const d = vn(ts); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); };
  const dmy = (ts) => { const d = vn(ts); return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
  const ago = (s) => { s = Math.max(0, Math.round(Number(s) || 0)); if (s < 60) return s + " giây"; if (s < 3600) return Math.floor(s / 60) + " phút"; if (s < 86400) return Math.floor(s / 3600) + " giờ"; return Math.floor(s / 86400) + " ngày"; };
  const dur = (s) => { s = Math.round(Number(s) || 0); const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? h + " giờ " + (m ? m + " phút" : "") : m + " phút"; };
  const num = (v, d) => (v == null || v === "" ? "–" : Number(v).toLocaleString("vi-VN", { maximumFractionDigits: d || 0 }));
  const usd = (v) => (v == null ? "–" : "$" + Number(v).toFixed(2));
  const nowS = () => Date.now() / 1000 + P.skew;
  const pill = (st) => { const x = ST[st] || ST.off; return `<span class="av-pill ${x[1]}">${x[0]}</span>`; };
  const nextTxt = (n, now) => { if (!n) return "–"; if (n.start <= now) return "Đang trong khung, đến " + hhmm(n.end); const d0 = dmy(now), d1 = dmy(n.start); return (d0 === d1 ? "Hôm nay " : d1 + " ") + hhmm(n.start) + "–" + hhmm(n.end); };
  function stop() { clearTimeout(P.timer); clearInterval(P.tick); P.timer = P.tick = null; }
  const tabs = (cur) => `<div class="ls-tabs">${[["lives", "Phiên live"], ["schedule", "Lịch live"], ["history", "Lịch sử phiên"], ["races", "Đua vịt"], ["monitor", "Trực live"]]
    .map(([r, l]) => `<a class="av-chip ${cur === r ? "on" : ""}" href="#/${r}">${l}</a>`).join("")}</div>`;
  const crumbs = (x) => `<div class="av-eyebrow" style="color:rgba(255,255,255,.75)"><a href="#/" style="color:inherit">AI Video hàng loạt</a> / ${x}</div>`;
  const fail = (title, msg, retry) => { view().innerHTML = `<section class="av-hero"><div>${crumbs(title)}<h1>${title}</h1></div></section><div class="av-callout bad"><div>${esc(msg || "Không tải được.")}</div></div>${retry ? `<div><button class="av-outline" data-ls="retry">Thử lại</button></div>` : ""}`; };

  /* ---------- route ---------- */
  async function load(h) {
    stop(); h = h == null ? hash() : h;
    if ($("av-modal") && !$("av-modal").hidden) closeModal();
    const v = view(); v.classList.add("ls-wide");
    let m = /^live\/([^/?]+)(\/giai)?/.exec(h); if (m) { P.dtab = m[2] ? "giai" : ""; return loadDetail(decodeURIComponent(m[1])); }
    m = /^schedule\/(day|month|sync)(?:\/([0-9-]{7,10}))?/.exec(h);   /* fix10g: Gantt ngay / Thang / Dong bo */
    if (m) { if (m[1] === "day") { P.day = m[2] || P.day || ""; return loadDay(); } if (m[1] === "month") { P.mo = m[2] || P.mo || ""; return loadMonth(); } return loadSync(); }
    m = /^schedule(?:\/(\d{4}-\d{2}-\d{2}))?/.exec(h); if (m) { P.wk = m[1] || P.wk || ""; return loadWeek(); }
    if (/^history/.test(h)) return loadHistory();
    if (/^watch/.test(h)) return loadWatch();
    return loadList();
  }
  window.addEventListener("hashchange", () => { if (!/^watch/.test(hash())) closeWatch(); if (!on()) { stop(); const v = view(); if (v) v.classList.remove("ls-wide"); } });

  /* ---------- danh sach phien ---------- */
  async function loadList(quiet) {
    if (!quiet && !P.list) view().innerHTML = `<section class="av-hero"><div>${crumbs("Phiên live")}<h1>Phiên live</h1><div class="sub">Đang tải…</div></div></section>`;
    const r = await call("list_sessions", P.f, "GET");
    if (!/^lives/.test(hash())) return;
    if (r.success) { P.list = r.data; P.failed = 0; P.skew = r.data.server_time - Date.now() / 1000; renderList(); }
    else { P.failed++; if (!P.list) return fail("Phiên live", r.message, true); stampList(); }
    P.timer = setTimeout(() => loadList(true), 15000);
  }
  function stampList() { const el = $("ls-upd"); if (!el || !P.list) return; el.className = "ls-upd" + (P.failed ? " bad" : ""); el.textContent = P.failed ? `Mất kết nối – đang thử lại (số liệu lúc ${hhmm(P.list.server_time)})` : `Cập nhật ${hhmm(P.list.server_time)} · tự làm mới 15 giây/lần`; }
  function renderList() {
    const d = P.list, c = d.counts || {}, fa = d.facets || {}, now = d.server_time;
    const stat = (k, label, hl) => `<button class="av-stat av-stat-btn${hl ? " hl" : ""}" data-ls-status="${P.f.status === k ? "" : k}"><span>${label}</span><b>${c[k] || 0}</b></button>`;
    const sel = (key, label, opts) => `<select data-ls-f="${key}" aria-label="${label}"><option value="">${label}: tất cả</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${P.f[key] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    P.sel = new Set([...P.sel].filter((id) => d.sessions.some((s) => s.id === id)));
    view().innerHTML = `
      <section class="av-hero"><div>${crumbs("Phiên live")}<h1>Phiên live</h1><div class="sub">Mọi phiên live của các brand trên mọi máy phát. Phiên + lịch tạo trên ERP, app trên máy phát tự lấy về. Bấm một dòng để xem chi tiết đang phát, sắp phát, câu hỏi của khách.</div></div>
        <div class="av-stats">${stat("problem", "Có vấn đề", c.problem)}${stat("on_air", "Đang live")}${stat("scheduled", "Có lịch")}${stat("off", "Tắt")}</div></section>
      ${tabs("lives")}
      <div class="ls-bar"><div class="ls-filters">${sel("brand", "Brand", (fa.brands || []).map((b) => [b, b]))}${sel("platform", "Sàn", (fa.platforms || []).map((b) => [b, b]))}${sel("machine", "Máy", (fa.machines || []).map((m) => [m.code, m.code + (m.label ? " · " + m.label : "")]))}
        ${P.f.status ? `<button class="av-chip on" data-ls-status="">${(ST[P.f.status] || ST.off)[0]} ✕</button>` : ""}</div>
        <div class="av-row"><span class="ls-upd" id="ls-upd"></span><a class="av-btn" href="#/watch">👁 Xem như khách</a><a class="av-gold" href="/app/ec-ai-live-session/new" target="_blank" rel="noopener">+ Thêm phiên</a></div></div>
      <div class="ls-bulk" id="ls-bulk" ${P.sel.size ? "" : "hidden"}><b id="ls-nsel">${P.sel.size}</b> phiên đã chọn<button class="av-btn sm" data-ls="bulk-on">Bật</button><button class="av-btn sm" data-ls="bulk-off">Tắt</button><button class="av-btn sm ghost" data-ls="bulk-clear">Bỏ chọn</button></div>
      ${d.sessions.length ? `<div class="av-panel"><table class="ls-table"><thead><tr><th><input type="checkbox" data-ls-all aria-label="Chọn tất cả" ${d.sessions.every((s) => P.sel.has(s.id)) ? "checked" : ""}></th><th>Phiên</th><th>Brand · Sàn</th><th>Máy</th><th>Trạng thái</th><th>Khung kế tiếp</th><th>Người xem</th><th>Chi phí hôm nay</th><th>Đang phát</th></tr></thead><tbody>
        ${d.sessions.map((s) => `<tr data-ls-open="${esc(s.id)}">
          <td><input type="checkbox" data-ls-sel="${esc(s.id)}" ${P.sel.has(s.id) ? "checked" : ""} aria-label="Chọn ${esc(s.title)}"></td>
          <td><span class="t">${esc(s.title)}</span><span class="s">${esc(s.id)}${s.shop_name ? " · " + esc(s.shop_name) : ""}</span></td>
          <td data-l="Brand · Sàn">${esc(s.brand || "—")} · ${esc(s.platform || "—")}</td>
          <td data-l="Máy">${esc(s.machine || "Chưa gán")}</td>
          <td data-l="Trạng thái">${pill(s.status)}${(s.reasons || []).length ? `<span class="ls-why" title="${esc(s.reasons.map((x) => x.text).join(" · "))}">${esc(s.reasons[0].text)}</span>` : ""}</td>
          <td data-l="Khung kế tiếp">${nextTxt(s.next, now)}</td>
          <td data-l="Người xem">${num(s.viewers)}</td>
          <td data-l="Chi phí hôm nay">${usd(s.cost_today_usd)}</td>
          <td data-l="Đang phát">${esc(s.now_playing || "–")}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="av-empty">${c.total ? "Không có phiên nào khớp bộ lọc." : 'Chưa có phiên live nào. Bấm <b>+ Thêm phiên</b> (chọn brand, sàn, máy phát, cổng OBS, Bộ live, khung giờ).'}</div>`}`;

  }
  async function bulk(enabled) {
    const names = [...P.sel]; if (!names.length) return;
    const r = await call("set_sessions_enabled", { names: JSON.stringify(names), enabled: enabled ? 1 : 0 });

    const errs = r.data.errors || [];
    toast(`${enabled ? "Đã bật" : "Đã tắt"} ${r.data.done.length} phiên` + (errs.length ? ` · ${errs.length} lỗi: ${errs[0].id} – ${errs[0].error}` : ""), !!errs.length);
    P.sel.clear(); loadList(true);
  }

  /* ---------- chi tiet phien ---------- */
  async function loadDetail(name, quiet) {
    if (!quiet) { P.detail = null; view().innerHTML = `<section class="av-hero"><div>${crumbs(`<a href="#/lives" style="color:inherit">Phiên live</a> / ${esc(name)}`)}<h1>${esc(name)}</h1><div class="sub">Đang tải…</div></div></section>`; }
    const r = await call("session_detail", { name }, "GET");
    const base = hash().replace(/\/giai$/, ""); if (base !== "live/" + encodeURIComponent(name) && base !== "live/" + name) return;
    if (r.success) { P.detail = r.data; P.failed = 0; P.skew = r.data.server_time - Date.now() / 1000; renderDetail(); pumpThumbs(); }
    else { P.failed++; if (!P.detail) return fail("Phiên live", r.message, true); }
    clearTimeout(P.timer); if (P.dtab !== "giai") P.timer = setTimeout(() => loadDetail(name, true), 10000);   /* tab Giai thuong tu lam moi rieng */
    if (!P.tick) P.tick = setInterval(paintProgress, 1000);
  }
  function shot(d, kind, label) {
    if (!d.key) return `<div class="ls-shot">${label}<br>chưa gán máy</div>`;
    if (!(d.thumbs || {})[kind]) return `<div class="ls-shot">${label}<br>chưa có ảnh</div>`;
    return `<div class="ls-shot"><img data-ls-img="${esc(d.key)}|${kind}" alt="${label} ${esc(d.title)}"><i>${label}</i></div>`;
  }
  function spark(samples, f, max) {
    const pts = (samples || []).filter((s) => s[f] != null); if (pts.length < 2) return `<svg viewBox="0 0 300 48" role="img" aria-label="Chưa đủ số liệu"><text x="150" y="28" text-anchor="middle" font-size="11" fill="currentColor" opacity=".5">Chưa đủ số liệu</text></svg>`;

  async function copyWeek() {

  /* ---------- lich live: dau trang chung + Gantt ngay / Thang / Dong bo (23/10, fix10g) ----------

  const VIEWS = [["day", "Gantt ngày", "#/schedule/day"], ["week", "Tuần", "#/schedule"], ["month", "Tháng", "#/schedule/month"], ["sync", "Đồng bộ", "#/schedule/sync"]];

  const legend = () => `<div class="lc-legend"><span><i style="background:var(--navy-wash);border:1px solid var(--navy-line)"></i>Lặp hằng tuần</span><span><i style="background:#fff7e0;border:1px solid #f0d58a"></i>Chỉ ngày này</span><span><i style="border:1.5px dashed var(--navy)"></i>Nháp (chưa phát hành)</span><span><i style="background:repeating-linear-gradient(135deg,#eef0fb 0 3px,#e1e5f7 3px 6px);border:1px solid var(--navy)"></i>Giữ giờ cũ</span><span><i style="background:var(--bad-bg);border:1px solid var(--bad)"></i>Vượt số live của máy</span>${/^schedule\/day/.test(hash()) ? `<span><i style="background:var(--ok)"></i>Thực tế lên sóng (✓ Đúng giờ · ⏰ Trễ · ✗ Lỡ · ⚡ Gián đoạn · ? Không có báo cáo)</span>` : ""}</div>`;

  /* Gantt ngay: moi dong = 1 may phat, chia theo kenh OBS; vach hong = bay gio */
  async function loadDay(quiet) {
    if (!quiet && !P.dayData) view().innerHTML = `<section class="av-hero"><div>${crumbs("Lịch live")}<h1>Lịch live</h1><div class="sub">Đang tải…</div></div></section>`;
    const day = P.day || vnToday();
    const [r, ra] = await Promise.all([call("week_schedule", { start: isoAdd(day, -1), days: 2 }, "GET"), call("schedule_actuals", { date: day }, "GET")]);
    if (!/^schedule\/day/.test(hash())) return;
    if (!r.success) return P.dayData ? toast(r.message || "Lỗi", true) : fail("Lịch live", r.message, true);
    P.act = ra.success ? ra.data : null;   /* fix10h: lop thuc te (push_slot_report); loi thi chi an lop nay */
    P.week = r.data; P.dayData = r.data; P.day = r.data.days[1]; P.skew = r.data.server_time - Date.now() / 1000; renderDay();
    clearTimeout(P.timer); P.timer = setTimeout(() => { if (/^schedule\/day/.test(hash()) && $("av-modal").hidden && !P.drag) loadDay(true); }, 60000);

  /* fix10h: thanh thuc te duoi khung ke hoach (B3): len song that / gian doan / chip Dung gio, Tre, Lo, Khong co bao cao */
  const ACT_TONE = { ok: "ok", warn: "warn", bad: "bad", idle: "idle" };
  function actHtml(r, day, top, now) {
    const lo = Date.parse(day + "T00:00:00+07:00") / 1000, rep = r.report || {};
    let a = r.start_ts, b = r.end_ts, real = false;
    if (rep.actual_start_ts) { a = rep.actual_start_ts; b = rep.actual_end_ts || Math.min(now, r.end_ts + 3 * 3600); real = true; }
    const m = (ts) => Math.max(P.sc.a, Math.min(1440, (ts - lo) / 60));
    if (m(b) <= m(a)) b = a + 60;
    const left = pctOf(m(a)), width = Math.max(0.6, pctOf(m(b)) - left);
    const ints = (rep.interruptions || []).map((x) => { const x1 = pctOf(m(x.from)), x2 = pctOf(m(x.to || now)); return `<i style="left:${((x1 - left) / width * 100).toFixed(2)}%;width:${Math.max(1.5, (x2 - x1) / width * 100).toFixed(2)}%"></i>`; }).join("");
    const txt = r.chips.map((c) => c.text).join(" · ");
    const tip = `${r.title} · thực tế${rep.actual_start_ts ? " " + hhmm(rep.actual_start_ts) + "–" + (rep.actual_end_ts ? hhmm(rep.actual_end_ts) : "đang chạy") : ""} · ${txt}${rep.note ? " · " + rep.note : ""}`;
    return `<div class="lc-act t-${ACT_TONE[r.tone] || "idle"}${real ? "" : " plan"}" style="left:${left.toFixed(3)}%;width:${width.toFixed(3)}%;top:${top}px" title="${esc(tip)}">${ints}<span>${esc(txt)}</span></div>`;
  }
  function actsFor(day) { return P.act && P.act.date === day ? P.act.rows.filter((r) => r.chips.length) : []; }
  function renderDay() {
    const w = P.dayData, day = w.days[1], prev = w.days[0], now = nowS(), acts = actsFor(day);
    const nowMin = day === w.today ? (() => { const d = vn(now); return d.getUTCHours() * 60 + d.getUTCMinutes(); })() : -1;
    const blocks = (w.blocks || []).filter((b) => b.date === day || (b.date === prev && minOf(b.end) < minOf(b.start)));
    const first = Math.min(360, ...blocks.map((b) => spanOf(b, day)[0]), nowMin >= 0 ? nowMin : 1440);
    P.sc = { a: Math.floor(first / 60) * 60, b: 1440 }; const hn = 24 - P.sc.a / 60;
    const codes = new Set((w.machines || []).filter((m) => m.enabled).map((m) => m.code));
    blocks.forEach((b) => codes.add(b.machine || ""));
    acts.forEach((x) => { if (x.machine) codes.add(x.machine); });
    const rows = [...codes].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b)).map((code) => {
      const m = (w.machines || []).find((x) => x.code === code), mine = blocks.filter((b) => (b.machine || "") === code);
      const ports = [...new Set(mine.map((b) => b.obs_port || 0))].sort((a, b) => (a === 0) - (b === 0) || a - b);
      if (!ports.length) ports.push(0);
      const lanes = ports.map((port) => {
        const ends = [];
        const placed = mine.filter((b) => (b.obs_port || 0) === port).map((b) => [b, spanOf(b, day)]).sort((x, y) => x[1][0] - y[1][0]).map(([b, sp]) => {
          let r = ends.findIndex((e) => e <= sp[0]); if (r < 0) { r = ends.length; ends.push(0); } ends[r] = sp[1]; return blockHtml(b, day, r); });
        const mineAct = acts.filter((x) => x.machine === code && ((x.obs_port || 0) === port || (!ports.includes(x.obs_port || 0) && port === ports[0])));
        const aTop = 8 + Math.max(1, ends.length) * 26, actRow = mineAct.map((x) => actHtml(x, day, aTop, now)).join("");
        return `<div class="gt-k"><span>${port ? "OBS " + port : ports.length > 1 ? "Chưa đặt cổng" : "—"}</span><div class="lc-track" style="--hn:${hn};min-height:${aTop + (actRow ? 20 : 0)}px" data-lc-track="${esc(code)}|${day}">${placed.join("")}${actRow}${nowMin >= 0 ? `<i class="lc-now" style="left:${pctOf(nowMin).toFixed(3)}%" aria-hidden="true"></i>` : ""}</div></div>`;
      }).join("");
      return `<div class="gt-m"><div class="gt-mh"><b>${esc(code || "Chưa gán máy")}</b>${m ? `<small>${esc(m.label || "")}${m.label ? " · " : ""}tối đa ${m.max_lives} live</small>${syncPill(m.sync)}` : ""}</div><div class="gt-lanes">${lanes}</div></div>`;
    }).join("");
    const mob = blocks.slice().sort((a, b) => a.start_ts - b.start_ts).map((b) => { const s = sessOf(b.session) || {};
      const ac = acts.find((x) => x.live === b.session && Math.abs(x.start_ts - b.start_ts) < 60);
      return `<button class="lc-chip${b.conflict ? " bad" : ""}" ${b.held ? `data-lc-held="${esc(b.session)}|${b.held_until}|${b.held_why}"` : `data-lc-blk="${esc(b.session)}|${b.slot}|${b.date}"`}><span><b>${b.start}–${b.end}</b> ${esc(s.title || b.session)}${ac ? `<span class="lc-actx t-${ACT_TONE[ac.tone] || "idle"}">${esc(ac.chips.map((c) => c.text).join(" · "))}</span>` : ""}</span><span class="av-hint">${esc(b.machine || "chưa gán")}${b.obs_port ? " · " + b.obs_port : ""}${b.held ? " · giữ giờ cũ" : b.changed ? " · nháp" : ""}</span></button>`; }).join("") || `<div class="av-empty">Không có khung live nào trong ngày.</div>`;
    const extraAct = acts.filter((x) => x.off_plan || x.stale_plan).map((x) => `<div class="lc-chip"><span><b>${hhmm(x.start_ts)}–${hhmm(x.end_ts)}</b> ${esc(x.live)}<span class="lc-actx t-${ACT_TONE[x.tone] || "idle"}">${esc(x.chips.map((c) => c.text).join(" · "))}</span></span><span class="av-hint">${esc(x.machine)}</span></div>`).join("");
    const sm = (P.act && P.act.date === day && P.act.summary) || null;
    const wdN = new Date(day + "T00:00:00Z").getUTCDay() || 7, nConf = (w.conflicts || []).length;
    const onAir = blocks.filter((b) => b.start_ts <= now && now < b.end_ts).length;
    view().innerHTML = schedHead("day", "Mỗi dòng là một máy phát, chia theo kênh OBS. Kéo trên dải giờ để thêm khung, kéo khối để đổi giờ, bấm khối để sửa giờ / đổi máy / kênh. Mọi sửa đổi vào bản nháp.",
      stat("Bản lịch", w.version) + stat("Khung trong ngày", blocks.length) + stat("Đang trong giờ live", onAir) + stat("Chỗ vượt máy", nConf, nConf)
        + (sm ? stat("Lỡ / không báo cáo", sm.missed + sm.no_report, sm.missed + sm.no_report) : ""), w.drafts) + `
      <div class="lc-head"><div class="av-row"><button class="av-btn" data-lc-day="-1" aria-label="Ngày trước">←</button><b>${WD[wdN]} ${day.split("-").reverse().join("/")}</b><button class="av-btn" data-lc-day="1" aria-label="Ngày sau">→</button><button class="av-btn sm" data-lc-day="0">Hôm nay</button></div>${legend()}</div>
      ${(w.sessions || []).length ? "" : `<div class="av-callout"><div>Chưa có phiên live. Bấm <b>+ Thêm phiên</b> để tạo (brand, sàn, máy, cổng OBS), rồi quay lại đây xếp giờ.</div></div>`}
      <div class="lc-desk"><div class="gt"><div class="gt-hours" style="--hn:${hn}"><div></div><div>${hoursRow()}</div></div>${rows || `<div class="av-empty">Chưa có máy phát.</div>`}</div></div>
      <div class="lc-mob">${mob}${extraAct}</div>`;
  }

  /* Thang: moi o = 1 ngay (so lan live, vai khung noi bat, thanh = luc dong nhat / so live toi da cua may) */
  async function loadMonth(quiet) {
    if (!quiet && !P.moData) view().innerHTML = `<section class="av-hero"><div>${crumbs("Lịch live")}<h1>Lịch live</h1><div class="sub">Đang tải…</div></div></section>`;
    const r = await call("month_schedule", { month: P.mo || "" }, "GET");
    if (!/^schedule\/month/.test(hash())) return;
    if (!r.success) return P.moData ? toast(r.message || "Lỗi", true) : fail("Lịch live", r.message, true);
    P.moData = r.data; P.mo = r.data.month; renderMonth();
  }
  function renderMonth() {
    const d = P.moData, caps = {}; (d.machine_util || []).forEach((m) => { caps[m.code] = m.max_lives || 2; });
    const [y, mo] = d.month.split("-").map(Number);
    const cells = d.days.map((x) => {
      const load = Math.max(0, ...Object.entries(x.peak || {}).map(([c, k]) => k / (caps[c] || 2)));
      const pct = Math.min(100, Math.round(load * 100)), col = x.over.length ? "var(--bad)" : pct >= 100 ? "#b95f0a" : "#17845a";
      return `<a class="mo-c${x.in_month ? "" : " o"}${x.date === d.today ? " t" : ""}" href="#/schedule/day/${x.date}" aria-label="Ngày ${x.date.split("-").reverse().join("/")}: ${x.n} lần live">
        <div class="av-row" style="justify-content:space-between;gap:4px"><span class="d">${+x.date.slice(8)}</span>${x.over.length ? `<span class="av-pill p-bad">Vượt ${esc(x.over.join(", "))}</span>` : ""}</div>
        ${(x.chips || []).map((c) => `<span class="mo-chip"><i style="background:${brandDot(c.brand)}"></i><b>${c.start}</b> ${esc(c.title)}</span>`).join("")}

  const snap = (m) => Math.round(m / 15) * 15;
  const minsAt = (track, clientX) => { const r = track.getBoundingClientRect(); return Math.max(P.sc.a, Math.min(P.sc.b, P.sc.a + ((clientX - r.left) / r.width) * (P.sc.b - P.sc.a))); };

    if (e.target.closest && e.target.closest("[data-lc-held],.lc-act")) return;     /* fix10g: lan dang giu gio cu / fix10h: thanh thuc te - khong keo */
    const blk = e.target.closest && e.target.closest(".lc-desk [data-lc-blk]"), track = e.target.closest && e.target.closest(".lc-desk [data-lc-track]");
    if (!track) return;
    const x0 = minsAt(track, e.clientX);
    if (blk) { P.drag = { kind: "move", blk, track, x0, left0: parseFloat(blk.style.left), moved: false }; }
    else { const sel = document.createElement("div"); sel.className = "lc-sel"; track.appendChild(sel); P.drag = { kind: "new", track, sel, a: snap(x0), b: snap(x0) }; }
    track.setPointerCapture && track.setPointerCapture(e.pointerId); e.preventDefault();
  });

    const g = P.drag; if (!g) return;
    const x = minsAt(g.track, e.clientX);

    else { const dm = snap(x - g.x0); if (Math.abs(x - g.x0) > 4) g.moved = true; g.dm = dm; g.blk.classList.add("drag"); g.blk.style.left = Math.max(0, g.left0 + (dm / (P.sc.b - P.sc.a)) * 100) + "%"; }
  });

  /* ---------- xem nhu khach: tuong anh phia khach cua moi phien dang live (toan man hinh) ---------- */

  async function loadWatch() {

  function closeWatch() { if (W.el) { W.el.remove(); W.el = null; window.removeEventListener("resize", layoutWatch); } if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }

  const srcLabel = (t) => (t.source === "platform" ? t.platform || "Sàn" : SRC[t.source] || "Chưa có ảnh");

    $("vw-info").textContent = `${live} phiên${lost ? ` · ${lost} mất hình` : ""} · bấm ô để xử lý trên Trực live · làm mới ${d.refresh_s} giây/lần`;
    if (!live) { g.innerHTML = `<div style="text-align:center;color:#9ca3af">Không có phiên nào đang trong giờ live.</div>`; return; }

    g.innerHTML = d.tiles.map((t) => { const w = t.wall || { level: "ok" }, bad = w.level !== "ok";
      return `<div class="vw-t lv-${esc(w.level)}${t.stale ? " stale" : ""}" data-vw-go="${esc(t.key || t.id)}" tabindex="0" role="button" aria-label="${esc(t.title + " · " + (WL[w.level] || "") + (w.text ? " · " + w.text : "") + " – mở trên Trực live")}">
      ${t.source ? `<img data-vw-img="${esc(t.key)}|${t.source}" alt="">` : ""}<div class="h"><span><b>${esc(t.title)}</b> · ${esc(t.brand)}</span><span>${t.viewers != null ? "👁 " + num(t.viewers) : ""}</span></div>
      <div class="lost">${t.source ? "Mất hình" : "Chưa có ảnh phía khách"}<br>${t.source ? "ảnh cuối " + ago(t.age_s) + " trước" : "cần extension / điện thoại"}</div>

  function layoutWatch() {

  document.addEventListener("click", async (e) => {

.lr-w td.nm{white-space:normal;min-width:120px;font-weight:600}
.lr-w input[data-lr-note]{width:100%;min-width:140px;font-size:12.5px}
#ec-aiv-root .lr-w select.st-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
#ec-aiv-root .lr-w select.st-warn{border-color:#e5c07b;color:var(--warn);background:var(--warn-bg)}

.lr-bulk{position:fixed;right:24px;bottom:16px;z-index:50;width:max-content;max-width:calc(100vw - 32px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 6px 18px rgba(17,24,39,.25)}

  .lr-w table,.lr-w tbody{display:block}.lr-w thead{display:none}
  .lr-w tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 12px 10px 40px;position:relative;border-bottom:1px solid var(--line-soft)}

  .lr-w td.nm{order:-1;flex:1 1 100%;font-size:14px}.lr-w td[data-l]{font-size:12.5px}.lr-w td[data-l]::before{content:attr(data-l) ": ";color:var(--ink3)}
  .lr-w td:nth-child(6),.lr-w td:nth-child(7){flex:1 1 100%}.lr-w select,.lr-w input[data-lr-note]{width:100%}}

<script>
/* 18/10 fix10e: Dua vit (W20) - trang #/races (moi cuoc dua, loc brand / live / ngay, xuat CSV, cap nhat trao giai hang loat)
   + tab "Giai thuong" trong chi tiet phien (window.ecAiLiveRace.mount). Ket qua do app chot; ERP chi sua trang thai trao giai + ghi chu. */
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_live.controllers.api.";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const STP = { "Chưa trao": "st-warn", "Đã trao": "st-ok", "Không liên lạc được": "st-bad" };
  const STATUSES = Object.keys(STP);
  const OUT = { done: ["Đã đua xong", "p-ok"], not_enough: ["Chưa đủ người", "p-idle"], cancelled: ["Đã huỷ", "p-warn"], aborted_restart: ["Huỷ do app khởi động lại", "p-warn"] };
  const BY = { app: "bấm trên app", schedule: "lịch giờ cố định", every: "mỗi X phút", erp: "lệnh từ ERP" };
  const R = { el: null, scope: "", f: { brand: "", live: "", date_from: "", date_to: "", outcome: "", prize: "" }, data: null, sel: new Set(), seq: 0 };

  async function call(method, args, http) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (http === "GET") { const qs = new URLSearchParams(Object.entries(args || {}).filter(([, v]) => v != null && v !== "")).toString(); if (qs) url += "?" + qs; }
    else { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = (window.frappe && window.frappe.csrf_token) || ""; opts.body = JSON.stringify(args || {}); }
    let res;
    try { res = await fetch(url, opts); } catch (e) { return { success: false, message: "Mất kết nối mạng.", data: null }; }
    if (res.status === 401) return { success: false, message: "Phiên đăng nhập hết hạn – tải lại trang.", data: null };
    let body = {}; try { body = await res.json(); } catch (e) { /* khong phai JSON */ }
    const m = body.message; if (m && typeof m === "object" && typeof m.success === "boolean") return m;
    return res.ok ? { success: true, message: "", data: m } : { success: false, message: "Máy chủ báo lỗi (" + res.status + ").", data: null };
  }
  let tt; function toast(msg, err) { const t = $("av-toast"); if (!t) return; t.textContent = msg; t.className = "av-toast show" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 2600); }
  const vn = (ts) => new Date((ts + 7 * 3600) * 1000);
  const when = (r) => { const t = r.finished_ts || r.race_started_ts || r.reg_started_ts; if (!t) return r.race_date.split("-").reverse().join("/"); const d = vn(t), p = (n) => String(n).padStart(2, "0"); return `${p(d.getUTCDate())}/${p(d.getUTCMonth() + 1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; };
  const crumbs = (x) => `<div class="av-eyebrow" style="color:rgba(255,255,255,.75)"><a href="#/" style="color:inherit">AI Video hàng loạt</a> / ${x}</div>`;
  const tabs = () => `<div class="ls-tabs">${[["lives", "Phiên live"], ["schedule", "Lịch live"], ["history", "Lịch sử phiên"], ["races", "Đua vịt"], ["monitor", "Trực live"]].map(([r, l]) => `<a class="av-chip ${r === "races" ? "on" : ""}" href="#/${r}">${l}</a>`).join("")}</div>`;
  const live = () => !!(R.el && R.el.isConnected);

  /* ---------- vao trang / gan vao chi tiet phien ---------- */
  function load(h) {
    const q = new URLSearchParams(String(h || "").split("?")[1] || ""), v = $("av-view"); v.classList.add("ls-wide");
    R.scope = ""; R.sel.clear(); R.data = null;
    R.f = { brand: q.get("brand") || "", live: q.get("live") || "", date_from: q.get("from") || "", date_to: q.get("to") || "", outcome: "", prize: q.get("prize") || "" };
    v.innerHTML = `<section class="av-hero"><div>${crumbs("Đua vịt")}<h1>Đua vịt</h1><div class="sub">Mọi cuộc đua vịt trong live của các brand: người thắng, phần quà, trạng thái trao giải. Kết quả do app chốt ngẫu nhiên có kiểm chứng – ERP chỉ cập nhật trao giải và ghi chú.</div></div><div class="av-stats" id="lr-stats"></div></section>${tabs()}<div id="lr-body" class="lr-list"><div class="av-hint">Đang tải…</div></div>`;
    R.el = $("lr-body"); return fetchRaces();
  }
  function mount(el, opts) {
    R.el = el; R.scope = (opts && opts.live) || ""; R.sel.clear(); R.data = null;
    const d = new Date(Date.now() + 7 * 3600 * 1000), to = d.toISOString().slice(0, 10); d.setUTCDate(d.getUTCDate() - 29);
    R.f = { brand: "", live: R.scope, date_from: d.toISOString().slice(0, 10), date_to: to, outcome: "", prize: "" };
    el.innerHTML = '<div class="av-hint">Đang tải giải thưởng…</div>'; return fetchRaces();
  }
  async function fetchRaces() {
    const my = ++R.seq, r = await call("list_races", R.f, "GET");
    if (my !== R.seq || !live()) return;
    if (!r.success) { R.el.innerHTML = `<div class="av-callout bad"><div>${esc(r.message || "Không tải được danh sách đua vịt.")}</div></div><div><button class="av-outline" data-lr="refresh">Thử lại</button></div>`; return; }
    R.data = r.data; R.f.date_from = r.data.date_from; R.f.date_to = r.data.date_to;
    const keep = new Set(r.data.races.flatMap((x) => x.winners.map((w) => x.id + "|" + w.rank))); [...R.sel].forEach((k) => { if (!keep.has(k)) R.sel.delete(k); });
    render();
  }

  /* ---------- ve ---------- */
  function render() {
    const d = R.data, t = d.totals, st = $("lr-stats");
    if (st && !R.scope) st.innerHTML = `<div class="av-stat"><span>Cuộc đua</span><b>${t.races}</b></div><div class="av-stat"><span>Người thắng</span><b>${t.winners}</b></div><div class="av-stat"><span>Chưa trao</span><b>${t.chua_trao}</b></div>`;
    const opt = (list, cur, all) => `<option value="">${all}</option>` + [...new Set(list.concat(cur ? [cur] : []))].map((x) => `<option value="${esc(x)}" ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
    const filters = `<div class="lr-filters">
        ${R.scope ? "" : `<label>Brand<select data-lr-f="brand">${opt(d.brands, R.f.brand, "Tất cả")}</select></label><label>Phiên live<select data-lr-f="live">${opt(d.lives, R.f.live, "Tất cả")}</select></label>`}
        <label>Từ ngày<input type="date" data-lr-f="date_from" value="${esc(R.f.date_from)}"></label><label>Đến ngày<input type="date" data-lr-f="date_to" value="${esc(R.f.date_to)}"></label>
        <label>Kết quả<select data-lr-f="outcome"><option value="">Tất cả</option>${Object.entries(OUT).map(([k, [l]]) => `<option value="${k}" ${R.f.outcome === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label>Trao giải<select data-lr-f="prize"><option value="">Tất cả</option>${STATUSES.map((s) => `<option ${R.f.prize === s ? "selected" : ""}>${s}</option>`).join("")}</select></label></div>`;
    const sum = `<div class="lr-sum"><span><b>${t.races}</b> cuộc đua (${t.done} đua xong)</span><span><b>${t.winners}</b> người thắng</span><span>Đã trao <b>${t.da_trao}</b></span><span>Chưa trao <b>${t.chua_trao}</b></span><span>Không liên lạc được <b>${t.khong_lien_lac}</b></span>${d.truncated ? '<span class="av-hint">Chỉ hiện 500 cuộc đua mới nhất – thu hẹp khoảng ngày.</span>' : ""}</div>`;
    R.el.innerHTML = `<div class="lr-bar">${filters}<div class="av-row"><button class="av-btn" data-lr="refresh">Làm mới</button><button class="av-btn" data-lr="csv">Xuất CSV</button>${R.scope ? `<a class="av-outline" href="#/races?live=${encodeURIComponent(R.scope)}">Mở trang Đua vịt</a>` : ""}</div></div>
      ${sum}${d.races.length ? d.races.map(raceHtml).join("") : `<div class="av-callout"><div>Chưa có cuộc đua nào trong khoảng này. Cuộc đua hiện ở đây khi app trên máy phát gửi kết quả (cần app có tính năng Đua vịt).</div></div>`}
      <div class="lr-bulk" id="lr-bulk" ${R.sel.size ? "" : "hidden"}><span>Đã chọn <b id="lr-nsel">${R.sel.size}</b> người thắng</span><select id="lr-bulk-st" aria-label="Trạng thái mới">${STATUSES.map((s) => `<option>${s}</option>`).join("")}</select><button class="av-btn pri sm" data-lr="bulk-go">Cập nhật</button><button class="av-btn sm" data-lr="bulk-clear">Bỏ chọn</button></div>`;
  }
  function raceHtml(r) {
    const o = OUT[r.outcome] || [r.status_raw || r.outcome, "p-idle"], ex = r.excluded_count ? ` · loại ${r.excluded_count}${r.excluded_reasons.length ? " (" + r.excluded_reasons.map((x) => esc(x.reason) + " " + x.n).join(", ") + ")" : ""}` : "";
    const head = `<div class="lr-rh"><b>${when(r)}</b>${R.scope ? "" : `<a href="#/live/${encodeURIComponent(r.live)}/giai">${esc(r.live)}</a>`}${r.brand ? `<span class="lr-meta">${esc(r.brand)}</span>` : ""}<span class="av-pill ${o[1]}">${esc(o[0])}</span>
      <span class="lr-meta">${r.entrants} người đua (đăng ký ${r.registered}${ex}) · từ khoá "${esc(r.keyword)}" · ${esc(BY[r.by] || r.by)}${r.seed ? ` · mã kiểm tra <code title="${esc(r.algo)}">${esc(r.seed.slice(0, 12))}…</code>` : ""}</span>
      ${r.png_url ? `<a class="av-outline" href="${esc(r.png_url)}" target="_blank" rel="noopener">Ảnh kết quả</a>` : ""}</div>`;
    if (!r.winners.length) return `<div class="lr-race">${head}<div class="lr-none">Không có người thắng.</div></div>`;
    const all = r.winners.every((w) => R.sel.has(r.id + "|" + w.rank));
    return `<div class="lr-race">${head}<div class="lr-w av-tw"><table><thead><tr><th><input type="checkbox" data-lr-all="${esc(r.id)}" ${all ? "checked" : ""} aria-label="Chọn cả cuộc đua"></th><th>Hạng</th><th>Giải</th><th>Phần quà</th><th>Người thắng</th><th>Trao giải</th><th>Ghi chú</th></tr></thead><tbody>
      ${r.winners.map((w) => { const k = r.id + "|" + w.rank; return `<tr><td><input type="checkbox" data-lr-sel="${esc(k)}" ${R.sel.has(k) ? "checked" : ""} aria-label="Chọn ${esc(w.name)}"></td><td data-l="Hạng">${w.rank}</td><td data-l="Giải">${esc(w.tier)}</td><td data-l="Quà">${esc(w.prize)}</td><td class="nm">${esc(w.name)}</td>
        <td><select class="${STP[w.status] || ""}" data-lr-st="${esc(k)}" aria-label="Trao giải cho ${esc(w.name)}">${STATUSES.map((s) => `<option ${s === w.status ? "selected" : ""}>${s}</option>`).join("")}</select></td>
        <td><input type="text" maxlength="500" data-lr-note="${esc(k)}" value="${esc(w.note)}" placeholder="vd đã gửi đơn #123" aria-label="Ghi chú ${esc(w.name)}"></td></tr>`; }).join("")}</tbody></table></div></div>`;
  }
  const winner = (k) => { const [id, rank] = k.split("|"); const r = (R.data.races || []).find((x) => x.id === id); return r && r.winners.find((w) => String(w.rank) === rank); };

  /* ---------- ghi ---------- */
  async function setStatus(keys, status, note) {
    const items = keys.map((k) => { const [race, rank] = k.split("|"); return { race, rank: +rank }; });
    const r = await call("set_prize_status", { items: JSON.stringify(items), status, note: note == null ? null : note });
    if (!r.success) { toast(r.message || "Không cập nhật được.", true); fetchRaces(); return false; }
    toast(note != null && keys.length === 1 ? "Đã lưu ghi chú" : `Đã cập nhật ${r.data.updated} người thắng: ${r.data.status}`); return true;
  }
  async function exportCsv(btn) {
    btn.disabled = true; btn.classList.add("av-loading");
    try {
      const r = await call("export_races_csv", R.f, "GET"); if (!r.success) return toast(r.message || "Không xuất được CSV.", true);
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.data.csv], { type: "text/csv;charset=utf-8" })); a.download = r.data.filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(`Đã xuất ${r.data.rows} dòng`);
    } finally { btn.disabled = false; btn.classList.remove("av-loading"); }
  }
  function paintBulk() { const b = $("lr-bulk"); if (b) b.hidden = !R.sel.size; const n = $("lr-nsel"); if (n) n.textContent = R.sel.size; }

  document.addEventListener("click", async (e) => {
    if (!live()) return;
    const t = e.target.closest ? e.target.closest("[data-lr],[data-lr-sel],[data-lr-all]") : null; if (!t || !(R.el.contains(t))) return;
    const ds = t.dataset;
    if (ds.lrSel != null) { t.checked ? R.sel.add(ds.lrSel) : R.sel.delete(ds.lrSel); return paintBulk(); }
    if (ds.lrAll != null) { const r = R.data.races.find((x) => x.id === ds.lrAll); (r ? r.winners : []).forEach((w) => (t.checked ? R.sel.add(r.id + "|" + w.rank) : R.sel.delete(r.id + "|" + w.rank))); t.closest(".lr-race").querySelectorAll("[data-lr-sel]").forEach((c) => { c.checked = t.checked; }); return paintBulk(); }
    if (ds.lr === "refresh") return fetchRaces();
    if (ds.lr === "csv") return exportCsv(t);
    if (ds.lr === "bulk-clear") { R.sel.clear(); return render(); }
    if (ds.lr === "bulk-go") { const st = ($("lr-bulk-st") || {}).value; t.disabled = true; const ok = await setStatus([...R.sel], st, null); t.disabled = false; if (ok) { R.sel.clear(); fetchRaces(); } }
  });
  document.addEventListener("change", async (e) => {
    if (!live() || !R.el.contains(e.target)) return; const t = e.target, ds = t.dataset || {};
    if (ds.lrF) { R.f[ds.lrF] = t.value; return fetchRaces(); }
    if (ds.lrSt) { const w = winner(ds.lrSt); if (await setStatus([ds.lrSt], t.value, null) && w) { w.status = t.value; t.className = STP[t.value] || ""; } return; }
    if (ds.lrNote) { const w = winner(ds.lrNote); if (!w || w.note === t.value.trim()) return; if (await setStatus([ds.lrNote], w.status, t.value.trim())) w.note = t.value.trim(); }
  });
  window.ecAiLiveRace = { load, mount, isMine: (h) => /^races/.test(h || "") };
})();
</script>

<script>
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_video.controllers.api.";
  const CATS = [["", "Tự nhận theo mô tả"], ["milk_can", "Sữa lon"], ["milk_carton_pack", "Sữa hộp / vỉ"], ["oil_bottle", "Chai dầu ăn"],
    ["personal_care_bottle", "Chai dầu gội / sữa tắm"], ["cream_tube", "Tuýp kem"], ["diaper_pack", "Bịch tã / bỉm"],
    ["battery_blister", "Vỉ pin"], ["small_box", "Hộp nhỏ (pin, mỹ phẩm)"], ["biscuit_box_large", "Hộp bánh lớn"],
    ["soft_pouch", "Túi mềm (bánh, bông, khẩu trang)"], ["hair_dryer", "Máy sấy"], ["table_appliance", "Đồ gia dụng để bàn"]];
  const STEPS = [["host", "0. Host & khung neo"], ["talk", "A. Video chỉ nói"], ["input", "B1. Nhập SKU"], ["pick", "B2. Duyệt ảnh"], ["video", "B3. Clip cầm SP"], ["mix", "B4. Trộn & xuất"], ["prompt", "Prompt"]];
  const UNIT_LABEL = { putdown_left: "Hạ trái", putdown_right: "Hạ phải", putdown_below: "Hạ dưới", pickup_left: "Lấy trái", pickup_right: "Lấy phải", pickup_below: "Lấy dưới", hold_01: "Cầm A", hold_02: "Cầm B", hold_03: "Cầm C", hold_04: "Cầm D", hold_05: "Cầm E", hold_06: "Cầm F" };
  /* khung SP: ti le 0..1 tren anh host. Cm chi la UOC TINH theo khung hinh host chuan
     (vai + tay ao ~44 cm chiem ~58% be ngang anh) - doi chieu lo Friso: vi 110ml ~17 cm, 180ml ~24 cm. */
  const CM_PER_W = 1 / 0.0132;
  const GROUP_ST = { ok: ["Đã kiểm chứng", "p-ok"], try: ["Đang thử", "p-warn"], none: ["Mẫu chung", "p-idle"] };
  /* 12/10: cong thuc prompt theo BRAND + DONG SP (worker luu, chot = khoa prompt) */
  const RCP_ST = { ok: ["Đã chốt", "p-ok"], try: ["Đang thử", "p-warn"], off: ["Tắt", "p-idle"] };
  const RCP_SIDE = [["host_right", "Tay phải host đỡ đáy (bên trái ảnh)"], ["host_left", "Tay trái host đỡ đáy (bên phải ảnh)"], ["auto", "Để AI tự chọn"]];
  const RCP_CLIP = [["gesture_b", "Cử chỉ nhẹ (khuyên dùng)"], ["still", "2 tay giữ, không cử chỉ"], ["on_product", "Cử chỉ trên SP (chạm nắp, chỉ logo)"], ["one_hand", "Cầm 1 tay, tay kia cử chỉ"]];
  let frDrag = null;
  const S = { showFrame: true, projects: [], brand: "", p: null, items: [], exports: [], step: "input", timer: null, sel: new Set(), mixSel: new Set(), drafts: [], prompts: null, busy: false, btn: null, shown: null, syncing: false, renderLater: false, bulk: null };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 10/10: loi AI kiem tra anh cam (worker tra ma khong dau) -> chu de doc
  const QC_VI = [[/^co x/, "Cỡ SP x"], [/^ho rang$/, "Cười hở răng"], [/^nham mat$/, "Nhắm mắt"], [/^dat tren ban$/, "SP đặt trên bàn"], [/^sai SP$/, "Sai sản phẩm"], [/^sai chu /, "Sai chữ: "], [/^chu /, "Chữ hơi lệch: "]];
  const qcVi = (x) => QC_VI.reduce((a, [r, t]) => a.replace(r, t), String(x));
  const qcView = (q) => !q ? "" : !q.pass ? `<div class="qc bad">⚠ ${esc((q.issues || []).map(qcVi).join(" · "))}</div>`
    : (q.warn || []).length ? `<div class="qc warn">${esc(q.warn.map(qcVi).join(" · "))}</div>` : '<div class="qc ok">✓ AI kiểm tra: ổn</div>';

  /* ---------- API ---------- */

  async function speechSec(file) { // do dai giong noi (bo lang dau/cuoi < -40dB) ngay tren trinh duyet - worker cat lai chinh xac
    try {

      const d = buf.getChannelData(0), sr = buf.sampleRate, win = Math.max(1, Math.round(sr * 0.02)), thr = 0.01; let a = -1, b = -1;

      return { dur: buf.duration, speech: a < 0 ? buf.duration : (b - a) / sr };
    } catch (e) { const t = await audioSec(file); return { dur: t, speech: t }; }
  }

    if (t.id === "rc-copy") { const brand = $("rc-cbrand").value.trim(), line = $("rc-cline").value.trim(); if (!brand || !line) return toast("Cần brand và tên dòng mới", true);
      return rcpAfter(await act("recipes_copy", { data: JSON.stringify({ from: S.rcpSel, brand, line }) }, "Đã sao chép sang " + brand)); }
    if (t.dataset.rcroll) { if (!confirm("Quay về v" + t.dataset.rcroll + "? Bản hiện tại vẫn giữ trong lịch sử.")) return;
      return rcpAfter(await act("recipes_rollback", { key: S.rcpSel, v: t.dataset.rcroll }, "Đã quay về v" + t.dataset.rcroll), S.rcpSel); }
    if (t.id === "gr-save") { const v = (id) => $(id).value; const d = { status: v("gr-status"), clip_base: v("gr-base"), size_cm: v("gr-size"), hold: v("gr-hold"), clip: v("gr-clip"), put: v("gr-put") };
      t.disabled = true; try { if (await act("groups_set", { data: JSON.stringify({ cat: S.grpSel, data: d, note: v("gr-note") }) }, "Đã lưu bản mới")) loadGroups(); } finally { t.disabled = false; } return; }
    if (t.dataset.grroll) { if (!confirm("Quay về v" + t.dataset.grroll + "? Bản hiện tại vẫn giữ trong lịch sử.")) return; if (await act("groups_rollback", { cat: S.grpSel, v: t.dataset.grroll }, "Đã quay về v" + t.dataset.grroll)) loadGroups(); return; }
    if (t.id === "gr-req") { const d = { name: $("gr-name").value.trim(), sku: $("gr-sku").value, hold: $("gr-hold").value.trim(), ref: $("gr-ref").value.trim() };

      t.disabled = true; try { const r = await act("group_request", { data: JSON.stringify(d) }); if (r) { toast("Đã gửi cho " + r.sent_to + " quản trị"); S.grpSel = "milk_carton_pack"; renderGroups(); } } finally { t.disabled = false; } return; }

      const r = await act("prompts_set", { data: JSON.stringify(d) }, "Đã lưu prompt"); if (r) loadPrompts(); return; }
  });
  $("av-modal").addEventListener("click", (e) => { if (e.target.id === "av-modal") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("av-modal").hidden) closeModal(); });
  document.addEventListener("change", async (e) => {
    const t = e.target; if (!t.closest || !root().contains(t)) return;

    if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); const b = $("av-start"); const n = S.items.filter((i) => S.sel.has(i.name)).length; b.textContent = "Tạo ảnh cầm cho " + n + " SKU"; b.disabled = !n; return; }

    if (t.dataset.unitUse) { const it = S.items.find((x) => x.name === t.dataset.unitUse); if (!it) return; const off = new Set(it.unit_off || []); t.checked ? off.delete(t.dataset.unit) : off.add(t.dataset.unit); const prev = it.unit_off;

      const r = await act("set_units", { name: it.name, off: JSON.stringify([...off]) }, t.checked ? "Sẽ dùng clip này khi trộn" : "Đã bỏ clip này khi trộn");
      it.unit_off = r ? r.unit_off : prev; renderProject(); return; }
    if (t.dataset.talkUse) { const off = new Set(S.p.talk_off || []); t.checked ? off.delete(t.dataset.talkUse) : off.add(t.dataset.talkUse); const prev = S.p.talk_off;
      S.p.talk_off = [...off]; renderProject();
      const r = await act("set_talks", { project: S.p.name, off: JSON.stringify([...off]) }, t.checked ? "Sẽ dùng clip này khi trộn" : "Đã bỏ clip này khi trộn");
      if (r) S.p.talk_off = r.talk_off; else S.p.talk_off = prev; renderProject(); return; }
    if (t.id === "fq-files" && t.files && t.files.length) { const fs2 = [...t.files]; t.value = ""; return faqAdd(fs2); }
    if (["fq-n", "fq-sec"].includes(t.id)) { faqState()[t.id === "fq-n" ? "n" : "sec"] = t.value; return renderProject(); }
    if (t.id === "fq-autols") { faqState().autols = t.checked; return renderProject(); }
    if (t.id === "fq-copies") { faqState().copies = +t.value; return renderProject(); }   /* 16/10: so ban moi voice */   /* 14/10: tron xong tu lipsync */
    if (["fq-lead", "fq-tail", "fq-target", "fq-batch"].includes(t.id)) { const F = faqState(); F[t.id.slice(3)] = t.id === "fq-batch" ? t.value.trim() || F.batch : t.value; return renderProject(); }
    if (t.dataset.mx) { t.checked ? S.mixSel.add(t.dataset.mx) : S.mixSel.delete(t.dataset.mx); $("av-mix").disabled = !S.mixSel.size && (S.mixMode || S.p.mix_mode) !== "talk"; return; }
    if (t.id === "mx-all") { S.items.forEach((i) => { if (i.stage === "ready" || i.stage === "done") t.checked ? S.mixSel.add(i.name) : S.mixSel.delete(i.name); }); return renderProject(); }
    if (t.dataset.dk) { const k = +t.closest("[data-draft]").dataset.draft; S.drafts[k][t.dataset.dk] = t.value;
      if (t.dataset.dk === "recipe") { const r = rcpOf(t.value); if (r) { if (r.category) S.drafts[k].product_category = r.category; if (r.weight_g && !S.drafts[k].weight_g) S.drafts[k].weight_g = r.weight_g; } renderProject(); } return; }
    if (t.dataset.irec) { const it = S.items.find((x) => x.name === t.dataset.irec); if (!it) return; const r = rcpOf(t.value), d = { recipe: t.value };
      if (r && r.category) d.product_category = r.category; if (r && r.weight_g && !it.weight_g) d.weight_g = +r.weight_g;
      S.btn = null; if (await act("update_item", { name: it.name, data: JSON.stringify(d) }, t.value ? "Đã chọn công thức " + rcpName(t.value) : "Đã bỏ công thức")) loadProject(S.p.name); return; }
    if (t.id === "rc-from") { const r = rcpOf(t.value); if (r) { $("rc-newf").innerHTML = ""; $("rc-newf").insertAdjacentHTML("beforeend", '<div class="av-callout"><div>Sao chép toàn bộ cài đặt và lưu ý của <b>' + esc(r.brand + " · " + r.line) + '</b>. Sửa thêm sau khi tạo.</div></div>'); if (!$("rc-line").value) $("rc-line").value = r.line; } else { const lv = $("rc-line").value; S.rcpNewBrand = $("rc-brand").value; renderRecipes(); $("rc-line").value = lv; } return; }
    if (t.dataset.dfileMulti && t.files && t.files.length) { const k = +t.closest("[data-draft]").dataset.draft; const cur = S.drafts[k][t.dataset.dfileMulti] || []; const files = [...t.files].slice(0, Math.max(0, 4 - cur.length)); if (!files.length) return toast("Tối đa 4 ảnh phụ", true); toast("Đang tải " + files.length + " ảnh…"); try { for (const f of files) cur.push(await upload(f)); S.drafts[k][t.dataset.dfileMulti] = cur; renderProject(); } catch (err) { toast(err.message, true); } return; }
    if (t.dataset.ifileExtra && t.files && t.files.length) { const it = S.items.find((x) => x.name === t.dataset.ifileExtra); const cur = (it && it.extra_images) || []; const files = [...t.files].slice(0, Math.max(0, 4 - cur.length)); if (!files.length) return toast("Tối đa 4 ảnh phụ", true); toast("Đang tải " + files.length + " ảnh…"); try { const urls = cur.slice(); for (const f of files) urls.push(await upload(f)); if (await act("update_item", { name: it.name, data: JSON.stringify({ extra_images: urls }) }, "Đã thêm ảnh phụ")) loadProject(S.p.name); } catch (err) { toast(err.message, true); } return; }
    if (t.dataset.dfile && t.files && t.files[0]) { const k = +t.closest("[data-draft]").dataset.draft; toast("Đang tải file…"); try { if (t.dataset.dfile === "audio_file") { const s2 = await audioSec(t.files[0]); if (s2) S.drafts[k].audio_seconds = String(s2); } S.drafts[k][t.dataset.dfile] = await upload(t.files[0]); renderProject(); } catch (err) { toast(err.message, true); } return; }

    if (t.id === "av-showfr") { S.showFrame = t.checked; return renderProject(); }
    if (t.id === "fr-paste" || t.id === "fr-ghost") { S.fr[t.id === "fr-paste" ? "paste" : "ghost"] = t.checked; return renderFrame(); }
    if (t.id === "pj-night" || t.id === "pj-gm" || t.id === "pj-ga") { const f = { "pj-night": "night_mode", "pj-gm": "gate_motion", "pj-ga": "gate_hold_a" }[t.id];
      const v = t.checked; t.disabled = true; S.btn = null;
      const r = await act("update_project", { name: S.p.name, data: JSON.stringify({ [f]: v ? 1 : 0 }) }, v ? "Đã bật" : "Đã tắt");
      t.disabled = false; if (!r) { t.checked = !v; return; } S.p[f] = v ? 1 : 0; return; }
    if (t.id === "bk-files" && t.files && t.files.length) { bulkAdd([...t.files]); t.value = ""; return; }
  });
  /* 08/10: bam chon anh/mp3 -> giu nguyen trang toi khi hop chon file dong (truoc: trang ve lai giua chung, file chon bi mat, phai bam lan 2) */
  document.addEventListener("click", (e) => { const l = e.target.closest && e.target.closest("label, input[type=file]"); if (l && root().contains(l) && (l.type === "file" || l.querySelector("input[type=file]"))) S.picking = Date.now(); }, true);
  window.addEventListener("focus", () => setTimeout(() => { if (!S.picking) return; S.picking = 0; if (S.renderLater && !typing() && !S.busy && S.p && route().project === S.p.name) renderProject(); }, 400));
  document.addEventListener("focusout", () => setTimeout(() => { if (S.renderLater && !typing() && !S.busy && S.p && route().project === S.p.name) renderProject(); }, 250));  /* 250ms: de cu bam nut (vd Luu) xong da roi moi ve lai */
  document.addEventListener("input", (e) => { const t = e.target;
    if (t.id === "mx-d") S.mixD = t.value;   /* 09/10: giu gia tri nhap khi trang ve lai (truoc: tra ve 5 -> tron 5 ban) */
    if (t.id === "mx-b") S.mixBatch = t.value;

    if (t.id === "bk-text" && S.bulk) { S.bulk.text = t.value; clearTimeout(S.bkT); S.bkT = setTimeout(bulkRefresh, 250); return; } if (t.dataset && t.dataset.dk && t.closest("[data-draft]")) S.drafts[+t.closest("[data-draft]").dataset.draft][t.dataset.dk] = t.value; });
  load();
