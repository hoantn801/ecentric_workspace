      const r = await act("update_project", { name: S.p.name, data: JSON.stringify({ [f]: t.checked ? 1 : 0 }) }, t.checked ? "Đã bật" : "Đã tắt"); if (r) loadProject(S.p.name, true); }

  document.addEventListener("input", (e) => { const t = e.target; if (t.dataset && t.dataset.dk && t.closest("[data-draft]")) S.drafts[+t.closest("[data-draft]").dataset.draft][t.dataset.dk] = t.value; });
  load();
})();
</script>
