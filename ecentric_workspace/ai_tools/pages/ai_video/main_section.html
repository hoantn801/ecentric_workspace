<style id="ec-aiv-css">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

#ec-aiv-root{

  --line:#e5e7eb;--line-soft:#f1f2f6;--navy:#2C3DA6;--navy-d:#1f2c80;--navy-wash:#eef0fb;--navy-line:#c9d0f0;

.av-chip.on{border-color:var(--navy);color:var(--navy);background:var(--navy-wash)} .av-chip.on .n{background:var(--navy);color:#fff}

<script>
/* AI Live (17/10, fix10b): Bo live + Kho host / Studio anh host. Route #/kits, #/kit/<ten|new>, #/hosts.
   Script rieng, khong dung bien cua script chinh; script chinh goi window.ecAiLive.load(hash).
   API: ecentric_workspace.ai_tools.features.ai_live.controllers.api.* (envelope success/message/data). */
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_live.controllers.api.";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const enc = encodeURIComponent;
  const fmt = (n, d) => Number(n || 0).toLocaleString("vi-VN", { maximumFractionDigits: d || 0 });
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim();
  const ST_PILL = { "Nháp": "p-idle", "Đang gửi": "p-run", "Đang dựng": "p-run", "Xong": "p-ok", "Lỗi": "p-bad" };
  const BUSY_ST = ["Đang gửi", "Đang dựng"];
  const GEN = [["greet", "Chào chung", "Chào người mới vào, không gọi tên"], ["thanks", "Cảm ơn / hẹn giới thiệu lại", "Khi mọi bản FAQ đang nghỉ"], ["answer", "Trả lời chung", "Câu hỏi chưa có FAQ (chế độ Tiết kiệm)"], ["cho", "Câu chờ", "Phát khi đọc lại câu hỏi bị trễ (realtime chậm)"],
    /* 18/10 fix10e: 4 nhom clip dua vit (W20) - khong ten khach, khong gia */
    ["race_call", "Mời tham gia", "Mời comment từ khoá để vào đua · 5–8 giây", 1], ["race_commentary", "Bình luận lúc đua", "Phát khi vịt đang chạy, không nói ai thắng · 10–15 giây", 1],
    ["race_winner", "Chúc mừng (không tên)", "Khi không kịp gọi tên, tên người thắng hiện trên bảng · 5–7 giây", 1], ["race_claim", "Cách nhận quà", "Phát sau lời chúc mừng · 4–6 giây", 1]];
  const GEN_FILE = { greet: "chao", thanks: "camon", answer: "traloi", cho: "cho", race_call: "dua_moi", race_commentary: "dua_binhluan", race_winner: "dua_chucmung", race_claim: "dua_nhanqua" };
  const GEN_EMPTY = () => Object.assign(Object.fromEntries(GEN.map(([g]) => [g, []])), { scripts: {} });
  const LS_USD_S = 0.012;
  const DEF_PROMPT = "Nữ MC người Việt khoảng 25 tuổi, áo sơ mi trắng, tóc buộc gọn, ngồi sau bàn trắng, hai tay đặt trên bàn, nhìn thẳng camera, cười mỉm nhẹ. Nền phông xanh lá đồng màu (chroma key), ánh sáng studio dịu, khung dọc 9:16, thấy từ giữa đùi trở lên, không chữ, không logo.";
  const L = { kits: [], brands: [], brand: "", hosts: null, models: [], proposal: [], kit: null, dirty: false, timer: null, busy: false, studio: null, refs: [], mplan: null };
  const isMine = (h) => /^(kits|kit\/|hosts|monitor|lives|live\/|schedule|history|watch|races)/.test(h || "");  /* 18/10 fix10d: Phien live / Lich live; fix10e: Dua vit */
  const hash = () => location.hash.replace(/^#\/?/, "");
  const view = () => $("av-view");

  /* ---------- helpers (giong script chinh) ---------- */
  const serverMsg = (b) => { try { const a = JSON.parse(b._server_messages || "[]"); if (a.length) return JSON.parse(a[0]).message || ""; } catch (e) { /* bo qua */ } return ""; };
  async function call(method, args, http) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (http === "GET") { const qs = new URLSearchParams(Object.entries(args || {}).filter(([, v]) => v != null)).toString(); if (qs) url += "?" + qs; }
    else { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = (window.frappe && window.frappe.csrf_token) || ""; opts.body = JSON.stringify(args || {}); }
    let res;
    try { res = await fetch(url, opts); } catch (e) { return { success: false, message: "Mất kết nối mạng.", data: null }; }
    if (res.status === 401) return { success: false, message: "Phiên đăng nhập hết hạn.", data: null };
    let body = {}; try { body = await res.json(); } catch (e) { /* khong phai JSON */ }
    const m = body.message; if (m && typeof m === "object" && typeof m.success === "boolean") return m;
    if (!res.ok) return { success: false, message: serverMsg(body) || ("Máy chủ báo lỗi (" + res.status + ")."), data: null };
    return { success: true, message: "", data: m };
  }
  let tt; function toast(msg, err) { const t = $("av-toast"); if (!t) return; t.textContent = msg; t.className = "av-toast show" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 2600); }
  async function act(btn, method, args, okMsg) {
    if (L.busy) { toast("Đang xử lý thao tác trước, đợi chút…"); return null; } L.busy = true;
    if (btn) { btn.disabled = true; btn.classList.add("av-loading"); btn.setAttribute("aria-busy", "true"); }
    try { const r = await call(method, args); if (!r.success) { toast(r.message || "Lỗi", true); return null; } if (okMsg) toast(okMsg); return r.data; }
    finally { L.busy = false; if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove("av-loading"); btn.removeAttribute("aria-busy"); } }
  }
  async function upload(file) {
    const fd = new FormData(); fd.append("file", file, file.name); fd.append("is_private", 1);
    const r = await fetch("/api/method/upload_file", { method: "POST", credentials: "same-origin", headers: { "X-Frappe-CSRF-Token": (window.frappe && window.frappe.csrf_token) || "" }, body: fd });
    let j = null; try { j = await r.json(); } catch (e) { /* 413 nginx */ }
    const url = j && j.message && j.message.file_url; if (!url) throw new Error(r.status === 413 ? "File quá lớn" : "Tải file lỗi");
    return url;
  }
  function audioSec(f) { return new Promise((res) => { const a = new Audio(), u = URL.createObjectURL(f); let done = false; const fin = (v) => { if (done) return; done = true; URL.revokeObjectURL(u); res(v); };
    a.preload = "metadata"; a.onloadedmetadata = () => fin(isFinite(a.duration) ? Math.round(a.duration * 10) / 10 : 0); a.onerror = () => fin(0); a.src = u; setTimeout(() => fin(0), 5000); }); }
  const isAudio = (f) => /^audio\//.test(f.type || "") || /\.(mp3|wav|m4a)$/i.test(f.name);
  const verOf = (name) => { const m = /[_\- ]v(\d{1,2})(?=[_\- .]|$)/i.exec(name.replace(/\.[^.]+$/, "")); return m ? +m[1] : 1; };
  function modal(html) { const b = $("av-modal-box"); b.className = "box wide"; b.innerHTML = html; $("av-modal").hidden = false; }
  function closeModal() { $("av-modal").hidden = true; $("av-modal-box").innerHTML = ""; }
  function fail(msg) { view().innerHTML = `<div class="av-callout bad"><div>${esc(msg)}</div></div><div><a class="av-outline" href="#/">← AI Video hàng loạt</a></div>`; }
  const crumbs = (x) => `<div class="av-eyebrow" style="color:rgba(255,255,255,.75)"><a href="#/" style="color:inherit">AI Video hàng loạt</a> / ${x}</div>`;

  /* ---------- route ---------- */
  async function load(h) {
    clearTimeout(L.timer); h = h == null ? hash() : h;
    if (/^hosts/.test(h)) return loadHosts();
    if (/^monitor/.test(h)) return window.ecAiLiveMon ? window.ecAiLiveMon.load(h) : fail("Màn Trực live chưa tải xong, tải lại trang.");
    if (/^(lives|live\/|schedule|history|watch)/.test(h)) return window.ecAiLiveSess ? window.ecAiLiveSess.load(h) : fail("Màn Phiên live chưa tải xong, tải lại trang.");
    if (/^races/.test(h)) return window.ecAiLiveRace ? window.ecAiLiveRace.load(h) : fail("Màn Đua vịt chưa tải xong, tải lại trang.");
    const m = /^kit\/(.+)$/.exec(h); if (m) return loadKit(decodeURIComponent(m[1]));
    return loadKits();
  }
  window.ecAiLive = { load, isMine };
  window.addEventListener("beforeunload", (e) => { if (L.dirty && isMine(hash())) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- danh sach Bo live ---------- */
  async function loadKits() {
    L.kit = null; L.dirty = false;
    const r = await call("list_kits", {}, "GET"); if (!isMine(hash())) return;
    if (!r.success) return fail(r.message);
    L.kits = r.data.kits || []; L.brands = r.data.brands || []; if (r.data.generic_defaults) L.genDefs = r.data.generic_defaults; renderKits();
  }
  function renderKits() {
    const brands = [...new Set(L.kits.map((k) => k.brand))].sort(), list = L.kits.filter((k) => !L.brand || k.brand === L.brand);
    view().innerHTML = `
      <section class="av-hero"><div>${crumbs("Bộ live")}<h1>Bộ live</h1><div class="sub">Mỗi Bộ live gồm video chính, FAQ và câu chung của một brand. App eCentric AI Live trên máy phát tải Bộ live từ Thư mục Bộ live (Google Drive / SharePoint) của brand.</div></div>
        <div class="av-row"><a class="av-gold" href="#/kit/new">+ Tạo Bộ live</a><a class="av-outline" href="#/hosts">Kho host</a></div></section>
      ${brands.length > 1 ? `<div class="av-chips"><button class="av-chip ${L.brand ? "" : "on"}" data-lk-brand="">Tất cả <span class="n">${L.kits.length}</span></button>${brands.map((b) => `<button class="av-chip ${L.brand === b ? "on" : ""}" data-lk-brand="${esc(b)}">${esc(b)} <span class="n">${L.kits.filter((k) => k.brand === b).length}</span></button>`).join("")}</div>` : ""}
      <div class="av-cards">${list.map((k) => `<article class="av-card"><div class="corner"><span class="av-pill ${ST_PILL[k.status] || "p-idle"}">${esc(k.status || "Nháp")}</span></div>
          <div><div class="av-eyebrow">${esc(k.brand)} · ${k.mode === "lite" ? "Tiết kiệm" : "Đầy đủ"}</div><h3>${esc(k.title || k.brand)}</h3></div>
          <div class="av-meta"><span><b>${k.products || 0}</b> SP</span><span>nghỉ <b>${esc(k.break_sec || 20)}</b>s</span><span>${k.host_key ? "host " + esc(k.host_key) : "chưa chọn host"}</span></div>
          <div class="foot"><span class="av-hint">${esc(String(k.modified || "").slice(0, 16))}</span><a class="av-outline" href="#/kit/${enc(k.name)}">Mở →</a></div></article>`).join("")}
        <a class="av-card new" href="#/kit/new" style="text-decoration:none">+ Tạo Bộ live</a></div>`;
  }

  /* ---------- 1 Bo live ---------- */
  const blankKit = () => ({ name: null, brand: L.brand || L.brands[0] || "", title: "", host_key: "", voice_id: "", voice_provider: "", mode: "full", break_sec: "20", background: "", bake_bg: 0,
    products: [], faq: [{ topic: "Giá", videos: [] }, { topic: "Cách dùng", videos: [] }, { topic: "Vận chuyển", videos: [] }], generic: GEN_EMPTY(), status: "Nháp", state: {} });
  async function loadKit(name) {
    const [kr, hr, gr] = await Promise.all([name === "new" ? Promise.resolve(null) : call("get_kit", { name, tick: 1 }, "GET"), call("list_hosts", {}, "GET"), L.brands.length ? Promise.resolve(null) : call("list_kits", {}, "GET")]);
    if (!isMine(hash())) return;
    if (gr && gr.success) { L.kits = gr.data.kits || []; L.brands = gr.data.brands || []; if (gr.data.generic_defaults) L.genDefs = gr.data.generic_defaults; }
    L.hosts = hr.success ? hr.data.hosts || [] : null; L.hostsMsg = hr.success ? "" : hr.message;
    if (kr && !kr.success) return fail(kr.message);
    L.kit = kr ? kr.data : blankKit(); L.kit.generic = Object.assign(GEN_EMPTY(), L.kit.generic || {}); L.kit.generic.scripts = L.kit.generic.scripts || {}; L.dirty = false;
    if (kr && kr.data.generic_defaults) L.genDefs = kr.data.generic_defaults;
    renderKit(); schedulePoll();
  }
  function schedulePoll() { clearTimeout(L.timer); if (L.kit && L.kit.name && BUSY_ST.includes(L.kit.status)) L.timer = setTimeout(poll, 15000); }
  async function poll() {

      <textarea id="lk-paste" placeholder="sp01; Friso Gold 4 850g; 2234567; 1729384"></textarea><div class="av-row" style="justify-content:flex-end"><button class="av-btn" data-close="1">Huỷ</button><button class="av-btn pri" data-lk="p-paste-ok">Thêm</button></div>`);
  }

  /* ---------- Kho host + Studio ---------- */
  async function loadHosts() {
    const r = await call("list_hosts", {}, "GET"); if (!isMine(hash())) return;
    if (!r.success) return fail(r.message);
    L.hosts = r.data.hosts || []; L.models = r.data.models || []; L.proposal = r.data.motion_proposal || []; L.propCost = r.data.motion_cost;
    if (!L.studio) { try { const h = localStorage.getItem("ecAiLiveStudio"); if (h && !L.hosts.some((x) => x.host === h)) L.studio = { host: h, items: [], done: false }; } catch (e) { /* bo qua */ } }
    renderHosts(); if (L.studio && !L.studio.done) studioPoll();
  }
  function modelCost() { const m = L.models.find((x) => x.id === (L.stModel || (L.models[0] || {}).id)); return m && m.credits ? `4 ảnh × ${m.credits} credit ≈ <b>${fmt(m.credits * 4 * 80)}đ</b>` : "Chi phí theo bảng giá nhà cung cấp (chưa có ước tính)"; }
  function renderHosts() {
    const st = L.studio;
    view().innerHTML = `
      <section class="av-hero"><div>${crumbs("Kho host")}<h1>Kho host</h1><div class="sub">Host dùng chung cho mọi brand. Brand mới chỉ cần chọn host, đưa voice; motion trong kho được dùng lại, chỉ lipsync và hậu kỳ.</div></div><div class="av-row"><a class="av-outline" href="#/kits" style="background:#fff">Bộ live →</a></div></section>
      <div class="av-panel"><div class="av-panel-h"><h2>Studio ảnh host</h2><span class="av-hint">Tạo 4 ảnh host mới, chọn 1 ảnh để lưu vào kho.</span></div><div class="av-panel-b"><div class="av-grid2" style="align-items:start">
        <div class="lk-st" style="display:flex;flex-direction:column;gap:12px">
          <label class="av-f">Tên host<input type="text" id="lk-st-label" value="${esc(L.stLabel || "")}" placeholder="vd Linh – áo trắng"></label>
          <label class="av-f">Mô tả ảnh<textarea id="lk-st-prompt" style="font-family:inherit;font-size:13px;min-height:130px">${esc(L.stPrompt || DEF_PROMPT)}</textarea></label>
          <label class="av-f">Model<select id="lk-st-model">${L.models.map((m) => `<option value="${esc(m.id)}" ${m.id === L.stModel ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></label>
          <div class="av-f">Ảnh tham chiếu (tối đa 4: khuôn mặt, trang phục, tư thế…)<div class="lk-refs">${L.refs.map((u, i) => `<figure><img src="${esc(u)}" alt=""><button type="button" data-lk-refdel="${i}" aria-label="Bỏ ảnh">×</button></figure>`).join("")}${L.refs.length < 4 ? '<label class="lk-add">+ Ảnh<input type="file" accept="image/png,image/jpeg,image/webp" multiple id="lk-st-refs"></label>' : ""}</div></div>
          <div class="av-row" style="justify-content:space-between"><span class="av-hint" id="lk-st-cost">${modelCost()}</span><button class="av-btn pri" data-lk="studio-go">Tạo 4 ảnh</button></div>
        </div>
        <div>${st ? `<div class="av-row" style="justify-content:space-between;margin-bottom:8px"><b>Lượt ${esc(st.host)}</b><span class="av-hint">${st.done ? "Đã xong" : "Đang tạo… (~1–3 phút)"}</span></div>
          <div class="lk-cands">${(st.items || []).map((it) => `<div class="lk-cand">${it.thumb ? `<img src="${esc(it.thumb)}" data-media="${esc(it.full || it.thumb)}" alt="Ảnh ứng viên">` : `<div class="lk-noimg">${it.state === "failed" ? "Lỗi" : "Đang tạo…"}</div>`}
            <div class="av-row" style="margin-top:6px">${it.cand ? `<button class="av-btn sm pri" data-lk-pick="${it.cand}">Lưu vào kho</button>` : it.error ? `<span class="av-hint" style="color:var(--bad)">${esc(it.error)}</span>` : ""}</div></div>`).join("") || '<div class="av-hint">Đang chờ máy chạy video nhận việc…</div>'}</div>
          ${st.saved ? `<div class="av-callout" style="margin-top:10px"><div>Đã lưu host <b>${esc(st.host)}</b>. Bước tiếp: <button class="av-btn sm pri" data-lk-motion="${esc(st.host)}">Gen bộ motion</button></div></div>` : ""}` : '<div class="av-empty">Ảnh tạo ra sẽ hiện ở đây.</div>'}</div>
      </div></div></div>
      <div class="av-panel"><div class="av-panel-h"><h2>Host trong kho <span class="av-hint">${L.hosts.length}</span></h2></div><div class="av-panel-b"><div class="lk-hosts">
        ${L.hosts.map((h) => `<div class="lk-host">${h.thumb ? `<img src="${esc(h.thumb)}" data-media="${esc(h.thumb)}" alt="${esc(h.label || h.host)}">` : '<div class="lk-noimg">Chưa có ảnh</div>'}
          <div style="margin-top:6px"><b>${esc(h.label || h.host)}</b>${h.label ? `<div class="av-hint">${esc(h.host)}</div>` : ""}</div>
          <div class="av-row" style="margin-top:6px;justify-content:space-between">${h.talks ? `<span class="av-pill p-ok">${h.talks} clip motion</span>` : '<span class="av-pill p-warn">Chưa có motion</span>'}<button class="av-btn sm${h.talks ? "" : " pri"}" data-lk-motion="${esc(h.host)}">${h.talks ? "Gen thêm motion" : "Gen bộ motion"}</button></div></div>`).join("") || '<div class="av-empty">Chưa có host nào.</div>'}
      </div></div></div>`;
  }
  async function studioGo(btn) {
    const prompt = $("lk-st-prompt").value.trim(); if (!prompt) return toast("Chưa nhập mô tả ảnh.", true);
    const model = $("lk-st-model").value, label = $("lk-st-label").value.trim();
    const m = L.models.find((x) => x.id === model);
    if (!confirm(`Tạo 4 ảnh host bằng ${m ? m.label : model}?${m && m.credits ? `\nƯớc tính ${m.credits * 4} credit ≈ ${fmt(m.credits * 4 * 80)}đ.` : ""}`)) return;
    const r = await act(btn, "host_image_start", { data: JSON.stringify({ prompt, model, label, refs: L.refs }) }, "Đã gửi – đang tạo 4 ảnh"); if (!r) return;
    L.studio = { host: r.host, items: [], done: false }; try { localStorage.setItem("ecAiLiveStudio", r.host); } catch (e) { /* bo qua */ }
    renderHosts(); studioPoll();
  }
  async function studioPoll() {
    clearTimeout(L.timer); if (!L.studio || !/^hosts/.test(hash())) return;
    const r = await call("host_image_status", { host: L.studio.host }, "GET");
    if (!/^hosts/.test(hash()) || !L.studio) return;
    if (r.success) { L.studio.items = r.data.items || []; L.studio.done = r.data.done; if (!typingHere()) renderHosts(); }
    if (!L.studio.done) L.timer = setTimeout(studioPoll, 5000);
  }
  const typingHere = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "file" && view().contains(a)); };
  function motionModal(host) {
    const h = (L.hosts || []).find((x) => x.host === host) || { host };
    const plan = {}; (L.proposal || []).forEach((p) => { plan[p.dur] = p.n; }); L.mplan = { host, plan };
    modal(`<h3 style="margin:0">Gen bộ motion – ${esc(h.label || host)}</h3>
      <p class="av-hint" style="margin:0">Đề xuất 20 clip nói câm, tỉ lệ 50/25/15/10% theo độ dài, tính từ 2 host đang dùng thật (H_BOO3HGI9JF 81 clip, H_FAQ_GREEN 22 clip). Clip ngắn giúp khớp câu ngắn mà không phải kéo giãn. Sửa số lượng nếu cần.</p>
      <div class="av-tw"><table><thead><tr><th>Độ dài clip</th><th>Số clip</th></tr></thead><tbody>${[10, 8, 6, 4].map((d) => `<tr><td>${d} giây</td><td><input type="number" min="0" max="20" value="${plan[d] || 0}" data-lk-mn="${d}" style="width:90px"></td></tr>`).join("")}</tbody></table></div>
      <div class="av-callout"><div id="lk-mcost">${costLine(L.propCost)}</div></div>
      <div class="av-row" style="justify-content:flex-end"><button class="av-btn" data-close="1">Huỷ</button><button class="av-btn pri" data-lk="motion-go">Gen bộ motion</button></div>`);
  }
  const costLine = (c) => !c ? "" : `<b>${c.clips} clip · ${c.seconds} giây</b> – ước tính <b>~${fmt(c.credits)} credit ≈ ${fmt(c.vnd)}đ</b><div class="av-hint">${esc(c.formula)}. Trang AI Video ghi chi phí thật sau khi chạy.</div>`;
  const mplanArr = () => [10, 8, 6, 4].map((d) => ({ dur: d, n: Math.max(0, Math.min(20, +(L.mplan.plan[d] || 0))) })).filter((x) => x.n);
  let mT; function motionRecalc() { clearTimeout(mT); mT = setTimeout(async () => { if (!L.mplan) return; const r = await call("motion_set", { host: L.mplan.host, plan: JSON.stringify(mplanArr()), dry_run: 1 }); const el = $("lk-mcost"); if (el) el.innerHTML = r.success ? costLine(r.data.cost) : `<span style="color:var(--bad)">${esc(r.message)}</span>`; }, 300); }
  async function motionGo(btn) {
    const plan = mplanArr(), n = plan.reduce((a, x) => a + x.n, 0); if (!n) return toast("Chưa chọn số clip.", true);
    const r = await act(btn, "motion_set", { host: L.mplan.host, plan: JSON.stringify(plan), dry_run: 0 }, "Đã xếp " + n + " clip motion – máy chạy video gen dần, kết quả hiện trong Kho host"); if (!r) return;
    closeModal(); L.mplan = null; loadHosts();
  }

  /* ---------- su kien ---------- */
  document.addEventListener("click", async (e) => {
    if (!isMine(hash())) return;
    const t = e.target.closest ? e.target.closest("[data-lk],[data-lk-brand],[data-lk-vdel],[data-lk-pdel],[data-lk-qdel],[data-lk-motion],[data-lk-pick],[data-lk-refdel],[data-lk-gsadd],[data-lk-gsdel],[data-lk-gsreset],[data-lk-gscopy]") : null;
    if (!t || !$("ec-aiv-root").contains(t)) return;
    const a = t.dataset.lk, k = L.kit;
    if (t.dataset.lkBrand != null) { L.brand = t.dataset.lkBrand; return renderKits(); }
    if (t.dataset.lkVdel) { const [p, i] = t.dataset.lkVdel.split("|"); listAt(p).splice(+i, 1); L.dirty = true; return renderKit(); }
    if (t.dataset.lkPdel) { if (!confirm("Xoá sản phẩm này khỏi Bộ live?")) return; k.products.splice(+t.dataset.lkPdel, 1); L.dirty = true; return renderKit(); }
    if (t.dataset.lkQdel) { k.faq.splice(+t.dataset.lkQdel, 1); L.dirty = true; return renderKit(); }
    if (t.dataset.lkGsadd) { const l = genOwn(t.dataset.lkGsadd); if (l.length >= 6) return toast("Tối đa 6 lời mỗi loại", true); l.push(""); L.dirty = true; return renderKit(); }
    if (t.dataset.lkGsdel) { const [g, i] = t.dataset.lkGsdel.split("|"); genOwn(g).splice(+i, 1); L.dirty = true; return renderKit(); }
    if (t.dataset.lkGsreset) { delete k.generic.scripts[t.dataset.lkGsreset]; L.dirty = true; return renderKit(); }
    if (t.dataset.lkGscopy) { const txt = genLines(t.dataset.lkGscopy).filter((x) => x.trim()).map((x, i) => (i + 1) + ". " + x).join("\n"); try { await navigator.clipboard.writeText(txt); toast("Đã chép lời – dán vào công cụ TTS"); } catch (err) { toast("Không chép được, bôi đen và chép tay giúp em", true); } return; }
    if (t.dataset.lkMotion) return motionModal(t.dataset.lkMotion);
    if (t.dataset.lkRefdel) { L.refs.splice(+t.dataset.lkRefdel, 1); return renderHosts(); }
    if (t.dataset.lkPick) { const r = await act(t, "host_save", { host: L.studio.host, cand: +t.dataset.lkPick, label: ($("lk-st-label") || {}).value || "" }, "Đã lưu host vào kho"); if (!r) return; L.studio.saved = true; try { localStorage.removeItem("ecAiLiveStudio"); } catch (err) { /* bo qua */ } return loadHosts(); }
    if (a === "kit-save") return saveKit(t);
    if (a === "kit-build") return buildKit(t);
    if (a === "p-add") { k.products.push({ id: "sp" + String(k.products.length + 1).padStart(2, "0"), name: "", platformIds: { shopee: "", tiktok: "" }, main_free: [], main_hold: [], putdown: true, pickup: true }); L.dirty = true; return renderKit(); }
    if (a === "q-add") { k.faq.push({ topic: "", videos: [] }); L.dirty = true; return renderKit(); }
    if (a === "p-paste") return pasteProducts();
    if (a === "p-paste-ok") { const rows = ($("lk-paste").value || "").split(/\r?\n/).map((l) => l.split(/[;\t]/).map((x) => x.trim())).filter((c) => c[0]);
      rows.forEach((c) => { const ex = k.products.find((p) => norm(p.id) === norm(c[0])); const pl = { shopee: c[2] || "", tiktok: c[3] || "" };
        if (ex) { if (c[1]) ex.name = c[1]; ex.platformIds = Object.assign(ex.platformIds || {}, Object.fromEntries(Object.entries(pl).filter(([, v]) => v))); }
        else k.products.push({ id: c[0], name: c[1] || "", platformIds: pl, main_free: [], main_hold: [], putdown: true, pickup: true }); });
      closeModal(); L.dirty = true; toast("Đã thêm / cập nhật " + rows.length + " SP"); return renderKit(); }
    if (a === "studio-go") return studioGo(t);
    if (a === "motion-go") return motionGo(t);
  });
  document.addEventListener("input", (e) => {
    if (!isMine(hash())) return; const t = e.target, k = L.kit;
    if (t.dataset.lkMn && L.mplan) { L.mplan.plan[t.dataset.lkMn] = +t.value || 0; return motionRecalc(); }
    if (t.id === "lk-st-prompt") { L.stPrompt = t.value; return; } if (t.id === "lk-st-label") { L.stLabel = t.value; return; }
    if (!k) return;
    if (t.dataset.lkK && t.type !== "checkbox") { k[t.dataset.lkK] = t.value; return touch(); }
    if (t.dataset.lkP != null && t.dataset.lkPk) { const p = k.products[+t.dataset.lkP], f = t.dataset.lkPk; if (f === "shopee" || f === "tiktok") { p.platformIds = p.platformIds || {}; p.platformIds[f] = t.value.trim(); } else p[f] = t.value; return touch(); }
    if (t.dataset.lkQ != null) { k.faq[+t.dataset.lkQ].topic = t.value; return touch(); }
    if (t.dataset.lkGs) { const [g, i] = t.dataset.lkGs.split("|"); genOwn(g)[+i] = t.value.slice(0, 200); return touch(); }
  });
  document.addEventListener("change", async (e) => {
    if (!isMine(hash())) return; const t = e.target, k = L.kit;
    if (t.id === "lk-st-model") { L.stModel = t.value; const c = $("lk-st-cost"); if (c) c.innerHTML = modelCost(); return; }
    if (t.id === "lk-st-refs" && t.files && t.files.length) { const files = [...t.files].slice(0, 4 - L.refs.length); toast("Đang tải " + files.length + " ảnh…"); for (const f of files) { try { L.refs.push(await upload(f)); } catch (err) { toast(err.message, true); } } return renderHosts(); }
    if (!k) return;
    if (t.dataset.lkVadd && t.files && t.files.length) { const files = [...t.files]; t.value = ""; return addVoices(t.dataset.lkVadd, files); }
    if (t.dataset.lkVver) { const [p, i] = t.dataset.lkVver.split("|"); listAt(p)[+i].version = +t.value; return touch(); }
    if (t.dataset.lkPc != null) { const p = k.products[+t.dataset.lkPc]; p.putdown = p.pickup = t.checked; return touch(); }
    if (t.dataset.lkK === "bake_bg") { k.bake_bg = t.checked ? 1 : 0; return touch(); }
    if (t.dataset.lkK === "host_key" || t.dataset.lkK === "break_sec") { k[t.dataset.lkK] = t.value; return touch(); }
    if (t.name === "lk-mode") { k.mode = t.value; L.dirty = true; return renderKit(); }
    if (t.id === "lk-bg" && t.files && t.files[0]) { toast("Đang tải nền…"); try { k.background = await upload(t.files[0]); if (!/\.(png|jpe?g|webp)$/i.test(k.background)) k.bake_bg = 0; L.dirty = true; renderKit(); } catch (err) { toast(err.message, true); } }
  });
  const hasFiles = (e) => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files"));
  document.addEventListener("dragover", (e) => { if (!isMine(hash()) || !hasFiles(e)) return; const z = e.target.closest && e.target.closest("#lk-drop"); if (!z) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; z.classList.add("on"); });
  document.addEventListener("dragleave", (e) => { const z = e.target.closest && e.target.closest("#lk-drop"); if (z) z.classList.remove("on"); });
  document.addEventListener("drop", (e) => { if (!isMine(hash()) || !hasFiles(e)) return; const z = e.target.closest && e.target.closest("#lk-drop"); if (!z) return; e.preventDefault(); z.classList.remove("on"); if (L.kit && !ro()) dropVoices([...e.dataTransfer.files]); });
})();
</script>

.lm-why li.critical{background:var(--bad-bg);color:var(--bad);font-weight:600} .lm-why li.warn{background:var(--warn-bg);color:var(--warn)} .lm-why li.info{background:var(--line-soft);color:var(--ink2)}

.lm-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lm-chart{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lm-chart h4{margin:0 0 4px;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between} .lm-chart h4 b{color:var(--ink);font-variant-numeric:tabular-nums}
.lm-chart svg{width:100%;height:56px;display:block}
.lm-dshots{display:flex;gap:10px;justify-content:center} .lm-dshots .lm-shot{width:200px;max-height:none;aspect-ratio:9/16}

.wb-prob{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #f4c2c2;background:var(--bad-bg);border-radius:12px;padding:8px 12px;min-width:0}

.wb-prob-t{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px} .wb-prob-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.wb-timer{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px} .wb-timer.bad{color:var(--bad)} .wb-timer.warn{color:var(--warn)}

.wb-today .gt-m{grid-template-columns:150px 1fr} .wb-today .gt-hours{grid-template-columns:214px 1fr}
.wb-today > .lc-desk{min-width:0}

.wb-sh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start} .wb-sh h2{margin:0;font-size:16px;line-height:1.3}
.wb-sb{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.wb-sbt{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:12.5px}
.wb-ptext{font-size:14px} .wb-ptext.bad{color:var(--bad)} .wb-ptext.warn{color:var(--warn)}
.wb-dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px;border-top:1px solid var(--line-soft);padding-top:10px}

.wb-mini .p{position:absolute;top:0;bottom:0;background:var(--navy-wash);border:1px solid var(--navy-line);border-radius:3px}
.wb-mini .a{position:absolute;top:3px;bottom:3px;border-radius:2px} .wb-mini .a.t-ok{background:var(--ok)} .wb-mini .a.t-warn{background:#e0a33a} .wb-mini .a.t-bad{background:var(--bad)} .wb-mini .a.t-idle{background:var(--ink3)}
.wb-mini .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:#c0306f}
tr.wb-r-bad td:first-child{box-shadow:inset 4px 0 0 var(--bad)} tr.wb-r-warn td:first-child{box-shadow:inset 4px 0 0 var(--gold)}

  .wb-side{display:none} .wb-probs{grid-template-columns:1fr} .wb-prob{flex-wrap:wrap}

}

</style>
<script>
/* AI Live - Truc live (24/10 fix10h; thay tuong Giam sat fix10c). Giao dien theo ERP / Lich live:
   #/monitor            "Hom nay": Gantt hom nay (may x kenh OBS) to theo tinh trang that + vach thuc te, hang su co can
                        xu ly, o chi tiet live dang chon (lenh 1 cham, xac nhan). Dien thoai: danh sach khung theo gio.
   #/monitor/live/<key> nhu tren, chon san live do (tu Tuong hinh / Xem nhu khach).
   #/monitor/list       "Danh sach": bang can xu ly + bang dang chay.
   #/monitor/incidents  "Su co": dang mo / da xac nhan / da xong.
   1 endpoint wallboard 15 s; dong ho "da X phut" dem phia client; mau / chu / thu tu do service Python tinh. */
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_live.controllers.api.";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LV = { critical: ["Đỏ", "p-bad"], offline: ["Mất tín hiệu", "p-bad"], warn: ["Vàng", "p-warn"], ok: ["Ổn", "p-ok"], idle: ["Ngoài giờ", "p-idle"] };
  const CARD = { lost: ["○ Mất liên lạc", "p-bad"], crit: ["■ KHẨN", "p-bad"], warn: ["▲ Cảnh báo", "p-warn"], ok: ["● Đang live", "p-ok"] };
  const ST = { live: "Đang live", preflight: "Kiểm tra trước giờ", ending: "Đang kết thúc", idle: "Chờ", stopped: "Đã dừng", error: "Lỗi app" };
  const ACT = { pause_ai: "Tạm dừng AI", resume_ai: "Chạy lại AI", skip_clip: "Bỏ clip", play_faq: "Phát FAQ" };
  const CMD = { Queued: "Đang gửi…", Sent: "Máy đã nhận…", Done: "✓ Xong", Failed: "✗ Lỗi", Expired: "✗ Hết hạn – máy không nhận" };
  const CMD_RANK = { Queued: 0, Sent: 1, Done: 2, Failed: 2, Expired: 2 };
  const M = { data: null, brand: "", machine: "", timer: null, failed: 0, thumbs: new Map(), queue: [], running: 0, detail: null,
    skew: 0, cmd: new Map(), cmdTimer: null, inc: null, incStatus: "open", sel: "", selKey: "", full: false };
  const hash = () => location.hash.replace(/^#\/?/, "");
  const on = () => /^monitor/.test(hash());
  const sub = () => (/^monitor\/incidents/.test(hash()) ? "inc" : /^monitor\/list/.test(hash()) ? "list" : "today");
  const view = () => $("av-view");
  const nowS = () => Date.now() / 1000 + M.skew;
  const mobile = () => window.matchMedia("(max-width: 720px)").matches;

  const serverMsg = (b) => { try { const a = JSON.parse(b._server_messages || "[]"); if (a.length) return JSON.parse(a[0]).message || ""; } catch (e) { /* bo qua */ } return ""; };
  async function call(method, args, http) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (http === "GET") { const qs = new URLSearchParams(Object.entries(args || {}).filter(([, v]) => v != null && v !== "")).toString(); if (qs) url += "?" + qs; }
    else { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = (window.frappe && window.frappe.csrf_token) || ""; opts.body = JSON.stringify(args || {}); }
    let res;
    try { res = await fetch(url, opts); } catch (e) { return { success: false, message: "Mất kết nối mạng.", data: null }; }
    if (res.status === 401) return { success: false, message: "Phiên đăng nhập hết hạn.", data: null };
    let body = {}; try { body = await res.json(); } catch (e) { /* khong phai JSON */ }
    const m = body.message; if (m && typeof m === "object" && typeof m.success === "boolean") return m;
    if (!res.ok) return { success: false, message: serverMsg(body) || ("Máy chủ báo lỗi (" + res.status + ")."), data: null };
    return { success: true, message: "", data: m };
  }
  let tt; function toast(msg, err) { const t = $("av-toast"); if (!t) return; t.textContent = msg; t.className = "av-toast show" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 2600); }
  const ago = (s) => { s = Math.max(0, Math.round(Number(s) || 0)); if (s < 60) return s + " giây"; if (s < 3600) return Math.floor(s / 60) + " phút"; if (s < 86400) return Math.floor(s / 3600) + " giờ"; return Math.floor(s / 86400) + " ngày"; };
  const dur = (s) => { s = Math.max(0, Math.floor(Number(s) || 0)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}g${String(m).padStart(2, "0")}p` : `${m} phút`; };
  const vn = (ts) => new Date((ts + 7 * 3600) * 1000);
  const hhmm = (ts) => { const d = vn(ts); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); };
  const dmy = (ts) => { const d = vn(ts); return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
  const num = (v, d) => (v == null || v === "" ? "–" : Number(v).toLocaleString("vi-VN", { maximumFractionDigits: d || 0 }));
  const since = (ts, kind) => `<span data-since="${ts}" data-k="${kind || "ago"}" title="${esc(dmy(ts) + " " + hhmm(ts))}">${kind === "dur" ? dur(nowS() - ts) : ago(nowS() - ts)}</span>`;
  function modal(html, wide) { const b = $("av-modal-box"); b.className = "box" + (wide ? " wide" : ""); b.innerHTML = html; $("av-modal").hidden = false; }
  function closeModal() { $("av-modal").hidden = true; $("av-modal-box").innerHTML = ""; }

  /* ---------- route ---------- */
  async function load() {
    clearTimeout(M.timer); M.detail = null;
    const v = view(); v.classList.add("lm-wide");
    const m = hash().match(/^monitor\/live\/([^/?]+)/); if (m) { M.selKey = decodeURIComponent(m[1]); M.sel = ""; M.pend = mobile(); }
    if (sub() === "inc") return loadInc();
    if (!M.data) v.innerHTML = head(sub(), 0, true) + `<div class="lm-empty">Đang tải tín hiệu các máy phát…</div>`;
    else render();
    return refresh();
  }
  window.addEventListener("hashchange", () => { if (!on()) { clearTimeout(M.timer); M.detail = null; const v = view(); if (v) v.classList.remove("lm-wide"); } });

  async function refresh() {
    clearTimeout(M.timer); if (!on() || sub() === "inc") return;
    if (document.hidden) { M.timer = setTimeout(refresh, 5000); return; }         /* tab an: dung poll */
    const r = await call("wallboard", { brand: M.brand, machine: M.machine }, "GET");
    if (!on() || sub() === "inc") return;
    if (r.success) { M.data = r.data; M.failed = 0; M.skew = r.data.server_time - Date.now() / 1000; render(); pumpThumbs();
      if (M.pend) { M.pend = false; if (sub() === "today") openSide(); } }          /* dien thoai: mo san o chi tiet live duoc chon */
    else { M.failed++; if (!M.data) view().innerHTML = head(sub(), 0, true) + `<div class="av-callout bad"><div>${esc(r.message || "Không tải được.")}</div></div><div><button class="av-outline" data-lm="retry">Thử lại</button></div>`; else stamp(); }
    M.timer = setTimeout(refresh, ((M.data && M.data.refresh_s) || 15) * 1000);
  }
  function stamp() {
    const el = $("lm-upd"); if (el && M.data) { el.className = "av-hint" + (M.failed ? " lm-bad" : ""); el.innerHTML = M.failed ? `Không tải được – đang thử lại (số liệu lúc ${hhmm(M.data.server_time)})` : `cập nhật ${since(M.data.server_time)} trước`; }
    const bn = $("wb-fail"); if (bn) bn.style.display = M.failed ? "" : "none";
  }
  setInterval(() => { if (!on()) return; document.querySelectorAll("#av-view [data-since], #av-modal [data-since]").forEach((el) => { const s = nowS() - Number(el.dataset.since); el.textContent = el.dataset.k === "dur" ? dur(s) : ago(s); }); }, 1000);

  /* ---------- dau trang chung (giong Lich live) ---------- */
  const tabs = () => `<div class="ls-tabs">${[["lives", "Phiên live"], ["schedule", "Lịch live"], ["history", "Lịch sử phiên"], ["races", "Đua vịt"], ["monitor", "Trực live"]].map(([r, l]) => `<a class="av-chip ${r === "monitor" ? "on" : ""}" href="#/${r}">${l}</a>`).join("")}</div>`;
  function head(cur, nInc, loading) {
    const d = M.data || {}, c = d.counters || {};
    const st = (l, v, hl) => `<div class="av-stat${hl ? " hl" : ""}"><span>${l}</span><b>${loading ? "…" : v || 0}</b></div>`;
    const V = [["today", "Hôm nay", "#/monitor"], ["list", "Danh sách", "#/monitor/list"], ["inc", "Sự cố", "#/monitor/incidents"]];
    return `<section class="av-hero"><div><div class="av-eyebrow" style="color:rgba(255,255,255,.72)"><a href="#/" style="color:inherit">AI Video hàng loạt</a> / <a href="#/lives" style="color:inherit">Phiên live</a> / Trực live</div><h1>Trực live</h1>
        <div class="sub">${cur === "inc" ? "Sự cố máy im lặng và báo động app nhờ ERP gửi hộ. Xác nhận để ERP dừng nhắc lại; KHẨN chưa ai xác nhận sau 10 phút thì ERP gửi thêm cho nhóm quản lý."
          : cur === "list" ? "Việc cần xử lý lên đầu, lâu nhất trước; bên dưới là mọi live đang chạy kèm vạch hôm nay. Bấm Mở để xem trên Gantt và gửi lệnh."
          : "Gantt hôm nay giống Lịch live, khối tô theo tình trạng thật: đỏ = KHẨN / mất liên lạc, vàng = cảnh báo, xanh = ổn. Vạch dưới khối là thực tế lên sóng. Bấm khối để xem và gửi lệnh."}</div></div>
        <div class="av-stats">${st("Đang live", c.on_air)}${st("■ KHẨN", c.crit, c.crit)}${st("▲ Cảnh báo", c.warn)}${st("○ Mất liên lạc", c.lost, c.lost)}${st("Lỡ giờ hôm nay", c.missed_today)}</div></section>
      ${tabs()}
      <div class="ls-bar"><nav class="lc-views" aria-label="Kiểu xem Trực live">${V.map(([k, l, href]) => `<a class="${k === cur ? "on" : ""}" href="${href}"${k === cur ? ' aria-current="page"' : ""}>${l}${k === "inc" && (nInc || d.inc_open) ? ` <span class="n wb-n">${nInc || d.inc_open}</span>` : ""}</a>`).join("")}</nav>
        <div class="av-row">${cur !== "inc" ? `<span class="av-hint" id="lm-upd"></span>
          <label class="av-hint wb-f">Brand <select id="wb-brand"><option value="">Tất cả</option>${(d.brands || []).map((b) => `<option ${M.brand === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label>
          <label class="av-hint wb-f">Máy <select id="wb-machine"><option value="">Tất cả</option>${(d.machines || []).map((b) => `<option ${M.machine === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label>` : ""}
          <a class="av-outline" href="#/watch" title="Tường hình toàn màn hình (Xem như khách) cho màn treo tường">⛶ Tường hình</a>
          <button class="av-btn" data-lm="test">Gửi thử báo động</button><a class="av-btn" href="/app/ec-ai-live-alert-settings" target="_blank" rel="noopener">Cài đặt báo động</a></div></div>
      <div class="av-callout bad" id="wb-fail" style="${M.failed ? "" : "display:none"}"><div>Không tải được dữ liệu – đang thử lại. Số liệu dưới đây là lần cập nhật trước.</div></div>`;
  }

  /* ---------- phan dung chung ---------- */
  const cardOf = (live) => ((M.data && M.data.cards) || []).find((c) => c.live === live);
  const cardByKey = (key) => ((M.data && M.data.cards) || []).find((c) => c.key === key);
  const incBtn = (inc, cls) => (inc && inc.status === "Open" ? `<button class="av-btn ${cls || "sm"} pri" data-wb-ack="${esc(inc.name)}" data-lv="${esc(inc.level)}">Xác nhận</button>` : "");
  function cmdLine(c) {
    let p = M.cmd.get(c.key);
    const srv = (c.commands || [])[0], same = p && (c.commands || []).find((x) => x.id === p.id);
    if (p && ((same && CMD_RANK[same.status] >= 2) || Date.now() - p.t0 > 150000)) { M.cmd.delete(c.key); p = null; }
    const last = p && (!same || CMD_RANK[p.status] >= CMD_RANK[same.status]) ? p : (same || srv);
    if (!last) return "";
    const bad = last.status === "Failed" || last.status === "Expired";
    return `<div class="wb-cmd${bad ? " bad" : ""}">${esc(ACT[last.action] || last.action)}: ${esc(CMD[last.status] || last.status)}${last.result && last.status !== "Queued" ? " – " + esc(last.result) : ""}</div>`;
  }
  const cmdBtns = (c, cls) => ((M.data && M.data.actions) || []).map((a) => `<button class="av-btn ${cls || "sm"}" data-wb-cmd="${a}" data-key="${esc(c.key)}">${ACT[a]}${a === "play_faq" ? "…" : ""}</button>`).join("");
  /* hang su co can xu ly: may mat lien lac + the KHAN / canh bao */
  function problems() {
    const d = M.data, lostM = new Set((d.lost_machines || []).map((x) => x.machine));
    const out = (d.lost_machines || []).map((x) => ({ cls: "bad", pill: "○ Mất liên lạc", name: x.machine + (x.label ? " · " + x.label : ""), text: x.lives.length ? "Có live: " + x.lives.join(", ") : "Lần cuối " + hhmm(x.since_ts), ts: x.since_ts, inc: x.incident, sel: "" }));
    (d.cards || []).filter((c) => (c.level === "crit" || c.level === "warn" || (c.level === "lost" && !lostM.has(c.machine))) && c.problem).forEach((c) =>
      out.push({ cls: c.level === "warn" ? "warn" : "bad", pill: CARD[c.level][0], name: c.title, text: c.problem.text + " · " + c.machine, ts: c.problem.since_ts, inc: c.incident, sel: c.key }));
    return out;
  }
  function problemStrip() {
    const ps = problems();
    if (!ps.length) return `<div class="av-callout"><div>✓ Không có sự cố nào cần xử lý.</div></div>`;
    return `<div class="wb-probs" role="list">${ps.map((p) => `<div class="wb-prob ${p.cls}" role="listitem"><span class="wb-prob-t"><span class="av-pill ${p.cls === "warn" ? "p-warn" : "p-bad"}">${esc(p.pill)}</span> <b>${esc(p.name)}</b><span class="av-hint">${esc(p.text)}</span></span>
      <span class="av-row" style="flex-wrap:nowrap"><b class="wb-timer ${p.cls}">${since(p.ts)}</b>${incBtn(p.inc)}${p.sel ? `<button class="av-btn sm" data-wb-sel="${esc(p.sel)}">Xem</button>` : ""}</span></div>`).join("")}</div>`;
  }
  function waitLine() {
    const d = M.data;
    return `<div class="wb-wait">${(d.waiting || []).length ? `<span><span class="av-pill p-idle">◌ Chờ giờ live</span> ${d.waiting.map((w) => `${esc(w.title)} ${hhmm(w.start_ts)} · ${esc(w.machine)}`).join(" · ")}</span>` : ""}${(d.idle_machines || []).length ? `<span><b>Máy rảnh</b> · ${esc(d.idle_machines.join(", "))}</span>` : ""}</div>`;
  }
  function shotHtml(c, big) {
    const th = c.thumb || {};
    return `<div class="wb-shot${big ? " big" : ""}${c.level === "lost" ? " stale" : ""}">${th.kind ? `<img data-lm-img="${esc(c.key)}|${esc(th.kind)}" alt="Ảnh ${esc(c.title)}">` : "Chưa có ảnh"}${th.ts ? `<i>ảnh ${hhmm(th.ts)}</i>` : ""}</div>`;
  }
  /* o chi tiet live dang chon (ben phai; dien thoai: hop thoai) */
  function sideHtml(row, c) {
    if (!row && !c) return `<div class="av-hint" style="padding:8px">Bấm một khối trên Gantt để xem chi tiết và gửi lệnh cho live đó.</div>`;
    const title = (c && c.title) || (row && row.title) || "", lv = c ? CARD[c.level] : null;
    const where = c ? `${c.brand || "—"} · ${c.machine}${c.obs_port ? " · OBS " + c.obs_port : ""}` : `${row.brand || "—"} · ${row.machine}${row.obs_port ? " · OBS " + row.obs_port : ""}`;
    const slot = row ? `${hhmm(row.start_ts)}–${hhmm(row.end_ts)}${row.chips.length ? " · " + row.chips.map((x) => x.text).join(" · ") : ""}` : "";
    if (!c) return `<div class="wb-sh"><div><div class="av-hint">${esc(where)}</div><h2>${esc(title)}</h2></div><span class="av-pill p-idle">${row.level === "future" ? "Chờ giờ" : "Không đang chạy"}</span></div>
      <dl class="wb-dl"><dt>Khung</dt><dd>${hhmm(row.start_ts)}–${hhmm(row.end_ts)}</dd><dt>Tình trạng</dt><dd>${esc(row.state)}</dd></dl>${row.live && !row.off_plan ? `<a class="av-outline" href="#/live/${encodeURIComponent(row.live)}">Chi tiết phiên →</a>` : ""}`;
    const cost = c.cost || {}, pct = cost.pct == null ? 0 : Math.min(100, cost.pct), inc = c.incident;
    return `<div class="wb-sh"><div><div class="av-hint">${esc(where)}</div><h2>${esc(title)}</h2></div><span class="av-pill ${lv[1]}">${lv[0]}</span></div>
      <div class="wb-sb">${shotHtml(c, true)}<div class="wb-sbt">${c.problem ? `<b class="wb-ptext ${c.level === "warn" ? "warn" : "bad"}">${esc(c.problem.text)}</b><b class="wb-timer ${c.level === "warn" ? "warn" : "bad"}" style="font-size:20px">⏱ ${since(c.problem.since_ts)}</b>` : `<b style="color:var(--ok)">Ổn</b>`}
        ${(c.reasons || []).map((r) => `<span class="av-hint">${esc(r.text)}</span>`).join("")}
        ${inc ? `<span class="av-hint">${inc.status === "Open" ? "ERP gửi hộ " + inc.sent_count + " lần · chưa ai xác nhận" : "Đã xác nhận · " + esc(inc.acked_by)}</span>${incBtn(inc, "")}` : ""}
        ${c.minimal ? `<span class="av-pill p-warn" style="align-self:flex-start">Máy tải cao – số liệu rút gọn</span>` : ""}</div></div>
      <dl class="wb-dl">
        <dt>Lên sóng</dt><dd>${c.on_air_since_ts ? since(c.on_air_since_ts, "dur") : esc(ST[c.state] || c.state || "—")}${c.mode ? " · " + esc(c.mode) : ""}</dd>
        <dt>Hình</dt><dd>${c.fps != null ? `<b class="${c.fps < 25 ? "wb-badfps" : ""}">${num(c.fps)}</b> fps` : "–"}${c.gpu != null ? " · GPU " + num(c.gpu) + "%" : ""}</dd>
        <dt>AI</dt><dd><span class="av-pill ${c.ai.tone === "warn" ? "p-warn" : c.ai.tone === "ok" ? "p-ok" : "p-idle"}" title="${esc(c.ai.label)}">${esc(c.ai.text)}</span></dd>
        <dt>Chi phí hôm nay</dt><dd>${esc(cost.text)}${cost.cap ? `<div class="av-prog" style="margin-top:4px"><i style="width:${pct}%;background:${cost.over ? "var(--bad)" : pct >= 80 ? "#b95f0a" : "var(--navy)"}"></i></div>` : ""}</dd>
        ${slot ? `<dt>Khung</dt><dd>${esc(slot)}</dd>` : ""}</dl>
      <div class="wb-acts">${cmdBtns(c, "")}</div>${cmdLine(c)}
      <div class="av-row"><button class="av-btn ghost" data-lm-key="${esc(c.key)}">Biểu đồ 1 giờ</button>${c.erp ? `<a class="av-btn ghost" href="#/live/${encodeURIComponent(c.live)}">Chi tiết phiên →</a>` : '<span class="av-hint">Live đặt tay trên máy, không có trên ERP</span>'}</div>`;
  }
  /* khung dang chon: M.sel = "live|start_ts" hoac M.selKey (khoa the) */
  function selected() {
    const d = M.data, rows = d.today || [], now = nowS();
    if (M.selKey) { const k = M.selKey, c = cardByKey(k) || cardOf(k); M.selKey = "";
      if (c) { const r = rows.find((x) => x.live === c.live && x.start_ts <= now && now < x.end_ts) || rows.find((x) => x.live === c.live); M.sel = r ? r.live + "|" + r.start_ts : "card|" + c.key; }
      else { const r = rows.find((x) => x.live === k || x.key === k); if (r) M.sel = r.live + "|" + r.start_ts; } }
    if (!M.sel) { const p = problems().find((x) => x.sel), c = p ? cardByKey(p.sel) : (d.cards || [])[0]; if (c) { const r = rows.find((x) => x.live === c.live && x.start_ts <= now && now < x.end_ts); M.sel = r ? r.live + "|" + r.start_ts : "card|" + c.key; } }
    if (M.sel.startsWith("card|")) { const c = cardByKey(M.sel.slice(5)); return [null, c || null]; }
    const [live, ts] = M.sel.split("|"), row = rows.find((x) => x.live === live && String(x.start_ts) === ts) || null;
    return [row, cardOf(live) && row && row.start_ts <= now && now < row.end_ts + 1800 ? cardOf(live) : (row ? null : cardOf(live))];
  }

  /* ---------- Hom nay: Gantt + hang su co + o chi tiet ---------- */
  const TONE = { ok: "t-ok", warn: "t-warn", bad: "t-bad", idle: "t-idle" };
  function render() {
    if (sub() === "list") return renderList();
    const d = M.data, all = d.today || [], now = nowS(), lo = Date.parse(d.date + "T00:00:00+07:00") / 1000;
    const nowMin = (now - lo) / 60, inDay = nowMin >= 0 && nowMin < 1440;
    const first = Math.min(360, ...all.map((r) => Math.max(0, (r.start_ts - lo) / 60)), inDay ? nowMin : 1440);
    /* mac dinh "quanh gio nay": tu 6 gio truoc toi 24h (it nhat 8 gio) cho de doc; nut "Ca ngay" mo lai tu khung som nhat */
    const a = M.full || !inDay ? Math.floor(first / 60) * 60 : Math.min(960, Math.max(Math.floor(first / 60) * 60, Math.floor(nowMin / 60) * 60 - 360)), span = 1440 - a, hn = 24 - a / 60;
    const rows = all.filter((r) => r.end_ts > lo + a * 60), hidden = all.length - rows.length;
    const pct = (ts) => Math.max(0, Math.min(100, ((ts - lo) / 60 - a) / span * 100));
    const [selRow, selCard] = selected(), selId = M.sel;
    const info = new Map((d.machine_info || []).map((m) => [m.code, m]));
    const codes = [...new Set([...(d.machine_info || []).map((m) => m.code), ...rows.map((r) => r.machine).filter(Boolean)])].sort();
    const gantt = codes.map((code) => {
      const m = info.get(code) || { code, label: "", status: "Chưa có nhịp tim", pill: "p-idle", sub: "" };
      const mine = rows.filter((r) => r.machine === code), ports = [...new Set(mine.map((r) => r.obs_port || 0))].sort((x, y) => (x === 0) - (y === 0) || x - y);
      if (!ports.length) ports.push(0);
      const lanes = ports.map((port) => {
        const rs = mine.filter((r) => (r.obs_port || 0) === port || (!ports.includes(r.obs_port || 0) && port === ports[0]));
        const blocks = rs.map((r) => { const id = r.live + "|" + r.start_ts, L = pct(r.start_ts), W = Math.max(0.8, pct(r.end_ts) - L);
          const label = (r.level === "crit" || r.level === "lost" || r.level === "warn") ? `${CARD[r.level][0].split(" ")[0]} ${r.title} · ${r.state.replace(/^[^·]*·\s*/, "")}` : r.title;
          return `<button class="lc-blk wb-blk st-${r.level}${id === selId ? " sel" : ""}" style="left:${L.toFixed(3)}%;width:${W.toFixed(3)}%;top:5px;height:22px;bottom:auto" data-wb-row="${esc(id)}" title="${esc(r.title + " · " + hhmm(r.start_ts) + "–" + hhmm(r.end_ts) + " · " + r.state)}">${esc(label)}</button>`; }).join("");
        const acts = rs.filter((r) => r.chips.length).map((r) => { const rep = r.report || {}; let s0 = r.start_ts, s1 = r.end_ts, real = false;
          if (rep.actual_start_ts) { s0 = rep.actual_start_ts; s1 = rep.actual_end_ts || Math.min(now, r.end_ts + 3 * 3600); real = true; }
          const L = pct(s0), W = Math.max(0.6, pct(s1) - L), txt = r.chips.map((x) => x.text).join(" · ");
          const ints = (rep.interruptions || []).map((x) => { const x1 = pct(x.from), x2 = pct(x.to || now); return `<i style="left:${((x1 - L) / W * 100).toFixed(2)}%;width:${Math.max(1.5, (x2 - x1) / W * 100).toFixed(2)}%"></i>`; }).join("");
          return `<div class="lc-act ${TONE[r.tone] || "t-idle"}${real ? "" : " plan"}" style="left:${L.toFixed(3)}%;width:${W.toFixed(3)}%;top:31px" title="${esc(txt)}">${ints}<span>${esc(txt)}</span></div>`; }).join("");
        return `<div class="gt-k"><span>${port ? "OBS " + port : ports.length > 1 ? "Chưa đặt cổng" : "—"}</span><div class="lc-track wb-track" style="--hn:${hn};min-height:52px">${blocks}${acts}${nowMin >= a && nowMin < 1440 ? `<i class="lc-now" style="left:${pct(now).toFixed(3)}%" aria-hidden="true"></i>` : ""}</div></div>`;
      }).join("");
      return `<div class="gt-m${m.lost ? " wb-lostm" : ""}"><div class="gt-mh"><b>${esc(code)}</b>${m.label ? `<small>${esc(m.label)}</small>` : ""}<span class="av-pill ${m.pill}" style="align-self:flex-start">${esc(m.status)}</span>${m.sub ? `<small>${esc(m.sub)}</small>` : ""}</div><div class="gt-lanes">${lanes}</div></div>`;
    }).join("");
    const mob = all.slice().sort((x, y) => x.start_ts - y.start_ts).map((r) => { const id = r.live + "|" + r.start_ts;
      return `<button class="lc-chip wb-chip st-${r.level}" data-wb-row="${esc(id)}"><span><b>${hhmm(r.start_ts)}–${hhmm(r.end_ts)}</b> ${esc(r.title)}<span class="lc-actx ${r.level === "crit" || r.level === "lost" ? "t-bad" : r.level === "warn" ? "t-warn" : r.level === "ok" ? "t-ok" : "t-idle"}">${esc(r.state)}</span></span><span class="av-hint">${esc(r.machine)}${r.obs_port ? " · " + r.obs_port : ""}</span></button>`; }).join("") || `<div class="av-empty">Hôm nay chưa có khung live nào.</div>`;
    const empty = !(d.machine_info || []).length && !all.length;
    view().innerHTML = head("today", d.inc_open) + problemStrip() + (empty ? `<div class="lm-empty">Chưa có máy nào gửi nhịp tim – kiểm tra địa chỉ ERP / token trong cấu hình app eC Live trên máy phát.</div>` : `
      <div class="wb-today">
        <div class="lc-desk"><div class="gt"><div class="gt-hours" style="--hn:${hn}"><div></div><div>${Array.from({ length: hn }, (_, i) => `<span>${a / 60 + i}h</span>`).join("")}</div></div>${gantt}</div>
          <div class="lc-legend wb-legend"><span><i style="background:#eef8f1;border:1px solid #9fd7b1"></i>Đang live ổn</span><span><i style="background:var(--warn-bg);border:1px solid #e9b955"></i>Cảnh báo</span><span><i style="background:var(--bad-bg);border:1.5px solid var(--bad)"></i>KHẨN</span><span><i style="border:1.5px dashed var(--bad)"></i>Mất liên lạc</span><span><i style="background:var(--navy-wash);border:1px solid var(--navy-line)"></i>Chờ giờ</span><span><i style="background:#b9e5c8"></i>Thực tế: ✓ Đúng giờ · ⏰ Trễ · ✕ Lỡ · ⚡ Gián đoạn · ? Không có báo cáo</span>
            ${M.full || hidden ? `<button class="av-btn sm ghost" data-wb-full="1">${M.full ? "Chỉ quanh giờ này" : `Xem cả ngày (${hidden} khung sớm hơn)`}</button>` : ""}</div></div>
        <aside class="av-panel wb-side" aria-label="Live đang chọn">${sideHtml(selRow, selCard)}</aside>
        <div class="lc-mob">${mob}</div>
      </div>`) + waitLine();
    stamp(); paintThumbs();
  }

  /* ---------- Danh sach: bang can xu ly + bang dang chay ---------- */
  function renderList() {
    const d = M.data, rows = d.today || [], now = nowS(), ps = problems();
    const mini = (live) => { const r = rows.find((x) => x.live === live && x.start_ts <= now && now < x.end_ts) || rows.filter((x) => x.live === live).pop(); if (!r) return "";
      const lo = Date.parse(d.date + "T00:00:00+07:00") / 1000, p = (ts) => Math.max(0, Math.min(100, ((ts - lo) / 60 - 360) / 1080 * 100)), rep = r.report || {};
      const a1 = rep.actual_start_ts ? p(rep.actual_start_ts) : 0, a2 = rep.actual_start_ts ? p(rep.actual_end_ts || now) : 0;
      return `<div class="wb-mini"><span class="p" style="left:${p(r.start_ts)}%;width:${Math.max(1, p(r.end_ts) - p(r.start_ts))}%"></span>${rep.actual_start_ts ? `<span class="a ${TONE[r.tone]}" style="left:${a1}%;width:${Math.max(0.8, a2 - a1)}%"></span>` : ""}<span class="now" style="left:${p(now)}%"></span></div><span class="av-hint">${esc(r.chips.map((x) => x.text).join(" · ") || hhmm(r.start_ts) + "–" + hhmm(r.end_ts))}</span>`; };
    const prob = ps.length ? `<section class="av-panel wb-pp"><div class="av-panel-h"><h2>Cần xử lý ngay <span class="av-hint" style="font-weight:500">· ${ps.length} · lâu nhất lên đầu</span></h2><span class="av-hint">Xác nhận chỉ dừng tin nhắc của ERP; tin app tự gửi không dừng được.</span></div>
      <div class="av-tw"><table class="ls-table"><thead><tr><th>Mức</th><th>Ở đâu</th><th>Vấn đề</th><th>Đã bao lâu</th><th>Đã báo</th><th></th></tr></thead><tbody>${ps.map((p) => `<tr>
        <td data-l="Mức"><span class="av-pill ${p.cls === "warn" ? "p-warn" : "p-bad"}">${esc(p.pill)}</span></td><td data-l="Ở đâu"><span class="t">${esc(p.name)}</span></td><td data-l="Vấn đề">${esc(p.text)}</td>
        <td data-l="Đã bao lâu"><b class="wb-timer ${p.cls}">${since(p.ts)}</b></td><td data-l="Đã báo"><span class="s">${p.inc ? (p.inc.status === "Open" ? p.inc.sent_count + " lần · chưa xác nhận" : "Đã xác nhận · " + esc(p.inc.acked_by)) : "—"}</span></td>
        <td style="white-space:nowrap;text-align:right">${incBtn(p.inc)} ${p.sel ? `<button class="av-btn sm" data-wb-goto="${esc(p.sel)}">Xem trên Gantt</button>` : ""}</td></tr>`).join("")}</tbody></table></div></section>` : `<div class="av-callout"><div>✓ Không có sự cố nào cần xử lý.</div></div>`;
    const run = (d.cards || []).map((c) => { const lv = CARD[c.level], cost = c.cost || {}, pct = cost.pct == null ? 0 : Math.min(100, cost.pct);
      return `<tr class="${c.level === "crit" || c.level === "lost" ? "wb-r-bad" : c.level === "warn" ? "wb-r-warn" : ""}">
        <td data-l="Live"><div class="av-row" style="flex-wrap:nowrap">${shotHtml(c)}<span><span class="t">${esc(c.title)}</span><span class="s">${esc(c.brand || "—")} · ${esc(c.machine)}${c.obs_port ? " · OBS " + c.obs_port : ""}</span></span></div></td>
        <td data-l="Trạng thái"><span class="av-pill ${lv[1]}">${lv[0]}</span>${c.problem ? `<span class="s" style="color:${c.level === "warn" ? "var(--warn)" : "var(--bad)"}">${esc(c.problem.text)} · ${since(c.problem.since_ts)}</span>` : ""}</td>
        <td data-l="Lên sóng">${c.on_air_since_ts ? since(c.on_air_since_ts, "dur") : "—"}</td>
        <td data-l="Hình">${c.fps != null ? num(c.fps) + " fps" : "–"}${c.mode ? " · " + esc(c.mode) : ""}</td>
        <td data-l="AI"><span class="av-pill ${c.ai.tone === "warn" ? "p-warn" : c.ai.tone === "ok" ? "p-ok" : "p-idle"}">${esc(c.ai.text)}</span></td>
        <td data-l="Chi phí" style="min-width:140px"><span style="font-size:12.5px">${esc(cost.text)}</span>${cost.cap ? `<div class="av-prog" style="margin-top:4px"><i style="width:${pct}%;background:${cost.over ? "var(--bad)" : pct >= 80 ? "#b95f0a" : "var(--navy)"}"></i></div>` : ""}</td>
        <td data-l="Hôm nay" style="min-width:220px">${mini(c.live)}</td>
        <td style="white-space:nowrap">${cmdLine(c)}<button class="av-btn sm" data-wb-goto="${esc(c.key)}">Mở</button></td></tr>`; }).join("");
    view().innerHTML = head("list", d.inc_open) + prob + `
      <section class="av-panel"><div class="av-panel-h"><h2>Đang chạy <span class="av-hint" style="font-weight:500">· ${(d.cards || []).length} live</span></h2><span class="av-hint">Hôm nay 06h–24h: ô xanh nhạt = kế hoạch, vạch đặc = thực tế, vạch hồng = bây giờ</span></div>
        ${(d.cards || []).length ? `<div class="av-tw"><table class="ls-table"><thead><tr><th>Live</th><th>Trạng thái</th><th>Lên sóng</th><th>Hình</th><th>AI</th><th>Chi phí hôm nay / trần</th><th>Hôm nay</th><th></th></tr></thead><tbody>${run}</tbody></table></div>` : `<div class="av-empty">Không có live nào đang chạy.</div>`}</section>` + waitLine();
    stamp(); paintThumbs();
  }

  /* ---------- anh: chi tai anh moi, toi da 4 luot cung luc ---------- */
  function pumpThumbs() {
    for (const c of (M.data && M.data.cards) || []) {
      const t = c.thumb || {}; if (!t.kind || !t.ts) continue;
      const id = c.key + "|" + t.kind, have = M.thumbs.get(id);
      if ((!have || have.v < t.ts) && !M.queue.some((q) => q.id === id)) M.queue.push({ id, key: c.key, kind: t.kind, v: t.ts });
    }
    while (M.running < 4 && M.queue.length) { const q = M.queue.shift(); M.running++; fetchThumb(q).finally(() => { M.running--; pumpThumbs(); }); }
  }
  async function fetchThumb(q) {
    const r = await call("monitor_thumb", { key: q.key, kind: q.kind }, "GET");
    if (!r.success || !r.data) return;
    M.thumbs.set(q.id, { v: q.v, uri: r.data.data_uri }); paintThumbs();
  }
  function paintThumbs() {
    document.querySelectorAll("img[data-lm-img]").forEach((img) => { const t = M.thumbs.get(img.dataset.lmImg); if (t && img.getAttribute("src") !== t.uri) img.src = t.uri; });
  }

  /* ---------- lenh 1 cham ---------- */
  async function sendCmd(btn, key, action, args) {
    const c = cardByKey(key); if (!c) return;
    if (action === "pause_ai" && !confirm(`Tạm dừng AI cho ${c.title} (${c.machine})?`)) return;
    btn.disabled = true; btn.classList.add("av-loading");
    const r = await call("wall_command", { machine: c.machine, live: c.live, action, args: args ? JSON.stringify(args) : null });
    btn.disabled = false; btn.classList.remove("av-loading");
    if (!r.success) return toast(r.message || "Không gửi được lệnh", true);
    M.cmd.set(key, { id: r.data.id, action, status: "Queued", result: "", t0: Date.now() });
    if ($("av-modal-box").dataset.wbSide === key) openSide(); else closeModal();
    render(); pollCmds();
  }
  async function pollCmds() {
    clearTimeout(M.cmdTimer);
    const open = [...M.cmd.entries()].filter(([, v]) => ["Queued", "Sent"].includes(v.status) && Date.now() - v.t0 < 150000);
    if (!open.length || !on()) return;
    const r = await call("command_status", { ids: JSON.stringify(open.map(([, v]) => v.id)) }, "GET");
    if (r.success) { for (const x of r.data.commands) for (const [k, v] of M.cmd) if (v.id === x.id) M.cmd.set(k, Object.assign(v, { status: x.status, result: x.result }));
      if (M.data && sub() !== "inc") { render(); if ($("av-modal-box").dataset.wbSide) openSide(); } }
    M.cmdTimer = setTimeout(pollCmds, 3000);
  }
  async function faqModal(key) {
    const c = cardByKey(key); if (!c) return;
    modal(`<h3 style="margin:0">Phát FAQ – ${esc(c.title)}</h3><div class="av-hint">Đang tải danh sách FAQ trên máy…</div>`);
    const r = await call("monitor_detail", { key }, "GET");
    const faq = (r.success && r.data.faq) || [];
    modal(`<h3 style="margin:0">Phát FAQ – ${esc(c.title)}</h3>
      ${faq.length ? `<label class="av-f">Chọn FAQ có clip trên máy<select id="wb-faq"><option value="">— chọn —</option>${faq.map((f) => `<option value="${esc(f.id || f.title)}">${esc(f.title || f.id)}</option>`).join("")}</select></label>` : `<div class="av-hint">Máy chưa gửi danh sách FAQ (cần app eC Live ≥ 1.0.21). Gõ tên chủ đề FAQ đúng như trong Bộ live.</div>`}
      <label class="av-f">Hoặc gõ chủ đề<input type="text" id="wb-topic" maxlength="120" placeholder="vd Giá, Cách pha"></label>
      <div class="av-row" style="justify-content:flex-end"><button class="av-btn" data-close>Huỷ</button><button class="av-btn pri" data-wb-faqgo="${esc(key)}">Phát ngay</button></div>`);
  }
  /* dien thoai: o chi tiet thanh hop thoai */
  function openSide() {
    const [row, c] = selected(); if (!row && !c) return;
    modal(`<div class="av-row" style="justify-content:flex-end"><button class="av-btn sm" data-close aria-label="Đóng">✕</button></div>${sideHtml(row, c)}`);
    $("av-modal-box").dataset.wbSide = c ? c.key : "-"; paintThumbs();
  }

  /* ---------- su co ---------- */
  function ackModal(name, level) {
    modal(`<h3 style="margin:0">Xác nhận sự cố</h3><div class="av-hint">Xác nhận chỉ dừng tin nhắc lại và leo thang do ERP gửi. Tin app tự gửi không dừng được. Khi máy / báo động hết, ERP vẫn báo "đã có lại / đã ổn".</div>
      <label class="av-f">Ghi chú${level === "critical" ? " (bắt buộc với KHẨN)" : ""}<textarea id="wb-note" rows="3" maxlength="500" placeholder="vd Đã gọi anh Nam ra kiểm tra máy" style="font-family:inherit;font-size:13px;min-height:80px"></textarea></label>
      <div class="av-row" style="justify-content:flex-end"><button class="av-btn" data-close>Huỷ</button><button class="av-btn pri" data-wb-ackgo="${esc(name)}" data-lv="${esc(level)}">Xác nhận</button></div>`);
    setTimeout(() => { const t = $("wb-note"); if (t) t.focus(); }, 30);
  }
  async function ackGo(btn) {
    const note = ($("wb-note").value || "").trim();
    if (btn.dataset.lv === "critical" && !note) return toast("Sự cố KHẨN cần ghi chú (đã làm gì / ai đang xử lý).", true);
    btn.disabled = true; btn.classList.add("av-loading");
    const r = await call("ack_incident", { name: btn.dataset.wbAckgo, note });
    btn.disabled = false; btn.classList.remove("av-loading");
    if (!r.success) return toast(r.message || "Không xác nhận được", true);
    toast("Đã xác nhận – ERP dừng nhắc lại"); closeModal();
    return sub() === "inc" ? loadInc() : refresh();
  }
  async function loadInc() {
    clearTimeout(M.timer);
    if (!M.inc) view().innerHTML = head("inc", 0) + `<div class="lm-empty">Đang tải sự cố…</div>`;
    const r = await call("list_incidents", { status: M.incStatus, days: 7 }, "GET");
    if (sub() !== "inc") return;
    if (!r.success) { toast(r.message || "Lỗi", true); return; }
    M.inc = r.data; M.skew = r.data.server_time - Date.now() / 1000; renderInc();
    M.timer = setTimeout(() => { if (sub() === "inc" && $("av-modal").hidden) loadInc(); }, 30000);
  }
  function renderInc() {
    if (!M.inc) return;
    const d = M.inc, k = d.counts || {};
    const TABS = [["open", "Đang mở"], ["acked", "Đã xác nhận"], ["done", "Đã xong (7 ngày)"]];
    const KIND = { machine_silent: "Máy im lặng", forward: "Báo động gửi hộ" };
    const rows = d.rows.map((x) => `<tr><td data-l="Mức"><span class="av-pill ${x.level === "critical" ? "p-bad" : "p-warn"}">${x.level === "critical" ? "■ KHẨN" : "▲ Cảnh báo"}</span></td>
      <td data-l="Ở đâu"><span class="t">${esc(x.machine)}${x.live ? " · " + esc(x.live) : ""}</span><span class="s">${esc(x.brand || "—")} · ${KIND[x.kind] || esc(x.kind)}</span></td>
      <td data-l="Nội dung">${esc(x.text)}${x.escalated_ts ? `<span class="s" style="color:var(--bad)">Đã leo thang lúc ${hhmm(x.escalated_ts)}</span>` : ""}${x.resolve_text ? `<span class="s">${esc(x.resolve_text)}</span>` : ""}</td>
      <td data-l="Bắt đầu">${dmy(x.opened_ts)} ${hhmm(x.opened_ts)}</td><td data-l="Kéo dài">${x.status === "Resolved" ? dur(x.duration_s) : since(x.opened_ts, "dur")}</td>
      <td data-l="Đã gửi">${x.sent_count} tin</td>
      <td data-l="Xác nhận">${x.acked_by ? `${esc(x.acked_by)}<span class="s">${hhmm(x.acked_ts)}${x.ack_note ? " · " + esc(x.ack_note) : ""}</span>` : "—"}</td>
      <td>${incBtn(x)}</td></tr>`).join("");
    view().innerHTML = head("inc", k.open || 0) + `
      <div class="av-chips">${TABS.map(([v, l]) => `<button class="av-chip ${M.incStatus === v ? "on" : ""}" data-wb-st="${v}">${l} <span class="n">${k[v] || 0}</span></button>`).join("")}</div>
      ${d.rows.length ? `<div class="av-panel"><div class="av-tw"><table class="ls-table"><thead><tr><th>Mức</th><th>Ở đâu</th><th>Nội dung</th><th>Bắt đầu</th><th>Kéo dài</th><th>Đã gửi</th><th>Xác nhận</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
        : `<div class="av-panel"><div class="av-empty">${M.incStatus === "open" ? "Không có sự cố nào đang mở." : "Không có sự cố nào."}</div></div>`}`;
  }

  /* ---------- bieu do 1 gio cua 1 live ---------- */
  function spark(samples, f, max) {
    const pts = samples.filter((s) => s[f] != null); if (pts.length < 2) return `<svg viewBox="0 0 300 56" role="img" aria-label="Chưa đủ số liệu"><text x="150" y="32" text-anchor="middle" font-size="11" fill="currentColor" opacity=".5">Chưa đủ số liệu</text></svg>`;
    const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts || t0 + 1, hi = Math.max(max || 0, ...pts.map((s) => s[f])) || 1;
    const xy = pts.map((s) => `${(((s.ts - t0) / (t1 - t0 || 1)) * 296 + 2).toFixed(1)},${(54 - (s[f] / hi) * 50).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Biểu đồ 1 giờ"><polyline points="${xy}" fill="none" stroke="var(--navy)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  }
  async function openDetail(key) {
    M.detail = key;
    const r = await call("monitor_detail", { key }, "GET");
    if (M.detail !== key || !on()) return;
    if (!r.success) { toast(r.message || "Lỗi", true); return; }
    const d = r.data, lv = LV[d.level] || LV.ok, s = d.samples || [], m = d.metrics || {}, last = (f) => num(m[f], f === "drop_pct" ? 1 : 0);
    const chart = (f, label, max) => `<div class="lm-chart"><h4><span>${label}</span><b>${last(f)}</b></h4>${spark(s, f, max)}</div>`;
    modal(`<div class="av-row" style="justify-content:space-between"><div><div class="av-eyebrow">${esc(d.machine)} · ${esc(d.live)}</div><h2 style="margin:0;font-size:17px">${esc(d.brand || "—")} <span class="av-pill ${lv[1]}">${lv[0]}</span></h2></div><button class="av-btn sq" data-close aria-label="Đóng">✕</button></div>
      ${(d.reasons || []).length ? `<ul class="lm-why">${d.reasons.map((x) => `<li class="${esc(x.level)}">${esc(x.text)}</li>`).join("")}</ul>` : `<div class="av-callout"><div>Không có cảnh báo.</div></div>`}
      <div class="lm-sub">${esc(ST[d.state] || d.state || "—")} · tín hiệu ${ago(d.stale_s)} trước${d.app_version ? " · app " + esc(d.app_version) : ""}</div>
      <div class="lm-charts">${chart("fps", "Khung hình/giây (1 giờ)", 30)}${chart("drop_pct", "Rớt khung (%)", 5)}${chart("gpu", "Card đồ hoạ (%)", 100)}${chart("kbps", "Bitrate lên sàn (kbps)")}</div>
      <div><div class="av-eyebrow" style="margin-bottom:4px">Báo động 24 giờ</div>${(d.alerts || []).length ? `<div class="av-tw"><table><thead><tr><th>Lúc</th><th>Mức</th><th>Nội dung</th><th>Teams / Zalo</th></tr></thead><tbody>${d.alerts.map((a) => `<tr><td>${hhmm(a.ts)}</td><td><span class="av-pill ${(LV[a.level] || LV.warn)[1]}">${(LV[a.level] || LV.warn)[0]}</span></td><td>${esc(a.text)}</td><td>${esc(a.teams || "–")} / ${esc(a.zalo || "–")}</td></tr>`).join("")}</tbody></table></div>` : `<div class="lm-sub">Chưa có báo động nào.</div>`}</div>`, true);
  }

  /* ---------- su kien ---------- */
  document.addEventListener("click", async (e) => {
    if (!on()) return;
    const t = e.target.closest ? e.target.closest("[data-lm],[data-wb-cmd],[data-wb-ack],[data-wb-ackgo],[data-wb-faqgo],[data-wb-st],[data-wb-row],[data-wb-sel],[data-wb-goto],[data-wb-full],[data-lm-key]") : null; if (!t) return;
    if (t.dataset.lm === "retry") return refresh();
    if (t.dataset.lm === "test") {
      t.disabled = true; t.classList.add("av-loading");
      try { const r = await call("alert_test", {}); if (!r.success) return toast(r.message || "Lỗi", true);
        const f = (x) => (x.ok ? "đã gửi" : x.code === "OFF" ? "chưa bật" : "lỗi " + x.code); toast(`Teams: ${f(r.data.teams)} · Zalo: ${f(r.data.zalo)}`, !(r.data.teams.ok || r.data.zalo.ok)); }
      finally { t.disabled = false; t.classList.remove("av-loading"); }
      return;
    }
    if (t.dataset.wbCmd) return t.dataset.wbCmd === "play_faq" ? faqModal(t.dataset.key) : sendCmd(t, t.dataset.key, t.dataset.wbCmd);
    if (t.dataset.wbFaqgo) { const topic = (($("wb-faq") || {}).value || $("wb-topic").value || "").trim(); if (!topic) return toast("Chọn hoặc gõ chủ đề FAQ", true); return sendCmd(t, t.dataset.wbFaqgo, "play_faq", { topic }); }
    if (t.dataset.wbAck) return ackModal(t.dataset.wbAck, t.dataset.lv);
    if (t.dataset.wbAckgo) return ackGo(t);
    if (t.dataset.wbSt) { M.incStatus = t.dataset.wbSt; M.inc = null; return loadInc(); }
    if (t.dataset.wbFull) { M.full = !M.full; return render(); }
    if (t.dataset.wbRow) { M.sel = t.dataset.wbRow; render(); if (mobile()) openSide(); return; }
    if (t.dataset.wbSel) { M.selKey = t.dataset.wbSel; M.sel = ""; render(); if (mobile()) openSide(); return; }
    if (t.dataset.wbGoto) { location.hash = "#/monitor/live/" + encodeURIComponent(t.dataset.wbGoto); return; }
    if (t.dataset.lmKey) return openDetail(t.dataset.lmKey);
  });
  document.addEventListener("change", (e) => {
    if (!on()) return;
    if (e.target.id === "wb-brand") { M.brand = e.target.value; return refresh(); }
    if (e.target.id === "wb-machine") { M.machine = e.target.value; return refresh(); }
  });
  document.addEventListener("visibilitychange", () => { if (on() && !document.hidden && M.data && nowS() - M.data.server_time > 20 && sub() !== "inc") refresh(); });
  window.ecAiLiveMon = { load };
})();
</script>
