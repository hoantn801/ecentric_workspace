<style id="ec-aiv-css">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

#ec-aiv-root{

  --line:#e5e7eb;--line-soft:#f1f2f6;--navy:#2C3DA6;--navy-d:#1f2c80;--navy-wash:#eef0fb;--navy-line:#c9d0f0;

.av-chip.on{border-color:var(--navy);color:var(--navy);background:var(--navy-wash)} .av-chip.on .n{background:var(--navy);color:#fff}

<script>
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_video.controllers.api.";
  const CATS = [["", "Tự nhận theo mô tả"], ["milk_can", "Sữa lon"], ["milk_carton_pack", "Sữa hộp / vỉ"], ["oil_bottle", "Chai dầu ăn"],
    ["personal_care_bottle", "Chai dầu gội / sữa tắm"], ["cream_tube", "Tuýp kem"], ["diaper_pack", "Bịch tã / bỉm"],
    ["battery_blister", "Vỉ pin"], ["small_box", "Hộp nhỏ (pin, mỹ phẩm)"], ["biscuit_box_large", "Hộp bánh lớn"],
    ["soft_pouch", "Túi mềm (bánh, bông, khẩu trang)"], ["hair_dryer", "Máy sấy"], ["table_appliance", "Đồ gia dụng để bàn"]];
  const STEPS = [["host", "0. Host & khung neo"], ["talk", "A. Video chỉ nói"], ["input", "B1. Nhập SKU"], ["pick", "B2. Duyệt ảnh"], ["video", "B3. Clip cầm SP"], ["mix", "B4. Trộn & xuất"], ["prompt", "Prompt"]];
  const UNIT_LABEL = { putdown_left: "Hạ trái", putdown_right: "Hạ phải", putdown_below: "Hạ dưới", pickup_left: "Lấy trái", pickup_right: "Lấy phải", pickup_below: "Lấy dưới", hold_01: "Cầm A", hold_02: "Cầm B", hold_03: "Cầm C", hold_04: "Cầm D", hold_05: "Cầm E", hold_06: "Cầm F" };

     (vai + tay ao ~44 cm chiem ~58% be ngang anh) - doi chieu lo Friso: vi 110ml ~17 cm, 180ml ~24 cm. */
  const CM_PER_W = 1 / 0.0132;
  const GROUP_ST = { ok: ["Đã kiểm chứng", "p-ok"], try: ["Đang thử", "p-warn"], none: ["Mẫu chung", "p-idle"] };
  /* 12/10: cong thuc prompt theo BRAND + DONG SP (worker luu, chot = khoa prompt) */
  const RCP_ST = { ok: ["Đã chốt", "p-ok"], try: ["Đang thử", "p-warn"], off: ["Tắt", "p-idle"] };
  const RCP_SIDE = [["host_right", "Tay phải host đỡ đáy (bên trái ảnh)"], ["host_left", "Tay trái host đỡ đáy (bên phải ảnh)"], ["auto", "Để AI tự chọn"]];
  const RCP_CLIP = [["gesture_b", "Cử chỉ nhẹ (khuyên dùng)"], ["still", "2 tay giữ, không cử chỉ"], ["on_product", "Cử chỉ trên SP (chạm nắp, chỉ logo)"], ["one_hand", "Cầm 1 tay, tay kia cử chỉ"]];
  let frDrag = null;
  const S = { showFrame: true, projects: [], brand: "", p: null, items: [], exports: [], step: "input", timer: null, sel: new Set(), mixSel: new Set(), drafts: [], prompts: null, busy: false, btn: null, shown: null, syncing: false, renderLater: false, bulk: null };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 10/10: loi AI kiem tra anh cam (worker tra ma khong dau) -> chu de doc
  const QC_VI = [[/^co x/, "Cỡ SP x"], [/^ho rang$/, "Cười hở răng"], [/^nham mat$/, "Nhắm mắt"], [/^dat tren ban$/, "SP đặt trên bàn"], [/^sai SP$/, "Sai sản phẩm"], [/^sai chu /, "Sai chữ: "], [/^chu /, "Chữ hơi lệch: "]];
  const qcVi = (x) => QC_VI.reduce((a, [r, t]) => a.replace(r, t), String(x));
  const qcView = (q) => !q ? "" : !q.pass ? `<div class="qc bad">⚠ ${esc((q.issues || []).map(qcVi).join(" · "))}</div>`
    : (q.warn || []).length ? `<div class="qc warn">${esc(q.warn.map(qcVi).join(" · "))}</div>` : '<div class="qc ok">✓ AI kiểm tra: ổn</div>';

  /* ---------- API ---------- */
  const serverMsg = (b) => { try { const a = JSON.parse(b._server_messages || "[]"); if (a.length) return JSON.parse(a[0]).message || ""; } catch (e) { /* bo qua */ } return ""; };
  async function call(method, args, http) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (http === "GET") { const qs = new URLSearchParams(Object.entries(args || {}).filter(([, v]) => v != null)).toString(); if (qs) url += "?" + qs; }
    else { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = (window.frappe && window.frappe.csrf_token) || ""; opts.body = JSON.stringify(args || {}); }
    let res;
    try { res = await fetch(url, opts); } catch (e) { return { success: false, message: "Mất kết nối mạng.", data: null }; }
    if (res.status === 401 || res.status === 403) return { success: false, message: "Phiên đăng nhập hết hạn hoặc chưa có quyền EC AI Content.", data: null };
    let body = {}; try { body = await res.json(); } catch (e) { /* khong phai JSON */ }
    if (!res.ok) return { success: false, message: serverMsg(body) || ("Máy chủ báo lỗi (" + res.status + ")."), data: null };
    const m = body.message; if (m && typeof m === "object" && typeof m.success === "boolean") return m;
    return { success: true, message: "", data: m };
  }
  /* nut vua bam (S.btn) quay vong + khoa lai cho den khi may chu tra loi: bam "Duyet" la thay ngay dang xu ly */
  async function act(method, args, okMsg) {
    if (S.busy) { toast("Đang xử lý thao tác trước, đợi chút…"); return null; } S.busy = true;
    const b = S.btn; S.btn = null; if (b) { b.disabled = true; b.classList.add("av-loading"); b.setAttribute("aria-busy", "true"); }
    try { const r = await call(method, args); if (!r.success) { toast(r.message || "Lỗi", true); return null; } if (okMsg) toast(okMsg); return r.data; }
    finally { S.busy = false; if (b && b.isConnected) { b.disabled = false; b.classList.remove("av-loading"); b.removeAttribute("aria-busy"); } }
  }
  async function upload(file) {
    const fd = new FormData(); fd.append("file", file, file.name); fd.append("is_private", 1);
    const r = await fetch("/api/method/upload_file", { method: "POST", credentials: "same-origin", headers: { "X-Frappe-CSRF-Token": (window.frappe && window.frappe.csrf_token) || "" }, body: fd });
    let j = null; try { j = await r.json(); } catch (e) { /* 413 nginx */ }
    const url = j && j.message && j.message.file_url; if (!url) throw new Error(r.status === 413 ? "File quá lớn" : "Tải file lỗi");
    return url;
  }
  let tt; function toast(msg, err) { const t = $("av-toast"); t.textContent = msg; t.className = "av-toast show" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 2600); }

  /* ---------- modal / media ---------- */
  function modal(html, media) { const b = $("av-modal-box"); b.className = "box" + (media ? " media" : ""); b.innerHTML = html; $("av-modal").hidden = false; }
  function closeModal() { if (S.fr && S.fr.dirty && !confirm("Bỏ thay đổi khung chưa lưu?")) return; S.fr = null; frDrag = null; $("av-modal").hidden = true; $("av-modal-box").innerHTML = ""; }
  function showMedia(url, kind) { if (!url) return; modal(kind === "video" ? `<video src="${esc(url)}" controls autoplay loop playsinline></video>` : `<img src="${esc(url)}" alt="">`, true); }

  /* ---------- routing ---------- */
  function route() { const h = location.hash.replace(/^#\/?/, ""); const m = /^p\/([^/]+)(?:\/(\w+))?/.exec(h); return m ? { project: decodeURIComponent(m[1]), step: m[2] || null } : { project: null }; }
  window.addEventListener("hashchange", load);
  async function load() {
    clearTimeout(S.timer); const r = route();
    if (!r.project) return loadHub();
    S.step = r.step || null;
    return loadProject(r.project, true);
  }

  /* ---------- hub ---------- */
  async function loadHub() {
    S.shown = null;
    const r = await call("list_projects", {}, "GET");
    if (!r.success) { $("av-view").innerHTML = `<div class="av-callout bad">${esc(r.message)}</div>`; return; }
    S.projects = r.data.projects || []; renderHub(r.data.worker_configured);
  }
  function renderHub(configured) {
    const all = S.projects || [], arch = all.filter((p) => p.status === "Lưu trữ"), ps = S.showArch ? arch : all.filter((p) => p.status !== "Lưu trữ"), brands = {};
    ps.forEach((p) => { brands[p.brand] = (brands[p.brand] || 0) + 1; });
    const tot = { sku: 0, run: 0, pick: 0, qc: 0, done: 0 };
    ps.forEach((p) => { const c = p.counts || {}; tot.sku += c.total || 0; tot.run += c.running || 0; tot.pick += c.pick || 0; tot.qc += c.qc || 0; tot.done += (c.done || 0) + (c.ready || 0); });
    const list = ps.filter((p) => !S.brand || p.brand === S.brand);
    $("av-view").innerHTML = `
      <section class="av-hero"><div><h1>AI Video hàng loạt</h1><div class="sub">Mỗi dự án là một brand + một host. Nhập lô SKU, chọn ảnh cầm, tạo clip rồi trộn ra nhiều video khác nhau cho CapCut.</div>
        <span class="tag" id="av-ping">Đang kiểm tra máy chạy video…</span></div>

      ${configured ? "" : `<div class="av-callout warn"><div><b>Chưa nối máy chạy video.</b> Cần khai <code>ec_video_worker_url</code> và <code>ec_video_worker_secret</code> trong site_config (IT làm một lần). Vẫn tạo dự án và nhập lô được.</div></div>`}

        ${Object.keys(brands).sort().map((b) => `<button class="av-chip ${S.brand === b ? "on" : ""}" data-brand="${esc(b)}">${esc(b)} <span class="n">${brands[b]}</span></button>`).join("")}
        ${arch.length || S.showArch ? `<button class="av-chip ${S.showArch ? "on" : ""}" id="av-arch" title="Dự án đã lưu trữ">${S.showArch ? "← Đang dùng" : "Đã lưu trữ"} <span class="n">${arch.length}</span></button>` : ""}</div>
      <div class="av-cards">
        ${list.map((p) => { const c = p.counts || {}; const pct = c.total ? Math.round(100 * ((c.done || 0) + (c.ready || 0)) / c.total) : 0;
          const st = c.error ? `<span class="av-pill p-bad">${c.error} lỗi</span>` : (c.pick + c.qc) ? `<span class="av-pill p-warn">${c.pick + c.qc} chờ bạn</span>` : c.running ? `<span class="av-pill p-run">Đang chạy</span>` : `<span class="av-pill p-idle">${esc(p.status)}</span>`;
          return `<article class="av-card"><div class="corner">${st}</div><div class="ico">${esc((p.brand || "?").slice(0, 2).toUpperCase())}</div>
            <div><div class="av-eyebrow">${esc(p.brand)}${p.night_mode ? " · chạy đêm" : ""}</div><h3>${esc(p.title)}</h3></div>
            <div class="av-meta"><span><b>${c.total || 0}</b> SKU</span><span><b>${c.pick || 0}</b> chờ chọn ảnh</span><span><b>${c.qc || 0}</b> chờ duyệt</span><span><b>${(c.ready || 0) + (c.done || 0)}</b> đủ clip</span></div>
            <div class="av-prog" aria-hidden="true"><i style="width:${pct}%"></i></div>
            <div class="foot"><span class="av-hint">${pct}% SKU đủ clip</span><a class="av-outline" href="#/p/${encodeURIComponent(p.name)}">Mở dự án →</a></div></article>`; }).join("")}
        ${S.showArch ? (list.length ? "" : '<div class="av-empty">Chưa có dự án lưu trữ.</div>') : '<button class="av-card new" id="av-new">+ Tạo dự án mới</button>'}
      </div>`;
    ping();
  }
  async function ping() {
    const el = $("av-ping"); if (!el) return;
    const r = await call("worker_ping", {}, "GET");
    if (!$("av-ping")) return;
    if (r.success && r.data.up) { const b = r.data.breaker || {}; const wait = b.until && b.until > Date.now(); el.textContent = wait ? "Máy chạy video: bật · nhà cung cấp AI đang lỗi, tự thử lại lúc " + new Date(b.until).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) : "Máy chạy video: đang bật"; }
    else el.textContent = "Máy chạy video: " + ((r.data && r.data.message) || r.message || "không kết nối được");
  }
  function newProjectForm(p) {
    p = p || {};
    modal(`<h2 style="margin:0;font-size:17px">${p.name ? "Cài đặt dự án" : "Tạo dự án"}</h2>
      <div class="av-grid2"><label class="av-f">Brand<input type="text" id="np-brand" value="${esc(p.brand || "")}" placeholder="VD: Friso"></label>
      <label class="av-f">Tên dự án<input type="text" id="np-title" value="${esc(p.title || "")}" placeholder="VD: Livestream tháng 10"></label></div>
      <div class="av-f">Ảnh host (9:16, host ngồi sau bàn)<div class="av-up" id="np-host-up">${p.host_image ? `<img class="av-thumb" src="${esc(p.host_image)}" alt="">` : ""}<label>Chọn ảnh<input type="file" accept="image/*" id="np-host"></label><span class="av-hint" id="np-host-t"></span></div></div>

  let loading = false, loadNext = null;

    } finally { loading = false; S.syncing = false; syncMark(); }
    if (loadNext) { const n = loadNext; loadNext = null; return loadProject(n.name, n.doTick); }

  function typing() { if (S.picking && Date.now() - S.picking < 60000) return true; const a = document.activeElement; return !!(a && root().contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !/^(checkbox|file|radio)$/.test(a.type) && !a.closest("#av-modal")); }

  /* co audio: video = 2s dau + audio + 2s cuoi (may chay video tu do audio); khong audio: so giay nhap / mac dinh du an */
  function durTxt(i) { if (!i.audio_file) return (i.audio_seconds || S.p.audio_seconds || 72) + "s"; return (i.audio_seconds ? "~" + Math.round(+i.audio_seconds + 4) + "s · " : "") + '<span title="2s đầu chưa nói + audio + 2s cuối">audio +2s đầu/cuối</span>'; }

  function bulkModal() {

  function bulkRows() {

      if (f.kind === "audio") { if (same || side) { out.audio = f.url; out.sec = f.sec; } return; }

  function audioSec(f) { return new Promise((res) => { const a = new Audio(), u = URL.createObjectURL(f); let done = false; const fin = (v) => { if (done) return; done = true; URL.revokeObjectURL(u); res(v); };
    a.preload = "metadata"; a.onloadedmetadata = () => fin(isFinite(a.duration) ? Math.round(a.duration) : 0); a.onerror = () => fin(0); a.src = u; setTimeout(() => fin(0), 5000); }); }

    if (t.id === "pj-night" || t.id === "pj-gm" || t.id === "pj-ga") { const f = { "pj-night": "night_mode", "pj-gm": "gate_motion", "pj-ga": "gate_hold_a" }[t.id];
      const v = t.checked; t.disabled = true; S.btn = null;
      const r = await act("update_project", { name: S.p.name, data: JSON.stringify({ [f]: v ? 1 : 0 }) }, v ? "Đã bật" : "Đã tắt");
      t.disabled = false; if (!r) { t.checked = !v; return; } S.p[f] = v ? 1 : 0; return; }
    if (t.id === "bk-files" && t.files && t.files.length) { bulkAdd([...t.files]); t.value = ""; return; }
  });
  /* 08/10: bam chon anh/mp3 -> giu nguyen trang toi khi hop chon file dong (truoc: trang ve lai giua chung, file chon bi mat, phai bam lan 2) */
  document.addEventListener("click", (e) => { const l = e.target.closest && e.target.closest("label, input[type=file]"); if (l && root().contains(l) && (l.type === "file" || l.querySelector("input[type=file]"))) S.picking = Date.now(); }, true);
  window.addEventListener("focus", () => setTimeout(() => { if (!S.picking) return; S.picking = 0; if (S.renderLater && !typing() && !S.busy && S.p && route().project === S.p.name) renderProject(); }, 400));
  document.addEventListener("focusout", () => setTimeout(() => { if (S.renderLater && !typing() && !S.busy && S.p && route().project === S.p.name) renderProject(); }, 250));  /* 250ms: de cu bam nut (vd Luu) xong da roi moi ve lai */
  document.addEventListener("input", (e) => { const t = e.target;
    if (t.id === "mx-d") S.mixD = t.value;   /* 09/10: giu gia tri nhap khi trang ve lai (truoc: tra ve 5 -> tron 5 ban) */
    if (t.id === "mx-b") S.mixBatch = t.value;
    if (t.id === "mx-n") { S.mixN = t.value; const n = +t.value || 0; document.querySelectorAll("[data-hmax]").forEach((x) => { const bad = n > +x.dataset.hmax; x.style.color = bad ? "var(--bad)" : ""; x.style.fontWeight = bad ? "600" : ""; }); } if (t.id === "fr-range" && S.fr) { frResize(+t.value / 100); return; }
    if (t.id === "bk-text" && S.bulk) { S.bulk.text = t.value; clearTimeout(S.bkT); S.bkT = setTimeout(bulkRefresh, 250); return; } if (t.dataset && t.dataset.dk && t.closest("[data-draft]")) S.drafts[+t.closest("[data-draft]").dataset.draft][t.dataset.dk] = t.value; });
  load();
})();
</script>
