<style id="ec-aiv-css">
body > header, body > footer, body > nav.navbar, header.navbar,
.web-page-header, #navbarSupportedContent, .navbar-collapse { display:none; }
body { padding:0; margin:0; background:#eef3f2; }
body main { padding-top:0; }
body .main-section, body main.container, body main.fluid { margin:0; padding:0; max-width:100%; }
.ec-aiv-wrap { display:flex; min-height:100vh; max-width:none; width:100%; }
.ec-aiv-wrap > main.ec-aiv-main { flex:1; min-width:0; padding:0; overflow-x:hidden; background:transparent; }

#ec-aiv-root{
  --bg1:#eef3f2;--bg2:#e4eef0;--bg3:#f1ecf6;--bg4:#fdf1e6;
  --ink:#16201f;--ink2:#3d4a49;--muted:#5f6c6b;
  --glass:rgba(255,255,255,.7);--glass2:rgba(255,255,255,.9);--stroke:rgba(255,255,255,.92);--line:rgba(20,40,38,.1);
  --teal:#0b7f80;--teal-ink:#086667;--teal2:#0bbf9a;--amber:#e07d1c;--amber-ink:#9a5208;--rose:#e0577f;--bad:#b4231f;--bad-bg:#fdecea;
  --ok:#0a7a5a;--ok-bg:rgba(11,191,154,.13);--warn-bg:#fdf0e6;
  --shadow:0 24px 60px rgba(30,70,66,.14);--shadow2:0 8px 22px rgba(30,70,66,.09);
  --r-card:20px;--r-pill:999px;
  font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);
  min-height:calc(100vh - 56px);
  background:
    radial-gradient(1000px 650px at 0% 0%,var(--bg2),transparent 55%),
    radial-gradient(900px 700px at 100% 0%,var(--bg4),transparent 50%),
    radial-gradient(900px 800px at 100% 100%,var(--bg3),transparent 58%),
    linear-gradient(140deg,var(--bg1),var(--bg2));
}
#ec-aiv-root *{box-sizing:border-box}
/* :where() = do dac hieu 0: reset khong de len class thanh phan (QC 15/11: nut chinh mat nen teal) */
:where(#ec-aiv-root) :where(button,input,select,textarea){font:inherit;color:inherit}
:where(#ec-aiv-root) :where(button){cursor:pointer;border:0;background:none}
:where(#ec-aiv-root) :where(button:disabled){cursor:not-allowed}
#ec-aiv-root [hidden]{display:none !important}
#ec-aiv-root :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#ec-aiv-root svg.i{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ec-aiv-root .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.av-shell{max-width:1440px;margin:0 auto;padding:18px 22px 64px}
.av-app{border-radius:28px;padding:16px;background:linear-gradient(160deg,var(--glass),rgba(255,255,255,.35));border:1px solid var(--stroke);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.av-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex-shrink:0;
  background:conic-gradient(from 210deg,var(--teal),var(--teal2),var(--amber),var(--teal));box-shadow:0 8px 18px rgba(11,143,143,.3)}
.av-logo svg.i{width:22px;height:22px}
#ec-aiv-root .av-title{font-size:21px;font-weight:800;margin:0;line-height:1.2}
.av-title small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.av-grow{flex:1}
.av-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:var(--r-pill);background:var(--glass2);border:1px solid var(--stroke);
  font-size:12.5px;font-weight:700;box-shadow:var(--shadow2);color:var(--ink2);min-height:36px}
.av-chip .dot{width:8px;height:8px;border-radius:50%;background:#9aa6a4;flex-shrink:0}
.av-chip.ok .dot{background:var(--teal2);box-shadow:0 0 0 4px rgba(11,191,154,.18)}
.av-chip.warn .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(224,125,28,.18)}
.av-chip.bad .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(180,35,31,.14)}
.av-chip.busy .dot{animation:avpulse 1s ease-in-out infinite}
@keyframes avpulse{50%{opacity:.35}}
.av-tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(20,40,38,.05);overflow-x:auto;scrollbar-width:none}
.av-tabs:empty{display:none}
.av-tabs::-webkit-scrollbar{display:none}
.av-tab{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--ink2);padding:8px 14px;border-radius:10px;white-space:nowrap;min-height:38px}
.av-tab[aria-selected="true"]{background:#fff;color:var(--teal);box-shadow:var(--shadow2)}
.av-tab .cnt{font-size:11px;font-weight:800;background:rgba(11,143,143,.12);color:var(--teal-ink);padding:1px 7px;border-radius:var(--r-pill)}
.av-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:#7a4510;font-weight:600;font-size:13px;line-height:1.45;border:1px solid rgba(224,125,28,.25)}
.av-banner.bad{background:var(--bad-bg);color:#8e1d19;border-color:rgba(180,35,31,.2)}
.av-banner.info{background:rgba(11,143,143,.08);color:#0b5f60;border-color:rgba(11,143,143,.2)}
.av-banner svg.i{margin-top:1px;color:inherit}
.av-banner .av-btn{margin-left:auto;flex-shrink:0}
.av-card{background:var(--glass2);border:1px solid var(--stroke);border-radius:var(--r-card);box-shadow:var(--shadow2);padding:15px 16px;min-width:0}
.av-ct{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:0 0 11px}
.av-ct svg.i{width:17px;height:17px;color:var(--teal)}
.av-ct .tag{margin-left:auto;font-size:11.5px;padding:3px 10px;border-radius:var(--r-pill);background:rgba(11,143,143,.12);color:var(--teal-ink);letter-spacing:0;text-transform:none}
.av-ct .tag.over{background:var(--bad-bg);color:var(--bad)}
.av-gen{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"main side" "recent side";gap:14px;align-items:start}
.av-main{grid-area:main}.av-side{grid-area:side}.av-recentcard{grid-area:recent}
.av-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.av-fld{width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;outline:none;background:#fff;min-height:40px}
.av-fld:focus{border-color:rgba(11,143,143,.55);box-shadow:0 0 0 3px rgba(11,143,143,.12)}
textarea.av-fld{resize:vertical;line-height:1.5;min-height:72px}
.av-editor{width:100%;min-height:260px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;font-size:15px;line-height:1.7;
  resize:vertical;outline:none;box-shadow:inset 0 1px 3px rgba(20,40,38,.04)}
.av-editor:focus{border-color:rgba(11,143,143,.55);box-shadow:0 0 0 3px rgba(11,143,143,.12)}
.av-efoot{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.av-modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.av-mode{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:11px 9px;text-align:center;transition:.16s;box-shadow:var(--shadow2);min-height:72px}
.av-mode b{display:block;font-size:13px}
.av-mode small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.av-mode[aria-checked="true"]{border-color:var(--teal);background:linear-gradient(160deg,rgba(11,143,143,.12),rgba(224,125,28,.06));box-shadow:0 12px 26px rgba(11,143,143,.16)}
.av-mode[aria-checked="true"] b{color:var(--teal)}
.av-vsel{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow2);min-height:62px}
.av-vsel:hover{border-color:rgba(11,143,143,.35)}
.av-vsel .nm{flex:1;min-width:0}
.av-vsel .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-vsel .nm small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-vsel .chg{font-size:12px;font-weight:800;color:var(--teal);white-space:nowrap}
.av-ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,#b8c2c0,#8a9694)}
.av-ava.nu{background:linear-gradient(135deg,#ff8fb3,#e0577f)}
.av-ava.nam{background:linear-gradient(135deg,#2bb3a8,#0b7f7f)}
.av-ava.brand{background:linear-gradient(135deg,#ffc27a,var(--amber))}
.av-par{margin-bottom:14px}
.av-par label,.av-par .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.av-par .val{font-size:12.5px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.av-par input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.av-par .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.av-toggle{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;width:100%;text-align:left}
.av-toggle .tl{flex:1;min-width:0}
.av-toggle small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.av-sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--teal2);position:relative;transition:.15s;flex-shrink:0}
.av-sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.15s}
[aria-checked="false"] > .av-sw{background:rgba(20,40,38,.18)}
[aria-checked="false"] > .av-sw::after{right:21px}
.av-genbtn{width:100%;padding:15px;border-radius:17px;color:#fff;font-size:15px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(135deg,#0a7f80,#0a8270);box-shadow:0 12px 24px rgba(11,143,143,.3);min-height:52px}
.av-genbtn:disabled{opacity:.55;box-shadow:none}
.av-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.av-hint.warn{color:var(--amber-ink)}
.av-hint.bad{color:var(--bad)}
.av-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:var(--r-pill);background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink2);box-shadow:var(--shadow2);min-height:38px;white-space:nowrap}
#ec-aiv-root .av-btn:hover:not(:disabled){border-color:rgba(11,143,143,.35);color:var(--teal)}
.av-btn:disabled{opacity:.5}
#ec-aiv-root .av-btn.pri{background:linear-gradient(135deg,#0a7f80,#0a8270);color:#fff;border-color:transparent}
#ec-aiv-root .av-btn.pri:hover:not(:disabled){color:#fff;filter:brightness(1.06)}
#ec-aiv-root .av-btn.danger{color:var(--bad)}
#ec-aiv-root .av-btn.danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.av-btn.sm{padding:6px 11px;font-size:12px;min-height:34px}
.av-ib{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:#f4f7f6;border:1px solid var(--line);color:var(--ink2);flex-shrink:0}
#ec-aiv-root .av-ib:hover:not(:disabled){background:#e6f2f0;color:var(--teal)}
#ec-aiv-root .av-ib.del:hover:not(:disabled){background:var(--bad-bg);color:var(--bad)}
#ec-aiv-root .av-ib.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-color:transparent}
.av-ib:disabled{opacity:.4}
.av-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.av-seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:rgba(20,40,38,.06);flex-wrap:wrap}
.av-seg button{font-weight:700;font-size:12.5px;color:var(--ink2);padding:6px 12px;border-radius:9px;min-height:34px}
.av-seg button[aria-pressed="true"]{background:#fff;color:var(--teal);box-shadow:var(--shadow2)}
.av-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;border-radius:var(--r-pill);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow2)}
.av-search:focus-within{border-color:rgba(11,143,143,.55);box-shadow:0 0 0 3px rgba(11,143,143,.12)}
#ec-aiv-root .av-search input:focus-visible{outline:none}
.av-search input{flex:1;border:0;outline:none;font-size:13.5px;background:transparent;min-width:0}
.av-search svg.i{color:var(--muted)}
.av-jobs{display:flex;flex-direction:column;gap:8px}
.av-job{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow2)}
.av-job.playing{border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,143,143,.12),var(--shadow2)}
.av-job .st{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:rgba(20,40,38,.06);color:var(--muted)}
.av-job .st.done{background:var(--ok-bg);color:var(--ok)}
.av-job .st.run{background:rgba(11,143,143,.12);color:var(--teal)}
.av-job .st.err{background:var(--bad-bg);color:var(--bad)}
.av-job .bd{flex:1;min-width:0}
.av-job .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.av-job .t b{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100% }
.av-job .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:4px 10px;flex-wrap:wrap}
.av-job .er{font-size:12.5px;color:var(--bad);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.av-job .acts{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.av-bar{height:6px;border-radius:99px;background:rgba(20,40,38,.08);overflow:hidden;margin-top:8px}
.av-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--amber));transition:width .4s}
.av-bar.indet span{width:35%;animation:avslide 1.4s ease-in-out infinite}
@keyframes avslide{0%{margin-left:-35% }100%{margin-left:100% }}
.av-badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:var(--r-pill);background:rgba(20,40,38,.07);color:var(--ink2);white-space:nowrap}
.av-badge.ok{background:var(--ok-bg);color:var(--ok)}
.av-badge.run{background:rgba(11,143,143,.12);color:var(--teal-ink)}
.av-badge.warn{background:rgba(224,125,28,.13);color:var(--amber-ink)}
.av-badge.bad{background:var(--bad-bg);color:var(--bad)}
.av-badge.nu{background:rgba(224,87,127,.12);color:#a82a52}
.av-badge.nam{background:rgba(11,143,143,.12);color:var(--teal-ink)}
.av-player{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:14px;background:linear-gradient(135deg,rgba(11,143,143,.08),rgba(224,125,28,.06));border:1px solid var(--line)}
.av-player input[type=range]{flex:1;accent-color:var(--teal);min-width:60px}
.av-player .tm{font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.av-vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.av-vcard{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow2);min-width:0}
.av-vcard.cur{border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,143,143,.14),var(--shadow2)}
.av-vcard.dim{opacity:.78}
.av-vcard .bd{flex:1;min-width:0}
.av-vcard .nm{font-size:14.5px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-vcard .bdg{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.av-vcard .ds{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av-vcard .note{font-size:12px;color:var(--amber-ink);margin-top:5px;line-height:1.4}
.av-vcard .note.bad{color:var(--bad)}
.av-vcard .ft{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:nowrap}
.av-vcard .ft .av-use{min-width:0;overflow:hidden;text-overflow:ellipsis}
.av-vcard .ft .av-ib{width:36px;height:36px}
.av-vcard .ft .sp{flex:1}
.av-use{white-space:nowrap;padding:7px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:800;background:rgba(11,143,143,.1);color:var(--teal-ink);border:1px solid rgba(11,143,143,.22);min-height:36px}
.av-use[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:transparent}
.av-sec-t{font-size:13px;font-weight:800;color:var(--ink2);margin:6px 0 8px;display:flex;align-items:center;gap:8px}
.av-sec-t small{font-weight:600;color:var(--muted);font-size:12px}
.av-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 12px;line-height:1.55}
.av-empty b{display:block;color:var(--ink2);font-size:14.5px;margin-bottom:4px}
.av-empty .av-btn{margin-top:12px}
.av-skel{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(20,40,38,.06),rgba(20,40,38,.12),rgba(20,40,38,.06));background-size:200% 100%;animation:avsk 1.2s linear infinite;margin:8px 0}
@keyframes avsk{to{background-position:-200% 0}}
.av-form{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px 16px;align-items:center;max-width:820px}
.av-form label{font-size:13px;font-weight:700;color:var(--ink2)}
.av-form .help{grid-column:2;font-size:12px;color:var(--muted);margin-top:-6px;line-height:1.45}
.av-steps{margin:0;padding-left:20px;font-size:13px;color:var(--ink2);line-height:1.7}
.av-steps code{font-size:12px;background:rgba(20,40,38,.06);padding:1px 5px;border-radius:5px}
.av-modal{position:fixed;inset:0;background:rgba(22,32,31,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1050;padding:16px}
.av-modal[hidden]{display:none}
.av-mbox{width:580px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:#fbfdfc;border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow);padding:22px 22px 18px}
.av-mbox.wide{width:680px}
.av-mhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#ec-aiv-root .av-mhead h2{font-size:18px;font-weight:800;flex:1;margin:0}
.av-mf{margin-bottom:13px}
.av-mf > label,.av-mf > .lb{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.av-mf .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.av-mf .err{font-size:12px;color:var(--bad);margin-top:5px}
.av-req{color:var(--bad)}
.av-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.av-gseg{display:flex;gap:6px}
.av-gseg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink2);min-height:40px}
.av-gseg button[aria-pressed="true"]{background:rgba(11,143,143,.1);border-color:var(--teal);color:var(--teal-ink)}
.av-gseg button[aria-pressed="true"][data-gender="Nữ"]{background:rgba(224,87,127,.1);border-color:var(--rose);color:#a82a52}
.av-file{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px;border:1px dashed rgba(11,143,143,.45);background:#fff;min-height:48px}
.av-file .fn{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-file .fn.empty{color:var(--muted)}
.av-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.45;cursor:pointer}
.av-check input{width:18px;height:18px;margin-top:1px;accent-color:var(--teal);flex-shrink:0}
.av-box{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.75);margin-bottom:13px}
.av-box > .lb{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.av-mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#fbfdfc;padding:10px 0 4px;border-top:1px solid var(--line)}
.av-plist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin:10px 0 4px}
.av-prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.av-prow.on{border-color:var(--teal);background:rgba(11,143,143,.06)}
.av-prow .nm{flex:1;min-width:0}
.av-prow .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-prow .nm small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-prow .av-ava{width:36px;height:36px;font-size:14px}
.av-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#16201f;color:#fff;padding:11px 18px;border-radius:14px;
  font-size:13.5px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.3);transition:.25s;pointer-events:none;z-index:1100;max-width:min(560px,calc(100vw - 32px))}
.av-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.av-toast.err{background:var(--bad)}
.av-more{display:flex;justify-content:center;margin-top:10px}
.av-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--ink2)}
.av-kv dt{color:var(--muted);font-weight:600}
.av-kv dd{margin:0;word-break:break-word}
@media (max-width:1100px){.av-gen{grid-template-columns:minmax(0,1fr) 290px}}
@media (max-width:900px){
  .av-gen{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "recent"}
  .av-form{grid-template-columns:minmax(0,1fr)}
  .av-form .help{grid-column:1;margin-top:-8px}
}
@media (max-width:640px){
  .av-shell{padding:10px 10px 48px}
  .av-app{padding:12px;border-radius:22px}
  .av-modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .av-editor{min-height:200px;font-size:15px}
  .av-job{flex-wrap:wrap}
  .av-job .acts{width:100%;justify-content:flex-start;padding-left:50px}
  .av-row2{grid-template-columns:minmax(0,1fr)}
  .av-vgrid{grid-template-columns:minmax(0,1fr)}
  .av-mbox{padding:18px 16px 14px;border-radius:20px}
  .av-head .av-chip{order:3;width:100%;justify-content:flex-start}
  .av-tab{flex:1 1 0;justify-content:center;padding:8px 6px;font-size:12.5px;white-space:normal;text-align:center;line-height:1.25}
  #ec-aiv-root .av-tab svg.i{display:none}
  #ec-aiv-root .av-use .lg{display:none}
}
@media (pointer:coarse){.av-btn.sm,.av-seg button,.av-use,.av-tab,.av-chip{min-height:40px} .av-ib,.av-vcard .ft .av-ib{width:40px;height:40px} }
@media (prefers-reduced-motion:reduce){ #ec-aiv-root *{animation:none !important;transition:none !important}}

<script>
(() => {
  "use strict";
  const API = "/api/method/ecentric_workspace.ai_tools.features.ai_voice.controllers.api.";
  const TABS = [
    { key: "tao", label: "Tạo giọng đọc", icon: "wand" },
    { key: "lich-su", label: "Lịch sử", icon: "clock" },

    { key: "cai-dat", label: "Cài đặt", icon: "gear", admin: true },
  ];
  const ICON = {
    wand: '<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',

    play: '<path d="M7 4.5v15l12-7.5z"/>',
    pause: '<path d="M8 4.5v15M16 4.5v15"/>',
    dl: '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',

    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
    wave: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>',
    hourglass: '<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/>',
    plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
    shield: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  };
  const QDESC = { quality_lightning: "Nháp, nghe thử", quality_fast: "Dùng hằng ngày", quality_standard: "Video, quảng cáo", quality_ultra: "Kỹ nhất, chậm nhất" };
  const POLL_ACTIVE = 4000, POLL_IDLE = 20000, DRAFT_KEY = "ec-aiv-draft";
  const S = {
    st: null, tab: "tao", machine: null, brands: null, brandsLoading: false,
    jobs: [], form: { text: "", title: "", voice: "", quality: "", speed: 1.1, language: "vi", breath: 1 },
    creating: false, hist: { scope: "mine", status: "", rows: [], more: false, loading: false, loaded: false },
    lib: { q: "", filter: "all", syncing: false }, settings: null, settingsBusy: false,
    play: { name: null, kind: null, url: null }, cache: new Map(), notified: new Set(), timer: null, lastMachine: 0,
  };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ic = (n) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || "") + "</svg>";
  const nf = (n) => Number(n || 0).toLocaleString("vi-VN");
  const say = (m) => { const s = el("av-status"); if (s) s.textContent = m; };
  const csrf = () => (window.frappe && window.frappe.csrf_token) || "";
  const isManager = () => !!(S.st && S.st.is_manager);
  const isAdmin = () => !!(S.st && S.st.is_admin);

  // ------------------------------------------------------------------ goi API ---
  function serverMsg(b) {
    try { const a = JSON.parse(b._server_messages || "[]"); if (a.length) return String(JSON.parse(a[0]).message || "").replace(/<[^>]+>/g, ""); } catch (e) { /* bo qua */ }
    return "";
  }
  function fail(msg, status) { const e = new Error(msg); e.status = status || 0; return e; }
  async function call(method, args, post) {
    const opts = { credentials: "same-origin", headers: { Accept: "application/json" } };
    let url = API + method;
    if (post) {
      opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.headers["X-Frappe-CSRF-Token"] = csrf();
      opts.body = JSON.stringify(args || {});
    } else if (args) {
      const qs = new URLSearchParams(Object.entries(args).filter(([, v]) => v !== "" && v != null)).toString();
      if (qs) url += "?" + qs;
    }
    let r;
    try { r = await fetch(url, opts); } catch (e) { throw fail("Không kết nối được tới ERP. Kiểm tra mạng rồi thử lại."); }
    const b = await r.json().catch(() => ({}));
    const env = b && b.message;
    if (r.status === 403) throw fail((env && env.message) || serverMsg(b) || "Bạn không có quyền làm việc này.", 403);
    if (!r.ok) throw fail(serverMsg(b) || (env && env.message) || ("Máy chủ trả lỗi " + r.status + "."), r.status);
    if (!env || typeof env !== "object" || env.success === false) throw fail((env && env.message) || "Không thực hiện được. Thử lại sau ít phút.");
    return env.data;
  }
  async function fetchFile(method, args) {
    let r;
    try { r = await fetch(API + method + "?" + new URLSearchParams(args), { credentials: "same-origin" }); }
    catch (e) { throw fail("Không kết nối được tới ERP."); }
    const ct = r.headers.get("Content-Type") || "";
    if (ct.indexOf("json") >= 0 || !r.ok) {
      const b = await r.json().catch(() => ({}));
      throw fail((b.message && b.message.message) || serverMsg(b) || "Không tải được file (" + r.status + ").", r.status);
    }
    const cd = r.headers.get("Content-Disposition") || "";
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
    let fname = "";
    if (m) { try { fname = decodeURIComponent(m[1]); } catch (e) { fname = m[1]; } }
    return { blob: await r.blob(), name: fname };
  }
  async function upload(file) {
    const fd = new FormData(); fd.append("file", file, file.name); fd.append("is_private", 1);
    let r;
    try { r = await fetch("/api/method/upload_file", { method: "POST", credentials: "same-origin", headers: { "X-Frappe-CSRF-Token": csrf() }, body: fd }); }
    catch (e) { throw fail("Không tải file lên được (mất mạng)."); }
    const b = await r.json().catch(() => ({}));
    if (!r.ok || !b.message || !b.message.file_url) throw fail(serverMsg(b) || "Không tải file lên được (" + r.status + ").");
    return b.message.file_url;
  }

  // ------------------------------------------------------------------ tien ich ---
  let toastT = 0;
  function toast(msg, err) {
    const t = el("av-toast"); if (!t) return;
    t.textContent = msg; t.className = "av-toast show" + (err ? " err" : "");
    clearTimeout(toastT); toastT = setTimeout(() => { t.className = "av-toast"; }, err ? 6000 : 3500);
  }
  function ago(s) {
    if (!s) return "";
    const d = new Date(String(s).replace(" ", "T"));
    if (isNaN(d)) return "";
    const sec = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (sec < 60) return "vừa xong";
    if (sec < 3600) return Math.floor(sec / 60) + " phút trước";
    if (sec < 86400) return Math.floor(sec / 3600) + " giờ trước";
    const p = (n) => String(n).padStart(2, "0");
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function dur(s) {
    s = Number(s || 0); if (!s) return "";
    const m = Math.floor(s / 60), r = Math.round(s % 60);
    return m ? m + ":" + String(r).padStart(2, "0") : r + " giây";
  }
  function pct(progress) {
    const m = /^(\d+)\s*\/\s*(\d+)$/.exec(String(progress || ""));
    if (!m || !+m[2]) return null;
    return Math.min(100, Math.round((+m[1] / +m[2]) * 100));
  }

  function syncCount() {

  async function create() {
    if (S.creating || genBlock()) return;
    S.creating = true; refreshGenButton();
    const b = document.querySelector('[data-act="create"]'); if (b) b.innerHTML = ic("hourglass") + "Đang tạo phiếu…";

      const f = S.form;
      const job = await call("create_job", { data: { text: f.text, title: f.title, voice: f.voice, quality: f.quality, speed: f.speed, language: f.language, breath: f.breath ? 1 : 0 } }, true);
      S.jobs = [job].concat(S.jobs.filter((x) => x.name !== job.name));
      S.hist.loaded = false;
      toast(S.machine && !S.machine.online ? "Đã tạo phiếu — máy đang mất kết nối, phiếu sẽ tự gửi khi máy bật lại." : "Đã tạo phiếu — máy đang đọc.");

  // ------------------------------------------------------------------ phieu ---
  function statusOf(j) {
    const p = pct(j.progress);
    switch (j.status) {
      case "pending": return { cls: "", badge: "", txt: "Đang chờ gửi sang máy", icon: "hourglass" };
      case "queued": return { cls: "run", badge: "run", txt: j.position ? "Trong hàng đợi · thứ " + j.position : "Trong hàng đợi", icon: "hourglass" };
      case "running": return { cls: "run", badge: "run", txt: "Đang đọc" + (p != null ? " · " + p + "%" : ""), icon: "wave", p };
      case "done": return j.has_audio ? { cls: "done", badge: "ok", txt: "Xong", icon: "check" } : { cls: "run", badge: "run", txt: "Đang lưu file về ERP", icon: "dl" };
      case "error": return { cls: "err", badge: "bad", txt: "Lỗi", icon: "alert" };
      case "cancelled": return { cls: "", badge: "", txt: "Đã huỷ", icon: "x" };
      default: return { cls: "", badge: "", txt: j.status || "", icon: "info" };
    }
  }
  function jobHtml(j, showOwner) {
    const s = statusOf(j), playing = S.play.kind === "job" && S.play.name === j.name;
    const meta = [esc(j.voice_label || ""), j.chars ? nf(j.chars) + " ký tự" : "", esc(qLabel(j.quality)), j.speed ? Number(j.speed).toFixed(2) + "×" : "",
      j.seconds ? "dài " + dur(j.seconds) : "", showOwner ? esc(j.owner) : "", esc(ago(j.creation))].filter(Boolean);
    const run = active(j) || (j.status === "done" && !j.has_audio);
    let bar = "";
    if (run) bar = s.p != null ? '<div class="av-bar" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + s.p + '"><span style="width:' + s.p + '%"></span></div>'
      : '<div class="av-bar indet" aria-hidden="true"><span></span></div>';
    const acts = [];
    if (j.status === "done" && j.has_audio) {
      acts.push('<button type="button" class="av-ib' + (playing ? " on" : "") + '" data-act="play" data-name="' + esc(j.name) + '" aria-label="' + (playing ? "Dừng" : "Nghe") + " " + esc(j.title) + '" title="' + (playing ? "Dừng" : "Nghe") + '">' + ic(playing ? "pause" : "play") + "</button>");
      acts.push('<button type="button" class="av-btn sm" data-act="download" data-name="' + esc(j.name) + '" aria-label="Tải MP3 ' + esc(j.title) + '">' + ic("dl") + "MP3</button>");
    }
    acts.push('<button type="button" class="av-ib" data-act="again" data-name="' + esc(j.name) + '" aria-label="Làm lại từ phiếu ' + esc(j.title) + '" title="Làm lại: nạp lại nội dung + giọng vào ô soạn">' + ic("redo") + "</button>");
    if (active(j)) acts.push('<button type="button" class="av-ib del" data-act="cancel" data-name="' + esc(j.name) + '" aria-label="Huỷ phiếu ' + esc(j.title) + '" title="Huỷ"' + (j.cancel_requested ? " disabled" : "") + ">" + ic("x") + "</button>");
    else if (j.status !== "done" || j.has_audio) acts.push('<button type="button" class="av-ib del" data-act="delete" data-name="' + esc(j.name) + '" aria-label="Xoá phiếu ' + esc(j.title) + '" title="Xoá phiếu">' + ic("trash") + "</button>");
    const player = playing ? '<div class="av-player" id="av-player"><input type="range" id="av-seek" min="0" max="1000" value="0" aria-label="Tua"><span class="tm" id="av-tm">0:00</span></div>' : "";
    return '<article class="av-job' + (playing ? " playing" : "") + '" data-job="' + esc(j.name) + '"><span class="st ' + s.cls + '" aria-hidden="true">' + ic(s.icon) + "</span>" +
      '<div class="bd"><div class="t"><b title="' + esc(j.title) + '">' + esc(j.title || "(không tiêu đề)") + '</b><span class="av-badge ' + s.badge + '">' + esc(j.cancel_requested && active(j) ? "Đang huỷ…" : s.txt) + "</span></div>" +
      '<div class="meta">' + meta.map((m) => "<span>" + m + "</span>").join("") + "</div>" +
      (j.status === "error" && j.error ? '<div class="er" title="' + esc(j.error) + '">' + esc(j.error) + "</div>" : "") + bar + player + "</div>" +
      '<div class="acts">' + acts.join("") + "</div></article>";
  }
  function upsertJob(j) {
    if (!j || !j.name) return;
    const old = S.jobs.find((x) => x.name === j.name);
    const prev = old ? old.status + "|" + !!old.has_audio : "";
    if (old) Object.assign(old, j); else if (j.owner === (S.st && S.st.user)) S.jobs.unshift(j);
    const h = S.hist.rows.find((x) => x.name === j.name); if (h) Object.assign(h, j);
    if (j.status === "done" && j.has_audio && prev && prev !== "done|true" && !S.notified.has(j.name)) { S.notified.add(j.name); toast("Xong: " + (j.title || "phiếu giọng đọc") + " — bấm ▶ để nghe."); }
    if (j.status === "error" && prev && prev.indexOf("error") !== 0 && !S.notified.has(j.name + ":e")) { S.notified.add(j.name + ":e"); toast("Lỗi: " + (j.title || "") + " — " + (j.error || ""), true); }
  }
  function repaintJobs() {
    // Ve lai rieng danh sach phieu - khong dung toi o soan thao (giu con tro / dang go).
    if (S.tab === "tao") {
      const r = el("av-recent");
      if (r) r.innerHTML = S.jobs.length ? S.jobs.slice(0, 6).map((j) => jobHtml(j, false)).join("") : '<div class="av-empty"><b>Chưa có phiếu nào</b></div>';
      refreshGenButton();
    } else if (S.tab === "lich-su") {

  async function refreshJobs() {
    try {
      const d = await call("list_jobs", { scope: "mine", limit: 20 });
      const sig = (j) => [j.status, !!j.has_audio, j.progress || "", j.position || 0, j.cancel_requested || 0, j.error || ""].join("|");
      const before = new Map(S.jobs.map((j) => [j.name, sig(j)]));
      (d.jobs || []).forEach((j) => {
        const old = S.jobs.find((x) => x.name === j.name);
        if (old && old.status !== "done" && j.status === "done" && j.has_audio && !S.notified.has(j.name)) { S.notified.add(j.name); toast("Xong: " + (j.title || "phiếu giọng đọc") + " — bấm ▶ để nghe."); }
        else if (old && old.status === "done" && !old.has_audio && j.has_audio && !S.notified.has(j.name)) { S.notified.add(j.name); toast("Xong: " + (j.title || "phiếu giọng đọc") + " — bấm ▶ để nghe."); }
        if (old && old.status !== "error" && j.status === "error" && !S.notified.has(j.name + ":e")) { S.notified.add(j.name + ":e"); toast("Lỗi: " + (j.title || "") + " — " + (j.error || ""), true); }
      });
      S.jobs = d.jobs || [];
      S.jobs.forEach((j) => { const h = S.hist.rows.find((x) => x.name === j.name); if (h) Object.assign(h, j); });
      // Chi ve lai khi co gi doi (QC 15/11: ve lai moi 4 giay lam giat thanh tua cua phieu dang nghe).
      const changed = S.jobs.length !== before.size || S.jobs.some((j) => before.get(j.name) !== sig(j));
      if (changed) repaintJobs();
    } catch (e) {
      if (e.status === 403) { S.stopped = true; clearTimeout(S.timer); deny(e); }   // het phien dang nhap / mat quyen

  const audio = new Audio();

  function stopAudio() {
    audio.pause(); S.play = { name: null, kind: null, url: null };
  }
  async function blobUrl(kind, name) {
    const key = kind + ":" + name;
    if (S.cache.has(key)) return S.cache.get(key);
    const f = kind === "job" ? await fetchFile("download_audio", { name }) : await fetchFile("voice_sample", { name });
    const url = URL.createObjectURL(f.blob);
    S.cache.set(key, url);
    if (S.cache.size > 12) { const k = S.cache.keys().next().value; URL.revokeObjectURL(S.cache.get(k)); S.cache.delete(k); }
    return url;
  }
  async function togglePlay(kind, name, btn) {
    if (S.play.kind === kind && S.play.name === name) { stopAudio(); afterPlayChange(); return; }
    stopAudio();
    if (btn) { btn.disabled = true; btn.innerHTML = ic("hourglass") + (btn.classList.contains("av-ib") ? "" : "Đang tải…"); }
    try {
      const url = await blobUrl(kind, name);
      audio.src = url; S.play = { name, kind, url };
      await audio.play();
    } catch (e) {
      S.play = { name: null, kind: null, url: null };
      toast(e.name === "NotAllowedError" ? "Trình duyệt chặn tự phát — bấm lại nút nghe." : (e.message || "Không phát được file."), true);
    }
    afterPlayChange();
  }
  function afterPlayChange() {
    if (S.tab === "giong") { const v = el("av-view"); if (v) v.innerHTML = libHtml(); }
    else {
      repaintJobs();

        const on = S.play.kind === "sample" && S.play.name === b.dataset.name;
        b.disabled = false; b.innerHTML = ic(on ? "pause" : "play") + "Nghe giọng mẫu";
      });

    if (el("av-modal") && !el("av-modal").hidden && S.modalKind === "picker") paintPicker();
    bindPlayer();

  function bindPlayer() {
    const seek = el("av-seek"), tm = el("av-tm");
    if (!seek || !tm) return;
    seek.oninput = () => { if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration; };
    tick();
  }
  function tick() {
    const seek = el("av-seek"), tm = el("av-tm");
    if (!seek || !tm) return;
    const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    if (audio.duration && isFinite(audio.duration)) { seek.value = Math.round((audio.currentTime / audio.duration) * 1000); tm.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration); }
  }
  audio.addEventListener("timeupdate", tick);
  audio.addEventListener("ended", () => { stopAudio(); afterPlayChange(); });
  audio.addEventListener("error", () => { if (S.play.name) { toast("File âm thanh hỏng hoặc trình duyệt không phát được.", true); stopAudio(); afterPlayChange(); } });
  async function download(name, btn) {

      setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  function vfErr(msg) { const e = el("vf-err"); if (e) { e.textContent = msg; e.hidden = !msg; if (msg && e.scrollIntoView) e.scrollIntoView({ block: "nearest" }); } }
  function pickFile(target) {
    const inp = el("av-picker");
    inp.value = "";
    inp.accept = target === "sample" ? S.st.limits.voice_exts.join(",") + ",audio/*" : "image/*,.pdf";
    inp.onchange = async () => {
      const file = inp.files && inp.files[0]; if (!file) return;
      const lim = S.st.limits, ext = "." + String(file.name.split(".").pop() || "").toLowerCase();
      if (target === "sample" && lim.voice_exts.indexOf(ext) < 0) { vfErr("File giọng mẫu chỉ nhận " + lim.voice_exts.join(" / ") + "."); return; }
      if (file.size > (target === "sample" ? lim.max_voice_mb : 10) * 1024 * 1024) { vfErr("File quá lớn (tối đa " + (target === "sample" ? lim.max_voice_mb : 10) + " MB)."); return; }
      const nameEl = el(target === "sample" ? "vf-file-n" : "vf-cfile-n");
      vfErr(""); if (nameEl) { nameEl.textContent = "Đang tải lên " + file.name + "…"; nameEl.classList.remove("empty"); }
      try {
        const url = await upload(file);
        if (target === "sample") { VF.sample = url; VF.sampleName = file.name; } else { VF.consentFile = url; VF.consentChanged = true; }
        if (nameEl) nameEl.textContent = file.name + " · " + (file.size / 1048576).toFixed(1) + " MB";
      } catch (e) { if (nameEl) { nameEl.textContent = "Chưa chọn file"; nameEl.classList.add("empty"); } vfErr(e.message); }
    };
    inp.click();
  }
  async function saveVoice(btn) {
    const add = !VF.name, val = (id) => { const x = el(id); return x ? x.value.trim() : ""; };
    const data = { voice_name: val("vf-name"), gender: VF.gender, description: val("vf-desc"), brand: val("vf-brand"), owner_user: val("vf-owner"),
      restricted: el("vf-restricted") && el("vf-restricted").checked ? 1 : 0 };
    if (!data.voice_name) { vfErr("Thiếu tên giọng."); el("vf-name").focus(); return; }
    const box = el("vf-consent");
    const consentOpen = add || (box && !box.hidden);
    if (consentOpen) {
      const by = val("vf-cby"), date = val("vf-cdate"), okc = el("vf-cok") && el("vf-cok").checked;
      const touched = by || date || okc || VF.consentChanged || val("vf-cnote");
      if (add || touched) {
        if (!by || !date) { vfErr("Bằng chứng đồng ý: cần tên người cho giọng và ngày đồng ý."); return; }
        if (!okc) { vfErr("Tick ô xác nhận người cho giọng đã đồng ý."); return; }
        Object.assign(data, { consent_by: by, consent_date: date, consent_note: val("vf-cnote"), consent_confirmed: 1, consent_file: VF.consentFile || "" });
      }
    }
    if (add && !VF.sample) { vfErr("Chưa chọn file giọng mẫu (hoặc file còn đang tải lên)."); return; }
    const sw = el("vf-status"); if (sw) data.status = sw.getAttribute("aria-checked") === "true" ? "active" : "disabled";
    btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = ic("hourglass") + "Đang lưu…";
    try {
      let p;
      if (add) { data.sample_url = VF.sample; p = await call("add_voice", { data }, true); }
      else p = await call("update_voice", { name: VF.name, data }, true);
      const list = S.st.voices || [];
      const i = list.findIndex((x) => x.name === p.name);
      if (i >= 0) list[i] = p; else list.unshift(p);
      closeModal(); paint();
      toast(add ? "Đã gửi file mẫu sang máy — tạo giọng mất vài phút, xong sẽ hiện \"Ngừng dùng\"/\"Đang dùng\"." : "Đã lưu giọng.");
      if (add) schedule(true);
    } catch (e) { btn.disabled = false; btn.innerHTML = label; vfErr(e.message); }
  }

  async function loadSettings() {

  async function saveSettings() {
    const val = (id) => (el(id) ? el(id).value.trim() : "");
    const data = { base_url: val("st-url"), default_quality: val("st-q"), default_speed: val("st-speed"), timeout: val("st-timeout"), callback_base_url: val("st-cb") };
    if (!/^https?:\/\//i.test(data.base_url)) { toast("Địa chỉ phải bắt đầu bằng https://", true); el("st-url").focus(); return; }
    const tok = val("st-token"); if (tok) data.token = tok;
    S.settingsBusy = true; paint();
    try {
      S.settings = await call("save_settings", { data }, true);
      S.st.configured = !!(S.settings.token_set && S.settings.base_url);
      toast("Đã lưu cài đặt."); S.settingsBusy = false; paint(); checkMachine(true);
    } catch (e) { S.settingsBusy = false; paint(); toast(e.message, true); }
  }
  async function testConn() {
    S.settingsBusy = true; paint();

      const r = await call("test_connection", {}, true);
      toast(r.message, !r.ok);
      S.settings = await call("get_settings");
    } catch (e) { toast(e.message, true); }
    S.settingsBusy = false; paint(); checkMachine(true);
  }

  // ------------------------------------------------------------------ nap du lieu ---
  async function checkMachine(fresh) {
    if (!S.st || !S.st.configured) { S.machine = null; paintMachine(); paintBanner(); return; }
    if (fresh && Date.now() - S.lastMachine < 5000) return;
    S.lastMachine = Date.now();
    const c = el("av-machine"); if (c) c.classList.add("busy");
    try { S.machine = await call("machine_status", fresh ? { fresh: 1 } : null); }
    catch (e) { S.machine = { online: false, message: e.message }; }
    paintMachine(); paintBanner();
    if (S.tab === "tao") refreshGenButton();
  }
  async function reloadState() {
    try {
      const st = await call("get_state");
      S.st = st;
      if (S.tab === "giong") { const v = el("av-view"); if (v && !(document.activeElement && document.activeElement.id === "av-lib-q")) v.innerHTML = libHtml(); }
      else if (S.tab === "tao") { const vs = document.querySelector(".av-vsel"); if (vs && !voiceInfo(S.form.voice)) paint(); }
    } catch (e) { /* lan sau */ }
  }
  function deny(e) {
    const v = el("av-view"); v.setAttribute("aria-busy", "false");
    const guest = window.frappe && window.frappe.session && window.frappe.session.user === "Guest";
    v.innerHTML = '<section class="av-card"><div class="av-empty" role="alert"><b>' + (e.status === 403 ? (guest ? "Cần đăng nhập" : "Bạn chưa có quyền dùng Giọng đọc AI") : "Không tải được trang") + "</b>" +
      esc(e.status === 403 && !guest ? "Nhờ quản lý bật quyền Giọng đọc AI cho tài khoản của bạn (quản trị: gán role EC AI Voice User)." : e.message) +
      "<br>" + (guest ? '<a class="av-btn pri" href="/login?redirect-to=/ai-voice">Đăng nhập</a>' : e.status === 403 ? "" : '<button type="button" class="av-btn" data-act="retry-boot">Thử lại</button>') + "</div></section>";
    el("av-tabs").innerHTML = ""; el("av-machine").hidden = e.status === 403;
  }
  async function boot() {
    try { S.st = await call("get_state"); }
    catch (e) { deny(e); return; }
    S.jobs = S.st.jobs || [];
    const d = restore(DRAFT_KEY) || {};
    const f = S.form;
    f.quality = S.st.defaults.quality; f.speed = S.st.defaults.speed; f.language = S.st.defaults.language;
    if (typeof d.text === "string") f.text = d.text.slice(0, S.st.limits.max_chars * 2);
    if (typeof d.title === "string") f.title = d.title.slice(0, 140);
    if (d.quality && S.st.qualities.some((q) => q.value === d.quality)) f.quality = d.quality;
    if (d.speed && +d.speed >= S.st.limits.speed_min && +d.speed <= S.st.limits.speed_max) f.speed = +d.speed;
    if (d.language && S.st.languages.some((l) => l.value === d.language)) f.language = d.language;
    if (d.breath === 0 || d.breath === 1) f.breath = d.breath;
    if (d.voice && (String(d.voice).indexOf("brand:") === 0 || voiceInfo(d.voice))) f.voice = d.voice;
    if (!f.voice && usableVoices().length === 1) f.voice = "profile:" + usableVoices()[0].name;
    el("av-machine").hidden = false;
    go((location.hash || "").replace(/^#\/?/, "") || "tao", false);
    checkMachine(false); schedule(false);
    try {
      if (window.frappe && window.frappe.realtime && typeof window.frappe.realtime.on === "function") {
        window.frappe.realtime.on("ai_voice_job", (j) => { upsertJob(j); repaintJobs(); schedule(false); });
      }
    } catch (e) { /* khong co socket - van con poll */ }
  }

  // ------------------------------------------------------------------ su kien ---
  const root = el("ec-aiv-root");
  root.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab],[data-act],[data-close],[data-hstatus],[data-hscope],[data-lfilter],[data-q],[data-gender]");
    if (!t || t.disabled) return;
    if (t.dataset.close) { closeModal(); return; }
    if (t.dataset.tab) { go(t.dataset.tab); return; }
    if (t.dataset.q) { S.form.quality = t.dataset.q; saveDraft(); document.querySelectorAll(".av-mode").forEach((m) => { m.setAttribute("aria-checked", m.dataset.q === S.form.quality); m.tabIndex = m.dataset.q === S.form.quality ? 0 : -1; }); const tg = document.querySelector("#av-h-q .tag"); if (tg) tg.textContent = qLabel(S.form.quality); return; }
    if (t.dataset.gender) { VF.gender = t.dataset.gender; t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === t)); return; }
    if (t.dataset.hstatus != null) { S.hist.status = t.dataset.hstatus; paint(); loadHist(false); return; }
    if (t.dataset.hscope) { S.hist.scope = t.dataset.hscope; paint(); loadHist(false); return; }
    if (t.dataset.lfilter) { S.lib.filter = t.dataset.lfilter; el("av-view").innerHTML = libHtml(); return; }
    const a = t.dataset.act, n = t.dataset.name;
    switch (a) {
      case "create": create(); break;
      case "clear": S.form.text = ""; S.form.title = ""; saveDraft(); paint(); { const x = el("av-text"); if (x) x.focus(); } break;
      case "breath": S.form.breath = S.form.breath ? 0 : 1; t.setAttribute("aria-checked", S.form.breath ? "true" : "false"); saveDraft(); break;
      case "vf-status": t.setAttribute("aria-checked", t.getAttribute("aria-checked") === "true" ? "false" : "true"); break;
      case "pick-voice": openPicker(); break;
      case "pick": case "use-voice": useVoice(t.dataset.key); break;
      case "sample": togglePlay("sample", n, t); break;
      case "play": togglePlay("job", n, t); break;
      case "download": download(n, t); break;
      case "again": again(n); break;
      case "cancel": t.disabled = true; cancelJob(n); break;
      case "delete": confirmDelete(n); break;
      case "do-delete": deleteJob(n, t); break;
      case "hist-more": loadHist(true); break;
      case "hist-reload": loadHist(false); break;
      case "sync-voices": syncVoices(t); break;
      case "add-voice": openAddVoice(); break;
      case "edit-voice": openEditVoice(n); break;
      case "edit-consent": { const b = el("vf-consent"); if (b) { b.hidden = false; t.parentElement.hidden = true; const x = el("vf-cby"); if (x) x.focus(); } } break;
      case "pick-file": pickFile(t.dataset.target); break;
      case "save-voice": saveVoice(t); break;
      case "remove-voice": confirmRemove(n); break;
      case "do-remove": removeVoice(n, t); break;
      case "retry-voice": retryVoice(n, t); break;
      case "reload-brands": S.brands = null; loadBrands(); { const v = el("av-view"); if (v && S.tab === "giong") v.innerHTML = libHtml(); } break;
      case "test-conn": testConn(); break;
      case "retry-boot": boot(); break;
      default: break;
    }
  });
  root.addEventListener("submit", (e) => { if (e.target.id === "av-set") { e.preventDefault(); saveSettings(); } });
  root.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "av-text") { S.form.text = t.value; syncCount(); refreshGenButton(); saveDraft(); }
    else if (t.id === "av-title-in") { S.form.title = t.value; saveDraft(); refreshGenButton(); }
    else if (t.id === "av-speed") { S.form.speed = +t.value; const v = el("av-speed-v"); if (v) v.textContent = Number(t.value).toFixed(2) + "×"; saveDraft(); }
    else if (t.id === "av-lib-q") { S.lib.q = t.value; const pos = t.selectionStart; el("av-view").innerHTML = libHtml(); const n = el("av-lib-q"); n.focus(); n.setSelectionRange(pos, pos); }
    else if (t.id === "av-pick-q") { pickQ = t.value; paintPicker(); }
  });
  root.addEventListener("change", (e) => { if (e.target.id === "av-lang") { S.form.language = e.target.value; saveDraft(); } });
  el("av-modal").addEventListener("click", (e) => { if (e.target === el("av-modal")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    const open = !el("av-modal").hidden;
    if (open && e.key === "Escape") { e.preventDefault(); closeModal(); return; }
    if (open && e.key === "Tab") { trapTab(e); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && document.activeElement && document.activeElement.id === "av-text") { e.preventDefault(); create(); return; }
    const mode = e.target.closest && e.target.closest(".av-mode");
    if (mode && ["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].indexOf(e.key) >= 0) {
      const ms = [...document.querySelectorAll(".av-mode")], k = ms.indexOf(mode);
      const nx = ms[(k + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : ms.length - 1)) % ms.length];
      e.preventDefault(); nx.click(); nx.focus(); return;
    }
    const tab = e.target.closest && e.target.closest('[role="tab"]');
    if (tab && ["ArrowRight", "ArrowLeft", "Home", "End"].indexOf(e.key) >= 0) {
      const all = [...document.querySelectorAll('#av-tabs [role="tab"]')], i = all.indexOf(tab);
      const nx = e.key === "Home" ? all[0] : e.key === "End" ? all[all.length - 1] : all[(i + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
      e.preventDefault(); go(nx.dataset.tab); const f = el("av-tab-" + nx.dataset.tab); if (f) f.focus();
    }
  });
  el("av-machine").addEventListener("click", () => checkMachine(true));
  window.addEventListener("hashchange", () => { const h = (location.hash || "").replace(/^#\/?/, ""); if (S.st && h && h !== S.tab) go(h, false); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.st && !S.stopped) { refreshJobs(); schedule(false); } });

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
