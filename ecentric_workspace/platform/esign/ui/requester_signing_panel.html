<!-- Copyright (c) 2026, eCentric and contributors
     Requester pre-approval signing entry point (Prepare Signing Package / Set Placement /
     Lock Signing Package). Visibility + status are decided by the governed backend readiness
     (requester_signing_readiness), which returns bare-boolean checks; the browser never
     computes authorization. Visibility depends ONLY on the requester + requester stage +
     policy - NEVER on overall `ready`, gates, package or placement state, so a requester who
     still has to prepare/place/lock always sees the panel. The local package/placement/lock
     actions work while Document Creation / Signing gates are OFF and make NO SCTS call / NO
     DSR. Only the actual requester sees the actions - never another user, Administrator or
     System Manager (unless they are the requester), never completed/cancelled requests,
     never approval-level stages. Closed provider gates are shown as information only and do
     NOT hide the local actions. -->
<div id="ec-req-sign" class="ec-req-sign" style="display:none;margin:8px 0">
  <style>
    .ec-req-sign{border:1px solid #d9dee3;border-radius:8px;padding:12px;font-size:13px;background:#f6f8fa}
    .ec-req-sign h4{margin:0 0 6px}
    .ec-req-sign .ec-pill{padding:1px 8px;border-radius:10px;background:#eaeef2;font-size:11px}
    .ec-req-sign .ec-msg{margin:6px 0;color:#57606a}
    .ec-req-sign .ec-warn{color:#9a6700;background:#fff8c5;padding:6px 8px;border-radius:6px}
    .ec-req-sign .ec-info{color:#0550ae;background:#ddf4ff;padding:6px 8px;border-radius:6px;margin:6px 0}
    .ec-req-sign .ec-sub{margin-left:6px}
  </style>
  <h4>Ký của người đề nghị <span id="ecReqStatus" class="ec-pill">-</span></h4>
  <div id="ecReqMsg" class="ec-msg"></div>
  <div id="ecReqGate" class="ec-info" style="display:none"></div>
  <!-- Chuan bi goi / Khoa goi / Trinh ky da duoc gop vao "Gui yeu cau" (28/08). Giu lai phan
       tu de cac lenh gan su kien ben duoi khong nem loi, nhung khong bao gio hien nua. -->
  <button id="ecReqPrepare" class="btn btn-sm btn-primary" style="display:none">Chuẩn bị gói ký</button>
  <button id="ecReqLock" class="btn btn-sm ec-sub" style="display:none">Khoá gói ký</button>
  <button id="ecReqFix" class="btn btn-sm ec-sub" style="display:none">Khôi phục gói</button>
  <!-- "Trình ký" GOI requester_submit_and_sign. Endpoint nay da co va chay duoc tu 23/08,
       nhung khong mot man hinh nao goi no: ca hai lan chay thu (27 va 28/08) deu phai goi
       API bang tay. Chuan bi va khoa gia xong ma khong gui di duoc thi luong dung tai day. -->
  <button id="ecReqSign" class="btn btn-sm btn-primary ec-sub" style="display:none">Trình ký</button>
  <!-- KET NOI TAI KHOAN KY SO (04/09). eContract giao buoc Trinh ky cho tai khoan TAO chung
       tu; ERP phai tao bang token cua chinh nguoi de nghi. Nguoi dung nhap mat khau SCTS MOT
       LAN, ERP giu token (1 nam), khong luu mat khau. Khoi nay chi hien cho nguoi de nghi
       khi backend bao scts_link_required && !scts_linked. -->
  <div id="ecReqLink" class="ec-link" style="display:none">
    <style>
      .ec-req-sign .ec-link{margin-top:8px;padding:10px;border:1px solid #f0c36d;border-radius:6px;background:#fff8e6}
      .ec-req-sign .ec-link-title{font-weight:600;margin-bottom:4px}
      .ec-req-sign .ec-link-help{color:#57606a;margin-bottom:8px}
      .ec-req-sign .ec-link-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
      .ec-req-sign .ec-link-row label{margin:0;font-weight:500}
      .ec-req-sign .ec-link-row input{flex:1 1 180px;min-width:0;padding:5px 8px;border:1px solid #d0d7de;border-radius:6px}
      .ec-req-sign .ec-link-err{color:#a40e26;background:#ffebe9;padding:6px 8px;border-radius:6px;margin-top:6px}
      .ec-req-sign .ec-link-ok{color:#1a7f37;margin-top:6px}
    </style>
    <div class="ec-link-title">Kết nối tài khoản ký số SCTS</div>
    <div class="ec-link-help">Để chữ ký người đề nghị là của chính bạn, ERP cần tạo chứng từ
      bằng tài khoản SCTS của bạn. Nhập mật khẩu SCTS <b>một lần</b>; ERP chỉ giữ mã kết nối
      (1 năm), <b>không lưu mật khẩu</b>.</div>
    <form id="ecReqLinkForm" class="ec-link-row" autocomplete="off">
      <label for="ecReqLinkUser">Tài khoản</label>
      <input id="ecReqLinkUser" type="text" autocomplete="username" placeholder="email SCTS (mặc định = email ERP)">
      <label for="ecReqLinkPass">Mật khẩu SCTS</label>
      <input id="ecReqLinkPass" type="password" autocomplete="current-password" required>
      <button id="ecReqLinkBtn" type="submit" class="btn btn-sm btn-primary">Kết nối</button>
    </form>
    <div id="ecReqLinkErr" class="ec-link-err" style="display:none"></div>
  </div>
  <div id="ecReqLinked" class="ec-link-ok" style="display:none"></div>
</div>
<script id="ec-req-sign-script">
(function () {
  "use strict";
  var root = document.getElementById("ec-req-sign");
  if (!root) return;
  // frappe.call may not be installed yet on a Website route even though window.frappe
  // exists; every call site below is guarded by this and uses window.frappe.call.
  function callReady() {
    return !!(window.frappe && typeof window.frappe.call === "function");
  }
  var elStatus = document.getElementById("ecReqStatus");
  var elMsg = document.getElementById("ecReqMsg");
  var elGate = document.getElementById("ecReqGate");
  var btnPrep = document.getElementById("ecReqPrepare");
  var btnLock = document.getElementById("ecReqLock");
  var btnFix = document.getElementById("ecReqFix");
  var btnSign = document.getElementById("ecReqSign");
  var elLink = document.getElementById("ecReqLink");
  var elLinked = document.getElementById("ecReqLinked");
  var elLinkErr = document.getElementById("ecReqLinkErr");
  var frmLink = document.getElementById("ecReqLinkForm");
  var inLinkUser = document.getElementById("ecReqLinkUser");
  var inLinkPass = document.getElementById("ecReqLinkPass");
  var btnLink = document.getElementById("ecReqLinkBtn");

  // Khoi ket noi tai khoan SCTS: hien khi backend noi can ket noi ma chua ket noi. Trang
  // thai la cua backend (readiness); trinh duyet khong tu suy ra. Da ket noi thi chi bao
  // con bao nhieu ngay.
  function renderLink(c) {
    if (!elLink) return;
    var need = b(c, "scts_link_required");
    var linked = b(c, "scts_linked");
    var days = (c && typeof c.scts_link_days_left === "number") ? c.scts_link_days_left : null;
    elLink.style.display = (need && !linked) ? "block" : "none";
    if (need && linked) {
      elLinked.textContent = "Đã kết nối tài khoản ký số SCTS"
        + (days !== null ? " (còn " + days + " ngày)" : "") + ".";
      elLinked.style.display = "block";
    } else {
      elLinked.style.display = "none";
    }
  }
  function linkErr(t) {
    if (!elLinkErr) return;
    elLinkErr.textContent = t || "";
    elLinkErr.style.display = t ? "block" : "none";
  }
  // TEMP-WORKAROUND (2026-09-04, chua co helper dung chung): rut cau frappe.throw ra khoi
  // xhr de nguoi dung doc duoc "Dang nhap SCTS khong thanh cong" thay vi cau chung chung.
  // Cung mot doan nay dang chep o 8 form khac (extractServerMsg) - gom lai la viec rieng.
  function serverMsg(e) {
    try {
      if (e && e.message && typeof e.message === "string") return e.message;
      var raw = e && e.responseJSON && e.responseJSON._server_messages;
      if (!raw) return "";
      var arr = JSON.parse(raw);
      var first = arr.length ? JSON.parse(arr[0]) : null;
      return (first && first.message) ? String(first.message).replace(/<[^>]+>/g, "") : "";
    } catch (x) { return ""; }
  }

  // Cho nha cung cap xac nhan. Bam "Trinh ky" xong thi khong co gi thay doi trong 3-4 phut:
  // SCTS xu ly bat dong bo. Man hinh khong noi gi thi khong phan biet duoc voi mot nut khong
  // an - Hoan bao 28/08, dung hien tuong da sua cho nut "Duyet & Ky" hom truoc ma quen lam
  // cho duong nay.
  var WAIT = { timer: null, until: 0 };
  function stopWait() { if (WAIT.timer) { clearInterval(WAIT.timer); WAIT.timer = null; } WAIT.until = 0; }
  function startWait() {
    stopWait();
    WAIT.until = Date.now() + 6 * 60 * 1000;          // co diem dung, khong quay mai
    WAIT.timer = setInterval(function () {
      if (Date.now() > WAIT.until) { stopWait(); refresh(); return; }
      if (!document.getElementById("ec-req-sign")) { stopWait(); return; }
      refresh();
    }, 10000);
  }
  function relocate() {
    // mount the panel INSIDE the Payment Request content column (never body/grid-root
    // level, which overlaps the left navigation).
    var host = document.querySelector("#ec-payr-root .content");
    if (host && root.parentNode !== host) host.appendChild(root);
  }

  // Resolve the Payment Request name using the governed URL convention (?id=), with
  // backward-compatible fallbacks (?name, ?payment_request_name) and any existing page
  // state/config. Never inferred from arbitrary DOM text; must be a non-empty string.
  function pr() {
    var q = null;
    try { q = new URLSearchParams(location.search); } catch (e) { q = null; }
    var id = q && (q.get("id") || q.get("name") || q.get("payment_request_name"));
    if (!id) {
      id = window.EC_PPH_PR
        || (window.PaymentRequest && window.PaymentRequest.state && window.PaymentRequest.state.id);
    }
    id = (id == null ? "" : ("" + id)).trim();
    return id || null;
  }
  // readiness returns bare booleans (checks[k] === true/false), NOT {ok:true} objects.
  function b(c, k) { return !!(c && c[k]); }
  function msg(t, warn) {
    elMsg.innerHTML = t
      ? (warn ? '<div class="ec-warn">' : "<span>") + frappe.utils.escape_html(t)
        + (warn ? "</div>" : "</span>")
      : "";
  }

  function refresh() {
    if (!callReady()) return;
    var name = pr();
    if (!name) {
      // No Payment Request identifier in the URL/state: keep the panel hidden, never throw.
      if (frappe.boot && frappe.boot.developer_mode && window.console) {
        console.debug("[ec-req-sign] no Payment Request id in URL/state; panel stays hidden");
      }
      return;
    }
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.requester_signing_readiness",
      args: { payment_request_name: name } })
      .then(function (r) {
        var m = r.message || {}, c = m.checks || {};
        // VISIBILITY (governed): requester + requester stage + policy ONLY. Never coupled to
        // ready / gates_enabled / package / placement state.
        // Van hien khi DANG CHO nha cung cap xac nhan. Ban truoc chi nhan trang thai
        // Pending/Failed/Reconciliation Required, nen ngay sau khi bam "Trinh ky" (-> Processing)
        // panel TU AN, mang theo ca nhan "dang cho" - dung luc nguoi dung can nhin nhat.
        var processing = b(c, "requester_signature_processing");
        var visible = b(c, "is_requester") && b(c, "requester_signature_required")
          && (b(c, "pending_requester_signature") || processing);
        // Pre-submission: tell the OWNER, clearly, that signing applies once submitted -
        // instead of showing nothing (fresh-request UX). No leak of any other request's state.
        var preSubmit = b(c, "not_submitted") && b(c, "is_owner")
          && b(c, "requester_signature_required");
        if (!visible && preSubmit) {
          relocate(); root.style.display = "block";
          elStatus.textContent = "Chưa gửi duyệt";
          btnPrep.style.display = "none"; btnLock.style.display = "none";
          btnFix.style.display = "none"; elGate.style.display = "none";
          msg("Yêu cầu chưa gửi duyệt. Sau khi gửi, bạn sẽ chuẩn bị và ký gói tài liệu tại đây.");
          renderLink(c);         // ket noi duoc NGAY tu truoc khi gui, khoi bi chan quay lai
          return;
        }
        if (!visible) { stopWait(); }
        root.style.display = visible ? "block" : "none";
        if (!visible) return;
        relocate();

        if (processing) {
          elStatus.textContent = "Đang chờ nhà cung cấp xác nhận…";
          btnPrep.style.display = "none"; btnLock.style.display = "none";
          btnFix.style.display = "none"; btnSign.style.display = "none";
          elGate.style.display = "none";
          msg("Đã gửi chữ ký của bạn tới nhà cung cấp. Việc này thường mất 1–3 phút. "
              + "Màn hình tự cập nhật, không cần tải lại trang.");
          startWait();
          return;
        }
        stopWait();

        var invalid = b(c, "package_invalid");
        var locked = b(c, "package_locked");
        var readyToLock = b(c, "placements_ready");
        var present = b(c, "package_present");

        // status + primary action per local package state (gate-independent).
        // Tu 28/08 "Gui yeu cau" lam luon chuan bi + khoa goi + ky. Nhung nut nay khong con
        // la viec cua nguoi dung: chung la trang thai noi bo cua may. Panel gio chi BAO
        // TRANG THAI. Ngoai le duy nhat la "Khoi phuc goi" - loi that su can nguoi can thiep.
        var status, prepText, prepShow = false, lockShow = false, fixShow = false, signShow = false;
        if (invalid) {
          status = "Gói lỗi (0 vị trí ký)"; fixShow = true;
        } else if (locked) {
          status = "Gói đã khoá";
        } else if (readyToLock) {
          status = "Sẵn sàng ký";
        } else if (present) {
          status = "Thiếu vị trí ký";
        } else {
          status = "Chưa chuẩn bị gói";
        }
        elStatus.textContent = status;
        if (prepText) btnPrep.textContent = prepText;
        btnPrep.style.display = prepShow ? "inline-block" : "none";
        btnLock.style.display = lockShow ? "inline-block" : "none";
        btnFix.style.display = fixShow ? "inline-block" : "none";
        btnSign.style.display = signShow ? "inline-block" : "none";

        // Closed provider gates: INFORMATION ONLY - must not hide the local actions above.
        if (!b(c, "gates_enabled")) {
          elGate.textContent = "Cổng ký số đang tắt. Bạn vẫn chuẩn bị, đặt vị trí và khoá "
            + "gói ký cục bộ; quản trị sẽ bật cổng để gửi ký thật.";
          elGate.style.display = "block";
        } else {
          elGate.style.display = "none";
        }

        if (invalid) {
          msg("Gói ký đang lỗi (đã khoá nhưng chưa có vị trí ký). Nhấn 'Khôi phục gói' để tạo "
            + "lại gói mới rồi đặt vị trí ký.", true);
        } else if (locked) {
          msg("Đã khoá gói ký và gửi chữ ký của bạn tới nhà cung cấp.");
        } else if (!b(c, "verified_mapping")) {
          msg("Người đề nghị chưa có ánh xạ chữ ký đã xác minh.", true);
        } else if (b(c, "scts_link_required") && !b(c, "scts_linked")) {
          msg("Cần kết nối tài khoản ký số SCTS của bạn trước khi gửi.", true);
        } else {
          msg("");
        }
        renderLink(c);
      })
      .catch(function (e) {
        // refresh khong catch tung lam panel dung im khi endpoint hong - ke ca luc dang
        // poll cho SCTS xac nhan, tuc nguoi dung tuong van "dang cho" trong khi thuc ra
        // he thong da ngung hoi tu lau (BOT 3, 31/08).
        if (elMsg) { msg("Không tải được trạng thái ký của bạn"
          + ((e && e.message) ? " — " + e.message : "") + ". Tải lại trang; còn lỗi thì báo kỹ thuật."); }
        if (window.console) console.error("[ec-req-sign] readiness failed", e);
      });
  }

  // Bind click handlers EXACTLY ONCE. A repeated page sync / navigation re-runs this IIFE;
  // the data flag stops duplicate handlers from stacking (refresh() below stays safe to call
  // on every init).
  if (root.getAttribute("data-ec-bound") !== "1") {
    root.setAttribute("data-ec-bound", "1");
  // Prepare / Set placement: create-or-reuse the package (idempotent) and open the existing
  // placement editor by reloading with the returned config. Repeated clicks reuse the same
  // package. No SCTS call / no DSR (works with the write gates OFF).
  btnPrep.onclick = function () {
    var name = pr();
    if (!name || !callReady()) return;
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.prepare_requester_signing_package",
      type: "POST", args: { payment_request_name: name }, freeze: true,
      freeze_message: "Đang chuẩn bị gói ký…" })
      .then(function (r) {
        var out = r.message || {};
        if (out.config && (!out.config.files || !out.config.files.length)) {
          msg("Không có tệp PDF riêng tư hợp lệ trong phiếu để ký. Vui lòng đính kèm PDF.", true);
          return;
        }
        window.EC_PPH_CONFIG = out.config;
        // Open the editor IN PLACE (no page reload, which would drop the config + navigate
        // away from the editor).
        if (typeof window.ecMountPlacementEditor === "function") {
          window.ecMountPlacementEditor(out.config);
        }
        frappe.show_alert({ message: "Đã chuẩn bị gói ký. Đang mở trình đặt vị trí…",
          indicator: "green" });
        refresh();
      })
      .catch(function () { msg("Không chuẩn bị được gói ký (kiểm tra quyền / ánh xạ).", true); });
  };

  // Lock: freeze the package locally (no SCTS). Requester-only + idempotent server-side.
  btnLock.onclick = function () {
    var name = pr();
    if (!name || !callReady()) return;
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.requester_lock_signing_package",
      type: "POST", args: { payment_request_name: name }, freeze: true,
      freeze_message: "Đang khoá gói ký…" })
      .then(function () {
        frappe.show_alert({ message: "Đã khoá gói ký.", indicator: "green" });
        refresh();
      })
      .catch(function () { msg("Khoá gói ký thất bại (cần ít nhất một vị trí ký hợp lệ).", true); });
  };

  // "Trinh ky": gui chu ky cua nguoi de nghi toi nha cung cap. Endpoint tra ve "da xep hang"
  // chu khong phai "da ky" - nha cung cap xu ly bat dong bo - nen thong bao phai noi dung su
  // that, khong hua hen qua.
  btnSign.onclick = function () {
    var name = pr();
    if (!name || !callReady()) return;
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.requester_submit_and_sign",
      type: "POST", args: { payment_request_name: name }, freeze: true,
      freeze_message: "Đang gửi yêu cầu ký…" })
      .then(function (r) {
        var m = (r && r.message) || {};
        frappe.show_alert({
          message: m.duplicate ? "Yêu cầu ký đã tồn tại — đang chờ nhà cung cấp xác nhận."
                               : "Đã gửi yêu cầu ký. Chữ ký sẽ được xác nhận trong ít phút.",
          indicator: "green" });
        // Khong tu ve trang thai o day: refresh() doc lai tu server va nhanh `processing`
        // se lo phan hien thi. Ve tay o hai cho la hai nguon su that.
        refresh();
      })
      .catch(function (e) {
        msg("Không gửi được yêu cầu ký: " + ((e && e.message) || "lỗi không rõ"), true);
      });
  };

  // Ket noi tai khoan SCTS: mat khau di thang len backend (POST), khong luu o dau trong
  // trinh duyet, xoa o nhap ngay sau khi gui. Thanh cong thi doc lai readiness tu server.
  if (frmLink) frmLink.onsubmit = function (ev) {
    ev.preventDefault();
    var name = pr();
    if (!name || !callReady()) return;
    var pw = inLinkPass.value;
    var user = (inLinkUser.value || "").trim();
    if (!pw) { linkErr("Nhập mật khẩu SCTS."); return; }
    linkErr("");
    btnLink.disabled = true; btnLink.textContent = "Đang kết nối…";
    inLinkPass.value = "";
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.link_scts_account",
      type: "POST", args: { payment_request_name: name, password: pw, username: user || null } })
      .then(function (r) {
        pw = null;
        var m = (r && r.message) || {};
        if (!m.linked) { linkErr("Chưa kết nối được. Thử lại."); return; }
        frappe.show_alert({ message: "Đã kết nối tài khoản ký số SCTS.", indicator: "green" });
        refresh();
      })
      .catch(function (e) {
        pw = null;
        linkErr(serverMsg(e) || "Không kết nối được. Kiểm tra tài khoản/mật khẩu.");
      })
      .then(function () { btnLink.disabled = false; btnLink.textContent = "Kết nối"; });
  };

  // Recovery: cancel an INVALID locked package (governed, requester/SM) so a fresh Draft can
  // be prepared. No provider/SCTS mutation.
  btnFix.onclick = function () {
    var name = pr();
    if (!name || !callReady()) return;
    window.frappe.call({ method: "ecentric_workspace.platform.esign.api.requester_reset_invalid_package",
      type: "POST", args: { payment_request_name: name }, freeze: true,
      freeze_message: "Đang khôi phục gói…" })
      .then(function () {
        frappe.show_alert({ message: "Đã khôi phục. Hãy chuẩn bị lại gói ký.", indicator: "green" });
        refresh();
      })
      .catch(function () { msg("Không khôi phục được gói (kiểm tra quyền).", true); });
  };

    // Bounded, idempotent initial refresh: on a Website route frappe.call can be installed
    // AFTER this inline script runs. Attempt immediately, then poll at a modest interval up to
    // a bounded timeout; invoke refresh() exactly once when the call API is ready; clear the
    // timer on success or timeout. The bind-once guard above means only one timer is ever
    // created per panel element (no duplicate timers on re-sync / navigation).
    var _pollTimer = null, _tries = 0;
    var _MAX_TRIES = 40, _INTERVAL_MS = 150;  // ~6s bounded window
    function _clearPoll() { if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; } }
    function _tryInit() {
      if (callReady()) { _clearPoll(); refresh(); return true; }
      return false;
    }
    if (!_tryInit()) {
      _pollTimer = setInterval(function () {
        _tries++;
        if (_tryInit()) return;
        if (_tries >= _MAX_TRIES) {
          _clearPoll();
          if (window.frappe && window.frappe.boot && window.frappe.boot.developer_mode
              && window.console) {
            console.debug("[ec-req-sign] frappe.call unavailable within bounded window; "
              + "panel stays hidden");
          }
        }
      }, _INTERVAL_MS);
    }
  }
})();
</script>
