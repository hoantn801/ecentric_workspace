    return fetch('/api/method/ec_mso_thread', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: DOCTYPE, name: ticketId })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var m = (d && d.message) || {};
      if (!m.success) throw new Error(m.error || 'fetch_failed');
      return m;
    });
  }

  function refresh() {
    return fetchThread().then(function (m) {
      STATE.files = m.files || [];
      STATE.comments = m.comments || [];
      STATE.events = m.events || [];
      STATE.user = m.user || '';
      STATE.canWrite = m.can_write ? 1 : 0;
      STATE.loaded = true;
      renderAttachments();
      renderFeed();
      setStatus('', '');
    })['catch'](function (e) {
      STATE.loaded = true;
      setStatus('Không tải được tệp/trao đổi: ' + e.message, 'err');
      renderAttachments();
      renderFeed();
    });
  }

  function setStatus(msg, kind) {
    var el = document.getElementById('ec-mso-thread-status');
    if (!el) return;
    el.className = 'mt-status' + (kind ? ' ' + kind : '');
    el.textContent = msg || '';
    if (!msg) el.style.display = 'none';
  }

  /* ---------------- attachments panel ---------------- */
  function findAttachPanel() {
    var titles = document.querySelectorAll('.panel .panel-title');
    for (var i = 0; i < titles.length; i++) {
      var t = (titles[i].textContent || '').trim().toLowerCase();
      if (t.indexOf('tài liệu đính kèm') === 0 || t.indexOf('tai lieu dinh kem') === 0) {
        return titles[i].closest('.panel');
      }
    }
    return null;
  }

  function renderAttachments() {
    var panel = findAttachPanel();
    if (!panel) return false;
    var body = panel.querySelector('.panel-body');
    if (!body) return false;
    var html = '';
    /* Anh dan trong o trao doi cung la File attach vao MSO -> khong liet ke o day,
       neu khong khung "Tai lieu dinh kem" se day anh chat va mat y nghia. */
    var visible = STATE.files.filter(function (f) { return !f.in_comment; });
    if (!STATE.loaded) {
      html = '<div class="attach-empty">Đang tải…</div>';
    } else if (!visible.length) {
      html = '<div class="attach-empty">Không có file đính kèm</div>';
    } else {
      html = '<div class="attach-list">';
      visible.forEach(function (f) {
        var sub = [fmtBytes(f.file_size), f.owner, fmtWhen(f.creation)].filter(function (x) { return x; }).join(' · ');
        html += '<div class="ec-msoatt-row">'
          + '<a class="attach-item" href="' + esc(f.file_url) + '" target="_blank" rel="noopener" style="flex:1;min-width:0">'
          + '<svg class="attach-icon icon icon-sm"><use href="#i-paperclip"/></svg>'
          + '<span class="attach-name">' + esc(f.file_name || 'attachment')
          + '<span class="ec-msoatt-sub" style="display:block">' + esc(sub) + '</span></span>'
          + '</a>';
        if (f.can_delete) {
          html += '<button type="button" class="ec-msoatt-del" title="Xoá tệp khỏi ' + LABEL + ' này"'
            + ' data-att-file="' + esc(f.name) + '"'
            + ' data-att-label="' + esc(f.file_name || 'attachment') + '">×</button>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    if (STATE.canWrite) {
      html += '<input type="file" id="ec-msoatt-input" multiple style="display:none"/>'
        + '<button type="button" class="ec-msoatt-add" id="ec-msoatt-btn">+ Thêm tệp đính kèm</button>'
        + '<div class="ec-msoatt-msg" id="ec-msoatt-msg"></div>';
    }
    body.innerHTML = html;
    var btn = document.getElementById('ec-msoatt-btn');
    var inp = document.getElementById('ec-msoatt-input');
    if (btn && inp) {
      btn.addEventListener('click', function () { inp.value = ''; inp.click(); });
      inp.addEventListener('change', function () { uploadFiles(inp.files); });
    }
    var dels = body.querySelectorAll('.ec-msoatt-del');
    for (var d = 0; d < dels.length; d++) dels[d].addEventListener('click', onDeleteAttachment);
    return true;
  }

  function onDeleteAttachment(e) {
    var btn = e.currentTarget;
    var fname = btn.getAttribute('data-att-file');
    var label = btn.getAttribute('data-att-label') || fname;
    if (!fname) return;
    if (!window.confirm('Xoá tệp "' + label + '" khỏi ' + LABEL + ' này?')) return;
    btn.disabled = true;
    attMsg('Đang xoá "' + label + '"…', '');
    fetch('/api/method/ec_mso_remove_attachment', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: DOCTYPE, name: ticketId, file: fname })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var m = (d && d.message) || {};
      if (!m.success) throw new Error(m.error || 'delete_failed');
      return refresh().then(function () { attMsg('Đã xoá "' + label + '".', 'ok'); });
    })['catch'](function (err) {
      attMsg('Lỗi xoá: ' + err.message, 'err');
      btn.disabled = false;
    });
  }

  function attMsg(text, kind) {
    var el = document.getElementById('ec-msoatt-msg');
    if (!el) return;
    el.className = 'ec-msoatt-msg' + (kind ? ' ' + kind : '');
    el.textContent = text || '';
  }

  function uploadOne(file) {
    var fd = new FormData();
    fd.append('file', file);
    fd.append('doctype', DOCTYPE);
    fd.append('docname', ticketId);
    fd.append('is_private', '1');
    return fetch('/api/method/upload_file', { method: 'POST', credentials: 'include', body: fd })
      .then(function (r) {
        if (r.ok) return r.json();
        return r.text().then(function (t) {
          var m = t.match(/<pre>([\s\S]*?)<\/pre>/);
          throw new Error((m ? m[1] : t).substring(0, 200));
        });
      });
  }

  function uploadFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var btn = document.getElementById('ec-msoatt-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang tải lên…'; }
    attMsg('Đang tải lên ' + files.length + ' tệp…', '');
    var chain = Promise.resolve();
    var okCount = 0, errs = [];
    files.forEach(function (f) {
      chain = chain.then(function () {
        return uploadOne(f).then(function () { okCount++; })
          ['catch'](function (e) { errs.push(f.name + ': ' + e.message); });
      });
    });
    chain.then(function () {
      return refresh();
    }).then(function () {
      if (errs.length) attMsg('Đã tải lên ' + okCount + ' tệp. Lỗi: ' + errs.join(' | '), 'err');
      else attMsg('Đã tải lên ' + okCount + ' tệp.', 'ok');
      var b = document.getElementById('ec-msoatt-btn');
      if (b) { b.disabled = false; b.textContent = '+ Thêm tệp đính kèm'; }
    });
  }

  /* ---------------- comment thread panel ---------------- */
  function buildPanel() {
    var exist = document.getElementById('ec-mso-thread-panel');
    if (exist) return exist;
    var panel = document.createElement('div');
    panel.id = 'ec-mso-thread-panel';
    panel.className = 'panel';
    panel.innerHTML = [
      '<div class="panel-header"><div class="mt-h" style="width:100%">',
      '  <span class="panel-title">Trao đổi</span>',
      '  <button type="button" class="mt-refresh" id="ec-mso-thread-refresh">Làm mới</button>',
      '</div></div>',
      '<div class="panel-body">',
      '  <div class="mt-status" id="ec-mso-thread-status"></div>',
      '  <div class="mt-feed" id="ec-mso-thread-feed"><div class="mt-empty">Đang tải…</div></div>',
      '  <div class="mt-reply" id="ec-mso-thread-reply" style="display:none">',
      '    <div class="mt-input" id="ec-mso-thread-input" contenteditable="true" data-placeholder="Nhập nội dung trao đổi về ' + LABEL + ' này... (dán ảnh bằng Ctrl+V)"></div>',
      '    <button type="button" class="mt-send" id="ec-mso-thread-send">Gửi</button>',
      '  </div>',
      '  <div class="mt-hint" id="ec-mso-thread-hint"></div>',
      '</div>'
    ].join('\n');
    return panel;
  }

  function renderFeed() {
    var feed = document.getElementById('ec-mso-thread-feed');
    if (!feed) return;
    if (!STATE.loaded) { feed.innerHTML = '<div class="mt-empty">Đang tải…</div>'; return; }

    /* Tron comment va moc duyet vao 1 dong theo thoi gian, cu nhat len truoc,
       de doc mot mach: ai trinh, ai duyet luc nao, xen giua la trao doi. */
    var rows = [];
    STATE.comments.forEach(function (c) {
      rows.push({ when: c.creation || '', kind: 'c', c: c });
    });
    STATE.events.forEach(function (ev) {
      rows.push({ when: ev.when || '', kind: 'e', e: ev });
    });
    rows.sort(function (a, b) { return String(a.when) < String(b.when) ? -1 : (String(a.when) > String(b.when) ? 1 : 0); });

    if (!rows.length) {
      feed.innerHTML = '<div class="mt-empty">Chưa có trao đổi nào. Người duyệt và người gửi đều có thể để lại ghi chú ở đây.</div>';
    } else {
      var html = '';
      rows.forEach(function (row) {
        if (row.kind === 'e') {
          var ev = row.e;
          html += '<div class="mt-item mt-ev ev-' + evKind(ev) + '">';
          html += '<span class="mt-av" style="background:' + avColor(ev.by) + '" title="' + esc(ev.by) + '">✓</span>';
          html += '<div class="mt-b">';
          html += '<div class="mt-meta"><span class="mt-who">' + esc(ev.by || '—') + '</span>';
          html += '<span class="mt-when">' + esc(fmtWhen(ev.when)) + '</span></div>';
          html += '<div class="mt-body">' + esc(evLabel(ev))
            + '<span class="mt-flow">' + esc((ev.from_state || '—') + ' → ' + (ev.to_state || '—')) + '</span></div>';
          html += '</div></div>';
          return;
        }
        var c = row.c;
        var isSys = c.comment_type !== 'Comment';
        html += '<div class="mt-item' + (isSys ? ' mt-sys' : '') + '" data-cname="' + esc(c.name) + '">';
        html += '<span class="mt-av" style="background:' + avColor(c.by) + '" title="' + esc(c.by) + '">' + esc(initials(c.by)) + '</span>';
        html += '<div class="mt-b">';
        html += '<div class="mt-meta"><span class="mt-who">' + esc(c.by || '—') + '</span>';
        if (isSys) html += '<span class="mt-tag">' + esc(c.comment_type) + '</span>';
        html += '<span class="mt-when">' + esc(fmtWhen(c.creation)) + (c.edited ? ' · đã sửa' : '') + '</span></div>';
        html += '<div class="mt-body">' + (c.content || '') + '</div>';
        if (!isSys && c.mine) {
          html += '<div class="mt-cbtns">'
            + '<button type="button" class="mt-cbtn mt-edit">Sửa</button>'
            + '<button type="button" class="mt-cbtn mt-del">Xoá</button></div>';
        }
        html += '</div></div>';
      });
      feed.innerHTML = html;
    }
    var reply = document.getElementById('ec-mso-thread-reply');
    var hint = document.getElementById('ec-mso-thread-hint');
    if (reply) reply.style.display = '';
    if (hint) hint.textContent = 'Ctrl+Enter để gửi nhanh. Dán ảnh trực tiếp bằng Ctrl+V. Nội dung lưu ngay trên ' + LABEL + ' này, không đẩy sang GBS.';
  }

  /* ---------------- dan anh vao o trao doi ---------------- */
  function insertNodeAtCaret(node) {
    var inp = document.getElementById('ec-mso-thread-input');
    if (!inp) return;
    inp.focus();
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !inp.contains(sel.anchorNode)) {
      inp.appendChild(node);
      return;
    }
    var range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function insertPastedImage(file) {
    /* Anh duoc upload NATIVE va attach vao chinh MSO (is_private=1) nen chi ai doc
       duoc MSO moi xem duoc anh. Khong dung duong boxme cua GBS: MSO khong ton tai
       ben do. Hien tam bang dataURL de nguoi dung thay ngay, sau khi upload xong
       thi doi src sang file_url that. */
    var reader = new FileReader();
    reader.onload = function () {
      var img = document.createElement('img');
      img.src = reader.result;
      img.setAttribute('data-uploading', '1');
      insertNodeAtCaret(img);
      var btn = document.getElementById('ec-mso-thread-send');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang tải ảnh…'; }
      uploadOne(file).then(function (d) {
        var url = (d && d.message && d.message.file_url) || '';
        if (!url) throw new Error('upload khong tra ve file_url');
        img.src = url;
        img.removeAttribute('data-uploading');
      })['catch'](function (e) {
        img.removeAttribute('data-uploading');
        img.setAttribute('data-error', '1');
        setStatus('Không tải được ảnh: ' + e.message, 'err');
      }).then(function () {
        var b = document.getElementById('ec-mso-thread-send');
        var inp = document.getElementById('ec-mso-thread-input');
        var pending = inp ? inp.querySelector('img[data-uploading="1"]') : null;
        if (b && !pending) { b.disabled = false; b.textContent = 'Gửi'; }
      });
    };
    reader.readAsDataURL(file);
  }

  function onPaste(e) {
    var cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    var items = cd.items || [];
    var imgFile = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && String(items[i].type).indexOf('image/') === 0) {
        imgFile = items[i].getAsFile();
        break;
      }
    }
    if (imgFile) {
      e.preventDefault();
      insertPastedImage(imgFile);
      return;
    }
    /* Dan chu: ep ve text thuan de khong keo theo mau/font tu Word, Excel. */
    var text = cd.getData ? cd.getData('text/plain') : '';
    if (text) {
      e.preventDefault();
      insertNodeAtCaret(document.createTextNode(text));
    }
  }

  function postComment() {
    var inp = document.getElementById('ec-mso-thread-input');
    var btn = document.getElementById('ec-mso-thread-send');
    if (!inp) return;
    if (inp.querySelector('img[data-uploading="1"]')) {
      setStatus('Ảnh đang tải lên, đợi một chút rồi gửi', 'err');
      return;
    }
    var imgs = inp.querySelectorAll('img');
    var text = (inp.textContent || '').trim();
    if (!text && !imgs.length) { setStatus('Nhập nội dung trước', 'err'); return; }

    var content, isHtml;
    if (imgs.length) {
      /* Co anh -> gui HTML. Don cac thuoc tinh tam truoc khi luu de trong DB chi
         con the <img src="/private/files/..."> sach se. */
      var tmp = document.createElement('div');
      tmp.innerHTML = inp.innerHTML;
      var ti = tmp.querySelectorAll('img');
      for (var i = 0; i < ti.length; i++) {
        ti[i].removeAttribute('data-uploading');
        ti[i].removeAttribute('data-error');
        if (String(ti[i].getAttribute('src') || '').indexOf('data:') === 0) ti[i].parentNode.removeChild(ti[i]);
      }
      content = tmp.innerHTML;
      isHtml = 1;
    } else {
      content = text;
      isHtml = 0;
    }
    if (btn) { btn.disabled = true; btn.textContent = 'Đang gửi…'; }
    setStatus('', '');
    fetch('/api/method/gbs_post_comment', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: DOCTYPE, name: ticketId, content: content, is_html: isHtml })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var m = (d && d.message) || {};
      if (!m.success) throw new Error(m.error || 'post_failed');
      inp.innerHTML = '';
      return refresh();
    })['catch'](function (e) {
      setStatus('Lỗi gửi: ' + e.message, 'err');
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = 'Gửi'; }
    });
  }

  function onFeedClick(e) {
    var editBtn = e.target.closest ? e.target.closest('.mt-edit') : null;
    var delBtn = e.target.closest ? e.target.closest('.mt-del') : null;
    if (!editBtn && !delBtn) return;
    var item = e.target.closest('.mt-item');
    if (!item) return;
    var cname = item.getAttribute('data-cname');
    if (delBtn) {
      if (!window.confirm('Xoá bình luận này?')) return;
      delBtn.disabled = true;
      fetch('/api/method/gbs_delete_comment', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ comment_name: cname, local_only: 1 })
      }).then(function (r) { return r.json(); }).then(function (d) {
        var m = (d && d.message) || {};
        if (!m.success) throw new Error(m.error || 'delete_failed');
        return refresh();
      })['catch'](function (err) { setStatus('Lỗi xoá: ' + err.message, 'err'); delBtn.disabled = false; });
      return;
    }
    var bodyEl = item.querySelector('.mt-body');
    if (bodyEl && bodyEl.querySelector('img')) {
      /* O sua la window.prompt (chi chu) -> sua se lam mat anh. Voi comment co
         anh, xoa roi gui lai la duong an toan. */
      setStatus('Bình luận có ảnh thì không sửa được tại đây — xoá rồi gửi lại giúp em.', 'err');
      return;
    }
    var current = bodyEl ? (bodyEl.textContent || '').trim() : '';
    var next = window.prompt('Sửa bình luận:', current);
    if (next === null) return;
    next = String(next).trim();
    if (!next) { setStatus('Nội dung không được để trống', 'err'); return; }
    fetch('/api/method/gbs_edit_comment', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ comment_name: cname, content: next, is_html: 0, local_only: 1 })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var m = (d && d.message) || {};
      if (!m.success) throw new Error(m.error || 'edit_failed');
      return refresh();
    })['catch'](function (err) { setStatus('Lỗi sửa: ' + err.message, 'err'); });
  }

  /* ---------------- mount ---------------- */
  function insertPanel() {
    if (document.getElementById('ec-mso-thread-panel')) return true;
    var content = document.getElementById('content');
    if (!content || content.children.length === 0) return false;
    var panel = buildPanel();
    content.appendChild(panel);
    var rf = document.getElementById('ec-mso-thread-refresh');
    if (rf) rf.addEventListener('click', function () { STATE.loaded = false; renderFeed(); refresh(); });
    var send = document.getElementById('ec-mso-thread-send');
    if (send) send.addEventListener('click', postComment);
    var inp = document.getElementById('ec-mso-thread-input');
    if (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); postComment(); }
      });
      inp.addEventListener('paste', onPaste);
    }
    var feed = document.getElementById('ec-mso-thread-feed');
    if (feed) feed.addEventListener('click', onFeedClick);
    console.log('[ec-mso-thread] panel inserted');
    return true;
  }

  var _tries = 0;
  function init() {
    _tries++;
    if (!insertPanel()) {
      if (_tries < 60) setTimeout(init, 500);
      else console.warn('[ec-mso-thread] gave up after 60 tries; #content never populated');
      return;
    }
    renderAttachments();
    renderFeed();
    refresh();
    var contentEl = document.getElementById('content');
    if (contentEl && !window._ecMsoThreadObserver) {
      var obs = new MutationObserver(function () {
        if (!document.getElementById('ec-mso-thread-panel')) {
          _tries = 0;
          setTimeout(init, 200);
        } else if (STATE.loaded) {
          // trang render lai khung "Tai lieu dinh kem" -> ve lai danh sach file
          var p = findAttachPanel();
          if (p && !p.querySelector('.ec-msoatt-row') && !p.querySelector('#ec-msoatt-btn')) renderAttachments();
        }
      });
      obs.observe(contentEl, { childList: true, subtree: true });
      window._ecMsoThreadObserver = obs;
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script><!-- /ec-mso-thread -->
<script id="ec-ecdoc-detail">
/* 2026-08-07: khung "Chi tiet" cua SO/PO SO EC tren /approval gan nhu trong.
   Nguyen nhan: nhanh `type === 'so'` / `type === 'po'` trong ham dung chi tiet van
   doc bo truong cua mo hinh Power Automate cu (service_name, master_service_ref,
   total_est_revenue, platform...). Sales Order / Purchase Order native khong he co
   nhung truong do -> moi dong deu ra "—", va khong co bang mat hang, khong co MSO
   tham chieu, khong co ngay giao dich, khong co VAT.
   Khoi nay KHONG sua ham cu (van phuc vu mso/gbs_so/gbs_po) ma doc thang chung tu
   qua /api/resource roi ve lai than khung "Chi tiet" cho dung 2 loai nay. */
(function () {
  'use strict';
  if (window._ecDocDetailInstalled) return;
  window._ecDocDetailInstalled = true;

  function urlParam(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var ticketType = urlParam('type');
  var ticketId = urlParam('id');
  var MAP = { 'so': 'Sales Order', 'po': 'Purchase Order' };
  var DOCTYPE = MAP[ticketType];
  if (!DOCTYPE || !ticketId) return;
  var IS_SO = (DOCTYPE === 'Sales Order');
  var DOC = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(n) {
    var v = Number(n || 0);
    if (!v) return '0 đ';
    return v.toLocaleString('vi-VN') + ' đ';
  }
  function qty(n) {
    var v = Number(n || 0);
    return (Math.round(v * 100) / 100).toLocaleString('vi-VN');
  }
  function dmy(s) {
    if (!s) return '';
    var p = String(s).substring(0, 10).split('-');
    return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : String(s);
  }

  function row(label, value, cls) {
    if (value === null || value === undefined || value === '') return '';
    return '<div class="row"><div class="lbl">' + esc(label) + '</div>'
      + '<div class="val ' + (cls || '') + '">' + value + '</div></div>';
  }
  function rowT(label, value, cls) { return row(label, esc(value), cls); }

  function section(title, inner) {
    if (!inner) return '';
    return '<div class="detail-section"><div class="detail-section-title">' + esc(title) + '</div>'
      + inner + '</div>';
  }

  function itemsTable(d) {
    var its = d.items || [];
    if (!its.length) return '';
    var h = '<div style="overflow-x:auto"><table class="ec-ecdoc-items">'
      + '<thead><tr><th>Mã hàng</th><th>Tên</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>';
    its.forEach(function (it) {
      h += '<tr><td class="mono">' + esc(it.item_code || '') + '</td>'
        + '<td>' + esc(it.item_name || '') + '</td>'
        + '<td class="r">' + esc(qty(it.qty)) + '</td>'
        + '<td class="r">' + esc(money(it.rate)) + '</td>'
        + '<td class="r b">' + esc(money(it.amount)) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  function budgetPill(v) {
    if (!v) return '';
    var ok = (String(v).indexOf('In Budget') === 0);
    return '<span class="pill ' + (ok ? 'in-budget' : 'out-budget') + '">' + esc(v) + '</span>';
  }

  function buildHtml(d) {
    var gen = '';
    // 2026-08-07: SO doi ung -- bao ngay dau khung Chi tiet de khong ai nham voi
    // phieu ban that. Nhan dien: kenh GBS + co ec_gbs_so_ref.
    if (IS_SO && (d.ec_channel || '') === 'GBS' && d.ec_gbs_so_ref) {
      gen += '<div class="row"><div class="lbl">Loại phiếu</div><div class="val">'
        + '<span class="pill out-budget">SO đối ứng — máy tự tạo</span>'
        + '<div style="font-size:11.5px;color:#6b7280;margin-top:6px;line-height:1.55">'
        + 'Phiếu này KHÔNG do người khai. Hệ thống tự sinh khi '
        + '<a href="/approval?id=' + encodeURIComponent(d.ec_gbs_so_ref) + '&type=gbs_so" '
        + 'style="color:#2C3DA6;font-weight:600;text-decoration:none">' + esc(d.ec_gbs_so_ref) + '</a>'
        + ' được duyệt, để ghi nhận phần doanh thu của eCentric. Không tạo đơn mua từ phiếu này.'
        + '</div></div></div>';
    }
    // Tieu de nguoi tao go. ERPNext dat mac dinh title = ten khach/NCC
    // nen chi hien khi khac cai mac dinh do, tranh lap dong voi "Khach hang".
    var _tt = (d.title || '').trim();
    var _dft = IS_SO ? (d.customer || '') : (d.supplier || '');
    if (_tt && _tt !== _dft) gen += rowT('Tiêu đề', _tt);
    if (IS_SO) {
      gen += rowT('Khách hàng', d.customer);
      gen += rowT('Brand', d.ec_brand);
      gen += rowT('Kênh', d.ec_channel);
      gen += rowT('Team / Phòng ban', d.ec_team);
      gen += rowT('Store (Platform)', d.ec_store);
      gen += rowT('MSO tham chiếu', d.ec_mso, 'mono');
      gen += rowT('Tháng MSO', d.ec_mso_month);
      gen += rowT('Hợp đồng', d.ec_contract, 'mono');
      if (d.ec_external_service) gen += rowT('Dịch vụ ngoài', 'Có');
      gen += rowT('Ngày đặt hàng', dmy(d.transaction_date));
      gen += rowT('Ngày giao hàng', dmy(d.delivery_date));
      gen += rowT('GBS SO đối ứng', d.ec_gbs_so_ref, 'mono');
    } else {
      gen += rowT('Nhà cung cấp', d.supplier);
      gen += rowT('SO tham chiếu', d.ec_so, 'mono');
      gen += rowT('Brand', d.ec_brand);
      gen += rowT('Team / Phòng ban', d.ec_team);
      gen += rowT('Ngày đặt hàng', dmy(d.transaction_date));
      gen += rowT('Ngày cần hàng', dmy(d.schedule_date));
    }
    gen += rowT('Người tạo', d.owner);
    gen += row('Trạng thái duyệt', '<span class="pill">' + esc(d.workflow_state || '') + '</span>', 'raw');
    var bp = budgetPill(d.ec_in_out_budget);
    if (bp) gen += row(IS_SO ? 'In/Out Budget' : 'In/Out Budget (vs SO)', bp, 'raw');
    if (d.ec_over_justification) gen += rowT('Lý do giải trình', d.ec_over_justification);
    if (d.ec_revision_count) gen += rowT('Số lần gửi lại', String(d.ec_revision_count));
    if (d.ec_revision_reason) gen += rowT('Lý do gửi lại', d.ec_revision_reason);
    if (d.ec_mso_warning) gen += rowT('Cảnh báo MSO', d.ec_mso_warning);

    var fin = '';
    fin += row('Tổng (chưa VAT)', esc(money(d.net_total)), 'money');
    if (IS_SO && d.ec_vat_template) fin += rowT('VAT template', d.ec_vat_template);
    if (!IS_SO && d.taxes_and_charges) fin += rowT('Thuế (template)', d.taxes_and_charges);
    fin += row('Thuế', esc(money(d.total_taxes_and_charges)), 'money');
    fin += row('Tổng cộng (đã VAT)', '<b>' + esc(money(d.grand_total)) + '</b>', 'money');

    return section('Thông tin chung', gen)
      + section('Chi tiết mặt hàng', itemsTable(d))
      + section('Tài chính', fin)
      + section('Metadata', rowT('Tạo lúc', String(d.creation || '').substring(0, 19))
        + rowT('Cập nhật lần cuối', String(d.modified || '').substring(0, 19)
          + (d.modified_by ? ' — ' + d.modified_by : '')));
  }

  if (!document.getElementById('ec-ecdoc-detail-css')) {
    var st = document.createElement('style');
    st.id = 'ec-ecdoc-detail-css';
    st.textContent = [
      '.ec-ecdoc-items { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; }',
      '.ec-ecdoc-items th { text-align:left; font-size:10.5px; letter-spacing:.4px; text-transform:uppercase;',
      '  color:#6b7280; font-weight:700; padding:6px 8px; border-bottom:1px solid #e5e7eb; white-space:nowrap; }',
      '.ec-ecdoc-items td { padding:7px 8px; border-bottom:1px solid #f3f4f6; color:#374151; vertical-align:top; }',
      '.ec-ecdoc-items th.r, .ec-ecdoc-items td.r { text-align:right; white-space:nowrap; }',
      '.ec-ecdoc-items td.b { font-weight:600; color:#111827; }',
      '.ec-ecdoc-items td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }',
      '.ec-ecdoc-items tr:last-child td { border-bottom:none; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  function detailPanel() {
    var titles = document.querySelectorAll('.panel .panel-title');
    for (var i = 0; i < titles.length; i++) {
      var t = (titles[i].textContent || '').trim().toLowerCase();
      if (t === 'chi tiết' || t === 'chi tiet') return titles[i].closest('.panel');
    }
    return null;
  }

  function paint() {
    if (!DOC) return false;
    var panel = detailPanel();
    if (!panel) return false;
    var body = panel.querySelector('.panel-body');
    if (!body) return false;
    if (body.getAttribute('data-ec-ecdoc') === ticketId) return true;
    body.innerHTML = buildHtml(DOC);
    body.setAttribute('data-ec-ecdoc', ticketId);
    return true;
  }

  var _tries = 0;
  function tick() {
    _tries++;
    if (!paint() && _tries < 60) setTimeout(tick, 500);
  }

  fetch('/api/resource/' + encodeURIComponent(DOCTYPE) + '/' + encodeURIComponent(ticketId), {
    credentials: 'include'
  }).then(function (r) { return r.json(); }).then(function (d) {
    DOC = (d && d.data) || null;
    if (!DOC) { console.warn('[ec-ecdoc-detail] khong doc duoc chung tu'); return; }
    tick();
    var content = document.getElementById('content');
    if (content && !window._ecDocDetailObserver) {
      var obs = new MutationObserver(function () {
        var p = detailPanel();
        var b = p ? p.querySelector('.panel-body') : null;
        if (b && b.getAttribute('data-ec-ecdoc') !== ticketId) paint();
      });
      obs.observe(content, { childList: true, subtree: true });
      window._ecDocDetailObserver = obs;
    }
  })['catch'](function (e) { console.warn('[ec-ecdoc-detail]', e); });
})();
</script><!-- /ec-ecdoc-detail -->

(function () {

  var REV_GROUP = 'Phí agency EC';

  function vnd(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' đ'; }

  function loadAll() {

      .then(function (r) { return r.json(); })

        var q = '/api/resource/Item?limit_page_length=0&fields=' +

    document.getElementById('scp2-ok').addEventListener('click', function () {
      var chosen = [], codes = [];
      for (var i = 0; i < chks.length; i++) {
        if (!chks[i].checked) continue;
        var it = items[parseInt(chks[i].getAttribute('data-idx'), 10)];
        if (!it) continue;
        // 2026-08-07: chep ca don gia tu SO sang lam GIA GOI Y (truoc do de trong).
        // Day la gia BAN cho brand, khong phai gia mua -- hop thoai va bang gia da
        // ghi ro de nguoi tao sua lai truoc khi trinh duyet.
        chosen.push({ item_code: it.item_code, item_name: it.item_name || '', qty: it.qty || 0, rate: it.rate || 0 });
        codes.push(it.item_code);
      }
      if (!chosen.length) return;
      try {
        sessionStorage.setItem('gbs_po_from_so', JSON.stringify({
          parent_so: ticketId,
          so: {
            so_title: SO.title || ticketId,
            department: SO.ec_team || '',
            brand_code: SO.ec_brand || '',
            transaction_date: SO.transaction_date || '',
            delivery_date: SO.delivery_date || '',
            notes: ''
          },
          items: chosen,
          item_codes: codes,
          ts: new Date().getTime()
        }));
      } catch (e) {
        window.alert('Không lưu được lựa chọn: ' + e.message);
        return;
      }
      location.href = '/gbs-po-form-v2?from_so=' + encodeURIComponent(ticketId);
    });
  }

  var _t = 0;
  function boot() {
    _t++;
    if (!buildPanel() && _t < 60) setTimeout(boot, 500);
  }
  loadAll().then(boot)['catch'](function (e) { console.warn('[ec-ecso-child-po]', e); });
})();
</script><!-- /ec-ecso-child-po -->
