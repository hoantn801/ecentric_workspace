      '#ec-so-child-po-panel .scp-children { margin-top:14px; padding-top:14px; border-top:1px dashed #e5e7eb; }',
      '#ec-so-child-po-panel .scp-children-title { font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px; }',
      '#ec-so-child-po-panel .scp-child-row { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px; }',
      '#ec-so-child-po-panel .scp-child-row a { color:#2C3DA6; text-decoration:none; font-family:"DM Mono", monospace; font-weight:600; }',
      '#ec-so-child-po-panel .scp-child-row a:hover { text-decoration:underline; }',
      '#ec-so-child-po-panel .scp-child-pill { padding:1px 8px; border-radius:10px; font-size:10.5px; font-weight:600; }',
      '#ec-so-child-po-panel .scp-child-pill.s-pending { background:#fef3c7; color:#92400e; }',
      '#ec-so-child-po-panel .scp-child-pill.s-approved { background:#dcfce7; color:#166534; }',
      '#ec-so-child-po-panel .scp-child-pill.s-rejected { background:#fee2e2; color:#991b1b; }',
      // Modal
      '.scp-modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; display:flex; align-items:center; justify-content:center; }',
      '.scp-modal .scp-card { background:#fff; border-radius:10px; width:720px; max-width:92vw; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.2); }',
      '.scp-modal .scp-card-h { padding:18px 20px; border-bottom:1px solid #e5e7eb; }',
      '.scp-modal .scp-card-h h3 { margin:0; font-size:16px; color:#111827; }',
      '.scp-modal .scp-card-h .scp-sub { font-size:12px; color:#6b7280; margin-top:4px; }',
      '.scp-modal .scp-card-body { padding:16px 20px; overflow-y:auto; flex:1; }',
      '.scp-modal table { width:100%; border-collapse:collapse; font-size:12.5px; }',
      '.scp-modal th { text-align:left; padding:8px 10px; background:#f9fafb; color:#6b7280; font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; border-bottom:1px solid #e5e7eb; }',
      '.scp-modal td { padding:8px 10px; border-bottom:1px solid #f3f4f6; }',
      '.scp-modal tr.poed td { background:#fff7ed; }',
      '.scp-modal .scp-item-code { font-family:"DM Mono",monospace; color:#2C3DA6; font-size:11.5px; }',
      '.scp-modal .scp-item-warn { font-size:10px; color:#92400e; margin-left:6px; }',
      '.scp-modal .scp-card-f { padding:14px 20px; border-top:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fafbfc; border-radius:0 0 10px 10px; }',
      '.scp-modal .scp-running { font-size:12px; color:#374151; }',
      '.scp-modal .scp-actions { display:flex; gap:8px; }',
      '.scp-modal .btn-cancel { background:#fff; color:#4b5563; border:1px solid #e5e7eb; border-radius:6px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer; }',
      '.scp-modal .btn-confirm { background:#2C3DA6; color:#fff; border:none; border-radius:6px; padding:8px 16px; font-weight:600; font-size:13px; cursor:pointer; }',
      '.scp-modal .btn-confirm[disabled] { background:#9ca3af; cursor:not-allowed; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtVnd(n) {
    return (Number(n) || 0).toLocaleString('vi-VN') + ' VND';
  }

  // ---- Cache + fetch ----
  var soData = null;

  function fetchSoData() {
    return fetch('/api/method/gbs_so_create_po_helper', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ so_name: ticketId })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      if (!msg.success) throw new Error(msg.error || 'helper_failed');
      soData = msg;
      return msg;
    });
  }

  // ---- Section render ----
  function statusPillClass(s) {
    var k = (s || '').toLowerCase();
    if (k.indexOf('reject') >= 0) return 's-rejected';
    if (k.indexOf('approve') >= 0) return 's-approved';
    return 's-pending';
  }

  function buildPanel() {
    if (document.getElementById('ec-so-child-po-panel')) return;
    if (!soData) return;
    var so = soData.so || {};
    var children = soData.child_pos || [];
    // v2 (Entry 18i 2026-05-27): require boxme gbs_status='Approved' too,
    // not just local status. Local Approved only completes our internal chain;
    // boxme still needs Revenue Verifier + Revenue Manager to sign off. PO
    // shouldn't be creatable until full boxme chain done.
    var isLocalApproved = (so.status === 'Approved');
    var hasGbsDoc       = !!so.gbs_doc_name;
    var isBoxmeApproved = (so.gbs_status === 'Approved');
    var canCreate       = isLocalApproved && hasGbsDoc && isBoxmeApproved;

    var panel = document.createElement('div');
    panel.id = 'ec-so-child-po-panel';

    var html = '';
    html += '<div class="scp-h">';
    html += '  <div class="scp-title">Purchase Orders từ Service Order này</div>';
    html += '</div>';
    var itemsCount = (soData.items || []).length;
    html += '<div class="scp-summary">Đã tạo <b>' + children.length + '</b> PO · SO có <b>' + itemsCount + '</b> items</div>';

    var btnAttr = canCreate ? '' : 'disabled';
    html += '<button class="scp-btn-primary" id="scp-create-btn" ' + btnAttr + '>';
    html += '  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">';
    html += '    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
    html += '  </svg>';
    html += '  Tạo Purchase Order';
    html += '</button>';
    if (!canCreate) {
      var hintMsg;
      var showRefresh = false;
      if (!isLocalApproved) {
        hintMsg = 'SO cần ở trạng thái Approved (local) trước khi tạo PO (hiện tại: <b>' + escapeHtml(so.status || '-') + '</b>).';
      } else if (!hasGbsDoc) {
        hintMsg = 'Đang chờ sync SO sang boxme... (gbs_doc_name chưa có). Vui lòng đợi vài giây rồi reload.';
      } else if (!isBoxmeApproved) {
        hintMsg = 'Đang chờ GBS team duyệt SO bên boxme. Trạng thái boxme hiện tại: <b>' + escapeHtml(so.gbs_status || 'Draft') + '</b>. PO sẽ tạo được sau khi boxme Approved (Verifier → Manager → Approve).';
        showRefresh = true;  // GD9: only offer refresh when blocked on boxme status
      }
      html += '<div class="scp-disabled-hint">' + hintMsg + '</div>';
      // GD9 (2026-05-28): refresh button — force-poll boxme status without 10min scheduler wait.
      // Only when waiting on boxme (other blockers don't poll-fix).
      if (showRefresh && hasGbsDoc) {
        html += '<button class="scp-refresh-btn" id="scp-refresh-btn" type="button" title="Force-poll trạng thái boxme ngay (không cần đợi scheduler 10 phút)">';
        html += '  <svg id="scp-refresh-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">';
        html += '    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>';
        html += '  </svg>';
        html += '  <span id="scp-refresh-label">Refresh boxme status</span>';
        html += '</button>';
      }
    }

    if (children.length > 0) {
      html += '<div class="scp-children">';
      html += '<div class="scp-children-title">Child POs (' + children.length + ')</div>';
      children.forEach(function(c){
        var statusLabel = c.gbs_status || c.status || 'Pending';
        var cls = statusPillClass(statusLabel);
        var href = '/approval?id=' + encodeURIComponent(c.name) + '&type=gbs_po';
        html += '<div class="scp-child-row">';
        html += '  <a href="' + href + '">' + escapeHtml(c.name) + '</a>';
        html += '  <span class="scp-child-pill ' + cls + '">' + escapeHtml(statusLabel) + '</span>';
        html += '  <span style="color:#6b7280">·</span>';
        html += '  <span>' + c.items_count + ' items</span>';
        html += '  <span style="color:#6b7280">·</span>';
        html += '  <span>' + fmtVnd(c.grand_total) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }
    panel.innerHTML = html;

    // Insert at end of #content (full-width below grid, same approach as Timeline)
    var content = document.getElementById('content');
    if (content) content.appendChild(panel);

    var btn = document.getElementById('scp-create-btn');
    if (btn && canCreate) {
      btn.addEventListener('click', openItemsModal);
    }
    // GD9 (2026-05-28): wire refresh button if present
    var refreshBtn = document.getElementById('scp-refresh-btn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function(){ refreshBoxmeStatus(true); });
    }
  }

  // ---- GD9: force-poll boxme gbs_status ----
  // Rate-limit guard: tránh storm khi panel re-render nhiều lần.
  // _lastPollTs: timestamp ms của lần poll cuối; 3000ms cooldown cho auto, 0ms cho manual.
  var _lastPollTs = 0;
  var POLL_COOLDOWN_MS = 3000;

  function refreshBoxmeStatus(manual) {
    var now = Date.now();
    if (!manual && (now - _lastPollTs) < POLL_COOLDOWN_MS) {
      return;  // auto-trigger rate-limited
    }
    _lastPollTs = now;

    if (!soData || !soData.so || !soData.so.gbs_doc_name) {
      console.warn('[ec-gbs-so-child-po] refreshBoxmeStatus: no gbs_doc_name');
      return;
    }
    var btn = document.getElementById('scp-refresh-btn');
    var svg = document.getElementById('scp-refresh-svg');
    var lbl = document.getElementById('scp-refresh-label');
    if (btn) btn.setAttribute('disabled', 'disabled');
    if (svg) svg.classList.add('scp-refresh-spin');
    if (lbl) lbl.textContent = 'Đang poll...';

    fetch('/api/method/manual_poll_gbs_status', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc: soData.so.gbs_doc_name })
    }).then(function(r){ return r.json(); }).then(function(d){
      console.log('[ec-gbs-so-child-po] manual_poll result:', d);
      // Re-fetch SO helper to pick up updated gbs_status, then re-render panel
      return fetchSoData();
    }).then(function(){
      // Wipe + re-build panel with fresh data
      var existing = document.getElementById('ec-so-child-po-panel');
      if (existing) existing.remove();
      buildPanel();
    }).catch(function(e){
      console.error('[ec-gbs-so-child-po] refresh err', e);
      if (svg) svg.classList.remove('scp-refresh-spin');
      if (lbl) lbl.textContent = 'Lỗi — thử lại';
      if (btn) btn.removeAttribute('disabled');
    });
  }

  // ---- Modal: select items to push to PO ----
  function openItemsModal() {
    var items = (soData && soData.items) || [];
    if (items.length === 0) {
      alert('SO không có item nào để tạo PO');
      return;
    }
    var modal = document.createElement('div');
    modal.className = 'scp-modal';
    var rowsHtml = items.map(function(it, idx){
      var poed = (it.po_count || 0) > 0;
      var warn = poed ? '<span class="scp-item-warn">(đã có ' + it.po_count + ' PO)</span>' : '';
      return '<tr ' + (poed ? 'class="poed"' : '') + ' data-idx="' + idx + '">' +
        '<td><input type="checkbox" class="scp-item-check" data-idx="' + idx + '" data-code="' + escapeHtml(it.item_code) + '" /></td>' +
        '<td><span class="scp-item-code">' + escapeHtml(it.item_code) + '</span>' + warn + '</td>' +
        '<td>' + escapeHtml(it.item_name) + '</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums;">' + (it.qty || 0) + '</td>' +
        '<td>' + escapeHtml(it.uom || '') + '</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums;">' + (Number(it.rate) || 0).toLocaleString('vi-VN') + '</td>' +
        '<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;">' + (Number(it.amount) || 0).toLocaleString('vi-VN') + '</td>' +
      '</tr>';
    }).join('');

    modal.innerHTML =
      '<div class="scp-card">' +
        '<div class="scp-card-h">' +
          '<h3>Chọn items đưa sang Purchase Order</h3>' +
          '<div class="scp-sub">Từ <b>' + escapeHtml(ticketId) + '</b> · ' + items.length + ' items · Tick item nào để chuyển sang PO mới</div>' +
        '</div>' +
        '<div class="scp-card-body">' +
          '<table>' +
            '<thead><tr><th width="32"></th><th>Item Code</th><th>Name</th><th style="text-align:right">Qty</th><th>UOM</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div class="scp-card-f">' +
          '<div class="scp-running" id="scp-running">Chưa chọn item nào</div>' +
          '<div class="scp-actions">' +
            '<button class="btn-cancel" id="scp-cancel">Huỷ</button>' +
            '<button class="btn-confirm" id="scp-confirm" disabled>Tạo PO →</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);

    function recalcRunning() {
      var checks = modal.querySelectorAll('.scp-item-check:checked');
      var total = 0;
      checks.forEach(function(ch){
        var idx = parseInt(ch.dataset.idx, 10);
        var it = items[idx];
        if (it) total += (Number(it.amount) || 0);
      });
      var run = document.getElementById('scp-running');
      var btn = document.getElementById('scp-confirm');
      if (checks.length === 0) {
        run.textContent = 'Chưa chọn item nào';
        btn.disabled = true;
      } else {
        run.innerHTML = 'Đã chọn <b>' + checks.length + '</b> items · Total: <b>' + total.toLocaleString('vi-VN') + ' VND</b>';
        btn.disabled = false;
      }
    }
    modal.querySelectorAll('.scp-item-check').forEach(function(ch){
      ch.addEventListener('change', recalcRunning);
    });

    document.getElementById('scp-cancel').addEventListener('click', function(){
      modal.remove();
    });
    modal.addEventListener('click', function(e){
      if (e.target === modal) modal.remove();
    });
    document.getElementById('scp-confirm').addEventListener('click', function(){
      var checks = modal.querySelectorAll('.scp-item-check:checked');
      if (checks.length === 0) return;
      var selectedItems = [];
      var selectedCodes = [];
      checks.forEach(function(ch){
        var idx = parseInt(ch.dataset.idx, 10);
        var it = items[idx];
        if (it) {
          selectedItems.push(it);
          selectedCodes.push(it.item_code);
        }
      });
      // Save to sessionStorage so PO form can read on next page
      try {
        sessionStorage.setItem('gbs_po_from_so', JSON.stringify({
          parent_so: ticketId,
          so:        soData.so,
          items:     selectedItems,
          item_codes: selectedCodes,
          ts:        Date.now()
        }));
      } catch(e) {
        console.error('[ec-gbs-so-child-po] sessionStorage err', e);
        alert('Lỗi: không lưu được session — ' + e.message);
        return;
      }
      // Redirect to PO form with from_so URL param
      location.href = '/gbs-po-form-v2?from_so=' + encodeURIComponent(ticketId);
    });
  }

  // ---- Init ----
  function init() {
    fetchSoData().then(function(){
      buildPanel();
      // GD9 (2026-05-28): auto-poll boxme status on mount if SO is local-approved
      // + synced (hasGbsDoc) but boxme not yet Approved. Saves user from manually
      // waiting up to 10 min for scheduler. Rate-limited 3s in case of remounts.
      var so = (soData && soData.so) || {};
      if (so.status === 'Approved' && so.gbs_doc_name && so.gbs_status !== 'Approved') {
        setTimeout(function(){ refreshBoxmeStatus(false); }, 600);
      }
      // Observe content re-renders (approval-page does innerHTML=html)
      var content = document.getElementById('content');
      if (content) {
        var obs = new MutationObserver(function(){
          // If our panel was wiped, re-insert
          if (!document.getElementById('ec-so-child-po-panel')) {
            setTimeout(buildPanel, 100);
          }
        });
        obs.observe(content, { childList: true, subtree: false });
      }
    }).catch(function(e){
      console.error('[ec-gbs-so-child-po] fetch err', e);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script><!-- /ec-gbs-so-child-po-section -->
<script id="ec-gbs-send-back">
(function(){
  'use strict';
  if (window._gbsSendBackInstalled) return;
  window._gbsSendBackInstalled = true;

  function urlParam(k){
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var ticketType = urlParam('type');
  var ticketId   = urlParam('id');
  // C4b B7 2026-08-03: mo cho ca MSO / SO / PO native — truoc day khoi nay chi
  // chay cho GBS SO/PO nen 3 loai native khong he co nut "Gui lai / Cần sửa".
  // Native khac GBS o 3 diem, xu ly bang co IS_NATIVE ben duoi:
  //   1. Lay du lieu qua get_ticket_detail (da chuan hoa status/revision_*),
  //      khong qua /api/resource — nhieu nguoi duyet la Website User nen doc
  //      thang bang native se bi chan quyen.
  //   2. Khong co bang approval_history — moc thoi gian/nguoi gui lai doc tu
  //      nhat ky duyet (ec_approval_log).
  //   3. Nut "Sửa & Submit lại": loai nao co web form sua thi ve web form,
  //      con lai moi ve Desk form (xem `webForm` va resubmitUrl() ben duoi).
  // 2026-08-05: `native` va `webForm` la HAI viec khac nhau — dung gop lam mot.
  // `native: true` con quyet dinh viec doc du lieu qua get_ticket_detail va viec
  // khong co bang approval_history; MSO van la doctype native nen phai giu
  // `native: true`, chi rieng dich cua nut "Sửa & Submit lại" doi sang web form
  // /mso-plan-form?edit=<id> (form nay da co che do sua tu 2026-08-05).
  var EC_SB_CFG = {
    'gbs_so': { doctype: 'GBS Sales Order',    form: '/gbs-so-form-v2', native: false },
    'gbs_po': { doctype: 'GBS Purchase Order', form: '/gbs-po-form-v2', native: false },
    'mso':    { doctype: 'MSO',                form: '/app/mso',             native: true, webForm: '/mso-plan-form' },
    'so':     { doctype: 'Sales Order',        form: '/app/sales-order',     native: true },
    'po':     { doctype: 'Purchase Order',     form: '/app/purchase-order',  native: true }
  };
  var CFG = EC_SB_CFG[ticketType];
  if (!CFG) return;
  if (!ticketId) return;
  console.log('[ec-send-back] active for', ticketType, ticketId);

  var DOCTYPE = CFG.doctype;
  var FORM_ROUTE = CFG.form;
  var IS_NATIVE = CFG.native;
  var docData = null;

  function resubmitUrl(){
    // Co web form sua -> luon uu tien, ke ca doctype native (MSO).
    if (CFG.webForm) return CFG.webForm + '?edit=' + encodeURIComponent(ticketId);
    if (IS_NATIVE) return FORM_ROUTE + '/' + encodeURIComponent(ticketId);
    return FORM_ROUTE + '?edit=' + encodeURIComponent(ticketId);
  }

  // ---- CSS ----
  if (!document.getElementById('ec-gbs-send-back-css')) {
    var st = document.createElement('style');
    st.id = 'ec-gbs-send-back-css';
    st.textContent = [
      '.btn.btn-sendback { background:#f59e0b; color:#fff; flex:1; }',
      '.btn.btn-sendback:hover:not(:disabled) { background:#d97706; }',
      '#ec-can-sua-banner { background:#fef3c7; border:1px solid #f59e0b; border-radius:8px; padding:14px 16px; margin-bottom:14px; }',
      '#ec-can-sua-banner .csb-title { font-size:14px; font-weight:700; color:#92400e; margin-bottom:6px; }',
      '#ec-can-sua-banner .csb-reason { font-size:13px; color:#78350f; margin-bottom:8px; line-height:1.5; }',
      '#ec-can-sua-banner .csb-meta { font-size:11.5px; color:#92400e; margin-bottom:10px; }',
      '#ec-can-sua-banner .csb-btn { background:#2C3DA6; color:#fff; border:none; border-radius:6px; padding:8px 16px; font-weight:600; font-size:13px; cursor:pointer; }',
      '#ec-can-sua-banner .csb-btn:hover { background:#1f2d80; }',
      '#ec-sendback-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:9999; }',
      '#ec-sendback-modal { background:#fff; border-radius:10px; padding:20px; min-width:420px; max-width:560px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }',
      '#ec-sendback-modal h3 { margin:0 0 12px; font-size:16px; color:#92400e; }',
      '#ec-sendback-modal textarea { width:100%; min-height:100px; border:1px solid #d1d5db; border-radius:6px; padding:10px; font-family:inherit; font-size:13px; resize:vertical; }',
      '#ec-sendback-modal .ec-mhint { font-size:11.5px; color:#6b7280; margin-top:6px; }',
      '#ec-sendback-modal .ec-mactions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }',
      '#ec-sendback-modal .ec-mbtn { padding:8px 16px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; border:none; }',
      '#ec-sendback-modal .ec-mbtn-cancel { background:#e5e7eb; color:#374151; }',
      '#ec-sendback-modal .ec-mbtn-cancel:hover { background:#d1d5db; }',
      '#ec-sendback-modal .ec-mbtn-confirm { background:#f59e0b; color:#fff; }',
      '#ec-sendback-modal .ec-mbtn-confirm:hover { background:#d97706; }',
      '#ec-sendback-modal .ec-mbtn-confirm[disabled] { background:#9ca3af; cursor:not-allowed; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  // ---- Helpers ----
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function getSessionEmail(){
    if (window.frappe && window.frappe.session && window.frappe.session.user_email) return window.frappe.session.user_email;
    if (window.frappe && window.frappe.session && window.frappe.session.user) {
      var u = window.frappe.session.user;
      if (typeof u === 'string' && u.indexOf('@') > 0) return u;
    }
    return null;
  }
  function fetchDoc(){
    // C4b B7 2026-08-03: 3 loai native (MSO / Sales Order / Purchase Order) phai
    // lay du lieu qua get_ticket_detail, KHONG qua /api/resource, vi 2 ly do:
    //   1. Quyen: nhieu nguoi duyet la Website User (57/119 tren live) nen doc
    //      thang bang native qua /api/resource se bi tra 403.
    //   2. Chuan hoa: chi get_ticket_detail moi tra ve 'status' da quy doi tu
    //      workflow_state va 2 khoa 'revision_reason' / 'revision_count' —
    //      ban ghi tho chi co 'ec_revision_reason' / 'ec_revision_count'.
    // Dang goi giong het loadTicket() cua trang: POST JSON {type, id},
    // doc ket qua o d.message.item (fallback d.message.data).
    if (IS_NATIVE) {
      return fetch('/api/method/ecentric_workspace.api.get_ticket_detail', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: ticketType, id: ticketId })
      }).then(function(r){ return r.json(); }).then(function(d){
        var payload = (d && d.message) || d || {};
        docData = payload.item || payload.data || null;
        return docData;
      }).catch(function(e){
        console.warn('[ec-send-back] fetchDoc (native) err', e);
        return null;
      });
    }
    var encName = encodeURIComponent(DOCTYPE) + '/' + encodeURIComponent(ticketId);
    return fetch('/api/resource/' + encName, {
      method: 'GET', credentials: 'include',
      headers: { 'Accept': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(d){
      docData = (d && d.data) || null;
      return docData;
    }).catch(function(e){
      console.warn('[ec-gbs-send-back] fetchDoc err', e);
      return null;
    });
  }
  // LUU Y: ham nay hien KHONG duoc goi o dau (quyen bam nut do may chu quyet
  // dinh trong approval_decision). Neu sau nay dung lai thi phai sua truoc:
  // tu C4b, mot cap duyet co the do NHIEU nguoi dam nhiem nen `approver` la
  // chuoi noi dau phay — phai so voi `approvers` (mang), khong so bang '==='.
  function currentApproverEmail(){
    if (!docData || !docData.approval_chain) return null;
    var chain = docData.approval_chain;
    try {
      if (typeof chain === 'string') chain = JSON.parse(chain);
    } catch(e){ return null; }
    if (!Array.isArray(chain)) return null;
    var lvl = Number(docData.current_level || 1);
    for (var i = 0; i < chain.length; i++) {
      if (Number(chain[i].level || (i+1)) === lvl) return (chain[i].approver || '').toLowerCase();
    }
    return null;
  }

  // ---- Send Back modal ----
  function openSendBackModal(){
    if (document.getElementById('ec-sendback-modal-bg')) return;
    var bg = document.createElement('div');
    bg.id = 'ec-sendback-modal-bg';
    bg.innerHTML = '' +
      '<div id="ec-sendback-modal">' +
        '<h3>Send back</h3>' +
        '<textarea id="ec-sendback-reason" placeholder="Lý do send back (tối thiểu 10 ký tự, mô tả rõ chỗ cần sửa)..."></textarea>' +
        '<div class="ec-mhint" id="ec-sendback-counter">0 / 10 ký tự tối thiểu</div>' +
        '<div class="ec-mactions">' +
          '<button class="ec-mbtn ec-mbtn-cancel" id="ec-sendback-cancel">Huỷ</button>' +
          '<button class="ec-mbtn ec-mbtn-confirm" id="ec-sendback-confirm" disabled>Send back</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);

    var ta = document.getElementById('ec-sendback-reason');
    var counter = document.getElementById('ec-sendback-counter');
    var btnConfirm = document.getElementById('ec-sendback-confirm');
    ta.focus();
    ta.addEventListener('input', function(){
      var l = ta.value.trim().length;
      counter.textContent = l + ' / 10 ký tự tối thiểu' + (l < 10 ? ' (chưa đủ)' : ' ✓');
      btnConfirm.disabled = (l < 10);
    });
    document.getElementById('ec-sendback-cancel').addEventListener('click', function(){ bg.remove(); });
    bg.addEventListener('click', function(e){ if (e.target === bg) bg.remove(); });
    btnConfirm.addEventListener('click', function(){
      var reason = ta.value.trim();
      if (reason.length < 10) return;
      btnConfirm.disabled = true;
      btnConfirm.textContent = 'Đang gửi...';
      var callerEmail = getSessionEmail();
      var body = new URLSearchParams();
      body.append('doctype', ticketType);
      body.append('name', ticketId);
      body.append('decision', 'send_back');
      body.append('caller_email', callerEmail || '');
      body.append('comment', reason);
      fetch('/api/method/ecentric_workspace.api.approval_decision', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      }).then(function(r){ return r.json(); }).then(function(d){
        var msg = (d && d.message) || d || {};
        if (msg.success) {
          bg.remove();
          // C4b B7: may chu tra message_vi de nguoi dung doc duoc tieng Viet.
          alert(msg.message_vi || ('Đã gửi lại cho người tạo. Trạng thái: ' + msg.status));
          location.reload();
        } else {
          // C4b B7: uu tien message_vi — cac loi moi (send_back_reason_too_short,
          // send_back_not_pending) chi co ma tieng Anh o msg.error.
          alert('Lỗi: ' + (msg.message_vi || msg.error || 'unknown'));
          btnConfirm.disabled = false;
          btnConfirm.textContent = 'Send back';
        }
      }).catch(function(e){
        alert('Lỗi mạng: ' + e.message);
        btnConfirm.disabled = false;
        btnConfirm.textContent = 'Send back';
      });
    });
  }

  // ---- Inject Send Back button next to Reject ----
  function injectSendBackButton(){
    var btnReject = document.getElementById('btnReject');
    if (!btnReject) return false;
    if (document.getElementById('btnSendBack')) return true;
    // Show button alongside Approve/Reject (same visibility convention).
    // Backend approval_decision_override validates caller_email == current
    // approver and returns 'not_authorized' if mismatch — same as Approve/Reject.
    var btn = document.createElement('button');
    btn.className = 'btn btn-sendback';
    btn.id = 'btnSendBack';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:14px;height:14px;margin-right:4px;vertical-align:middle"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>Send back';
    btn.addEventListener('click', openSendBackModal);
    btnReject.parentNode.appendChild(btn);
    console.log('[ec-gbs-send-back] Send Back button injected');
    return true;
  }

  // ---- Render Cần sửa banner (replaces wrong "Đã từ chối" panel) ----
  function injectCanSuaBanner(){
    if (!docData) return false;
    var status = (docData.status || '').trim();
    if (status !== 'Cần sửa') return true;

    // v2 2026-05-31: avoid double-inject (idempotent across primary AND fallback)
    // Marker: csb_fallback_2026-05-31
    if (document.getElementById('ec-can-sua-banner')) return true;

    // PRIMARY anchor: decided-panel.rejected (replace-mode, original behavior)
    var rejectedPanels = document.querySelectorAll('.decided-panel.rejected');
    var targetPanel = null;
    for (var i = 0; i < rejectedPanels.length; i++) {
      if (!rejectedPanels[i].dataset.ecCanSuaApplied) {
        targetPanel = rejectedPanels[i];
        break;
      }
    }

    // Build banner HTML (shared between primary and fallback paths)
    var reason = docData.revision_reason || '(không có lý do — Finance có thể chưa nhập)';
    /* ec-cansua-meta-v1 2026-08-03: co HAI duong dan dan toi trang thai "Can sua":
         (1) Finance send back  -> bump `revision_count`, ghi su kien 'send_back'
         (2) GBS/boxme reject rồi nguoi dung bam "Sua & Submit lai"
                                -> bump `resubmit_count`, ghi su kien
                                   'resubmit_after_gbs_reject'
       Banner cu chi biet duong (1) nen voi cac doc di duong (2) no hien
       "Yeu cau boi - . - . Lan thu 0" (vi du that: GBS-SO-2026-07-31-00016,
       GBS-SO-2026-07-24-00004, GBS-PO-2026-07-09-00004). Chi sai o cho hien
       thi, du lieu duoi database van dung. Nay doc ca hai duong. */
    var revCount = docData.revision_count || 0;
    var submitter = (docData.submitted_by || '').toLowerCase();
    var currentUser = (getSessionEmail() || '').toLowerCase();
    var isSubmitter = (currentUser === submitter);
    var docOwner = (docData.owner || docData.created_by || '').toLowerCase();
    if (!isSubmitter && currentUser && currentUser === docOwner) { isSubmitter = true; }
    if (!isSubmitter) { /* ec-resubmit-realuser-v1: getSessionEmail rong tren portal -> fetch user that, reveal nut cho submitter/owner (backend van gac quyen) */
      window._ecCurUserPromise = window._ecCurUserPromise || fetch('/api/method/frappe.auth.get_logged_user', {credentials:'include'}).then(function(r){ return r.json(); }).then(function(d){ return (((d && d.message) || '') + '').toLowerCase(); }).catch(function(){ return ''; });
      window._ecCurUserPromise.then(function(realU){
        if (!(realU && (realU === submitter || realU === docOwner))) return;
        if (document.getElementById('ec-csb-resubmit-btn')) return;
        var note = document.getElementById('ec-csb-nonsubmitter-note');
        if (!note || !note.parentNode) return;
        var b = document.createElement('button');
        b.className = 'csb-btn'; b.id = 'ec-csb-resubmit-btn'; b.textContent = 'S\u1eeda & Submit l\u1ea1i';
        note.parentNode.insertBefore(b, note); note.style.display = 'none';
        b.addEventListener('click', function(){ window.location.href = resubmitUrl(); });
      });
    }

    var sentBy = '—', sentAt = '—';
    /* ec-cansua-meta-v1: 'gbsreject' khi doc quay ve Can sua vi GBS tu choi,
       'sendback' khi Finance tra ve. Lay su kien MOI NHAT trong hai loai, vi mot
       doc co the da tung di ca hai duong (vi du that: GBS-SO-2026-07-31-00009 co
       send_back ngay 31/07 roi resubmit_after_gbs_reject ngay 03/08 - ly do dang
       nam o Can sua bay gio la cai sau). */
    var metaKind = 'sendback';
    try {
      var h = docData.approval_history;
      if (typeof h === 'string') h = JSON.parse(h);
      if (Array.isArray(h)) {
        for (var j = h.length - 1; j >= 0; j--) {
          var ev = h[j] && h[j].event;
          if (ev === 'send_back' || ev === 'resubmit_after_gbs_reject') {
            sentBy = h[j].by || '—';
            sentAt = h[j].at || '—';
            if (ev === 'resubmit_after_gbs_reject') {
              metaKind = 'gbsreject';
              revCount = h[j].resubmit_count || docData.resubmit_count || revCount;
            }
            break;
          }
        }
      }
    } catch(e){}
    /* Cat bo phan micro-giay: "2026-08-03 16:22:56.135705" -> "2026-08-03 16:22" */
    if (sentAt && sentAt !== '—') sentAt = String(sentAt).slice(0, 16);

    // C4b B7 2026-08-03: MSO / Sales Order / Purchase Order native KHONG co bang
    // `approval_history` (da xac nhan tren live: chi GBS SO/PO moi co field nay).
    // Nguoi va thoi diem gui lai doc tu nhat ky duyet `ec_approval_log`, la mot
    // Long Text moi dong co dang:  "<thoi diem> | <nguoi> | <noi dung>".
    // Uu tien dong do approval_decision ghi ("... | gui lai (can sua): <ly do>")
    // vi dong do co dung email nguoi bam nut. Neu nguoi duyet thao tac thang
    // trong Desk thi khong co dong do — luc ay lay dong chuyen trang thai
    // "Pending X -> Draft" do ec_*_before_save ghi, cung co email o cot 2.
    if (IS_NATIVE && sentBy === '—') {
      try {
        var logRaw = String(docData.ec_approval_log || '');
        var lines = logRaw.split('\n');
        var pick = null;
        var k;
        for (k = lines.length - 1; k >= 0; k--) {
          if (lines[k].indexOf('gui lai (can sua)') > -1) { pick = lines[k]; break; }
        }
        if (!pick) {
          for (k = lines.length - 1; k >= 0; k--) {
            if (lines[k].indexOf('-> Draft') > -1) { pick = lines[k]; break; }
          }
        }
        if (pick) {
          var parts = pick.split('|');
          if (parts.length >= 2) {
            sentAt = (parts[0] || '').trim() || '—';
            sentBy = (parts[1] || '').trim() || '—';
          }
        }
      } catch(e){}
    }

    var html = '<div id="ec-can-sua-banner">' +
      '<div class="csb-title">⚠️ Cần sửa</div>' +
      '<div class="csb-reason">' + escapeHtml(reason) + '</div>' +
      (metaKind === 'gbsreject'
        ? '<div class="csb-meta">GBS từ chối · Mở sửa bởi <b>' + escapeHtml(sentBy) + '</b> · ' + escapeHtml(sentAt) + ' · Lần thứ ' + revCount + '</div>'
        : '<div class="csb-meta">Yêu cầu bởi <b>' + escapeHtml(sentBy) + '</b> · ' + escapeHtml(sentAt) + ' · Lần thứ ' + revCount + '</div>');
    var _canRS = isSubmitter || (window._ecIsAdmin === true);
    if (_canRS) {
      html += '<button class="csb-btn" id="ec-csb-resubmit-btn">Sửa & Submit lại' + (isSubmitter ? '' : ' (admin)') + '</button>';
    } else {
      html += '<div style="font-size:11.5px; color:#92400e;" id="ec-csb-nonsubmitter-note">(Chỉ submitter <b>' + escapeHtml(submitter) + '</b> hoặc admin mới sửa được)</div>';
    }
    html += '</div>';

    if (targetPanel) {
      // PRIMARY path: replace the wrong decision card
      targetPanel.dataset.ecCanSuaApplied = '1';
      var parentPanel = targetPanel.closest('.panel') || targetPanel.parentNode;
      if (parentPanel) {
        parentPanel.outerHTML = html;
      } else {
        targetPanel.outerHTML = html;
      }
      console.log('[ec-gbs-send-back] Cần sửa banner injected via primary path (isSubmitter=' + isSubmitter + ')');
    } else {
      // FALLBACK path csb_fallback_2026-05-31: inject at top of #content.
      // Fires when user navigated back from form edit and decided-panel.rejected
      // is no longer rendered. Without this, user has no button to re-enter edit form.
      var fallbackAnchor = document.querySelector('#content') ||
                           document.querySelector('main') ||
                           document.body;
      if (!fallbackAnchor) return false;
      var wrap = document.createElement('div');
      wrap.innerHTML = html;
      var banner = wrap.firstChild;
      if (banner) {
        if (fallbackAnchor.firstChild) {
          fallbackAnchor.insertBefore(banner, fallbackAnchor.firstChild);
        } else {
          fallbackAnchor.appendChild(banner);
        }
      }
      console.log('[ec-gbs-send-back] Cần sửa banner injected via FALLBACK path csb_fallback_2026-05-31 (isSubmitter=' + isSubmitter + ')');
    }

    function _ecAttachResubmit(){
      var btn = document.getElementById('ec-csb-resubmit-btn');
      if (btn && !btn.dataset.ecBound) {
        btn.dataset.ecBound = '1';
        btn.addEventListener('click', function(){
          // C4b B7 2026-08-03: GBS mo web form (?edit=), native mo Desk form
          // (/app/<slug>/<name>) — xem resubmitUrl() va ghi chu o dau khoi.
          window.location.href = resubmitUrl();
        });
      }
    }
    if (isSubmitter || window._ecIsAdmin === true) {
      _ecAttachResubmit();
    } else if (window._ecAdminPromise) {
      window._ecAdminPromise.then(function(isAdmin){
        if (!isAdmin) return;
        if (!document.getElementById('ec-csb-resubmit-btn')) {
          var note = document.getElementById('ec-csb-nonsubmitter-note');
          if (note) {
            var b = document.createElement('button');

  function fmtTime(s) {
    if (!s) return '';
    try {
      var d = new Date(String(s).replace(' ', 'T'));
      var now = new Date();
      var diffMs = now - d;
      var diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'vừa xong';
      if (diffMin < 60) return diffMin + ' phút trước';
      var diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + ' giờ trước';
      var diffDay = Math.floor(diffHr / 24);
      if (diffDay < 7) return diffDay + ' ngày trước';
      return d.toLocaleString('vi-VN');
    } catch(e) { return s; }
  }

  function avatarOf(email) {
    if (!email) return '?';

  function escapeHtml(s) {

  }
  function parseOrigin(content) {
    var m = String(content || '').match(/^\[ecentric:\s*([^\]]+)\]\s*\n?([\s\S]*)$/);
    if (m) return { origin: 'ecentric', user: m[1].trim(), body: m[2] };
    return { origin: 'gbs', user: null, body: content || '' };
  }

  // ---- Event building from doc ----
  function eventsFromDoc(doc) {
    var events = [];
    // 1. Created
    if (doc.creation) {
      events.push({
        type: 'create',
        at: doc.creation,
        actor: doc.submitted_by || doc.owner || 'system',
        text: T.eventCreate + ' ' + (doc.po_title || doc.name)
      });
    }
    // 2. approval_history entries
    try {
      var ah = JSON.parse(doc.approval_history || '[]');
      if (Array.isArray(ah)) {
        ah.forEach(function(h){
          if (!h || typeof h !== 'object') return;
          var evType = 'approve';
          var evText = T.eventApprove;
          var ev = (h.event || h.action || '').toLowerCase();
          // v3_attach_branch_2026-06-03: catch 'added_attachment'/'attach' events so they
          // don't fall through to default 'approve' label. Plus prior v2 fix:
          // check 'resubmit' substring BEFORE 'reject' (event 'resubmit_after_gbs_reject'
          // contains both - reject was matching first).
          if (ev.indexOf('send_back') >= 0 || ev.indexOf('sendback') >= 0)
                                              { evType = 'reject';   evText = T.eventSendBack + (h.level ? ' (L' + h.level + ')' : ''); }
          else if (ev.indexOf('resubmit') >= 0){ evType = 'resubmit'; evText = T.eventResubmit + (h.revision_count ? ' (lần ' + h.revision_count + ')' : ''); }
          else if (ev.indexOf('reject') >= 0)      { evType = 'reject';   evText = T.eventReject; }
          else if (ev.indexOf('attach') >= 0 || ev.indexOf('added_') >= 0)
                                              { evType = 'attach';   evText = T.eventAttach + (h.count ? ' (' + h.count + ' file)' : ''); }
          else if (ev.indexOf('approve') >= 0) { evType = 'approve';  evText = T.eventApprove + (h.level ? ' (L' + h.level + ')' : ''); }
          else if (ev.indexOf('create') >= 0)  { evType = 'create';   evText = T.eventCreate; }
          else if (h.decision === 'approved')  { evType = 'approve';  evText = T.eventApprove + (h.level ? ' (L' + h.level + ')' : ''); }
          else if (h.decision === 'rejected')  { evType = 'reject';   evText = T.eventReject; }
          else if (h.decision === 'send_back') { evType = 'reject';   evText = T.eventSendBack + (h.level ? ' (L' + h.level + ')' : ''); }
          events.push({
            type: evType,
            at: h.at || h.timestamp || doc.creation,
            actor: h.by || h.approver || h.actor || 'unknown',
            text: evText,
            content: h.reason || h.comment || ''
          });
        });
      }
    } catch(e) { /* ignore */ }
    // 3. Sync to GBS (gbs_last_sync + gbs_doc_name)
    if (doc.gbs_doc_name && doc.gbs_last_sync) {
      events.push({
        type: 'sync',
        at: doc.gbs_last_sync,
        actor: 'system',
        text: T.eventSync + ' as ' + doc.gbs_doc_name + (doc.gbs_status ? ' (' + doc.gbs_status + ')' : '')
      });
    }
    if (doc.sync_error) {
      events.push({
        type: 'reject',
        at: doc.gbs_last_sync || doc.modified,
        actor: 'system',
        text: T.eventSyncErr,
        content: doc.sync_error
      });
    }
    // 4. Attachment sync
    if (doc.attachments_synced && doc.attachments_last_sync) {
      events.push({
        type: 'attach',
        at: doc.attachments_last_sync,
        actor: 'system',
        text: T.eventAttach + ' (' + (doc.attachments_sync_count || 0) + ' file)'
      });
    }
    return events;
  }

  function eventsFromComments(comments) {
    var events = [];
    (comments || []).forEach(function(c){
      var ctype = c.comment_type || 'Comment';
      var actor = c.comment_email || c.comment_by || 'unknown';
      if (ctype === 'Comment') {
        // User comment - parse [ecentric:] prefix + render as bubble
        var parsed = parseOrigin(c.content || '');
        actor = parsed.user || actor;
        events.push({
          type: parsed.origin === 'ecentric' ? 'comment_ec' : 'comment_gbs',
          at: c.creation,
          actor: actor,
          text: parsed.origin === 'ecentric' ? T.eventCommentEC : T.eventCommentGBS,
          content: parsed.body,
          cname: (c.name || ''), clocal: !!c.local_only, cmine: ((parsed.origin === 'ecentric') && (((parsed.user || '') === ecCurUser) || ((c.comment_email || '') === ecCurUser))),
          contentOrigin: parsed.origin,
          is_html: true
        });
      } else if (ctype === 'Workflow' || ctype === 'Label') { /* v27_marker_label_render_2026-07-06 */
        // Workflow state change from boxme - text only, no bubble.
        // Content is the state name e.g. "Bản nháp", "Từ chối"
        events.push({
          type: 'workflow',
          at: c.creation,
          actor: actor,
          text: (c.content || '').trim() || 'workflow event'
        });
      } else {
        // Other types (Edit, Attachment, Created, etc.) - treat as informational
        events.push({
          type: 'workflow',
          at: c.creation,
          actor: actor,
          text: ctype + ': ' + ((c.content || '').trim() || '')
        });
      }
    });
    return events;
  }

  function renderFeed(events, gbsDocName, warning) {
    var sub = document.getElementById('tl-sub');
    if (sub) {
      if (gbsDocName) sub.textContent = T.docPrefix + gbsDocName + ' - ' + events.length + ' event(s)';
      else sub.textContent = T.notSynced;
    }
    var feed = document.getElementById('tl-feed');
    if (!feed) return;

    // Remove old warning
    var oldWarn = document.querySelector('#ec-gbs-timeline-panel .tl-warn');
    if (oldWarn) oldWarn.remove();
    if (warning) {
      var w = document.createElement('div');
      w.className = 'tl-warn';
      w.textContent = warning;
      var body = document.querySelector('#ec-gbs-timeline-panel .tl-body');
      if (body) body.parentNode.insertBefore(w, body);
    }

    if (!events || events.length === 0) {
      feed.innerHTML = '<div class="tl-empty">' + T.empty + '</div>';
      return;
    }
    // Sort: newest first
    events.sort(function(a, b){
      var ta = new Date(String(a.at).replace(' ', 'T')).getTime();
      var tb = new Date(String(b.at).replace(' ', 'T')).getTime();
      return tb - ta;
    });

    feed.innerHTML = events.map(function(ev){
      var content = '';
      if (ev.content) {
        var cls = 'tl-content';
        if (ev.contentOrigin === 'ecentric') cls += ' tl-content-ecentric';
        else if (ev.contentOrigin === 'gbs') cls += ' tl-content-gbs';
        content = '<div class="' + cls + '">' + (ev.is_html ? ev.content : escapeHtml(ev.content)) + '</div>';

  // ---- Fetch local doc + boxme comments + merge ----
function ecDriftBadge(doc){

          .catch(function(e){ window.alert('L\u1ed7i: ' + e.message); pb.disabled = false; pb.textContent = 'K\u00e9o l\u1ea1i t\u1eeb GBS'; });

  function refreshTimeline() {

  // v26_marker_lightbox_2026-07-06: click comment image to view full-size

          .then(function(r){ return r.json(); }).then(function(d){ var mm = (d && d.message) || 0; if (!mm || !mm.success) { setStatus(((mm && mm.error) || 'edit error'), true); } else { setStatus('\u0110\u00e3 s\u1eeda', false); refreshTimeline(); } });

  }
  // v24_marker_paste_image_2026-07-06: contenteditable + paste image support
  function _ecInsertTextAt(text) {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) { document.getElementById('tl-input').appendChild(document.createTextNode(text)); return; }
    var range = sel.getRangeAt(0);
    range.deleteContents();
    var node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
  }
  function _ecInsertPastedImage(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      var inp = document.getElementById('tl-input');
      if (!inp) return;
      var img = document.createElement('img');
      img.src = dataUrl;
      img.setAttribute('data-uploading', '1');
      // Insert at cursor if inside input, else append
      var sel = window.getSelection();
      var inside = sel && sel.anchorNode && inp.contains(sel.anchorNode);
      if (inside && sel.rangeCount > 0) {
        var range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(img);
        range.setStartAfter(img); range.collapse(true);
        sel.removeAllRanges(); sel.addRange(range);
      } else {
        inp.appendChild(img);
      }
      inp.focus();
      // Upload to boxme via app method
      fetch('/api/method/ecentric_workspace.gbs_comment_proxy.upload_image_to_boxme', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          base64_data: dataUrl,
          filename: (file && file.name) || ('pasted_image_' + Date.now() + '.png')
        })
      }).then(function(r){ return r.json(); }).then(function(d){
        var msg = (d && d.message) || {};
        if (!msg.success) {
          img.setAttribute('data-error', msg.error || 'upload_failed');
          img.removeAttribute('data-uploading');
          setStatus('Upload áº£nh fail: ' + (msg.error || 'unknown'), true);
          return;
        }
        img.src = msg.proxy_url;
        img.setAttribute('data-boxme-src', msg.file_url);
        img.removeAttribute('data-uploading');
      }).catch(function(err){
        img.setAttribute('data-error', String(err));
        img.removeAttribute('data-uploading');
        setStatus('Upload áº£nh fail: ' + String(err), true);
      });
    };
    reader.readAsDataURL(file);
  }
  function _ecHandlePaste(e) {
    var cd = e.clipboardData;
    if (!cd) return;
    var items = cd.items || [];
    // Prefer image if present in clipboard
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
        e.preventDefault();
        var file = it.getAsFile();
        if (file) _ecInsertPastedImage(file);
        return;
      }
    }
    // Plain-text paste (strip formatting so we don't inherit external CSS)
    var text = cd.getData('text/plain');
    if (text !== null && text !== undefined && text !== '') {
      e.preventDefault();
      _ecInsertTextAt(text);
    }

  function postComment() {
    var inp = document.getElementById('tl-input');

    if (!inp || !btn) return;

    if (inp.querySelector('img[data-uploading="1"]')) {
      setStatus('Chá» áº£nh upload xong...', true);
      return;
    }
    var textOnly = (inp.innerText || '').trim();
    var hasImage = inp.querySelector('img[data-boxme-src]') !== null;
    if (!textOnly && !hasImage) { setStatus(T.emptyInp, true); return; }
    var htmlContent;
    if (hasImage) {
      // Build outgoing HTML from innerHTML; swap proxy src back to boxme /private/files path.
      var raw = inp.innerHTML;
      raw = raw.replace(/src="\/api\/method\/ecentric_workspace\.gbs_comment_proxy\.proxy_boxme_file\?path=([^"]+)"/g, function(m, p){
        try { return 'src="' + decodeURIComponent(p) + '"'; }

      raw = raw.replace(/\s*data-boxme-src="[^"]*"/g, '');
      raw = raw.replace(/\s*data-uploading="[^"]*"/g, '');
      raw = raw.replace(/\s*data-error="[^"]*"/g, '');
      htmlContent = raw;
    } else {
      // Text-only: send plain text through legacy path (server escapes)
      htmlContent = textOnly;
    }
    btn.disabled = true; btn.textContent = T.sending;
    fetch('/api/method/gbs_post_comment', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doctype: docType,
        name: ticketId,
        content: htmlContent,
        is_html: hasImage ? 1 : 0
      })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      if (!msg.success) throw new Error(msg.error || 'post_failed');
      setStatus(T.sent, false);
      inp.innerHTML = '';
      return refreshTimeline();
    }).catch(function(e){
      setStatus(T.errSend + e.message, true);
    }).then(function(){
      btn.disabled = false; btn.textContent = T.send;
    });
  }

  // ---- Insert anchor ----
  // User wants Timeline FULL WIDTH BELOW the 2-col grid (Chi tiết / Approval Chain).
  // We append as the last child of #content, which is the parent of the grid.
  // This makes Timeline a sibling AFTER the grid -> full width.
  // MutationObserver below re-injects when approval page does #content.innerHTML=html.
  function findAnchor() {
    var content = document.getElementById('content');
    if (!content) return null;
    // Only succeed if #content has been populated by approval page render
    // (avoids inserting into empty #content that will be wiped).
    if (content.children.length === 0) return null;
    console.log('[ec-gbs-timeline] using #content tail (full-width below grid)');
    return { container: content, after: null };
  }

  function insertPanel() {
    if (document.querySelector('div#ec-gbs-timeline-panel')) return true;
    var anchor = findAnchor();
    if (!anchor) {
      console.log('[ec-gbs-timeline] anchor not found yet');
      return false;
    }
    var panel = buildPanel();
    var mode = '';
    if (anchor.before) {
      anchor.container.insertBefore(panel, anchor.before);
      mode = 'before .decision-panel';
    } else if (anchor.after && anchor.after.nextSibling) {
      anchor.container.insertBefore(panel, anchor.after.nextSibling);
      mode = 'after target sibling';
    } else if (anchor.after) {
      anchor.container.appendChild(panel);
      mode = 'append (after has no nextSibling)';
    } else {
      anchor.container.appendChild(panel);
      mode = 'append to ' + (anchor.container.id || anchor.container.className || '?');
    }
    var refresh = document.getElementById('tl-refresh');
    if (refresh) refresh.addEventListener('click', refreshTimeline);
    var send = document.getElementById('tl-send');
    if (send) send.addEventListener('click', postComment);
    var inp = document.getElementById('tl-input');
    if (inp) {
      inp.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { postComment(); }
      });
      inp.addEventListener('paste', _ecHandlePaste);
    }
    console.log('[ec-gbs-timeline] panel inserted (mode=' + mode + ')');
    return true;
  }

  var _initTries = 0;
  var _refreshInterval = null;
  function init() {
    _initTries++;
    if (_initTries % 10 === 1) {
      console.log('[ec-gbs-timeline] init() called, try=' + _initTries + ' readyState=' + document.readyState);
    }
    if (!insertPanel()) {
      if (_initTries < 60) {
        setTimeout(init, 500);
      } else {
        console.warn('[ec-gbs-timeline] gave up after 60 tries (30s); .decision-panel never appeared');
      }
      return;
    }
    console.log('[ec-gbs-timeline] init() success - panel rendered, starting refresh + observer');
    refreshTimeline();
    if (!_refreshInterval) _refreshInterval = setInterval(refreshTimeline, 60000);

    // MutationObserver: if approval page re-renders #content (innerHTML replaced),
    // our panel gets wiped. Detect that and re-inject.
    var contentEl = document.getElementById('content');
    if (contentEl && !window._gbsTimelineObserver) {
      var obs = new MutationObserver(function(){
        // If our panel is no longer in DOM, re-inject
        if (!document.querySelector('div#ec-gbs-timeline-panel')) {
          console.log('[ec-gbs-timeline] panel removed by re-render, re-inserting...');
          _initTries = 0;
          setTimeout(init, 200);
        }
      });
      obs.observe(contentEl, { childList: true, subtree: true });
      window._gbsTimelineObserver = obs;
      console.log('[ec-gbs-timeline] MutationObserver attached to #content');
    }
  }
  console.log('[ec-gbs-timeline] IIFE setup complete, registering init. readyState=' + document.readyState);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
