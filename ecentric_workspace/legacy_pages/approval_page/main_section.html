
<script id="ec-csrf-fetch-patch">
(function(){
  if (window.ecFetchPatched) return;
  window.ecFetchPatched = true;
  var origFetch = window.fetch;
  function getCsrf() {
    return (window.frappe && window.frappe.csrf_token) ||
           (window.CTX && window.CTX.csrfToken) ||
           window.csrf_token ||
           (document.cookie.match(/csrf_token=([^;]+)/) || [])[1] ||
           'token';
  }
  window.fetch = function(url, opts) {
    opts = opts || {};
    var u = (typeof url === 'string') ? url : (url && url.url) || '';
    var method = (opts.method || 'GET').toUpperCase();
    var isApi = u.indexOf('/api/method/') >= 0 || u.indexOf('/api/resource/') >= 0;
    if (isApi && method !== 'GET' && method !== 'HEAD') {
      opts.headers = opts.headers || {};
      if (opts.headers.set && typeof opts.headers.set === 'function') {
        if (!opts.headers.get('X-Frappe-CSRF-Token')) {
          opts.headers.set('X-Frappe-CSRF-Token', getCsrf());
        }
      } else {
        var hasToken = false;
        for (var k in opts.headers) {
          if (k.toLowerCase() === 'x-frappe-csrf-token') { hasToken = true; break; }
        }
        if (!hasToken) {
          opts.headers['X-Frappe-CSRF-Token'] = getCsrf();
        }
      }
      if (opts.credentials === undefined) opts.credentials = 'include';
    }
    return origFetch.call(window, url, opts);
  };
  console.log('[ec-csrf] fetch wrapper installed');
})();
</script>

<script>
(function() {
  function setActive() {
    var path = window.location.pathname.replace(/\/+$/, '') || '/';
    var links = document.querySelectorAll('.ec-sb-link');
    links.forEach(function(a) {
      var href = (a.getAttribute('href') || '').replace(/\/+$/, '') || '/';
      a.classList.remove('active');
      // Strict exact match
      if (href === path) {
        a.classList.add('active');
      }
      // Special case: '/home' page should also activate links with href='/'
      else if ((path === '/home' || path === '/') && (href === '/' || href === '/home')) {
        a.classList.add('active');
      }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setActive);
  } else {
    setActive();
  }
})();
</script>

<script id="ec-approval-attach-fix">
(function(){
  // Flatten nested arrays (PA may wrap body('Get_attachments') one level deep)
  function flatten(arr) {
    if (!Array.isArray(arr)) return [];
    var out = [];
    arr.forEach(function(x) {
      if (Array.isArray(x)) x.forEach(function(y) { out.push(y); });
      else if (x && typeof x === 'object') out.push(x);
    });
    return out;
  }

  // Map SharePoint attachment shape -> UI shape
  function mapSpShape(arr) {
    var flat = flatten(arr);
    return flat.map(function(a) {
      if (!a) return null;
      var name = a.DisplayName || a.name || a.fileName || a.Title || '';
      var url  = a.AbsoluteUri || a.url || a.link || a.ServerRelativeUrl || '';
      // ServerRelativeUrl is relative, prepend host
      if (url && url.indexOf('http') !== 0 && url.indexOf('/sites/') === 0) {
        url = 'https://boxmeglobal.sharepoint.com' + url;
      }
      return { name: name, url: url };
    }).filter(function(x) { return x && x.url; });
  }

  // Monkey-patch fetch: intercept PA responses, inject mapped attachments into item
  if (window._ecApprovalFetchPatched) return;
  window._ecApprovalFetchPatched = true;

  var origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var isPA = /powerautomate\.com|powerplatform\.com/i.test(url);
    var p = origFetch(input, init);
    if (!isPA) return p;
    return p.then(function(res) {
      // Clone so caller can also read response normally
      var cloned = res.clone();
      return cloned.json().then(function(data) {
        try {
          if (data && typeof data === 'object') {
            var atts = data.attachments;
            if (Array.isArray(atts)) {
              var mapped = mapSpShape(atts);
              try { console.log('[ec-approval-attach] mapped', mapped.length, 'attachments'); } catch(_) {}
              if (mapped.length) {
                // Place into item if exists, also into items[] for batch
                if (data.item && typeof data.item === 'object') {
                  data.item.attachments = mapped;
                }
                if (Array.isArray(data.items)) {
                  data.items.forEach(function(it) {
                    if (it && !it.attachments) it.attachments = mapped;
                  });
                }
                // Build a fresh Response with patched body
                var patchedBody = JSON.stringify(data);
                return new Response(patchedBody, {
                  status: res.status,
                  statusText: res.statusText,
                  headers: res.headers
                });
              }
            }
          }
        } catch(e) { try { console.warn('[ec-approval-attach] patch err', e); } catch(_) {} }
        return res;  // unmodified
      }).catch(function() { return res; });
    });
  };
  try { console.log('[ec-approval-attach] fetch patched'); } catch(_) {}
})();
</script>

        <div class="ec-shell-tbright" data-ec-shell-header-right="1"><button type="button" class="ec-shell-iconbtn ec-shell-reminder" data-ec-shell-action-slot="1" aria-label="Nhắc việc" title="Nhắc việc" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span class="ec-shell-reminder-badge" data-ec-shell-reminder-badge="1" hidden></span></button><a class="ec-shell-iconbtn" href="/app/notification-log" data-ec-notification-bell="1" aria-label="Thông báo" title="Thông báo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></a><button type="button" class="ec-shell-iconbtn ec-shell-slot-disabled" data-ec-shell-settings-slot="1" disabled aria-disabled="true" title="Cài đặt (sắp ra mắt)" aria-label="Cài đặt (sắp ra mắt)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button></div>
      </div>
    </div>

    <div class="content">
      <div id="content">
        <div class="state">
          <div class="spinner"></div>
          <div>Đang tải chi tiết ticket...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></svg>
  <span></span>
</div>

<script>
(function () {
  'use strict';

  const ENDPOINTS = {
    getDetail: '/api/method/ecentric_workspace.api.get_ticket_detail',
    decision:  '/api/method/ecentric_workspace.api.approval_decision',
    lookup:    '/api/method/web_lookup'
  };

  const SERVICE_TYPE_LABELS = {
    'PRD-STD': 'Production - Standard',
    'PRD-PST': 'Production - Post-production',
    'PRD-VID': 'Production - Video',
    'PRD-PHO': 'Production - Photography',
    'PRD-AUD': 'Production - Audio',
    'PRD-LIV': 'Production - Livestream',
    'MED-STD': 'Media - Standard',
    'MED-CAM': 'Media - Campaign',
    'MED-CON': 'Media - Content',
    'MED-INF': 'Media - Influencer',
    'ECO-STD': 'E-commerce - Standard',
    'ECO-CAM': 'E-commerce - Campaign',
    'ECO-OPS': 'E-commerce - Operations',
    'MCD-STD': 'Merchandise - Standard',
    'MCD-DSG': 'Merchandise - Design',
    'MCD-CON': 'Merchandise - Content',
    'SVC-STD': 'Service - Standard',
    'SVC-CS':  'Service - Customer Support',
    'SVC-LOG': 'Service - Logistics',
    'ODS-STD': 'Operation, Data & System - Standard',
    'HRD-STD': 'HR - Standard',
    'FNA-STD': 'Finance & Accounting - Standard',
    'Setup':     'Setup (legacy)',
    'Campaign':  'Campaign (legacy)'
  };

  function fmtServiceType(code) {
    if (!code) return '—';
    const label = SERVICE_TYPE_LABELS[code];
    return label ? code + ' — ' + label : code;
  }

  function detectTypeFromId(id) {
    if (!id) return null;
    const upper = String(id).toUpperCase();
    if (upper.startsWith('MSO-')) return 'mso';
    if (upper.startsWith('SO-')) return 'so';
    if (upper.startsWith('PO-')) return 'po';
    return null;
  }

  function getQuery(name) {
    const u = new URLSearchParams(window.location.search);
    return u.get(name);
  }

  function getSessionEmail() {
    if (window.frappe && window.frappe.session && window.frappe.session.user_email) return window.frappe.session.user_email;
    if (window.frappe && window.frappe.session && window.frappe.session.user) {
      const u = window.frappe.session.user;
      if (typeof u === 'string' && u.includes('@')) return u;
    }
    return null;
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return '—';
    return Number(n).toLocaleString('vi-VN') + ' đ';
  }

  function fmtDate(d) {
    if (!d) return '—';
    try { return new Date(d).toLocaleString('vi-VN'); } catch (e) { return d; }
  }

  function val(item, ...keys) {
    for (const k of keys) {
      const v = item && item[k];
      if (v !== undefined && v !== null && v !== '') {
        if (typeof v === 'object' && v.Value !== undefined) return v.Value;
        return v;
      }
    }
    return null;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.className = 'toast toast-' + (type === 'error' ? 'error' : 'success');
    if (type === 'error') {
      t.querySelector('svg').innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
    } else {
      t.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12"/>';
    }
    t.querySelector('span').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4500);
  }

  // C4b B1/B2 2026-08-03: mot cap duyet co the do NHIEU nguoi cung dam nhiem.
  // SO/PO native khong luu email nguoi duyet tren chung tu — nguoi duyet la MOI
  // user giu Role 'EC Sales Admin' (hien tai 2 nguoi). Server tra ve ca
  // `approvers` (mang) lan `approver` (chuoi noi dau phay, de hien thi), nen moi
  // cho so sanh email phai so voi CA DANH SACH, khong so bang '===' voi 1 chuoi.
  function ecStepEmails(step) {
    if (!step) return [];
    let raw = step.approvers;
    if (!Array.isArray(raw)) raw = String(step.approver || step.approver_email || '').split(',');
    const out = [];
    raw.forEach(function (e) {
      const t = String(e == null ? '' : e).trim().toLowerCase();
      if (t && out.indexOf(t) === -1) out.push(t);
    });
    return out;
  }

  // 2026-08-04 (fb#6): mot cap duyet co the co 4-5 nguoi (vd Role 'EC Finance').
  // In ca chuoi email noi dau phay thi tran dong va khong doc noi. Doi sang bubble
  // 2 chu cai (hoan.tran -> HT); tro chuot / cham vao bubble hien full email.
  function ecInitials(email) {
    var local = String(email || '').split('@')[0];
    var parts = local.split(/[._\-]+/).filter(function (p) { return p; });
    var s;
    if (parts.length >= 2) s = parts[0].charAt(0) + parts[1].charAt(0);
    else s = local.substring(0, 2);
    return s.toUpperCase() || '?';
  }
  var EC_AV_COLORS = ['#2C3DA6', '#0f766e', '#b45309', '#7c3aed', '#be123c', '#0369a1', '#4d7c0f'];
  function ecAvatarColor(email) {
    var s = String(email || ''), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
    return EC_AV_COLORS[h % EC_AV_COLORS.length];
  }
  function ecApproverBubbles(emails) {
    if (!emails || !emails.length) return '<span class="step-email">—</span>';
    if (emails.length === 1) return '<div class="step-email">' + escapeHtml(emails[0]) + '</div>';
    var html = '<div class="step-avatars">';
    emails.forEach(function (e) {
      html += '<span class="ec-av" style="background:' + ecAvatarColor(e) + '" tabindex="0" title="' + escapeHtml(e) + '">'
        + escapeHtml(ecInitials(e))
        + '<span class="ec-av-tip">' + escapeHtml(e) + '</span></span>';
    });
    html += '</div>';
    return html;
  }
  // fb#3: dat ten cap duyet dung nhu flow da chot: Leader - SA - HOF - CEO.
  var EC_ROLE_LABEL = { manager: 'Leader', finance: 'SA / Finance', hof: 'HOF', ceo: 'CEO' };
  function ecRoleLabel(role) {
    var k = String(role || 'approver').toLowerCase().replace(/[\s-]+/g, '_');
    return EC_ROLE_LABEL[k] || String(role || 'approver').replace(/_/g, ' ');
  }

  function parseChain(item) {
    const raw = val(item, 'approval_chain');
    if (!raw) return [];
    try {
      const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function parseHistory(item) {
    const raw = val(item, 'approval_history');
    if (!raw) return [];
    try {
      const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function parseAttachments(item) {
    // v2_1_strip_fragment_2026-06-02: extract name from URL #fragment (for display),
    // but strip fragment from URL field (for href) - SP viewer breaks when URL has
    // #filename appended. Browser-side fragment handling confuses SP routing.
    function v2_extractName(u) {
      if (!u) return '';
      var h = u.indexOf('#');
      var n = (h > 0) ? u.substring(h + 1) : (u.split('/').pop() || u);
      try { return decodeURIComponent(n); } catch(e) { return n; }
    }
    function v2_stripFragment(u) {
      if (!u) return u;
      var h = u.indexOf('#');
      return (h > 0) ? u.substring(0, h) : u;
    }
    const raw = val(item, 'attachment_url', 'attached_pdf', 'attachment', 'attachments');
    if (!raw) return [];
    if (Array.isArray(raw)) return raw.map(x => typeof x === 'string' ? { url: v2_stripFragment(x), name: v2_extractName(x) } : x);
    if (typeof raw === 'string') {
      const parts = raw.split(',').map(s => s.trim()).filter(s => s.startsWith('http'));
      if (parts.length > 0) {
        return parts.map(u => ({ url: v2_stripFragment(u), name: v2_extractName(u) }));
      }
    }
    if (typeof raw === 'object' && raw.Url) return [{ url: raw.Url, name: raw.Description || raw.Url.split('/').pop() }];
    return [];
  }

  function renderChainPanel(item) {
    const chain = parseChain(item);
    const status = (val(item, 'final_status', 'status') || 'Pending').trim();
    const currentEmail = getSessionEmail();

    if (chain.length === 0) {
      return '<div class="panel"><div class="panel-header"><span class="panel-title">Approval Chain</span></div><div class="panel-body"><p style="color: var(--gray-500); font-size: 12.5px; margin: 0;">Không có chain config (single approver hoặc data legacy).</p></div></div>';
    }

    // ec-chain-fix-v2: derive approved/current from current_level + final_status (chain entries' status not updated by PA)
    const currentLevel = parseInt(val(item, 'current_level') || '1', 10);
    const finalStatus = (val(item, 'final_status', 'status') || 'Pending').trim();
    const doneCount = (finalStatus === 'Approved') ? chain.length : chain.filter((c, i) => {
      const lvl = c.level || (i + 1);
      return lvl < currentLevel;
    }).length;
    const total = chain.length;
    const isCurrentApprover = currentEmail && finalStatus === 'Pending' && chain.some((c, i) => {
      const lvl = c.level || (i + 1);
      return ecStepEmails(c).indexOf(currentEmail.toLowerCase()) > -1 && lvl === currentLevel;
    });

    let html = '<div class="panel"><div class="panel-header"><span class="panel-title">Approval Chain</span></div><div class="panel-body">';
    html += '<div class="chain-summary"><strong>' + doneCount + '/' + total + ' levels approved</strong>';
    if (status === 'Rejected') html += ' · <span style="color:var(--red);font-weight:600">Rejected</span>';
    if (status === 'Approved') html += ' · <span style="color:var(--green);font-weight:600">Done</span>';
    html += '</div>';

    html += '<div class="chain-list">';
    chain.forEach((step, idx) => {
      // ec-step-status-fix: derive per-step from currentLevel + finalStatus
      const stepLevel = step.level || (idx + 1);
      const isDone = stepLevel < currentLevel || finalStatus === 'Approved';
      const isRejected = finalStatus === 'Rejected' && stepLevel === currentLevel;
      const isCurrent = !isDone && !isRejected && stepLevel === currentLevel && finalStatus === 'Pending';
      const klass = isDone ? 'done' : (isRejected ? 'rejected' : (isCurrent ? 'current' : ''));
      html += '<div class="chain-step ' + klass + '">';
      html += '<div class="step-num">' + (step.level || (idx + 1)) + '</div>';
      html += '<div class="step-content">';
      html += '<div class="step-role">Level ' + (step.level || (idx + 1)) + ' · ' + escapeHtml(ecRoleLabel(step.role)) + '</div>';
      var stepEmails = ecStepEmails(step);
      html += ecApproverBubbles(stepEmails.length ? stepEmails : (step.approver ? [step.approver] : []));
      // C4b: cap duyet theo Role co the nhieu nguoi — noi ro de khoi tuong phai cho du ca hai.
      if (stepEmails.length > 1) {
        html += '<div class="step-status" style="color:var(--gray-500)">' + stepEmails.length + ' người — ai xử lý trước cũng được</div>';
      }
      if (isDone) html += '<div class="step-status">✓ Approved</div>';
      else if (isRejected) html += '<div class="step-status">✗ Rejected</div>';
      else if (isCurrent) html += '<div class="step-status">→ Đang chờ duyệt</div>';
      else html += '<div class="step-status">Chưa tới</div>';
      html += '</div></div>';
    });
    html += '</div>';

    if (currentEmail && isCurrentApprover) {
      html += '<div class="chain-summary" style="background: var(--navy-50); color: var(--navy); margin-top: 12px; margin-bottom: 0;"><strong>Bạn là approver hiện tại</strong></div>';
    } else if (currentEmail && status === 'Pending') {
      // D9: noi ro han — truoc day chi ghi "khong trong chain hien tai" trong khi nut
      // Approve/Reject van sang, khien nguoi dung tuong la loi. Quyen duyet con co the den
      // tu role trong Workflow; server moi la noi quyet dinh cuoi cung.
      var curStep = chain.filter(function (c, i) { return (c.level || (i + 1)) === currentLevel; })[0];
      var curWho = curStep ? (curStep.approver || '—') : '—';
      html += '<div class="chain-summary" style="margin-top: 12px; margin-bottom: 0;">Bạn (<strong>'
        + escapeHtml(currentEmail) + '</strong>) không phải approver của cấp đang chờ (Level '
        + escapeHtml(String(currentLevel)) + ' — <strong>' + escapeHtml(curWho) + '</strong>). '
        + 'Nút Approve/Reject vẫn hiển thị vì quyền duyệt còn có thể đến từ role trong Workflow; '
        + 'hệ thống sẽ kiểm tra lại khi bạn bấm.</div>';
    }

    html += '</div></div>';
    return html;
  }

  function renderAttachmentsPanel(item) {
    const list = parseAttachments(item);
    let html = '<div class="panel"><div class="panel-header"><span class="panel-title">Tài liệu đính kèm</span></div><div class="panel-body">';
    if (list.length === 0) {
      html += '<div class="attach-empty">Không có file đính kèm</div>';
    } else {
      html += '<div class="attach-list">';
      list.forEach(f => {
        html += '<div class="attach-row" style="display:flex;align-items:center;gap:4px">';
        html += '<a class="attach-item" href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener" style="flex:1;min-width:0">';
        html += '<svg class="attach-icon icon icon-sm"><use href="#i-paperclip"/></svg>';
        html += '<span class="attach-name">' + escapeHtml(f.name || 'attachment') + '</span>';
        html += '</a>';
        html += '<button type="button" class="ec-att-del-btn" title="Xoá file khỏi doc + GBS" data-att-url="' + escapeHtml(f.url) + '" data-att-name="' + escapeHtml(f.name || '') + '" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:17px;line-height:1;padding:0 6px;flex:none">\u00d7</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }

  // ---- Xoá file đính kèm (detail view) — gọi gbs_remove_attachment ----
  if (!window._ecAttDelWired) {
    window._ecAttDelWired = true;
    document.addEventListener('click', function(ev){
      var b = ev.target.closest && ev.target.closest('.ec-att-del-btn');
      if (!b || b.disabled) return;
      ev.preventDefault(); ev.stopPropagation();
      var url = b.getAttribute('data-att-url') || '';
      var nm  = b.getAttribute('data-att-name') || '';
      if (!window.confirm('Xoá file "' + (nm || url) + '" khỏi chứng từ này (và bên GBS)?')) return;
      var sp = new URLSearchParams(location.search);
      var ty = sp.get('type') || '';
      var dct = (ty === 'gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order';
      b.disabled = true; var _old = b.textContent; b.textContent = '\u2026';
      fetch('/api/method/gbs_remove_attachment', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': (window.frappe && frappe.csrf_token) || '' },
        body: JSON.stringify({ doctype: dct, name: (sp.get('id')||''), url: url, fname: nm })
      }).then(function(r){ return r.json(); }).then(function(j){
        var m = (j && j.message) || {};
        if (m.success) {
          var row = b.closest('.attach-row'); if (row && row.parentNode) row.parentNode.removeChild(row);
          try { if (typeof showToast === 'function') showToast('Đã xoá file' + (m.boxme_deleted ? ' (+ GBS)' : ''), 'success'); } catch(e){}
        } else { b.disabled = false; b.textContent = _old; alert('Xoá lỗi: ' + (m.error || 'không rõ')); }
      }).catch(function(e){ b.disabled = false; b.textContent = _old; alert('Lỗi kết nối: ' + e); });
    }, true);
  }

  // ---- D9 2026-08-02: khoi TAI CHINH cua MSO ----
  // Truoc: gom budget_lines theo `team` roi do vao 5 o cung cua mo hinh cu (MSO Request),
  // lam mat chieu category_group/fee_type/fee_percent va cong gop "chi phi hoat dong"
  // voi "phi agency EC" vao chung mot o. Gio doc thang budget_lines native.
  function msoBudgetLines(item) {
    var raw = item && (item.budget_lines || item.budget_lines_view);
    if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) { raw = null; } }
    return Array.isArray(raw) ? raw : [];
  }

  // 2026-08-04 (fb#2): nhan hien thi doi GMV -> NMV. FIELDNAME `forecast_gmv` GIU NGUYEN.
  // 2026-08-04 (fb#5): bo han loai phi '% GMV'. KAM go thang so tien, he thong khong
  // tinh amount tu phan tram nua, nen bang duoi khong con cot 'Cach tinh' / 'Ti le'.
  // Field fee_type / fee_percent van con tren DocType de 2 dong cu giu nguyen so da luu.
  function msoNmvLabel() { return 'NMV'; }
  function msoGmv(item) {
    var g = Number(val(item, 'forecast_gmv', 'total_est_revenue') || 0);
    if (isNaN(g) || g <= 0) return 0;
    return g;
  }

  function pctOfGmv(amount, gmv) {  // ti le tren NMV du kien
    if (!gmv) return '';
    var p = (Number(amount || 0) / gmv) * 100;
    if (isNaN(p) || !isFinite(p)) return '';
    return (Math.round(p * 10) / 10).toFixed(1).replace('.', ',') + '%';
  }

  function moneyWithPct(v, gmv) {
    var p = pctOfGmv(v, gmv);
    return p ? (fmtMoney(v) + '  ·  ' + p + ' NMV') : fmtMoney(v);
  }

  // Doi chieu tong tren chung tu voi tong cong dong chi tiet — lech thi canh bao,
  // de nguoi duyet khong duyet nham mot con so da cu.
  function msoTotalsWarning(item) {
    var lines = msoBudgetLines(item);
    if (lines.length === 0) return '';
    var sum = 0;
    lines.forEach(function (l) {
      var a = Number(l.amount || 0);
      if (!isNaN(a)) sum += a;
    });
    var op = Number(val(item, 'total_operating_budget') || 0);
    var fee = Number(val(item, 'total_ec_fee') || 0);
    if (isNaN(op)) op = 0;
    if (isNaN(fee)) fee = 0;
    if (Math.abs(sum - (op + fee)) < 1) return '';
    return '<div class="bl-warn"><strong>Cần kiểm tra:</strong> tổng các dòng chi tiết ('
      + escapeHtml(fmtMoney(sum)) + ') không khớp với tổng ghi trên chứng từ ('
      + escapeHtml(fmtMoney(op + fee)) + ').</div>';
  }

  // fb#4: bang tom tat tai chinh — cung khung .bl-table voi bang chi tiet ben duoi.
  function renderMsoFinanceTable(nmv, opBudget, ecFee) {
    var total = Number(opBudget || 0) + Number(ecFee || 0);
    function row(label, amount, klass) {
      return '<tr' + (klass ? ' class="' + klass + '"' : '') + '>'
        + '<td>' + escapeHtml(label) + '</td>'
        + '<td class="num">' + escapeHtml(fmtMoney(amount)) + '</td>'
        + '<td class="num bl-pct">' + escapeHtml(pctOfGmv(amount, nmv) || '—') + '</td>'
        + '</tr>';
    }
    var html = '<div class="bl-wrap"><table class="bl-table"><thead><tr>'
      + '<th>Khoản mục</th><th class="num">Số tiền (VND)</th><th class="num">% NMV</th>'
      + '</tr></thead><tbody>';
    html += '<tr class="bl-group"><td>Doanh thu bán hàng dự kiến (Target NMV)</td>'
      + '<td class="num">' + escapeHtml(fmtMoney(nmv)) + '</td>'
      + '<td class="num">100,0%</td></tr>';
    html += row('Tổng chi phí hoạt động', opBudget);
    html += row('Tổng phí agency EC', ecFee);
    html += '<tr class="bl-grand"><td>TỔNG NGÂN SÁCH</td>'
      + '<td class="num">' + escapeHtml(fmtMoney(total)) + '</td>'
      + '<td class="num">' + escapeHtml(pctOfGmv(total, nmv) || '—') + '</td></tr>';
    html += '</tbody></table></div>';
    if (!nmv) {
      html += '<div class="bl-foot">Chưa có Target NMV nên không tính được cột %.</div>';
    }
    return html;
  }

  function renderMsoBudgetTable(item) {
    var lines = msoBudgetLines(item);
    if (lines.length === 0) return '';
    var gmv = msoGmv(item);
    var ORDER = ['Chi phí hoạt động', 'Phí agency EC'];
    var groups = {};
    var seen = [];
    lines.forEach(function (l) {
      var g = String(l.category_group || 'Khác').trim() || 'Khác';
      if (!groups[g]) { groups[g] = []; seen.push(g); }
      groups[g].push(l);
    });
    var names = ORDER.filter(function (g) { return seen.indexOf(g) >= 0; })
      .concat(seen.filter(function (g) { return ORDER.indexOf(g) < 0; }));
    var grand = 0;
    var html = '<div class="bl-wrap"><table class="bl-table"><thead><tr>'

  function bindDecisionButtons(type, ticketId) {
    const btnA = document.getElementById('btnApprove');
    const btnR = document.getElementById('btnReject');
    if (!btnA || !btnR) return;
    btnA.addEventListener('click', () => makeDecision(type, ticketId, 'Approved'));
    btnR.addEventListener('click', () => makeDecision(type, ticketId, 'Rejected'));
  }

  async function makeDecision(type, ticketId, decision) {
    const approver = getSessionEmail();
    if (!approver) {
      const manual = prompt('Nhập email approver:');
      if (!manual || !manual.includes('@')) {
        showToast('Cần email approver hợp lệ', 'error');
        return;
      }
      submitDecision(type, ticketId, decision, manual);
      return;
    }
    submitDecision(type, ticketId, decision, approver);
  }

  async function submitDecision(type, ticketId, decision, approver, skipConfirm) {
    if (!skipConfirm && !confirm('Bạn xác nhận ' + (decision === 'Approved' ? 'DUYỆT' : 'TỪ CHỐI') + ' ticket ' + ticketId + '?')) return;
    const comment = (document.getElementById('approvalComment').value || '').trim();
    const btnA = document.getElementById('btnApprove');
    const btnR = document.getElementById('btnReject');
    btnA.disabled = true; btnR.disabled = true;
    try {
      const res = await fetch(ENDPOINTS.decision, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doctype: type, name: ticketId, decision: String(decision).toLowerCase(), approver_email: approver, caller_email: approver, comment })
      });
      // ec-friendly-error-v2: parse error body, show user-friendly Vietnamese toast
      if (!res.ok) {
        let errorMsg = 'L\u1ED7i kh\u00F4ng x\u00E1c \u0111\u1ECBnh';
        try {
          const txt = await res.text();
          console.error('[approval response]', txt); let errBody = JSON.parse(txt); if (errBody && typeof errBody.message === 'object' && errBody.message !== null) errBody = errBody.message;
          const code = (errBody.error || '').toLowerCase();
          const ERROR_MAP = {
            'not_authorized':       'B\u1EA1n ch\u01B0a ph\u1EA3i approver hi\u1EC7n t\u1EA1i \u2014 c\u1EA5p tr\u01B0\u1EDBc ph\u1EA3i approve tr\u01B0\u1EDBc',
            'already_decided':      'Ticket n\u00E0y \u0111\u00E3 \u0111\u01B0\u1EE3c quy\u1EBFt \u0111\u1ECBnh r\u1ED3i (' + (errBody.final_status || '?') + ')',
            'ticket_not_found':     'Kh\u00F4ng t\u00ECm th\u1EA5y ticket trong h\u1EC7 th\u1ED1ng',
            'invalid_decision':     'Quy\u1EBFt \u0111\u1ECBnh kh\u00F4ng h\u1EE3p l\u1EC7',
            'invalid_chain':        'Approval chain l\u1ED7i \u2014 li\u00EAn h\u1EC7 admin',
            'unauthorized':         'B\u1EA1n kh\u00F4ng c\u00F3 quy\u1EC1n th\u1EF1c hi\u1EC7n thao t\u00E1c n\u00E0y'
          };
          errorMsg = ERROR_MAP[code] || (errBody.message || ('L\u1ED7i: ' + (errBody.error || 'unknown')));
        } catch (e) {
          errorMsg = 'L\u1ED7i k\u1EBFt n\u1ED1i (HTTP ' + res.status + ')';
        }
        throw new Error(errorMsg);
      }
      const data = await res.json();
      if (!data.success) {
        const errCode = (data.error || '').toLowerCase();
        const errMap = {
          'not_authorized': 'Bạn không có quyền xử lý ticket này (phải đúng approver theo chain)',
          'already_decided': 'Ticket đã được quyết định rồi',
          'ticket_not_found': 'Không tìm thấy ticket',
          'invalid_decision': 'Quyết định không hợp lệ',
          'invalid_chain': 'Approval chain lỗi',
          'missing_params': 'Thiếu thông tin (doctype/name/decision)',
          'missing_caller': 'Thiếu thông tin người duyệt',
          'no_current_level_entry': 'Chain không có entry cho cấp hiện tại'
        };
        throw new Error(errMap[errCode] || data.error || 'Submit không thành công');
      }
      // AUTO-CASCADE: neu approve thanh cong va next level co cung email -> tu duyet tiep
      if (decision === 'Approved') {
        try {
          const detailRes = await fetch(ENDPOINTS.getDetail, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type, id: ticketId })
          });
          if (detailRes.ok) {
            const detailData = await detailRes.json();
            const detailItem = detailData.item || detailData.data;
            if (detailItem) {
              const finalStatus = ((detailItem.final_status || detailItem.status) || '').trim();
              if (finalStatus === 'Pending') {
                let chain = detailItem.approval_chain;
                if (typeof chain === 'string') {
                  try { chain = JSON.parse(chain); } catch(e) { chain = []; }
                }
                const curLvl = parseInt(detailItem.current_level || '1', 10);
                const nextEntry = (chain || []).find(c => (c.level || 0) === curLvl);
                if (nextEntry && (nextEntry.approver || '').toLowerCase() === (approver || '').toLowerCase()) {
                  showToast('Auto-approve level ' + curLvl + ' (cung email)', 'success');
                  return submitDecision(type, ticketId, 'Approved', approver, true);
                }
              }
            }
          }
        } catch (e) { console.warn('cascade check failed:', e); }
      }
      showToast('✓ Đã ' + (decision === 'Approved' ? 'duyệt' : 'từ chối') + ' ticket ' + ticketId, 'success');
      setTimeout(() => loadTicket(type, ticketId), 1200);
    } catch (err) {
      console.error(err);
      showToast(err.message, 'error');
      btnA.disabled = false; btnR.disabled = false;
    }
  }

  async function loadBatchItems(batchId) {
    try {
      const res = await fetch(ENDPOINTS.lookup, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'so' })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Lookup failed');
      return (data.items || []).filter(it => (val(it, 'so_batch_id') || '') === batchId)
        .sort((a, b) => (Number(val(a, 'line_index')) || 0) - (Number(val(b, 'line_index')) || 0));
    } catch (err) {
      console.error('loadBatchItems error:', err);
      return null;
    }
  }

  async function submitBatchDecisions(batchId, batchItems, mode) {
    const decisions = [];
    batchItems.forEach(it => {
      const itemSoId = val(it, 'id', 'so_id');
      const itemStatus = (val(it, 'final_status', 'status') || 'Pending').trim().toLowerCase();
      if (itemStatus !== 'pending') return;
      let decision;
      let comment = '';
      if (mode === 'reject_all') {
        decision = 'Rejected';
      } else if (mode === 'approve_all') {
        decision = 'Approved';
      } else {
        const cb = document.querySelector('.item-check[data-so-id="' + itemSoId + '"]');
        if (!cb || !cb.checked) return;
        decision = 'Approved';
        const ct = document.querySelector('.item-comment[data-so-id="' + itemSoId + '"]');
        comment = ct ? ct.value.trim() : '';
      }
      if (mode !== 'selected') {
        const ct = document.querySelector('.item-comment[data-so-id="' + itemSoId + '"]');
        comment = ct ? ct.value.trim() : '';
      }
      decisions.push({ so_id: itemSoId, decision: decision, comment: comment });
    });

    if (decisions.length === 0) {
      showToast(mode === 'selected' ? 'Chưa tick item nào để approve' : 'Không có item nào pending để xử lý', 'error');
      return;
    }

    const approver = getSessionEmail();
    if (!approver) {
      showToast('Chưa login Frappe — không xác định được approver', 'error');
      return;
    }

    const btnSelected = document.getElementById('btnApproveSelected');
    const btnAll = document.getElementById('btnApproveAll');
    const btnRejectAll = document.getElementById('btnRejectAll');
    [btnSelected, btnAll, btnRejectAll].forEach(b => { if (b) { b.disabled = true; b.style.opacity = '.5'; } });

    try {
      const res = await fetch(ENDPOINTS.decision, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'so',
          ticket_type: 'so',
          so_batch_id: batchId,
          decisions: decisions,
          decided_by: approver,
          level: 1
        })
      });
      // ec-friendly-error-v2: parse error body, show user-friendly Vietnamese toast
      if (!res.ok) {
        let errorMsg = 'L\u1ED7i kh\u00F4ng x\u00E1c \u0111\u1ECBnh';
        try {
          const txt = await res.text();
          console.error('[approval response]', txt); let errBody = JSON.parse(txt); if (errBody && typeof errBody.message === 'object' && errBody.message !== null) errBody = errBody.message;
          const code = (errBody.error || '').toLowerCase();
          const ERROR_MAP = {
            'not_authorized':       'B\u1EA1n ch\u01B0a ph\u1EA3i approver hi\u1EC7n t\u1EA1i \u2014 c\u1EA5p tr\u01B0\u1EDBc ph\u1EA3i approve tr\u01B0\u1EDBc',
            'already_decided':      'Ticket n\u00E0y \u0111\u00E3 \u0111\u01B0\u1EE3c quy\u1EBFt \u0111\u1ECBnh r\u1ED3i (' + (errBody.final_status || '?') + ')',
            'ticket_not_found':     'Kh\u00F4ng t\u00ECm th\u1EA5y ticket trong h\u1EC7 th\u1ED1ng',
            'invalid_decision':     'Quy\u1EBFt \u0111\u1ECBnh kh\u00F4ng h\u1EE3p l\u1EC7',
            'invalid_chain':        'Approval chain l\u1ED7i \u2014 li\u00EAn h\u1EC7 admin',
            'unauthorized':         'B\u1EA1n kh\u00F4ng c\u00F3 quy\u1EC1n th\u1EF1c hi\u1EC7n thao t\u00E1c n\u00E0y'
          };
          errorMsg = ERROR_MAP[code] || (errBody.message || ('L\u1ED7i: ' + (errBody.error || 'unknown')));
        } catch (e) {
          errorMsg = 'L\u1ED7i k\u1EBFt n\u1ED1i (HTTP ' + res.status + ')';
        }
        throw new Error(errorMsg);
      }
      const data = await res.json();
      if (!data.success) {
        const errCode = (data.error || '').toLowerCase();
        const errMap = {
          'not_authorized': 'Bạn không có quyền xử lý ticket này (phải đúng approver theo chain)',
          'already_decided': 'Ticket đã được quyết định rồi',
          'ticket_not_found': 'Không tìm thấy ticket',
          'invalid_decision': 'Quyết định không hợp lệ',
          'invalid_chain': 'Approval chain lỗi',
          'missing_params': 'Thiếu thông tin (doctype/name/decision)',
          'missing_caller': 'Thiếu thông tin người duyệt',
          'no_current_level_entry': 'Chain không có entry cho cấp hiện tại'
        };
        throw new Error(errMap[errCode] || data.error || 'Submit không thành công');
      }
      const approvedN = decisions.filter(d => d.decision === 'Approved').length;
      const rejectedN = decisions.filter(d => d.decision === 'Rejected').length;
      showToast('✓ Batch processed: ' + approvedN + ' approved, ' + rejectedN + ' rejected', 'success');
      setTimeout(() => loadTicket('so', val(batchItems[0], 'id', 'so_id')), 1500);
    } catch (err) {
      console.error(err);
      showToast(err.message, 'error');
      [btnSelected, btnAll, btnRejectAll].forEach(b => { if (b) { b.disabled = false; b.style.opacity = '1'; } });
    }
  }

  async function loadTicket(type, ticketId) {

        const txt = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + txt);
      }
      const data = await res.json();
      // Frappe wraps response in `message`
      const payload = (data && data.message) || data || {};
      if (!payload.success) throw new Error(payload.error || data.exception || 'Load failed');

  // ============== LIST VIEW ==============
  const SLA_DAYS = { mso: 7, so: 5, po: 5, gbs_po: 7, gbs_so: 5 };
  const TYPE_LABELS_FULL = { mso: 'MSO', so: 'SO', po: 'PO', gbs_po: 'GBS PO', gbs_so: 'GBS SO' };
  // EC-GBS-FIN-v1: extended ListState.filter with gbsPhase + mine
  const ListState = { allTickets: [], filter: { type: 'all', status: '', dept: '', search: '', dateFrom: '', dateTo: '', card: '', gbsPhase: '', mine: false } };

  async function fetchAllTypes() {
    const types = ['mso', 'so', 'po', 'gbs_po', 'gbs_so'];
    const promises = types.map(t =>
      fetch(ENDPOINTS.lookup, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: t }) })
        .then(r => r.json()).catch(() => ({ items: [] }))
    );
    const results = await Promise.all(promises);
    const tickets = [];
    results.forEach((res, i) => {
      if (res && res.items) {
        res.items.forEach(item => { item._type = types[i]; tickets.push(item); });
      }
    });
    return tickets;
  }

  function computeListTimeline(ticket) {
    const status = (val(ticket, 'final_status', 'status') || 'Pending').trim();
    if (status === 'Approved' || status === 'Rejected') return null;
    const created = val(ticket, 'created_at', 'Created');
    if (!created) return 'ontime';
    const slaMs = (SLA_DAYS[ticket._type] || 5) * 86400000;
    const elapsed = Date.now() - new Date(created).getTime();
    const remaining = slaMs - elapsed;
    if (remaining < 0) return 'late';
    if (remaining < 2 * 86400000) return 'risk';
    return 'ontime';
  }

  // EC-GBS-FIN-v1: GBS-side phase tracking (Phase 2 after local Approved)
  function computeGbsListTimeline(ticket) {
    const status = (val(ticket, 'final_status', 'status') || '').trim();
    if (status !== 'Approved') return null;
    const gs = (val(ticket, 'gbs_status') || '').toLowerCase();
    if (!gs || gs === 'approved' || gs === 'completed' || gs === 'rejected' || gs === 'cancelled') return null;
    if (gs.indexOf('pending') < 0 && gs.indexOf('draft') < 0) return null;
    // EC-GBS-FIN-v1-creation: use immutable created timestamp; modified is touched by poll task every 15min
    const ref = val(ticket, 'created_at', 'Created') || val(ticket, 'modified');
    if (!ref) return 'gbs_pending';
    const refDate = new Date(ref);
    if (isNaN(refDate)) return 'gbs_pending';
    return (Date.now() - refDate.getTime()) > 86400000 ? 'gbs_overdue' : 'gbs_pending';
  }

    try {
      const tickets = await fetchAllTypes();
      tickets.forEach(t => { t._timeline = computeListTimeline(t); t._gbsTimeline = computeGbsListTimeline(t); }); // EC-GBS-FIN-v1
      ListState.allTickets = tickets;
      renderList();
    } catch (err) {
      console.error(err);
      document.getElementById('content').innerHTML = '<div class="state error-state"><p><b>Lỗi load tickets</b></p><p>' + escapeHtml(err.message) + '</p></div>';

  function getFilteredList() {
    const f = ListState.filter;
    // EC-GBS-FIN-v1: GBS card filters
    const cardFilters = {
      pending: t => (val(t, 'final_status', 'status') || '').trim() === 'Pending',
      approved: t => (val(t, 'final_status', 'status') || '').trim() === 'Approved',
      late: t => t._timeline === 'late',
      gbs_pending: t => t._gbsTimeline === 'gbs_pending' || t._gbsTimeline === 'gbs_overdue',
      gbs_overdue: t => t._gbsTimeline === 'gbs_overdue'
    };
    return ListState.allTickets.filter(t => {
      // EC-GBS-FIN-v1: My Approval filter
      if (f.mine) {
        const me = ((window.frappe && window.frappe.session && (window.frappe.session.user_email || window.frappe.session.user)) || '').toLowerCase();
        const sb = (val(t, 'submitted_by', 'created_by', 'requestor', 'requested_by') || '').toLowerCase();
        if (!me || sb !== me) return false;
      }
      // EC-GBS-FIN-v1: GBS phase dropdown filter
      if (f.gbsPhase === 'gbs_overdue' && t._gbsTimeline !== 'gbs_overdue') return false;
      if (f.gbsPhase === 'gbs_pending' && t._gbsTimeline !== 'gbs_pending' && t._gbsTimeline !== 'gbs_overdue') return false;
      if (f.card && cardFilters[f.card] && !cardFilters[f.card](t)) return false;
      if (f.type !== 'all' && t._type !== f.type) return false;
      if (f.status && (val(t, 'final_status', 'status') || '').trim() !== f.status) return false;
      if (f.dept && val(t, 'department') !== f.dept) return false;
      if (f.search) {
        const s = f.search.toLowerCase();
        const hay = ((val(t, 'id') || '') + ' ' + (val(t, 'Title', 'title') || '') + ' ' + (val(t, 'department') || '')).toLowerCase();
        if (!hay.includes(s)) return false;
      }
      if (f.dateFrom || f.dateTo) {
        const created = val(t, 'created_at', 'Created');
        if (!created) return false;
        const cd = new Date(created);
        if (f.dateFrom && cd < new Date(f.dateFrom)) return false;
        if (f.dateTo && cd > new Date(f.dateTo + 'T23:59:59')) return false;
      }
      return true;
    });
  }

  function renderListBody(tickets) {
    if (tickets.length === 0) return '<tr><td colspan="8" class="list-empty">Không có ticket nào match filter</td></tr>';
    const sorted = [...tickets].sort((a, b) => {
      const da = new Date(val(a, 'created_at', 'Created') || 0);
      const db = new Date(val(b, 'created_at', 'Created') || 0);
      return db - da;
    });
    return sorted.map(t => {
      const id = val(t, 'id') || '';
      const title = val(t, 'Title', 'title') || '—';
      const dept = val(t, 'department') || '—';
      const status = (val(t, 'final_status', 'status') || 'Pending').trim();
      const created = val(t, 'created_at', 'Created');

})();

<script id="ec-listcols-fix">
(function(){
  // Patch fetch on lookup endpoint to normalize ticket items.
  // PA may return SP raw fields like Created, Author (object with EMail/Title) — JS expects
  // created_at, submitted_by. Add fallbacks here.
  if (window._ecListColsFixed) return;
  window._ecListColsFixed = true;

  var origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var p = origFetch(input, init);
    if (!/lookup|3d602b4b38644fec9b3b66ff3bf028a8/.test(url)) return p;
    return p.then(function(res){
      var cloned = res.clone();
      return cloned.json().then(function(data){
        try {
          if (data && Array.isArray(data.items) && data.items.length > 0) {
            // Debug: log first item shape once
            if (!window._ecLogged) {
              window._ecLogged = true;
              try { console.log('[ec-listcols] sample item:', data.items[0]); } catch(_) {}
            }
            data.items.forEach(function(item){
              // ----- created_at normalization -----
              if (!item.created_at && !item.Created) {
                item.created_at = item.creation || item.created || item.CreatedDate || item['Created Date'] || item.created_on || '';
              } else if (!item.created_at && item.Created) {
                item.created_at = item.Created;
              }
              // ----- submitted_by normalization -----
              if (!item.submitted_by) {
                var sb = '';
                // SP Author/Editor fields are objects {Title, EMail, ...} OR strings
                if (item.Author && typeof item.Author === 'object') {
                  sb = item.Author.EMail || item.Author.Email || item.Author.Title || '';
                } else if (typeof item.Author === 'string') {
                  sb = item.Author;
                }
                if (!sb) {
                  sb = item.created_by || item['Created By'] || item.owner || item.Owner ||
                       item.requestor || item.requested_by || item.user_email || item.email || '';
                }
                if (sb) item.submitted_by = sb;
              }
            });
          }
        } catch(e) { try { console.warn('[ec-listcols] normalize err', e); } catch(_) {} }
        return new Response(JSON.stringify(data), {
          status: res.status, statusText: res.statusText, headers: res.headers
        });
      }).catch(function(){ return res; });
    });
  };
  try { console.log('[ec-listcols] fetch patched'); } catch(_) {}
})();
</script>

<script id="ec-userinfo-fix">
(function(){
  function getCookie(name){
    var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]+)'));
    return m ? decodeURIComponent(m[1]).replace(/\+/g, ' ') : '';
  }
  function getEmail(){
    try {
      if (window.frappe && window.frappe.session) {
        var u = window.frappe.session.user_email || window.frappe.session.user || '';
        if (u && u !== 'Guest') return u;
      }
    } catch(_) {}
    var c = getCookie('user_id');
    if (c && c !== 'Guest') return c;
    return '';
  }
  function getFullName(email){
    // Frappe sets 'full_name' cookie on login (URL-encoded, + for space)
    var fn = getCookie('full_name');
    if (fn) return fn;
    // Fallback: derive from email
    if (!email) return '';
    var localPart = email.indexOf('@') >= 0 ? email.split('@')[0] : email;
    var firstName = localPart.split(/[._\- ]+/)[0] || localPart;
    return firstName.charAt(0).toUpperCase() + firstName.slice(1).toLowerCase();
  }
  function fillUser(){
    var email = getEmail();
    if (!email) return;
    var displayName = getFullName(email);
    if (!displayName) return;
    // Initial for avatar: first char of full name
    var initial = displayName.trim().charAt(0).toUpperCase() || 'U';

    // Update name labels (always overwrite \u2014 sync from Frappe is source of truth)
    var nameEls = document.querySelectorAll('#ecUserName, .ec-sb-user-name, .sidebar-user-name, .user-name');
    nameEls.forEach(function(el){ el.textContent = displayName; });
    // Update avatars
    var avEls = document.querySelectorAll('#ecAvatar, .ec-sb-avatar, .sidebar-user .avatar, .user-card .avatar, .avatar');
    avEls.forEach(function(el){
      var t = (el.textContent || '').trim();
      if (!t || t.length === 1) {
        el.textContent = initial;
      }
    });

    // Make user-card clickable -> Frappe user profile
    var profileUrl = '/app/user/' + encodeURIComponent(email);
    // \u1EDF = \u1EDF, \u0111 = \u0111, \u01B0 = \u01B0, \u1EDD = \u1EDD, \u00ED = \u00ED, \u00F3 = \u00F3, \u00E0 = \u00E0
    var tooltipText = 'M\u1EDF trang user trong Frappe';
    var cards = document.querySelectorAll('.ec-sb-footer .ec-sb-user-card, .ec-sb-user-card, .sidebar-footer .user-card, .sidebar-footer .sidebar-user');
    cards.forEach(function(el){
      if (el.tagName === 'A' || el.dataset.ecProfileWrapped === '1') return;
      if (el.parentElement && el.parentElement.tagName === 'A' && el.parentElement.href.indexOf('/app/user') >= 0) return;
      el.title = tooltipText;
      el.addEventListener('click', function(e){
        if (e.target.closest('.ec-sb-logout, .logout-btn, button')) return;
        location.href = profileUrl;
      });
      el.setAttribute('data-ec-profile-wrapped', '1');
    });
  }
  function init(){
    fillUser();
    setTimeout(fillUser, 250);
    setTimeout(fillUser, 800);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

  function chainContainsEmail(chainRaw, email) {
    if (!chainRaw || !email) return false;
    try {
      var chain = typeof chainRaw === 'string' ? JSON.parse(chainRaw) : chainRaw;

      var emailLow = email.toLowerCase();
      // C4b B1/B2 2026-08-03: mot cap co the nhieu nguoi duyet (SO/PO lay theo

  function waitForValidPerm(attempt) {

          return waitForValidPerm(attempt + 1);

        try { if (hasBody && typeof options.body === 'string') bodyType = JSON.parse(options.body).type; } catch(_){}
        var inTicketTypes = bodyType ? TICKET_TYPES.indexOf(bodyType) >= 0 : false;
        console.log('[ec-perm-DBG] urlStart=' + url.substring(0, 50) + ' | matchPrefix=' + matchPrefix + ' | hasBody=' + hasBody + ' | bodyType=' + bodyType + ' | inTypes=' + inTicketTypes);
      }
    } catch(_){}
    // Lookup_Parents (list view) \u2014 filter ticket types
    if (typeof url === 'string' && url.indexOf(LOOKUP_URL_PREFIX) === 0 && options && options.body) {
      try {
        var lBody = JSON.parse(options.body);
        if (lBody && lBody.type && TICKET_TYPES.indexOf(lBody.type) >= 0) {
          return waitForValidPerm().then(function(){
            return _origFetch(url, options).then(function(resp){
              if (!resp.ok) return resp;
              return resp.clone().json().then(function(data){
                try {
                  if (data && Array.isArray(data.items)) {
                    var before = data.items.length;
                    data.items = filterListByPermission(data.items, lBody.type);
                    console.log('[ec-perm] list filter type=' + lBody.type + ' ' + before + ' -> ' + data.items.length);
                  }
                  return new Response(JSON.stringify(data), {
                    status: 200,
                    headers: {'Content-Type': 'application/json'}
                  });
                } catch(e) {
                  console.error('[ec-perm] list filter error, denying:', e);
                  return new Response(JSON.stringify({ success: true, items: [] }), {
                    status: 200, headers: {'Content-Type': 'application/json'}
                  });
                }
              }).catch(function(e){
                console.error('[ec-perm] list parse error, denying:', e);
                return new Response(JSON.stringify({ success: true, items: [] }), {
                  status: 200, headers: {'Content-Type': 'application/json'}
                });
              });
            });
          });
        }
      } catch(_){}
    }
    // Get_Ticket_Detail_Flow \u2014 restrict ticket detail
    if (typeof url === 'string' && url.indexOf(DETAIL_URL_PREFIX) === 0 && options && options.body) {
      try {
        var body = JSON.parse(options.body);
        if (body && body.ticket_id && body.type) {
          return waitForValidPerm().then(function(perm){
            return _origFetch(url, options).then(function(resp){
              if (!resp.ok) return resp;
              return resp.clone().json().then(function(data){
                try {
                  var canView = computeCanViewFull(data.item || {}, body.type, perm, _userEmail);
                  console.log('[ec-perm] detail ' + body.ticket_id + ' canViewFull=' + canView);
                  window._ecApprovalRestricted = !canView;
                  if (!canView) {
                    data = stripSensitive(data);
                    setTimeout(showRestrictedBanner, 300);
                    setTimeout(showRestrictedBanner, 1200);
                  } else {
                    hideRestrictedBanner();
                  }
                  return new Response(JSON.stringify(data), {
                    status: 200,
                    headers: {'Content-Type': 'application/json'}
                  });
                } catch(filterErr) {
                  console.error('[ec-perm] detail filter error, denying:', filterErr);
                  return new Response(JSON.stringify({ success: false, error: 'Permission check failed' }), {
                    status: 403,
                    headers: {'Content-Type': 'application/json'}
                  });
                }
              }).catch(function(jsonErr){
                console.error('[ec-perm] parse error, denying:', jsonErr);
                return new Response(JSON.stringify({ success: false, error: 'Response parse failed' }), {
                  status: 500,
                  headers: {'Content-Type': 'application/json'}
                });
              });
            });
          });
        }
      } catch(_){}
    }
    return _origFetch(url, options);
  }
  _ecPermFetch[EC_PERM_MARK] = true;

  function applyFetchPatch() {
    if (window.fetch && window.fetch[EC_PERM_MARK]) return; // already mine
    _origFetch = window.fetch.bind(window);
    window.fetch = _ecPermFetch;
    try { console.log('[ec-perm] fetch re-patched'); } catch(_){}
  }
  applyFetchPatch();
  setTimeout(applyFetchPatch, 100);
  setTimeout(applyFetchPatch, 500);
  setTimeout(applyFetchPatch, 1500);
  setTimeout(applyFetchPatch, 3000);
  setTimeout(applyFetchPatch, 6000);
  if (document.readyState !== 'complete') {
    window.addEventListener('load', applyFetchPatch);
    document.addEventListener('DOMContentLoaded', applyFetchPatch);
  }

  waitForFrappeAndInit();
})();
</script>

(function(){
