    var wrapper = document.createElement('div');
    wrapper.style.cssText = 'max-width:900px;margin:24px auto;padding:0 24px;';
    wrapper.innerHTML = '<div style="background:white;border:1px solid #e5e7eb;border-radius:12px;padding:24px 28px;box-shadow:0 1px 3px rgba(15,23,42,0.06);"><h1 style="margin:0 0 4px 0;font-size:22px;font-weight:700;color:#1f2937;">Contract Approval</h1><p style="margin:0 0 18px 0;color:#6b7280;font-size:13px;">ID: <code style="color:#2C3DA6;font-weight:600;">' + contractId + '</code></p><div id="contractLoading" style="color:#6b7280;">Loading...</div><div id="contractDetail" style="display:none;"></div><div id="contractActions" style="display:none;margin-top:24px;padding-top:18px;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;gap:10px;"></div></div>';

    // Remove existing content children except sidebar/header
    Array.from(mainContent.children).forEach(function(c){
      if (!c.classList.contains('ec-tb') && c.id !== 'ec-shell') c.remove();
    });
    mainContent.appendChild(wrapper);

    fetch('/api/method/web_lookup', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'contract', id: contractId})})
      .then(function(r){return r.json();}).then(function(d){
        var resp = (d && d.success !== undefined) ? d : (d && d.message);
        if (!resp || !resp.success) {
          document.getElementById('contractLoading').textContent = 'Contract not found';
          return;
        }
        var c = resp.data;
        document.getElementById('contractLoading').style.display = 'none';
        var detail = document.getElementById('contractDetail');
        detail.style.display = 'block';
        var statusColor = c.workflow_status === 'Approved' || c.workflow_status === 'Active' ? '#166534' : (c.workflow_status === 'Pending' ? '#92400e' : '#dc2626');
        var statusBg = c.workflow_status === 'Approved' || c.workflow_status === 'Active' ? '#dcfce7' : (c.workflow_status === 'Pending' ? '#fef3c7' : '#fee2e2');
        detail.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;"><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Title</div><div style="font-size:14px;font-weight:600;color:#1f2937;margin-top:4px;">' + (c.contract_title || '-') + '</div></div><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Status</div><div style="margin-top:4px;"><span style="background:' + statusBg + ';color:' + statusColor + ';padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:600;">' + c.workflow_status + '</span></div></div><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Vendor</div><div style="margin-top:4px;color:#1f2937;">' + (c.party_name || '-') + '</div></div><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Total Value</div><div style="margin-top:4px;color:#1f2937;font-weight:600;">' + (parseFloat(c.total_value||0)).toLocaleString('vi-VN') + ' VND</div></div><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Start &mdash; End</div><div style="margin-top:4px;color:#1f2937;">' + (c.start_date || '-') + ' &rarr; ' + (c.end_date || '-') + '</div></div><div><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Procurement Type</div><div style="margin-top:4px;color:#1f2937;">' + (c.procurement_type || '-') + '</div></div></div><div style="margin-bottom:14px;"><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Scope</div><div style="margin-top:4px;color:#1f2937;white-space:pre-wrap;">' + (c.scope || '-') + '</div></div><div style="margin-bottom:14px;"><div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:600;">Deliverables</div><div style="margin-top:4px;color:#1f2937;white-space:pre-wrap;">' + (c.deliverables || '-') + '</div></div>' + (c.attached_pdf ? '<div><a href="' + c.attached_pdf + '" target="_blank" style="color:#2C3DA6;font-weight:600;">View Attached PDF</a></div>' : '');

        if (c.workflow_status === 'Pending') {
          var actions = document.getElementById('contractActions');
          actions.style.display = 'flex';
          actions.innerHTML = '<button onclick="rejectContract()" style="padding:10px 20px;background:white;border:1px solid #dc2626;color:#dc2626;border-radius:8px;font-weight:600;cursor:pointer;">Reject</button><button onclick="approveContract()" style="padding:10px 20px;background:#10b981;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Approve</button>';
        }
      });

    window.approveContract = function(){
      if (!confirm('Approve contract ' + contractId + '?')) return;
      fetch('/api/method/approve_contract', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contract_id: contractId, decision:'approve'})})
        .then(function(r){return r.json();}).then(function(d){
          var resp = (d&&d.success!==undefined)?d:(d&&d.message);
          if (resp && resp.success) { alert('Approved'); window.location.reload(); }
          else alert('Error: ' + (resp&&resp.error?resp.error:'Unknown'));
        });
    };
    window.rejectContract = function(){
      var reason = prompt('Reason for rejection:');
      if (!reason) return;
      fetch('/api/method/approve_contract', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contract_id: contractId, decision:'reject', reason:reason})})
        .then(function(r){return r.json();}).then(function(d){
          var resp = (d&&d.success!==undefined)?d:(d&&d.message);
          if (resp && resp.success) { alert('Rejected'); window.location.reload(); }
          else alert('Error: ' + (resp&&resp.error?resp.error:'Unknown'));
        });
    };
  }
})();
</script>







<script>
/* gbs_wrapper_v6 - debug-friendly fill panel + try multiple methods */
(function(){
  'use strict';

  function _esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function _val(item) {
    if (!item) return '';
    for (var i = 1; i < arguments.length; i++) {
      var v = item[arguments[i]];
      if (v !== null && v !== undefined && v !== '') return v;
    }
    return '';
  }
  function _fmtVnd(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' VND'; }

  function _section(title, rows) {
    var html = '<div style="margin-bottom:20px"><div style="font-size:11px;font-weight:700;color:#2C3DA6;text-transform:uppercase;letter-spacing:0.6px;border-left:3px solid #2C3DA6;padding:2px 0 2px 10px;margin-bottom:12px">' + _esc(title) + '</div>';
    rows.forEach(function(r) {
      html += '<div style="display:grid;grid-template-columns:180px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid #f3f4f6">';
      html += '<div style="color:#6b7280;font-size:12.5px">' + _esc(r[0]) + '</div>';
      html += '<div style="font-size:13px;color:#111827">' + _esc(r[1] || '-') + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function _itemsTable(items) {
    var html = '<div style="margin-bottom:20px"><div style="font-size:11px;font-weight:700;color:#2C3DA6;text-transform:uppercase;letter-spacing:0.6px;border-left:3px solid #2C3DA6;padding:2px 0 2px 10px;margin-bottom:12px">Items (' + items.length + ')</div>';
    html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">';
    html += '<thead><tr style="background:#f9fafb">';
    ['Item Code','Item Name','Qty','Rate','Amount','Warehouse'].forEach(function(h, i) {
      var align = (i >= 2 && i <= 4) ? 'right' : 'left';
      html += '<th style="text-align:' + align + ';padding:8px 10px;font-weight:600;color:#6b7280;text-transform:uppercase;font-size:11px;letter-spacing:0.4px">' + h + '</th>';
    });
    html += '</tr></thead><tbody>';
    items.forEach(function(it) {
      html += '<tr style="border-top:1px solid #e5e7eb">';
      html += '<td style="padding:8px 10px;font-family:monospace;font-size:12px">' + _esc(it.item_code || '') + '</td>';
      html += '<td style="padding:8px 10px">' + _esc(it.item_name || '') + '</td>';
      html += '<td style="padding:8px 10px;text-align:right">' + (it.qty || 0) + '</td>';
      html += '<td style="padding:8px 10px;text-align:right">' + (Number(it.rate) || 0).toLocaleString('vi-VN') + '</td>';
      html += '<td style="padding:8px 10px;text-align:right;font-weight:600">' + (Number(it.amount) || 0).toLocaleString('vi-VN') + '</td>';
      html += '<td style="padding:8px 10px">' + _esc(it.warehouse || '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    return html;
  }

  function _buildBody(item, type) {
    var isPo = (type === 'gbs_po');
    var general = [
      ['Title', _val(item, isPo ? 'po_title' : 'so_title', 'title')],
      ['Department', _val(item, 'department')],
      ['Brand', _val(item, 'brand_name') || _val(item, 'brand_code')],
      ['Submitter', _val(item, 'submitted_by')],
    ];
    if (isPo) general.push(['Supplier', (_val(item, 'supplier_name') || '') + (_val(item, 'supplier') ? ' (' + _val(item, 'supplier') + ')' : '')]);
    else { general.push(['Customer', _val(item, 'customer')]); general.push(['Default Warehouse', _val(item, 'set_warehouse')]); }
    general.push(['Transaction Date', _val(item, 'transaction_date')]);
    general.push([isPo ? 'Schedule Date' : 'Delivery Date', _val(item, isPo ? 'schedule_date' : 'delivery_date')]);
    general.push(['Currency', _val(item, 'currency')]);
    general.push(['Grand Total', _fmtVnd(_val(item, 'grand_total'))]);
    general.push(['Notes', _val(item, 'notes')]);

    var sync = [
      ['GBS Doc Name', _val(item, 'gbs_doc_name') || '-- chua sync --'],
      ['GBS Status', _val(item, 'gbs_status') || '-'],
      ['GBS Grand Total', _val(item, 'gbs_grand_total') ? _fmtVnd(_val(item, 'gbs_grand_total')) : '-'],
      ['Last Sync', _val(item, 'gbs_last_sync') || '-'],
      ['Sync Attempts', _val(item, 'sync_attempts') || 0],
      ['Sync Error', _val(item, 'sync_error') || '-'],
    ];

    var html = _section('Thong tin chung', general);
    var items = item.items || [];
    if (items.length) html += _itemsTable(items);

    html += '<div style="margin-bottom:20px">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
    html += '<div style="font-size:11px;font-weight:700;color:#2C3DA6;text-transform:uppercase;letter-spacing:0.6px;border-left:3px solid #2C3DA6;padding:2px 0 2px 10px;flex:1">GBS Sync</div>';
    html += '<button id="gbsCheckBtn" type="button" style="background:#8B5CF6;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-right:8px">Check Status</button>';
    // Submit button - only show if gbs_doc_name exists AND gbs_status is Draft (not yet submitted)
    var gbsName = _val(item, 'gbs_doc_name');
    var gbsStat = (_val(item, 'gbs_status') || '').toLowerCase();
    var canSubmit = gbsName && (gbsStat === 'draft' || gbsStat === '' || gbsStat === 'pending');
    if (canSubmit) {
      html += '<button id="gbsSubmitBtn" type="button" style="background:#10b981;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Submit on GBS</button>';
    }
    html += '</div>';
    sync.forEach(function(r) {
      html += '<div style="display:grid;grid-template-columns:180px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid #f3f4f6">';
      html += '<div style="color:#6b7280;font-size:12.5px">' + _esc(r[0]) + '</div>';
      html += '<div style="font-size:13px;color:#111827">' + _esc(r[1] || '-') + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  var TAG = '[gbs_v6]';

  function _tryFetch(id, type) {
    // Try multiple methods - POST JSON, then POST form, then GET
    var url = '/api/method/ecentric_workspace.api.get_ticket_detail';
    var attempts = [
      {
        label: 'POST JSON',
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
        body: JSON.stringify({name: id, type: type})
      },
      {
        label: 'POST form',
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest'},
        body: 'name=' + encodeURIComponent(id) + '&type=' + encodeURIComponent(type)
      },
      {
        label: 'GET',
        method: 'GET',
        headers: {'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
        url: url + '?name=' + encodeURIComponent(id) + '&type=' + encodeURIComponent(type)
      }
    ];
    var idx = 0;
    function next() {
      if (idx >= attempts.length) {
        return Promise.reject(new Error('All fetch attempts failed'));
      }
      var a = attempts[idx++];
      console.log(TAG, 'try', a.label);
      var opts = {method: a.method, credentials: 'include', headers: a.headers};
      if (a.body) opts.body = a.body;
      return fetch(a.url || url, opts)
        .then(function(r) {
          console.log(TAG, a.label, 'status', r.status);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(t) {
          console.log(TAG, a.label, 'raw len', t.length, 'preview', t.substring(0, 200));
          var d;
          try { d = JSON.parse(t); } catch(e) { throw new Error('JSON parse fail: ' + e.message); }
          var msg = (d && d.message) || {};
          if (msg.success) return {data: msg, raw: t};
          // Not success - try next method
          console.log(TAG, a.label, 'no success, msg:', JSON.stringify(msg).substring(0, 200));
          return next();
        })
        .catch(function(e) {
          console.log(TAG, a.label, 'err', e.message);
          return next();
        });
    }
    return next();
  }

  function _fill(id, type) {
    var content = document.getElementById('content');
    if (!content) return false;
    var panels = content.querySelectorAll('.panel');
    if (panels.length === 0) return false;
    var detailPanel = panels[0];
    var body = detailPanel.querySelector('.panel-body');
    if (!body) return false;
    if (body.querySelector('[data-gbs-filled]')) return true;

    body.innerHTML = '<div data-gbs-filled="1" style="padding:6px 0;color:#6b7280">Loading GBS detail...</div>';

    _tryFetch(id, type).then(function(res) {
      var item = res.data.item || res.data.data || {};
      body.innerHTML = '<div data-gbs-filled="1">' + _buildBody(item, type) + '</div>';

      var checkBtn = document.getElementById('gbsCheckBtn');
      if (checkBtn) {
        checkBtn.addEventListener('click', function() {
          var orig = checkBtn.innerHTML;
          checkBtn.disabled = true; checkBtn.innerHTML = 'Checking...';
          fetch('/api/method/manual_poll_gbs_status', {
            method: 'POST', credentials: 'include',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({doctype: (type==='gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order', name: id})
          }).then(function(r){return r.json();}).then(function(d2) {
            var m = (d2 && d2.message) || {};
            if (m.success) { alert('GBS Status: ' + (m.gbs_status || '-')); location.reload(); }
            else alert('Loi: ' + (m.error || 'unknown'));
          }).catch(function(e){alert('Loi: ' + e.message);}).finally(function(){checkBtn.disabled = false; checkBtn.innerHTML = orig;});
        });
      }

      // Submit on GBS button handler
      var submitBtn = document.getElementById('gbsSubmitBtn');
      if (submitBtn) {
        submitBtn.addEventListener('click', function() {
          if (!confirm('Bạn chắc chắn muốn submit doc này trên GBS?\n(Chuyển từ Draft → Submitted, không thể undo)')) return;
          var origS = submitBtn.innerHTML;
          submitBtn.disabled = true; submitBtn.innerHTML = 'Đang submit...';
          fetch('/api/method/submit_gbs_doc', {
            method: 'POST', credentials: 'include',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({doctype: (type==='gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order', name: id})
          }).then(function(r){return r.json();}).then(function(d3) {
            var m = (d3 && d3.message) || {};
            if (m.success) {
              alert('Đã submit trên GBS!\nStatus: ' + (m.gbs_status || 'Submitted'));
              location.reload();
            } else {
              alert('Lỗi: ' + (m.error || 'unknown'));
            }
          }).catch(function(e){alert('Lỗi: ' + e.message);}).finally(function(){
            submitBtn.disabled = false; submitBtn.innerHTML = origS;
          });
        });
      }
    }).catch(function(e) {
      body.innerHTML = '<div data-gbs-filled="1" style="color:#c0392b">Loi: ' + _esc(e.message) + '<br><br>Mo F12 Console xem chi tiet (search "[gbs_v6]")</div>';
    });
    return true;
  }

  function _init() {
    var sp = new URLSearchParams(window.location.search);
    var id = sp.get('id'); var type = sp.get('type');
    console.log(TAG, 'init', type, id);
    if (type !== 'gbs_po' && type !== 'gbs_so') return;
    if (!id) return;
    var attempts = 0;
    function tryFill() {
      attempts++;
      if (_fill(id, type)) return;
      if (attempts < 80) setTimeout(tryFill, 200);
    }
    tryFill();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _init);
  else _init();
})();
/* gbs_wrapper_v6_end */
</script>




<script id="ec-gbs-attach-button">
(function(){
  'use strict';
  if (window._gbsAttachButtonInstalled) return;
  window._gbsAttachButtonInstalled = true;

  function urlParam(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var ticketType = urlParam('type');
  var ticketId   = urlParam('id');
  if (ticketType !== 'gbs_po' && ticketType !== 'gbs_so') return;
  if (!ticketId) return;
  var docType = (ticketType === 'gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order';
  console.log('[ec-gbs-attach-btn] active for', docType, ticketId);

  // ---- CSS ----
  if (!document.getElementById('ec-gbs-attach-css')) {
    var st = document.createElement('style');
    st.id = 'ec-gbs-attach-css';
    st.textContent = [
      '.ec-attach-wrap { margin-top:10px; padding-top:10px; border-top:1px dashed #e5e7eb; }',
      '.ec-attach-btn { display:inline-flex; align-items:center; gap:6px; background:#fff; color:#2C3DA6; border:1px dashed #2C3DA6; border-radius:6px; padding:8px 14px; font-weight:600; font-size:12.5px; cursor:pointer; }',
      '.ec-attach-btn:hover { background:#eef0fb; }',
      '.ec-attach-btn[disabled] { opacity:.55; cursor:not-allowed; }',
      '.ec-attach-hint { font-size:11px; color:#9ca3af; margin-top:6px; }',
      '.ec-attach-progress { margin-top:8px; font-size:12px; color:#4b5563; }',
      '.ec-attach-progress.ok { color:#166534; }',
      '.ec-attach-progress.err { color:#991b1b; }',
      '.ec-attach-progress .ec-file-row { padding:3px 0; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- 1. Get pre-signed Graph upload URL for one file ----
  function getUploadUrl(filename) {
    return fetch('/api/method/gbs_attach_upload_session', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: docType, name: ticketId, filename: filename })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      if (!msg.success) throw new Error(msg.error || 'upload_session_failed');
      return msg.upload_url;
    });
  }

  // ---- 2. PUT binary directly to Graph upload session URL ----
  // For files <= 60MB Graph accepts a single PUT with Content-Range covering full size.
  function putToGraph(uploadUrl, file) {
    return new Promise(function(resolve, reject){
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl, true);
      xhr.setRequestHeader('Content-Range', 'bytes 0-' + (file.size - 1) + '/' + file.size);
      // Do NOT set Content-Type for binary; Graph infers
      xhr.onreadystatechange = function(){
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var d = JSON.parse(xhr.responseText || '{}');
            resolve({
              name: file.name,
              webUrl: d.webUrl || '',
              sp_item_id: d.id || ''
            });
          } catch(e) { reject(new Error('Graph response parse: ' + e.message)); }
        } else {
          reject(new Error('Graph PUT ' + xhr.status + ': ' + (xhr.responseText || '').substring(0, 200)));
        }
      };
      xhr.onerror = function(){ reject(new Error('Graph PUT network error')); };
      xhr.send(file);
    });
  }

  // ---- 3. POST collected URLs to gbs_add_attachment ----
  function finalizeAttachments(items) {
    return fetch('/api/method/gbs_add_attachment', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: docType, name: ticketId, urls: items })
    }).then(function(r){
      return r.text().then(function(txt){
        var parsed;
        try { parsed = JSON.parse(txt); } catch(e) {
          return { success: false, error: 'http_' + r.status + ' non-JSON: ' + txt.substring(0, 200) };
        }
        if (parsed && parsed.message) {
          if (typeof parsed.message === 'string') {
            return { success: false, error: parsed.message, exc: parsed.exc };
          }
          return parsed.message;
        }
        return parsed || { success: false, error: 'empty response' };
      });
    }).then(function(v22b_result) {
      // v22b_marker: postattach_anon_2026-07-01 - auto anon convert after successful add
      try {
        if (v22b_result && (v22b_result.success === true || v22b_result.added > 0)) {
          fetch('/api/method/gbs_convert_attachments_to_anon', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doc_name: ticketId, dt: docType, days: 365 })
          }).then(function(rr){ return rr.json(); })
          .then(function(dd){
            var mm = dd && dd.message;
            console.log('[ec-gbs-postattach-anon-v22b] converted', (mm && mm.converted) || 0, '/', (mm && mm.total) || 0);
          }).catch(function(err){ console.warn('[ec-gbs-postattach-anon-v22b] err:', err); });
        }
      } catch(e) {}
      return v22b_result;
    });
  }

  // ---- find the attachments panel ----
  function findAttachPanel() {
    var panels = document.querySelectorAll('.panel');
    for (var i = 0; i < panels.length; i++) {
      var t = (panels[i].querySelector('.panel-title') || {}).textContent || '';
      if (/T[aà]i\s*li[eệ]u\s*[dđ][íi]nh\s*k[eè]m/i.test(t)) {
        return panels[i];
      }
    }
    return null;
  }

  function alreadyHasButton(panel) { return !!panel.querySelector('.ec-attach-wrap'); }

  function injectButton() {
    var panel = findAttachPanel();
    if (!panel) return false;
    if (alreadyHasButton(panel)) return true;
    var body = panel.querySelector('.panel-body') || panel;

    var wrap = document.createElement('div');
    wrap.className = 'ec-attach-wrap';
    wrap.innerHTML = [
      '<button type="button" class="ec-attach-btn" id="ec-attach-btn">',
      '  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">',
      '    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
      '  </svg>',
      '  Thêm file đính kèm',
      '</button>',
      '<input type="file" id="ec-attach-input" multiple style="display:none" />',
      '<div class="ec-attach-hint">Tối đa 20 file, mỗi file ≤ 15MB (t\u1ed5ng \u2264 17MB/l\u1ea7n). Upload trực tiếp lên SharePoint + push GBS.</div>',
      '<div class="ec-attach-progress" id="ec-attach-progress"></div>'
    ].join('\n');
    body.appendChild(wrap);

    var btn   = document.getElementById('ec-attach-btn');
    var input = document.getElementById('ec-attach-input');
    var prog  = document.getElementById('ec-attach-progress');

    btn.addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(){
      var files = input.files;
      if (!files || files.length === 0) return;
      if (files.length > 20) { prog.className = 'ec-attach-progress err'; prog.textContent = 'Quá 20 file, chia nhỏ.'; return; }
      var ecTotalBytes = 0;
      for (var tzi = 0; tzi < files.length; tzi++) { ecTotalBytes += (files[tzi].size || 0); }
      if (ecTotalBytes > 17 * 1024 * 1024) { /* ec-attach-limit-v1 */
        prog.className = 'ec-attach-progress err';
        prog.textContent = 'T\u1ed5ng file m\u1ed7i l\u1ea7n \u2264 17MB (hi\u1ec7n ' + Math.round(ecTotalBytes/1048576) + 'MB) \u2014 chia nh\u1ecf.';
        input.value = '';
        return;
      }
      var oversize = [];
      for (var i = 0; i < files.length; i++) {
        if ((files[i].size || 0) > 15 * 1024 * 1024) oversize.push(files[i].name);
      }
      if (oversize.length) {
        prog.className = 'ec-attach-progress err';
        prog.textContent = 'Vượt 15MB: ' + oversize.join(', ');
        input.value = '';
        return;
      }
      btn.disabled = true;
      prog.className = 'ec-attach-progress';
      prog.innerHTML = '<div class="ec-file-row">Bắt đầu upload ' + files.length + ' file...</div>';

      // For each file: get session URL -> PUT to Graph -> collect result
      var jobs = Array.prototype.slice.call(files).map(function(f, idx){
        return getUploadUrl(f.name).then(function(uploadUrl){
          prog.innerHTML += '<div class="ec-file-row">↑ ' + escapeHtml(f.name) + ' (' + Math.round(f.size/1024) + ' KB)...</div>';
          return Promise.all([
            putToGraph(uploadUrl, f),
            new Promise(function(resolve, reject){
              var reader = new FileReader();
              reader.onload = function(e){
                var dataUrl = e.target.result || '';
                resolve((dataUrl.split(',')[1] || ''));
              };
              reader.onerror = function(){ reject(new Error('FileReader: ' + f.name)); };
              reader.readAsDataURL(f);
            })
          ]).then(function(arr){
            var spResult = arr[0];
            spResult.content_b64 = arr[1];
            return spResult;
          }); // EC-V4-BINARY-2026-06-09
        });
      });

      Promise.all(jobs).then(function(items){
        prog.innerHTML += '<div class="ec-file-row">Đang push sang GBS...</div>';
        return finalizeAttachments(items);
      }).then(function(msg){
        console.log('[ec-gbs-attach] response:', msg);
        if (msg.success) {
          prog.className = 'ec-attach-progress ok';
          var note = msg.note || ('Đã thêm ' + (msg.added || 0) + ' file');
          var html = '<div class="ec-file-row">✓ ' + escapeHtml(note) + '</div>';
          if (msg.errors && msg.errors.length) {
            html += '<div class="ec-file-row" style="color:#92400e">⚠ ' + escapeHtml(msg.errors.join(' | ')) + '</div>';
          }
          prog.innerHTML = html;
          setTimeout(function(){ location.reload(); }, 1500);
        } else {
          prog.className = 'ec-attach-progress err';
          var errMsg = msg.error || msg.exc || 'unknown';
          if (typeof errMsg === 'object') errMsg = JSON.stringify(errMsg);
          var html = '<div class="ec-file-row">Lỗi: ' + escapeHtml(String(errMsg).substring(0, 400)) + '</div>';
          if (msg.trace && msg.trace.length) {
            html += '<div class="ec-file-row" style="font-size:10px;color:#6b7280">Trace: ' + escapeHtml(msg.trace.join(' -> ')) + '</div>';
          }
          if (msg.errors && msg.errors.length) {
            html += '<div class="ec-file-row" style="color:#92400e">' + escapeHtml(msg.errors.join(' | ')) + '</div>';
          }
          prog.innerHTML = html;
          btn.disabled = false;
        }
      }).catch(function(e){
        console.error('[ec-gbs-attach] err:', e);
        prog.className = 'ec-attach-progress err';
        prog.textContent = 'Lỗi: ' + e.message;
        btn.disabled = false;
      }).then(function(){ input.value = ''; });
    });

    console.log('[ec-gbs-attach-btn] button injected (fast path)');
    return true;
  }

  function init() {
    injectButton();
    var content = document.getElementById('content') || document.body;
    var obs = new MutationObserver(function(){ setTimeout(injectButton, 200); });
    obs.observe(content, { childList: true, subtree: true });
    setTimeout(injectButton, 500);
    setTimeout(injectButton, 1500);
    setTimeout(injectButton, 3000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script><!-- /ec-gbs-attach-button -->



<script id="ec-unread-dots">
// Red dot indicator for unread changes on GBS PO/SO rows.
//   - On list pages (/all-ticket, /approval list view): batch-poll ec_get_unread every 60s,
//     add CSS dot to ID cell of unread rows.
//   - On detail pages (/approval?id=X&type=gbs_po|gbs_so): call ec_mark_seen on load.
// Scope: GBS PO + SO only (extendable).
(function(){
  'use strict';
  if (window._ecUnreadDotsInstalled) return;
  window._ecUnreadDotsInstalled = true;

  var DOCTYPE_MAP = { gbs_po: 'GBS Purchase Order', gbs_so: 'GBS Sales Order' };
  var POLL_MS = 60000;

  function urlParam(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  // CSS
  if (!document.getElementById('ec-unread-dots-css')) {
    var st = document.createElement('style');
    st.id = 'ec-unread-dots-css';
    st.textContent = [
      '/* Red dot indicator on ID cell of unread rows */',
      '.ec-id-dot-wrap { position:relative; display:inline-block; padding-right:14px; }',
      '.ec-id-dot { position:absolute; top:0px; right:0px; width:8px; height:8px; background:#dc2626; border-radius:50%; box-shadow:0 0 0 2px #fff; }',
      '.ec-id-dot.ec-id-dot-anim { animation: ec-dot-pulse 1.8s ease-in-out infinite; }',
      '@keyframes ec-dot-pulse { 0%,100% { box-shadow:0 0 0 2px #fff, 0 0 0 0 rgba(220,38,38,.45); } 50% { box-shadow:0 0 0 2px #fff, 0 0 0 4px rgba(220,38,38,0); } }',
      '/* Tooltip on hover */',
      '.ec-id-dot-wrap:hover .ec-id-dot::after { content: attr(data-msg); position:absolute; top:-26px; right:-4px; background:#1f2937; color:#fff; font-size:11px; padding:3px 8px; border-radius:4px; white-space:nowrap; pointer-events:none; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  // ---- Page-context detection ----
  function getPageContext() {
    var p = (location.pathname || '').replace(/\/+$/, '');
    var hasId = !!urlParam('id');
    var hasType = !!urlParam('type');
    if ((p === '/approval') && hasId && hasType) {
      return { mode: 'detail', type: urlParam('type'), id: urlParam('id') };
    }
    if (p === '/all-tickets' || p === '/all-ticket' || p === '/approval') {
      // List context — figure out which tbody
      var ctx = { mode: 'list' };
      if (document.getElementById('detailBody')) {
        ctx.tbodySel = '#detailBody';
        ctx.rowSel = '#detailBody tr[data-id]';
        ctx.tabSel = '.tab';
        ctx.tabTypeAttr = 'data-type';
      } else if (document.getElementById('listBody')) {
        ctx.tbodySel = '#listBody';
        ctx.rowSel = '#listBody tr[data-id]';
        ctx.tabSel = '.list-tab';
        ctx.tabTypeAttr = 'data-tab';
      } else {
        return null;
      }
      return ctx;
    }
    return null;
  }

  function currentTabType(ctx) {
    var active = document.querySelector(ctx.tabSel + '.active');
    if (!active) return 'all';
    return active.getAttribute(ctx.tabTypeAttr) || 'all';
  }

  // ---- List mode: poll unread + render dots ----
  function collectGbsRefs(ctx) {
    var refs = [];
    var rows = document.querySelectorAll(ctx.rowSel);
    rows.forEach(function(tr){
      var id = tr.getAttribute('data-id') || '';
      var type = tr.getAttribute('data-type') || '';
      // Tab filter: if currently on a GBS tab, only that. Else infer from row data.
      var tabT = currentTabType(ctx);
      var refType = type || tabT;
      if (refType !== 'gbs_po' && refType !== 'gbs_so') return;
      if (!id) return;
      var dt = DOCTYPE_MAP[refType];
      if (!dt) return;
      refs.push({ doctype: dt, name: id, _row: tr, _type: refType });
    });
    return refs;
  }

  function findIdCell(tr) {
    // Heuristic: ID cell is the first cell that contains tr's data-id text (or it's the first <td>)
    var dataId = tr.getAttribute('data-id') || '';
    var cells = tr.querySelectorAll('td');
    for (var i = 0; i < cells.length; i++) {
      var txt = (cells[i].textContent || '').trim();
      // Strip zero-width sentinels added by other modules
      txt = txt.replace(/[​‌]/g, '');
      if (dataId && txt.indexOf(dataId) >= 0) return cells[i];
    }
    return cells[0] || null;
  }

  function applyDot(tr, msg) {
    var cell = findIdCell(tr);
    if (!cell) return;
    // Wrap inline content in span if not yet wrapped
    var wrap = cell.querySelector('.ec-id-dot-wrap');
    if (!wrap) {
      wrap = document.createElement('span');
      wrap.className = 'ec-id-dot-wrap';
      // Move all of cell's children into wrap
      while (cell.firstChild) wrap.appendChild(cell.firstChild);
      cell.appendChild(wrap);
    }
    var dot = wrap.querySelector('.ec-id-dot');
    if (!dot) {
      dot = document.createElement('span');
      dot.className = 'ec-id-dot ec-id-dot-anim';
      wrap.appendChild(dot);
    }
    dot.setAttribute('data-msg', msg || 'Có cập nhật mới');
  }

  function removeDot(tr) {
    var cell = findIdCell(tr);
    if (!cell) return;
    var dot = cell.querySelector('.ec-id-dot');
    if (dot) dot.remove();
  }

  var _pollTimer = null;
  function pollUnread(ctx) {
    var refs = collectGbsRefs(ctx);
    if (!refs.length) return;
    var payload = refs.map(function(r){ return { doctype: r.doctype, name: r.name }; });
    fetch('/api/method/ec_get_unread', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refs: payload })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      if (!msg.success) {
        console.warn('[ec-unread-dots] response not success', msg);
        return;
      }
      var unreadMap = msg.unread || {};
      refs.forEach(function(r){
        var u = unreadMap[r.name];
        if (u && u.is_unread) {
          var parts = [];
          if (u.comments) parts.push(u.comments + ' comment(s)');
          if (u.attachments) parts.push(u.attachments + ' file(s)');
          applyDot(r._row, parts.length ? 'Cập nhật mới — ' + parts.join(', ') : 'Có cập nhật mới');
        } else {
          removeDot(r._row);
        }
      });
    }).catch(function(e){
      console.warn('[ec-unread-dots] fetch err', e);
    });
  }

  function startListMode(ctx) {
    // Initial poll
    pollUnread(ctx);
    // Periodic poll
    if (_pollTimer) clearInterval(_pollTimer);
    _pollTimer = setInterval(function(){ pollUnread(ctx); }, POLL_MS);
    // Watch for row changes (tab switch, search, filter)
    var tbody = document.querySelector(ctx.tbodySel);
    if (tbody) {
      var mo = new MutationObserver(function(muts){
        var hasNewRows = false;
        for (var i = 0; i < muts.length; i++) {
          if (muts[i].addedNodes && muts[i].addedNodes.length > 0) { hasNewRows = true; break; }
        }
        if (hasNewRows) {
          setTimeout(function(){ pollUnread(ctx); }, 300);
        }
      });
      mo.observe(tbody, { childList: true });
    }
    // Watch Sync GBS button: piggyback gbs_force_poll_all so comment counts refresh too
    document.addEventListener('click', function(e){
      var t = e.target;
      if (!t || !t.closest) return;
      var syncBtn = t.closest('.gbs-sync-btn');
      if (!syncBtn) return;
      console.log('[ec-unread-dots] Sync GBS clicked - chaining gbs_force_poll_all');
      fetch('/api/method/gbs_force_poll_all', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function(r){ return r.json(); }).then(function(d){
        var m = (d && d.message) || {};
        if (m.success) {
          console.log('[ec-unread-dots] force_poll done:', m.stats);
          // Re-poll unread immediately to refresh dots
          setTimeout(function(){ pollUnread(ctx); }, 500);
        } else {
          console.warn('[ec-unread-dots] force_poll failed', m);
        }
      }).catch(function(err){
        console.warn('[ec-unread-dots] force_poll err', err);
      });
    }, true);
    // Watch tab clicks
    document.addEventListener('click', function(e){
      var t = e.target;
      if (t && t.closest && t.closest(ctx.tabSel)) {
        setTimeout(function(){ pollUnread(ctx); }, 400);
      }
    });
    console.log('[ec-unread-dots] list mode active');
  }

  // ---- Detail mode: mark seen on load ----
  function markSeen(ctx) {
    var docType = DOCTYPE_MAP[ctx.type];
    if (!docType) return;
    fetch('/api/method/ec_mark_seen', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doctype: docType, name: ctx.id })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      if (msg.success) {
        console.log('[ec-unread-dots] marked seen:', ctx.type, ctx.id);
      } else {
        console.warn('[ec-unread-dots] mark_seen failed:', msg);
      }
    }).catch(function(e){
      console.warn('[ec-unread-dots] mark_seen err', e);
    });
  }

  // ---- Boot ----
  function init() {
    var ctx = getPageContext();
    if (!ctx) {
      // Retry shortly (page may render late)
      setTimeout(init, 500);
      return;
    }
    if (ctx.mode === 'detail') {
      markSeen(ctx);
    } else if (ctx.mode === 'list') {
      // Wait for tbody to populate
      function waitTbody(tries) {
        var rows = document.querySelectorAll(ctx.rowSel);
        if (rows.length > 0) { startListMode(ctx); return; }
        if (tries > 30) { startListMode(ctx); return; }
        setTimeout(function(){ waitTbody(tries + 1); }, 400);
      }
      waitTbody(0);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  console.log('[ec-unread-dots] installed');
})();
</script><!-- /ec-unread-dots -->
<script id="ec-gbs-detail-extra">
(function(){
  'use strict';
  if (window._gbsDetailExtraInstalled) return;
  window._gbsDetailExtraInstalled = true;

  function urlParam(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var ticketType = urlParam('type');
  var ticketId   = urlParam('id');
  if (ticketType !== 'gbs_po' && ticketType !== 'gbs_so') return;
  if (!ticketId) return;
  var docType = (ticketType === 'gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order';
  console.log('[ec-gbs-detail-extra] active for', docType, ticketId);

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildRow(label, value) {
    var v = (value == null || value === '') ? '-' : value;
    return '<div class="ec-extra-row" style="display:grid;grid-template-columns:180px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid #f3f4f6">' +
      '<div style="color:#6b7280;font-size:12.5px">' + escapeHtml(label) + '</div>' +
      '<div style="font-size:13px;color:#111827">' + escapeHtml(v) + '</div>' +
      '</div>';
  }

  function loadDoc() {
    return fetch('/api/resource/' + encodeURIComponent(docType) + '/' + encodeURIComponent(ticketId), {
      method: 'GET', credentials: 'include'
    }).then(function(r){ return r.json(); }).then(function(d){
      return (d && d.data) || null;
    }).catch(function(){ return null; });
  }

  // Find the "Thông tin chung" section in the detail card and append rows after the last existing row.
  function findGeneralSection() {
    // The renderer creates a section header div with text content === "Thong tin chung" (no diacritics in snapshot).
    // We look for any div whose text starts with "Thong tin" or "Thông tin chung".
    var hits = document.querySelectorAll('div');
    for (var i = 0; i < hits.length; i++) {
      var t = (hits[i].textContent || '').trim();
      // Match header text only (length cap so we don't grab the whole panel)
      if (t.length < 60 && /^th[oô]ng\s*tin\s*chung/i.test(t)) {
        return hits[i];
      }
    }
    return null;
  }

  function findContainerAfterHeader(header) {
    // The renderer wraps section rows in a div directly after the header.
    // Walk siblings until we find one that contains rows like grid-template-columns:180px.
    var sib = header.nextElementSibling;
    var tries = 0;
    while (sib && tries < 10) {
      if (sib.querySelector && sib.querySelector('div[style*="grid-template-columns:180px"]')) {
        return sib;
      }
      sib = sib.nextElementSibling;
      tries++;
    }
    // Fallback: the parent of the header probably contains both header + rows
    var parent = header.parentNode;
    if (parent && parent.querySelector && parent.querySelector('div[style*="grid-template-columns:180px"]')) {
      return parent;
    }
    return null;
  }

  function alreadyInjected(container) {
    return !!container.querySelector('.ec-extra-row');
  }

  function injectRows(doc) {
    var header = findGeneralSection();
    if (!header) { console.log('[ec-gbs-detail-extra] header not found yet'); return false; }
    var container = findContainerAfterHeader(header);
    if (!container) { console.log('[ec-gbs-detail-extra] section container not found'); return false; }
    if (alreadyInjected(container)) return true;

    // Find the LAST row in the section to insert after (so order stays clean)
    var rows = container.querySelectorAll('div[style*="grid-template-columns:180px"]');
    if (!rows.length) { console.log('[ec-gbs-detail-extra] no existing rows in section'); return false; }
    var lastRow = rows[rows.length - 1];

    var html = '';
    // For PO: add Default Warehouse + Project (Customer panel already has DW for SO)
    if (ticketType === 'gbs_po') {
      html += buildRow('Default Warehouse', doc.set_warehouse);
    }
    html += buildRow('Project', doc.project);
    // Service period dates (2026-05-21): SO always has them; PO only when linked from SO
    var ssd = doc.service_start_date ? String(doc.service_start_date).substring(0, 10) : '';
    var sed = doc.service_end_date   ? String(doc.service_end_date).substring(0, 10)   : '';
    if (ssd || sed || ticketType === 'gbs_so') {
      html += buildRow('Ngày bắt đầu DV', ssd);
      html += buildRow('Ngày kết thúc DV', sed);
    }
    // Taxes template (2026-05-26): show on PO + SO if set
    if (doc.taxes_template) {
      html += buildRow('Sales Taxes Template', doc.taxes_template);
    }

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    // Insert each child after lastRow (in order)
    Array.prototype.slice.call(wrap.children).forEach(function(node){
      lastRow.parentNode.insertBefore(node, lastRow.nextSibling);
      lastRow = node;
    });
    console.log('[ec-gbs-detail-extra] injected DW=' + doc.set_warehouse + ', project=' + doc.project + ', svc_start=' + ssd + ', svc_end=' + sed);
    return true;
  }

  var _docCache = null;
  function tryInject() {
    if (!_docCache) {
      loadDoc().then(function(doc){
        if (!doc) return;
        _docCache = doc;
        injectRows(doc);
      });
      return;
    }
    injectRows(_docCache);
  }

  // Initial pass + observer (detail re-renders on Refresh / Check Status / etc.)
  function init() {
    tryInject();
    // Re-inject on DOM mutations to handle re-renders
    var content = document.getElementById('content') || document.body;
    var obs = new MutationObserver(function(muts){
      // Throttle: only react when significant child changes happen
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].addedNodes && muts[i].addedNodes.length > 0) {
          // Defer slightly so renderer finishes
          setTimeout(tryInject, 200);
          return;
        }
      }
    });
    obs.observe(content, { childList: true, subtree: true });
    // Retry a few times if first pass missed
    setTimeout(tryInject, 500);
    setTimeout(tryInject, 1500);
    setTimeout(tryInject, 3000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script><!-- /ec-gbs-detail-extra -->

<script id="ec-gbs-so-child-po-section">

  // ---- CSS ----

      // GD9 (2026-05-28): refresh button next to disabled "Tạo PO" when waiting on boxme approval
      '#ec-so-child-po-panel .scp-refresh-btn { background:#fff; color:#2C3DA6; border:1px solid #2C3DA6; border-radius:6px; padding:6px 12px; font-weight:600; font-size:12px; cursor:pointer; margin-left:8px; display:inline-flex; align-items:center; gap:5px; }',
      '#ec-so-child-po-panel .scp-refresh-btn:hover { background:#eff6ff; }',
