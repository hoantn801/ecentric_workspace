        page: 'approval',
        tableSel:    '.list-table',
        theadRowSel: '.list-table thead tr',
        tbodySel:    '#listBody',
        tabSel:      '.list-tab',
        getTabType:  function(t){ return t.dataset.tab || 'all'; },
        rowSel:      '#listBody tr[data-id]'
      };
    }
    return null;
  }

  function currentTabType(ctx) {
    if (!ctx) return 'all';
    var active = document.querySelector(ctx.tabSel + '.active');
    return active ? ctx.getTabType(active) : 'all';
  }

  function isGbsTab(ctx) {
    var t = currentTabType(ctx);
    // EC-GBS-FIN-v1-mine: My Approval may contain GBS rows mixed with others
    return t === 'gbs_po' || t === 'gbs_so' || t === 'mine';
  }

  function statusPillClass(s) {
    var k = (s || '').toLowerCase();
    if (k.indexOf('reject') >= 0) return 'gbs-st-rejected';
    if (k.indexOf('approve') >= 0) return 'gbs-st-approved';
    if (k.indexOf('pending') >= 0) return 'gbs-st-pending';
    if (k === 'draft') return 'gbs-st-draft';
    if (!k) return 'gbs-st-empty';
    return 'gbs-st-draft';
  }

  // ---- Fetch wrapper: cache + inject gbs_doc_name into title for search ----
  //
  // CRITICAL: approval-page has its own _ecPermFetch wrapper that re-applies
  // itself at t=100/500/1500/3000/6000ms via applyFetchPatch. Its guard skips
  // re-wrap only when window.fetch carries the EC_PERM_MARK key. If my wrapper
  // does not carry that mark, _ecPermFetch RE-WRAPS at t=100ms, capturing my
  // wrapper as its _origFetch. My wrapper captured the OLD _ecPermFetch as its
  // _origFetch_mine. Result: infinite recursion (Maximum call stack exceeded).
  //
  // Fix: tag myWrapper with the same mark via BRACKET access using a string
  // built at RUNTIME (avoid any literal containing two underscores in source —
  // Frappe Jinja safety scanner rejects such patterns in Web Page main_section).
  var US = String.fromCharCode(95);   // single underscore
  var EC_PERM_MARK = US + US + 'ecPermPatched';  // assembled to '<dunder>ecPermPatched'
  var _origFetch = window.fetch.bind(window);
  var _myFetchWrapper = function(url, opts) {
    var pp = _origFetch(url, opts);
    try {
      var urlStr = (typeof url === 'string') ? url : (url && url.url) || '';
      if (urlStr.indexOf('/api/method/web_lookup') >= 0 && opts && opts.body) {
        var body;
        try { body = JSON.parse(opts.body); } catch(e) { body = null; }
        if (body && (body.type === 'gbs_po' || body.type === 'gbs_so')) {
          return pp.then(function(resp){
            return resp.clone().json().then(function(d){
              try {
                var msg = (d && d.message) || d || {};
                var items = msg.items || [];
                items.forEach(function(it){
                  var id = it.id || it.name || '';
                  if (id) {
                    // Merge with existing cache (supplemental fetch may run before/after)
                    var existing = gbsCache[id] || {};
                    gbsCache[id] = {
                      gbs_doc_name:    it.gbs_doc_name    || existing.gbs_doc_name    || '',
                      gbs_status:      it.gbs_status      || existing.gbs_status      || '',
                      gbs_last_sync:   it.gbs_last_sync   || existing.gbs_last_sync   || '',
                      gbs_grand_total: it.gbs_grand_total || existing.gbs_grand_total || '',
                      parent_so:       it.parent_so       || existing.parent_so       || ''
                    };
                  }
                  if (it.gbs_doc_name && it.title && it.title.indexOf(Z1) < 0) {
                    it.title = it.title + Z1 + it.gbs_doc_name + Z2;
                  }
                });
              } catch(e) { console.warn('[ec-all-tickets-gbs] mutate err', e); }
              return new Response(JSON.stringify(d), {
                status: resp.status,
                statusText: resp.statusText,
                headers: resp.headers
              });
            }).catch(function(){ return resp; });
          });
        }
      }
    } catch(e) {}
    return pp;
  };
  // Tag with approval-page mark so its applyFetchPatch guard skips us.
  // Bracket access only (Frappe Jinja blocks dot-dunder patterns in source).
  _myFetchWrapper[EC_PERM_MARK] = true;
  window.fetch = _myFetchWrapper;

  // ---- Supplemental fetch: get gbs_last_sync via frappe.client.get_list ----
  // (web_lookup currently doesn't include gbs_last_sync in its enrich)
  // Debug: expose cache so anh can inspect in F12 console.
  window.gbsCache = gbsCache;

  function fetchSyncInfo() {
    if (gbsLastSyncFetched) return Promise.resolve();
    gbsLastSyncFetched = true;
    var doctypes = ['GBS Purchase Order', 'GBS Sales Order'];
    return Promise.all(doctypes.map(function(dt){
      // fields must be JSON-stringified for Frappe REST API compatibility across versions
      // GBS Purchase Order: include parent_so (link to parent GBS Sales Order)
      var fields = ['name', 'gbs_doc_name', 'gbs_status', 'gbs_last_sync'];
      if (dt === 'GBS Purchase Order') fields.push('parent_so');
      return fetch('/api/method/frappe.client.get_list', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          doctype: dt,
          fields: JSON.stringify(fields),
          limit_page_length: 2000
        })
      }).then(function(r){ return r.json(); }).then(function(d){
        var items = (d && d.message) || [];
        if (!Array.isArray(items)) return;
        items.forEach(function(it){
          var id = it.name || '';
          if (!id) return;
          var existing = gbsCache[id] || {};
          gbsCache[id] = {
            gbs_doc_name:    it.gbs_doc_name  || existing.gbs_doc_name  || '',
            gbs_status:      it.gbs_status    || existing.gbs_status    || '',
            gbs_last_sync:   it.gbs_last_sync || existing.gbs_last_sync || '',
            gbs_grand_total: existing.gbs_grand_total || '',
            parent_so:       it.parent_so     || existing.parent_so     || ''
          };
        });
        console.log('[ec-all-tickets-gbs] sync info for ' + dt + ': ' + items.length + ' docs');
      }).catch(function(e){
        console.warn('[ec-all-tickets-gbs] supplemental sync info fetch failed for ' + dt, e);
      });
    }));
  }

  // ---- Strip title marker from a single TD ----
  function stripTitleMarker(td) {
    if (!td) return;
    var html = td.innerHTML;
    var idx1 = html.indexOf(Z1);
    if (idx1 < 0) return;
    var idx2 = html.indexOf(Z2, idx1);
    if (idx2 < 0) {
      td.innerHTML = html.substring(0, idx1);
    } else {
      td.innerHTML = html.substring(0, idx1) + html.substring(idx2 + 1);
    }
  }

  // ---- Native column index detection (label-based, not hardcoded) ----
  // Native order varies by page version. Always detect by matching TH label.
  var NATIVE_COLS = {
    createdIdx: null,  // index of Created TH among non-extra THs
    statusIdx:  null   // index of Status TH among non-extra THs
  };
  function detectNativeCols(ctx) {
    var thead = document.querySelector(ctx.theadRowSel);
    if (!thead) return;
    // Use only NATIVE THs (skip our gbs-extra-col extras)
    var ths = Array.prototype.slice.call(thead.children).filter(function(th){
      return !th.classList.contains('gbs-extra-col');
    });
    if (ths.length === 0) return;

    // If first non-extra TH is already Created, layout was reordered already.
    // Use previously-cached value (don't reset).
    var firstLabel = (ths[0].textContent || '').trim().toLowerCase();
    if (firstLabel === 'created' || firstLabel === 'tạo lúc' || firstLabel === 'tạo ngày') {
      return; // skip — already reordered, keep cached
    }
    // Detect from native order
    for (var i = 0; i < ths.length; i++) {
      var label = (ths[i].textContent || '').trim().toLowerCase();
      if (label === 'created' || label === 'tạo lúc' || label === 'tạo ngày') NATIVE_COLS.createdIdx = i;
      if (label === 'status') NATIVE_COLS.statusIdx = i;
    }
  }

  // ---- Augment thead — single pass, idempotent per render ----
  // Layout target (left to right):
  //   Created | ID | Title | (Type) | Department | Status | GBS Status |
  //   Timeline | Submitted by | GBS Doc | GBS Doc SO (po only) | Last Sync
  //
  // Native column order detected dynamically (label-based, not hardcoded).
  function augmentHead(ctx) {
    var thead = document.querySelector(ctx.theadRowSel);
    if (!thead) return;
    // Detect native indices BEFORE stripping extras (so first non-extra is reliable)
    detectNativeCols(ctx);

    // Strip previous GBS extras (will re-add if GBS tab)
    Array.prototype.slice.call(thead.querySelectorAll('th.gbs-extra-col')).forEach(function(n){ n.remove(); });

    var tabType = currentTabType(ctx);
    var isGbs = isGbsTab(ctx);

    // Reorder Created TH to position 0 (ALL tabs - common UX improvement)
    if (thead.dataset.ecLayoutV2 !== '1' && NATIVE_COLS.createdIdx !== null) {
      var thsArr = Array.prototype.slice.call(thead.children);
      var createdTh = thsArr[NATIVE_COLS.createdIdx];
      if (createdTh && (createdTh.textContent || '').trim().toLowerCase() === 'created') {
        thead.insertBefore(createdTh, thsArr[0]);
        thead.dataset.ecLayoutV2 = '1';
      }
    }

    // Add GBS extras (GBS tabs only)
    if (isGbs) {
      reAddGbsExtras(thead, Array.prototype.slice.call(thead.children), tabType);
    }
  }

  function reAddGbsExtras(thead, ths, tabType) {
    function makeTh(label, extraClass) {
      var th = document.createElement('th');
      th.className = 'gbs-extra-col ' + (extraClass || '');
      th.textContent = label;
      return th;
    }
    // Find Status TH (in current header positions)
    var statusTh = null;
    for (var i = 0; i < ths.length; i++) {
      if ((ths[i].textContent || '').trim().toLowerCase() === 'status') {
        statusTh = ths[i];
        break;
      }
    }
    var gbsStatusTh = makeTh('GBS Status', 'gbs-status-col');
    if (statusTh && statusTh.nextSibling) {
      thead.insertBefore(gbsStatusTh, statusTh.nextSibling);
    } else {
      thead.appendChild(gbsStatusTh);
    }
    thead.appendChild(makeTh('GBS Doc', 'gbs-doc-col'));
    if (tabType === 'gbs_po' || tabType === 'mine') thead.appendChild(makeTh('GBS Doc SO', 'gbs-doc-so-col')); // EC-GBS-FIN-v1-mine
    thead.appendChild(makeTh('Last Sync', 'gbs-sync-col'));
  }

  // ---- Augment rows — one-pass per row, idempotent ----
  // Steps per row (only when row layout != 'v2'):
  //   1. Strip zero-width title marker
  //   2. Strip prior gbs-extra-cell
  //   3. Move Created TD (native idx 6) to position 0
  //   4. Insert GBS Status TD right after Status TD
  //   5. Append GBS Doc + GBS Doc SO (po only) + Last Sync at end
  //   6. Mark row data-ec-layout-v2="1"
  // For non-GBS tabs: revert layout (move Created TD back to native idx 6)
  function augmentRows(ctx) {
    var rows = document.querySelectorAll(ctx.rowSel);
    var isGbs = isGbsTab(ctx);
    var tabType = currentTabType(ctx);

    rows.forEach(function(row){
      // Always strip extras + title marker before re-render
      var titleCell = row.cells && row.cells[1];
      stripTitleMarker(titleCell);
      Array.prototype.slice.call(row.querySelectorAll('td.gbs-extra-cell')).forEach(function(n){ n.remove(); });

      // Step 1: Reorder Created TD to position 0 (ALL tabs)
      if (row.dataset.ecLayoutV2 !== '1') {
        if (NATIVE_COLS.createdIdx === null) return;
        if (row.cells.length <= NATIVE_COLS.createdIdx) return;
        var createdTd = row.cells[NATIVE_COLS.createdIdx];
        row.insertBefore(createdTd, row.cells[0]);
        row.dataset.ecLayoutV2 = '1';
      }

      // Compact Title cell content (now at position 2 after Created moved to 0)
      // Use inner wrapper div to bypass table-layout:auto ignoring max-width on TD.
      compactTitleCell(row, 2);

      // Non-GBS tab: only Created reorder, no GBS extras
      if (!isGbs) return;

      // GBS tab path: continue with GBS-specific columns
      var info = gbsCache[row.dataset.id] || {};
      var stat    = info.gbs_status   || '';

      // Step 2: After Created moved to 0, find Status TD (now shifted by +1 from native idx 4 → 5)
      // Look up by header label to be robust.
      var statusTd = null;
      var thead = document.querySelector(ctx.theadRowSel);
      if (thead) {
        var ths = Array.prototype.slice.call(thead.children);
        // Find Status TH index, skipping gbs-extra-col
        var statusHeaderPos = -1;
        var nonExtraIdx = -1;
        for (var i = 0; i < ths.length; i++) {
          if (ths[i].classList.contains('gbs-extra-col')) continue;
          nonExtraIdx++;
          if ((ths[i].textContent || '').trim().toLowerCase() === 'status') {
            statusHeaderPos = nonExtraIdx;
            break;
          }
        }
        if (statusHeaderPos >= 0 && row.cells.length > statusHeaderPos) {
          statusTd = row.cells[statusHeaderPos];
        }
      }

      // Step 3: insert GBS Status TD right after Status TD
      var tdGbsStatus = document.createElement('td');
      tdGbsStatus.className = 'gbs-extra-cell gbs-status-cell';
      if (stat) {
        tdGbsStatus.innerHTML = '<span class="gbs-status-pill ' + statusPillClass(stat) + '">' + escapeHtml(stat) + '</span>';
      } else {
        tdGbsStatus.textContent = '—';
      }
      if (statusTd && statusTd.nextSibling) {
        row.insertBefore(tdGbsStatus, statusTd.nextSibling);
      } else {
        row.appendChild(tdGbsStatus);
      }

      // Step 4: append GBS Doc / GBS Doc SO (po) / Last Sync at end
      var tdDoc = document.createElement('td');
      tdDoc.className = 'gbs-extra-cell gbs-doc';
      tdDoc.textContent = info.gbs_doc_name || '—';
      row.appendChild(tdDoc);

      if (tabType === 'gbs_po' || tabType === 'mine') { // EC-GBS-FIN-v1-mine
        var tdSo = document.createElement('td');
        tdSo.className = 'gbs-extra-cell gbs-doc-so';
        var parentSo = info.parent_so || '';
        if (parentSo) {
          var a = document.createElement('a');
          a.href = '/approval?type=gbs_so&id=' + encodeURIComponent(parentSo);
          a.textContent = parentSo;
          a.style.cssText = 'color:#2C3DA6;text-decoration:none;font-size:12px';
          a.addEventListener('mouseover', function(){ this.style.textDecoration='underline'; });
          a.addEventListener('mouseout', function(){ this.style.textDecoration='none'; });
          tdSo.appendChild(a);
        } else {
          tdSo.textContent = '—';
        }
        row.appendChild(tdSo);
      }

      var tdSync = document.createElement('td');
      tdSync.className = 'gbs-extra-cell gbs-sync';
      tdSync.textContent = info.gbs_last_sync ? fmtTime(info.gbs_last_sync) : '—';
      row.appendChild(tdSync);
    });
  }

  // ---- Move Created column to position 1 (all tabs, visual reorder only) ----
  // CRITICAL: TH and TD reorder MUST be in sync. Earlier bug: TH was reordered
  // first refresh (rows not yet ready), subsequent refreshes early-returned via
  // idempotency check → TD never reordered → header/data mismatch.
  // Fix: per-row sentinel attribute tracks reorder state independently.
  var _ecOriginalCreatedIdx = null;
  function reorderCreatedColumn(ctx) {
    var thead = document.querySelector(ctx.theadRowSel);
    if (!thead) return;
    var ths = Array.prototype.slice.call(thead.children);

    // Step 1: ensure TH at position 0. Remember original index.
    var firstLabel = (ths[0] && ths[0].textContent || '').trim().toLowerCase();
    var thAlreadyFirst = (firstLabel === 'created' || firstLabel === 'tạo lúc' || firstLabel === 'tạo ngày');
    if (!thAlreadyFirst) {
      var createdIdx = -1;
      for (var i = 0; i < ths.length; i++) {
        var label = (ths[i].textContent || '').trim().toLowerCase();
        if (label === 'created' || label === 'tạo lúc' || label === 'tạo ngày') {
          createdIdx = i;
          break;
        }
      }
      if (createdIdx > 0) {
        if (_ecOriginalCreatedIdx === null) _ecOriginalCreatedIdx = createdIdx;
        thead.insertBefore(ths[createdIdx], ths[0]);
      } else {
        return; // Created TH not found
      }
    }

    // Step 2: reorder TD on each row. Track per-row with data attr to avoid
    // double-move + handle rows that were rendered AFTER first reorder.
    var origIdx = _ecOriginalCreatedIdx;
    if (origIdx === null || origIdx <= 0) return;
    var rows = document.querySelectorAll(ctx.rowSel);
    rows.forEach(function(row){
      if (row.dataset.ecCreatedReordered === '1') return; // already done
      if (row.cells && row.cells.length > origIdx) {
        row.insertBefore(row.cells[origIdx], row.cells[0]);
        row.dataset.ecCreatedReordered = '1';
      }
    });
  }

  // ---- CSS: title compact via inner div + scroll wrap with tooltip space ----
  function ensureCompactTitleCss() {
    if (document.getElementById('ec-gbs-cols-css')) return;
    var st = document.createElement('style');
    st.id = 'ec-gbs-cols-css';
    st.textContent = [
      '/* Title cell inner wrapper - works in table-layout:auto via inline-block */',
      '.ec-title-compact {',
      '  display: inline-block;',
      '  max-width: 260px;',
      '  white-space: nowrap;',
      '  overflow: hidden;',
      '  text-overflow: ellipsis;',
      '  vertical-align: middle;',
      '}',
      '/* GBS Doc SO link column compact */',
      'table .gbs-doc-so {',
      '  font-size: 12px;',
      '  white-space: nowrap;',
      '}',
      '/* Horizontal scroll wrapper with padding-bottom hack for tooltip space */',
      '/* overflow-y is implicitly auto when overflow-x is auto, but padding-bottom */',
      '/* gives content extra room before clip kicks in */',
      '.ec-table-scroll-wrap {',
      '  overflow-x: auto;',
      '  width: 100%;',
      '  padding-bottom: 60px;',
      '  margin-bottom: -60px;',
      '  -webkit-overflow-scrolling: touch;',
      '}',
      '.ec-table-scroll-wrap > table {',
      '  min-width: max-content;',
      '}'
    ].join('\n');
    document.head.appendChild(st);
  }

  // ---- Wrap title cell content in inner div for proper ellipsis clipping ----
  function compactTitleCell(row, titleIdx) {
    if (!row || row.cells.length <= titleIdx) return;
    var cell = row.cells[titleIdx];
    if (!cell || cell.dataset.ecTitleCompact === '1') return;
    // Move all children into inner wrapper
    var wrap = document.createElement('div');
    wrap.className = 'ec-title-compact';
    wrap.title = (cell.textContent || '').trim(); // tooltip on hover for full text
    while (cell.firstChild) {
      wrap.appendChild(cell.firstChild);
    }
    cell.appendChild(wrap);
    cell.dataset.ecTitleCompact = '1';
  }

  // ---- Ensure table scrolls horizontally (wrap table in scroll div) ----
  // Use NEW wrapper div around the table, not the existing parent. This isolates
  // scroll context so other content on page isn't affected. padding-bottom: 60px
  // provides space for tooltips (~30px) inside the scroll area before clip.
  function ensureTableScrollable(ctx) {
    var table = document.querySelector(ctx.tableSel);
    if (!table) return;
    if (table.dataset.ecScrollWrapped === '1') return;
    var parent = table.parentNode;
    if (!parent) return;
    // If already wrapped (parent IS our wrap), skip
    if (parent.classList && parent.classList.contains('ec-table-scroll-wrap')) {
      table.dataset.ecScrollWrapped = '1';
      return;
    }
    // Create new wrap div ONLY around table (isolated scroll context)
    var wrap = document.createElement('div');
    wrap.className = 'ec-table-scroll-wrap';
    parent.insertBefore(wrap, table);
    wrap.appendChild(table);
    table.dataset.ecScrollWrapped = '1';
  }

  function refresh() {
    var ctx = getPageContext();
    if (!ctx) return;
    ensureCompactTitleCss();
    ensureTableScrollable(ctx);  // horizontal scroll wrapper (both all-ticket + approval)
    augmentHead(ctx);  // Created TH reorder (all tabs) + GBS extras (GBS tabs only)
    augmentRows(ctx);  // Created TD reorder (all tabs) + GBS extras (GBS tabs only)
    ensureSyncButton(ctx);
  }

  // ---- Manual "Sync GBS" button ----
  function ensureSyncButton(ctx) {
    // EC-GBS-FIN-v1-mine: hide sync button on My Approval (mixed types)
    var _ecCurTab = currentTabType(ctx);
    if (!isGbsTab(ctx) || _ecCurTab === 'mine') {
      var existing = document.getElementById('gbs-sync-all-btn');
      if (existing) {
        var wrap = existing.closest('.gbs-sync-wrap');
        if (wrap) wrap.remove();
      }
      return;
    }
    if (document.getElementById('gbs-sync-all-btn')) return;
    // Anchor: place after filter bar or last tab
    var anchor = document.querySelector('.filter-bar') ||
                 document.querySelector('#activeFilters') ||
                 document.querySelector('.tab.active') ||
                 document.querySelector('.list-tab.active');
    if (!anchor) return;
    var scope = currentTabType(ctx);  // 'gbs_po' or 'gbs_so' or 'all'

    var wrap = document.createElement('span');
    wrap.className = 'gbs-sync-wrap';
    wrap.style.cssText = 'display:inline-flex;align-items:center;margin-left:6px;';
    wrap.innerHTML =
      '<button type="button" class="gbs-sync-btn" id="gbs-sync-all-btn" title="Force-sync all GBS docs (bypass 15-min auto-poll throttle)">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>' +
      '</svg>' +
      '<span class="gbs-sync-label">Sync GBS</span>' +
      '</button>' +
      '<span class="gbs-sync-meta" id="gbs-sync-meta">Auto-sync mỗi 15 phút</span>' +
      '<span class="gbs-sync-msg" id="gbs-sync-msg" style="display:none"></span>';
    // Insert after anchor
    if (anchor.nextSibling) {
      anchor.parentNode.insertBefore(wrap, anchor.nextSibling);
    } else {
      anchor.parentNode.appendChild(wrap);
    }
    var btn  = document.getElementById('gbs-sync-all-btn');
    var msg  = document.getElementById('gbs-sync-msg');
    var meta = document.getElementById('gbs-sync-meta');
    btn.addEventListener('click', function(){
      var t0 = Date.now();
      btn.disabled = true;
      btn.querySelector('.gbs-sync-label').textContent = 'Đang sync...';
      var icon = btn.querySelector('svg');
      if (icon) icon.style.display = 'none';
      var spin = document.createElement('span');
      spin.className = 'ec-spin';
      btn.insertBefore(spin, btn.firstChild);
      msg.style.display = 'none';
      if (meta) meta.style.display = 'none';

      fetch('/api/method/gbs_sync_all', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope: scope })
      }).then(function(r){ return r.json(); }).then(function(d){
        var m = (d && d.message) || d || {};
        var dur = Math.round((Date.now() - t0) / 1000);
        if (m.success) {
          msg.className = 'gbs-sync-msg ok';
          msg.textContent = '✓ Sync ' + (m.updated || 0) + '/' + (m.polled || 0) + ' docs ' +
                             (m.skipped_finalized ? '(skip ' + m.skipped_finalized + ' finalized) ' : '') +
                             '(' + dur + 's)';
          msg.style.display = 'inline-block';
          // Reload page to re-render with fresh data
          setTimeout(function(){ location.reload(); }, 1200);
        } else {
          msg.className = 'gbs-sync-msg err';
          msg.textContent = '✕ Lỗi: ' + (m.error || 'unknown');
          msg.style.display = 'inline-block';
          btn.disabled = false;
          var spinNode = btn.querySelector('.ec-spin');
          if (spinNode) spinNode.remove();
          if (icon) icon.style.display = '';
          btn.querySelector('.gbs-sync-label').textContent = 'Sync GBS';
          if (meta) meta.style.display = 'inline-block';
        }
      }).catch(function(e){
        msg.className = 'gbs-sync-msg err';
        msg.textContent = '✕ Lỗi mạng: ' + e.message;
        msg.style.display = 'inline-block';
        btn.disabled = false;
        var spinNode = btn.querySelector('.ec-spin');
        if (spinNode) spinNode.remove();
        if (icon) icon.style.display = '';
        btn.querySelector('.gbs-sync-label').textContent = 'Sync GBS';
        if (meta) meta.style.display = 'inline-block';
      });
    });
  }

  // ---- Init ----
  function init() {
    refresh();

    // Kick off supplemental fetch as soon as possible, then refresh
    fetchSyncInfo().then(refresh);

    // Observe each known body separately (we don't know which page yet, both may toggle)
    ['detailBody', 'listBody'].forEach(function(id){
      var n = document.getElementById(id);
      if (!n) return;
      var obs = new MutationObserver(function(){ setTimeout(refresh, 30); });
      obs.observe(n, { childList: true });
    });

    // Also observe #content for full re-render (approval-page does innerHTML=html)
    var content = document.getElementById('content');
    if (content) {
      var obs2 = new MutationObserver(function(){ setTimeout(refresh, 80); });
      obs2.observe(content, { childList: true, subtree: true });
    }

    // Click on tabs may not trigger tbody mutation (cheap re-render). Listen:
    function bindTabs() {
      document.querySelectorAll('.tab, .list-tab').forEach(function(tab){
        if (tab._gbsBound) return;
        tab._gbsBound = true;
        tab.addEventListener('click', function(){ setTimeout(refresh, 120); });
      });
    }
    bindTabs();
    setTimeout(bindTabs, 1000);
    setTimeout(bindTabs, 3000);

    // Backstop refreshes (data may arrive async after our observer attaches)
    setTimeout(refresh, 500);
    setTimeout(refresh, 2000);
    setTimeout(refresh, 5000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script><!-- /ec-all-tickets-gbs-cols -->
<script id="ec-gbs-detail-fields-pad">
// N15 Phase 1 (2026-05-28) — Pad GBS SO/PO approval detail page with fields missing
// from gbs_wrapper_v6 + ec_gbs_detail_extra. Independent script — does NOT touch
// either of those. If this script breaks, those two continue working unchanged.
//
// Adds to "Thông tin chung" section, AFTER all existing rows:
//   - Order Type        (SO + PO, if doc has it)
//   - Price List        (SO only — PO doc doesn't have this custom field)
//   - Store (Platform)  (SO only — V-code from custom_store, local field name = store_name)
//   - Parent Service Order  (PO only, as clickable link → /approval?id=<SO>&type=gbs_so)
//
// Augments items table with UOM column (between Item Name and Qty for read ergonomics).
//
// Safety:
//   - Idempotent via _ecGbsDetailFieldsPadInstalled guard.
//   - Only runs on /approval?type=gbs_so|gbs_po pages.
//   - Each insertion is wrapped in try/catch → never throws past observer.
//   - Uses .ec-fp-* class to mark its injections (so we can detect duplicates).
(function(){
  'use strict';
  if (window._ecGbsDetailFieldsPadInstalled) return;
  window._ecGbsDetailFieldsPadInstalled = true;

  function urlParam(k){ var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)')); return m?decodeURIComponent(m[1]):''; }
  var ticketType = urlParam('type');
  var ticketId   = urlParam('id');
  if (ticketType !== 'gbs_so' && ticketType !== 'gbs_po') return;
  if (!ticketId) return;
  var docType = (ticketType === 'gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order';
  console.log('[ec-gbs-detail-fields-pad] active for', docType, ticketId);

  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function buildRow(label, valueHtml, isRawHtml) {
    // Match the row visual style used by gbs_wrapper_v6 + ec_gbs_detail_extra (grid 180px 1fr).
    return '<div class="ec-fp-row" style="display:grid;grid-template-columns:180px 1fr;gap:14px;padding:8px 0;border-bottom:1px solid #f3f4f6">' +
      '<div style="color:#6b7280;font-size:12.5px">' + escapeHtml(label) + '</div>' +
      '<div style="font-size:13px;color:#111827">' + (isRawHtml ? valueHtml : escapeHtml(valueHtml)) + '</div>' +
      '</div>';
  }

  function loadDoc() {
    return fetch('/api/resource/' + encodeURIComponent(docType) + '/' + encodeURIComponent(ticketId), {
      method: 'GET', credentials: 'include'
    }).then(function(r){ return r.json(); }).then(function(d){
      return (d && d.data) || null;
    }).catch(function(){ return null; });
  }

  // ====== Locate Thông tin chung section + last existing row ======
  function findGeneralSection() {
    // gbs_wrapper_v6 uses _section() with header text "Thong tin chung" (no diacritics)
    // ec_gbs_detail_extra checks both with + without diacritics
    var divs = document.querySelectorAll('div');
    for (var i = 0; i < divs.length; i++) {
      var t = (divs[i].textContent || '').trim();
      if (t.length < 60 && /^th[oô]ng\s*tin\s*chung/i.test(t)) return divs[i];
    }
    return null;
  }
  function findContainerOfRows(header) {
    var sib = header.nextElementSibling;
    var tries = 0;
    while (sib && tries < 10) {
      if (sib.querySelector && sib.querySelector('div[style*="grid-template-columns:180px"]')) return sib;
      sib = sib.nextElementSibling; tries++;
    }
    if (header.parentNode && header.parentNode.querySelector &&
        header.parentNode.querySelector('div[style*="grid-template-columns:180px"]')) {
      return header.parentNode;
    }
    return null;
  }

  function injectExtraFields(doc) {
    try {
      var header = findGeneralSection();
      if (!header) return false;
      var container = findContainerOfRows(header);
      if (!container) return false;
      // Idempotency: don't re-inject our own rows
      if (container.querySelector('.ec-fp-row')) return true;

      var rows = container.querySelectorAll('div[style*="grid-template-columns:180px"]');
      if (!rows.length) return false;
      var lastRow = rows[rows.length - 1];

      var html = '';
      // Order Type — both SO + PO doc types (PO may have it via custom field too; if absent, value=='' → '-' rendered)
      if (doc.order_type) html += buildRow('Order Type', doc.order_type);
      // SO-only: Price List + Store (Platform)
      if (ticketType === 'gbs_so') {
        if (doc.price_list) html += buildRow('Price List', doc.price_list);
        if (doc.store_name) html += buildRow('Store (Platform)', doc.store_name);
      }
      // PO-only: Parent SO link
      if (ticketType === 'gbs_po' && doc.parent_so) {
        var href = '/approval?id=' + encodeURIComponent(doc.parent_so) + '&type=gbs_so';
        var linkHtml = '<a href="' + escapeHtml(href) + '" style="color:#2C3DA6;text-decoration:none;font-family:DM Mono,monospace;font-weight:600">' + escapeHtml(doc.parent_so) + '</a>';
        html += buildRow('Parent SO', linkHtml, true);
      }
      if (!html) return true;  // nothing to add — leave as-is

      var wrap = document.createElement('div');
      wrap.innerHTML = html;
      Array.prototype.slice.call(wrap.children).forEach(function(node){
        lastRow.parentNode.insertBefore(node, lastRow.nextSibling);
        lastRow = node;
      });
      console.log('[ec-gbs-detail-fields-pad] injected', wrap.childElementCount, 'rows');
      return true;
    } catch (e) {
      console.warn('[ec-gbs-detail-fields-pad] inject error', e);
      return false;
    }
  }

  // ====== Augment items table with UOM column ======
  // The table is rendered by gbs_wrapper_v6 with columns:
  //   Item Code | Item Name | Qty | Rate | Amount | Warehouse
  // We add a UOM column AFTER "Item Name" (so qty/rate/amount stay grouped).
  function augmentItemsTable(doc) {
    try {
      if (!doc || !Array.isArray(doc.items) || doc.items.length === 0) return false;
      // Locate the items table: <table> whose <thead> has "Item Code" + "Warehouse" headers
      var tables = document.querySelectorAll('table');
      var target = null;
      for (var i = 0; i < tables.length; i++) {
        var ths = tables[i].querySelectorAll('thead th');
        if (ths.length < 4) continue;
        var headers = Array.prototype.map.call(ths, function(th){ return (th.textContent||'').trim().toLowerCase(); });
        if (headers.indexOf('item code') >= 0 && headers.indexOf('warehouse') >= 0) {
          target = tables[i]; break;
        }
      }
      if (!target) return false;
      // Don't double-augment
      if (target.querySelector('th.ec-fp-uom-th')) return true;

      // Find "Item Name" column index
      var ths = target.querySelectorAll('thead th');
      var itemNameIdx = -1;
      ths.forEach(function(th, i){
        var t = (th.textContent||'').trim().toLowerCase();
        if (t === 'item name') itemNameIdx = i;
      });
      if (itemNameIdx < 0) return false;

      // Insert UOM header after Item Name
      var uomTh = document.createElement('th');
      uomTh.className = 'ec-fp-uom-th';
      uomTh.style.cssText = 'text-align:left;padding:8px 10px;font-weight:600;color:#6b7280;text-transform:uppercase;font-size:11px;letter-spacing:0.4px';
      uomTh.textContent = 'UOM';
      var refTh = ths[itemNameIdx];
      refTh.parentNode.insertBefore(uomTh, refTh.nextSibling);

      // Insert UOM cell into each row, mapping by row index ↔ doc.items[i].uom
      var bodyRows = target.querySelectorAll('tbody tr');
      bodyRows.forEach(function(tr, rowIdx){
        var item = doc.items[rowIdx] || {};
        var tds = tr.querySelectorAll('td');
        if (tds.length === 0) return;
        var refTd = tds[itemNameIdx];
        if (!refTd) return;
        var uomTd = document.createElement('td');
        uomTd.className = 'ec-fp-uom-td';
        uomTd.style.cssText = 'padding:8px 10px';
        uomTd.textContent = item.uom || '';
        refTd.parentNode.insertBefore(uomTd, refTd.nextSibling);
      });
      console.log('[ec-gbs-detail-fields-pad] augmented items table with UOM column');
      return true;
    } catch (e) {
      console.warn('[ec-gbs-detail-fields-pad] table augment error', e);
      return false;
    }
  }

  // ====== Orchestration ======
  var _docCache = null;
  function tryAll() {
    if (!_docCache) {
      loadDoc().then(function(doc){
        if (!doc) return;
        _docCache = doc;
        injectExtraFields(doc);
        augmentItemsTable(doc);
      });
      return;
    }
    injectExtraFields(_docCache);
    augmentItemsTable(_docCache);
  }

  function init() {
    tryAll();
    // Detail page re-renders on Check Status / Refresh / etc. — observe content area.
    var content = document.getElementById('content') || document.body;
    var obs = new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].addedNodes && muts[i].addedNodes.length > 0) {
          setTimeout(tryAll, 220);
          return;
        }
      }
    });
    obs.observe(content, { childList: true, subtree: true });
    // Safety retries
    setTimeout(tryAll,  600);
    setTimeout(tryAll, 1600);
    setTimeout(tryAll, 3200);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script><!-- /ec-gbs-detail-fields-pad -->
<script id="ec-gbs-resubmit-button">
(function(){
  'use strict';
  if (window._gbsResubmitButtonInstalled) return;
  window._gbsResubmitButtonInstalled = true;

  function urlParam(k) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var ticketType = urlParam('type');
  var ticketId   = urlParam('id');
  if (ticketType !== 'gbs_po' && ticketType !== 'gbs_so') return;
  if (!ticketId) return;
  var docType = (ticketType === 'gbs_po') ? 'GBS Purchase Order' : 'GBS Sales Order';
  console.log('[ec-gbs-resubmit] active for', docType, ticketId);

  // CSS
  if (!document.getElementById('ec-gbs-resubmit-css')) {
    var st = document.createElement('style');
    st.id = 'ec-gbs-resubmit-css';
    st.textContent = [
      '.ec-gbs-resubmit-btn { background:#f59e0b; color:white; border:none; border-radius:6px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer; margin-left:8px; }',
      '.ec-gbs-resubmit-btn:hover { background:#d97706; }',
      /* ec-resubmit-merge-v1: CTA now lives in a banner at the top, styled to match
         the #ec-can-sua-banner of the next stage so the two stages look identical. */
      '#ec-gbs-resubmit-banner { background:#fef3c7; border:1px solid #f59e0b; border-radius:8px; padding:14px 16px; margin-bottom:14px; }',
      '#ec-gbs-resubmit-banner .ecrb-title { font-size:14px; font-weight:700; color:#92400e; margin-bottom:6px; }',
      '#ec-gbs-resubmit-banner .ecrb-reason { font-size:13px; color:#78350f; margin-bottom:10px; line-height:1.5; }',
      '#ec-gbs-resubmit-banner .ec-gbs-resubmit-btn { margin-left:0; background:#2C3DA6; }',
      '#ec-gbs-resubmit-banner .ec-gbs-resubmit-btn:hover { background:#1f2d80; }',
      '.ec-gbs-resubmit-modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; display:flex; align-items:center; justify-content:center; }',
      '.ec-gbs-resubmit-modal .modal-card { background:#fff; border-radius:10px; padding:20px; width:480px; max-width:90vw; box-shadow:0 10px 40px rgba(0,0,0,0.2); }',
      '.ec-gbs-resubmit-modal h3 { margin:0 0 12px 0; font-size:16px; color:#111827; }',
      '.ec-gbs-resubmit-modal .modal-info { font-size:13px; color:#6b7280; margin-bottom:12px; line-height:1.5; }',
      '.ec-gbs-resubmit-modal textarea { width:100%; box-sizing:border-box; min-height:80px; padding:10px; border:1px solid #e5e7eb; border-radius:6px; font-family:inherit; font-size:13px; resize:vertical; }',
      '.ec-gbs-resubmit-modal textarea:focus { border-color:#2C3DA6; outline:none; }',
      '.ec-gbs-resubmit-modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }',
      '.ec-gbs-resubmit-modal .btn-confirm { background:#f59e0b; color:white; border:none; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }',
      '.ec-gbs-resubmit-modal .btn-confirm:disabled { background:#9ca3af; cursor:not-allowed; }',
      '.ec-gbs-resubmit-modal .btn-cancel { background:#fff; color:#4b5563; border:1px solid #e5e7eb; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  // Find "Submit on GBS" button by text - the existing button on GBS SYNC panel
  function findSubmitBtn() {
    var btns = document.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var t = (btns[i].textContent || '').trim();
      if (/Submit\s+on\s+GBS/i.test(t)) return btns[i];
    }
    return null;
  }

  // Check current local + remote state to decide UI
  function fetchState() {
    return fetch('/api/method/frappe.client.get_value', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': (window.frappe && window.frappe.csrf_token) || '' },
      body: JSON.stringify({
        doctype: docType,
        filters: ticketId,
        // v3 (2026-05-29): include gbs_resubmit_pushed_count so button can hide
        // after user resubmits + Finance approves + sync pushes data to boxme.
        fieldname: ['status', 'gbs_status', 'gbs_doc_name', 'resubmit_count', 'gbs_resubmit_pushed_count']
      })
    }).then(function(r){ return r.json(); }).then(function(d){
      var msg = (d && d.message) || {};
      return msg.message || msg;
    }).catch(function(){ return {}; });
  }

  function openModal(state) {
    var modal = document.createElement('div');
    modal.className = 'ec-gbs-resubmit-modal';
    var rc = (state && state.resubmit_count) || 0;
    modal.innerHTML = [
      '<div class="modal-card">',
      '  <h3>Resubmit doc sang GBS</h3>',
      '  <div class="modal-info">',
      '    Doc <b>' + ticketId + '</b> bị GBS reject. Resubmit sẽ:<br>',
      '    1. Mở form ở chế độ <b>Chỉnh sửa</b> — bạn có thể sửa fields, items, attachments<br>',
      '    2. Sau khi bạn submit form, Finance sẽ <b>duyệt lại</b><br>',
      '    3. Khi Finance duyệt, hệ thống tự push sang GBS<br>',
      '    Đây là lần resubmit thứ <b>' + (rc + 1) + '</b>.',
      '  </div>',
      '  <textarea id="resubmit-reason" placeholder="Lý do resubmit (optional)..."></textarea>',
      '  <div class="modal-actions">',
      '    <button class="btn-cancel" id="resubmit-cancel">Huỷ</button>',
      '    <button class="btn-confirm" id="resubmit-confirm">Xác nhận resubmit</button>',
      '  </div>',
      '</div>'
    ].join('\n');
    document.body.appendChild(modal);

    document.getElementById('resubmit-cancel').addEventListener('click', function(){
      modal.remove();
    });
    modal.addEventListener('click', function(e){
      if (e.target === modal) modal.remove();
    });
    document.getElementById('resubmit-confirm').addEventListener('click', function(){
      var btn = document.getElementById('resubmit-confirm');
      var reason = document.getElementById('resubmit-reason').value.trim();
      btn.disabled = true; btn.textContent = 'Đang resubmit...';
      fetch('/api/method/resubmit_gbs_doc', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doctype: docType, name: ticketId, reason: reason })
      }).then(function(r){ return r.json(); }).then(function(d){
        var msg = (d && d.message) || {};
        if (!msg.success) throw new Error(msg.error || msg.hint || 'resubmit_failed');
        modal.remove();
        // v2 (2026-05-29): redirect to form edit mode so user can update fields/items/attachments
        // before re-submitting. After form Submit → resubmit_gbs_so/po → status=Pending → Finance approve → sync to boxme.
        var redirect = msg.redirect_to || ((docType === 'GBS Sales Order' ? '/gbs-so-form-v2?edit=' : '/gbs-po-form-v2?edit=') + encodeURIComponent(ticketId));
        location.href = redirect;
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'Xác nhận resubmit';
        alert('Lỗi: ' + e.message);
      });
    });
  }

  function ensureButton() {
    fetchState().then(function(state){
      var gbsStatus = ((state.gbs_status || '') + '').toLowerCase();
      var locStatus = ((state.status || '') + '').toLowerCase();
      var hasDoc = !!state.gbs_doc_name;
      // v3 (2026-05-29): hide button after user has resubmitted + sync has pushed.
      // Show again only when GBS rejects a NEW version (next resubmit cycle).
      var resubmitCount = parseInt(state.resubmit_count || 0, 10);
      var pushedCount   = parseInt(state.gbs_resubmit_pushed_count || 0, 10);
      // v4 (2026-06-02): show button on EVERY rejection (incl re-rejection after prior cycle).
      // v3 hid button when counts matched (cycle "done"), but boxme can re-reject after
      // push - then gbs_status=Rejected stays with counts matched. New logic: show whenever
      // boxme is Rejected AND no pending push (sync caught up).
      // v4_btn_visibility_2026-06-02
      var hasPendingPush = resubmitCount > pushedCount;

      // Show Resubmit when:
      //   - local Approved AND
      //   - has gbs_doc_name AND
      //   - boxme rejected (gbs_status contains 'reject') AND
      //   - this rejection hasn't been resubmitted+pushed yet
      var shouldShow = (locStatus === 'approved' && hasDoc && gbsStatus.indexOf('reject') >= 0); /* v5_no_pending_check_2026-07-14: hasPendingPush check removed - counter reset by unknown writer blocks button */

      // Remove existing Resubmit button if exists
      var existing = document.getElementById('ec-gbs-resubmit-btn');
      if (existing && !shouldShow) {
        existing.remove();
        /* ec-resubmit-merge-v1: the button now lives inside a top banner - drop that too */
        var _bnRemove = document.getElementById('ec-gbs-resubmit-banner');
        if (_bnRemove) _bnRemove.remove();
        /* ec-resubmit-repoll-v1: un-hide the Submit-on-GBS button this block hid */
        var _sbRestore = findSubmitBtn(); if (_sbRestore) _sbRestore.style.display = '';
      }

      if (!shouldShow) {
        // Re-check every 3s in case state changes
        setTimeout(ensureButton, 3000);
        return;
      }

      /* ec-resubmit-repoll-v1: previously `return` with no re-poll, so once the button
         was inserted ensureButton() never ran again — after the user resubmitted and
         status flipped to 'Cần sửa' the stale Resubmit button stayed on screen next to
         the banner's "Sửa & Submit lại". Keep the 3s poll alive so it gets removed. */
      if (existing) { setTimeout(ensureButton, 3000); return; }

      /* ec-resubmit-merge-v1 2026-08-03: the resubmit CTA used to be injected at the
         BOTTOM of the page, next to "Check Status", labelled "Resubmit" - while the
         next stage ("Can sua") showed a DIFFERENT button at the TOP labelled
         "Sua & Submit lai". Two names, two places, one and the same flow; reported as
         "2 nut resubmit 1 duoi 1 tren khong dong bo". Both stages now render a single
         button with the same label in the same spot at the top of the detail panel.
         Same anchor + same styling as #ec-can-sua-banner, so the page looks unchanged
         to the user as the doc moves from one stage to the next. */

      // "Submit on GBS" would 417 while boxme holds the doc Rejected - keep it hidden.
      var submitBtn = findSubmitBtn();
      if (submitBtn) submitBtn.style.display = 'none';

      var host = document.querySelector('#content') || document.querySelector('main') || document.body;
      if (!host) { setTimeout(ensureButton, 1000); return; }

      var banner = document.createElement('div');
      banner.id = 'ec-gbs-resubmit-banner';
      banner.innerHTML =
        '<div class="ecrb-title">\u26a0\ufe0f GBS \u0111\u00e3 t\u1eeb ch\u1ed1i doc n\u00e0y</div>' +
        '<div class="ecrb-reason">B\u1ea5m n\u00fat b\u00ean d\u01b0\u1edbi \u0111\u1ec3 nh\u1eadp l\u00fd do, r\u1ed3i form s\u1ebd m\u1edf \u1edf ch\u1ebf \u0111\u1ed9 ch\u1ec9nh s\u1eeda. S\u1eeda xong b\u1ea5m Submit l\u1ea1i, doc ch\u1ea1y l\u1ea1i chu\u1ed7i duy\u1ec7t t\u1eeb Finance.</div>';

      var btn = document.createElement('button');
      btn.id = 'ec-gbs-resubmit-btn';
      btn.className = 'ec-gbs-resubmit-btn';
      btn.textContent = 'S\u1eeda & Submit l\u1ea1i';
      btn.addEventListener('click', function(){ openModal(state); });
      banner.appendChild(btn);

      if (host.firstChild) host.insertBefore(banner, host.firstChild);
      else host.appendChild(banner);
      console.log('[ec-gbs-resubmit] banner inserted at top (gbs_status=' + state.gbs_status + ')');
      /* ec-resubmit-merge-v1: re-arm the poll on the INSERT path too. ec-resubmit-repoll-v1
         only re-armed on the "already exists" path, which was unreachable because this path
         fell off the end of the function - so after the very first insert the poll died and
         the button could go stale again once the doc moved to "Can sua". */

      var msg = d && d.message;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', poll);
  } else {

  }
})();

<script id="ec-approval-list-url-state">
(function(){
  'use strict';
  if (window._ecApprovalListV1Installed) return;
  window._ecApprovalListV1Installed = true;

  // Only run on /approval list (no ?id query)
  var isListView = function(){
    var p = (location.pathname || '').replace(/\/+$/, '');
    if (p !== '/approval') return false;
    var q = new URLSearchParams(location.search);
    return !q.get('id');
  };

  // Inject CSS
  if (!document.getElementById('ec-approval-list-css')) {
    var st = document.createElement('style');
    st.id = 'ec-approval-list-css';
    st.textContent = [
      '.detail-id-link { text-decoration: none; color: inherit; display: inline-block; }',
      '.detail-id-link:hover .id-cell { text-decoration: underline; }'
    ].join('\n');
    document.head.appendChild(st);
  }

  var FIELDS = ['type', 'status', 'dept', 'search', 'dateFrom', 'dateTo', 'card', 'gbsPhase', 'mine'];

  window._ecSyncApprovalFilterToURL = function(){
    try {
      if (!isListView()) return;
      var LS = window.ListState;
      if (!LS || !LS.filter) return;
      var f = LS.filter;
      var params = new URLSearchParams();
      if (f.type && f.type !== 'all') params.set('type', f.type);
      if (f.status) params.set('status', f.status);
      if (f.dept) params.set('dept', f.dept);
      if (f.search) params.set('q', f.search);
      if (f.dateFrom) params.set('from', f.dateFrom);
      if (f.dateTo) params.set('to', f.dateTo);
      if (f.card) params.set('card', f.card);
      if (f.gbsPhase) params.set('gbsPhase', f.gbsPhase);
      if (f.mine) params.set('mine', '1');
      var qs = params.toString();
      var newUrl = location.pathname + (qs ? ('?' + qs) : '');
      if (newUrl !== location.pathname + location.search) {
        history.replaceState(null, '', newUrl);
      }
    } catch (e) {}
  };

  window._ecRestoreApprovalFilterFromURL = function(){
    try {
      if (!isListView()) return;
      var LS = window.ListState;
      if (!LS || !LS.filter) return;
      var params = new URLSearchParams(location.search);
      if (params.has('type')) LS.filter.type = params.get('type');
      if (params.has('status')) LS.filter.status = params.get('status');
      if (params.has('dept')) LS.filter.dept = params.get('dept');
      if (params.has('q')) LS.filter.search = params.get('q');
      if (params.has('from')) LS.filter.dateFrom = params.get('from');
      if (params.has('to')) LS.filter.dateTo = params.get('to');
      if (params.has('card')) LS.filter.card = params.get('card');
      if (params.has('gbsPhase')) LS.filter.gbsPhase = params.get('gbsPhase');
      if (params.has('mine')) LS.filter.mine = params.get('mine') === '1';
    } catch (e) {}
  };

  // Wait for ListState + first renderList completion, then restore + re-render
  var restored = false;
  var attempt = 0;
  var maxAttempts = 60; // 30 sec
  function attemptRestore(){
    attempt++;
    if (attempt > maxAttempts) return;
    if (!isListView()) return;
    var LS = window.ListState;
    var listBody = document.getElementById('listBody');
    if (!LS || !LS.filter || !listBody || restored) {
      setTimeout(attemptRestore, 500);
      return;
    }
    // Check URL has any filter param
    var q = location.search;
    if (q.length <= 1) { restored = true; return; } // no params - keep defaults
    window._ecRestoreApprovalFilterFromURL();
    restored = true;
    // Update DOM controls to reflect restored state
    var setEl = function(id, v){ var el = document.getElementById(id); if (el) el.value = v || ''; };
    setEl('listSearch', LS.filter.search);
    setEl('listStatus', LS.filter.status);
    setEl('listDept', LS.filter.dept);
    setEl('listDateFrom', LS.filter.dateFrom);
    setEl('listDateTo', LS.filter.dateTo);
    var fgp = document.getElementById('listGbsPhase'); if (fgp) fgp.value = LS.filter.gbsPhase || '';
    // Update active tab
    var activeTab = LS.filter.mine ? 'mine' : LS.filter.type;
    document.querySelectorAll('.list-tab').forEach(function(tab){
      tab.classList.toggle('active', tab.dataset.tab === activeTab);
    });
    // Trigger re-render via refreshBody if exposed, else click clear+re-apply
    try {
      var lb = document.getElementById('listBody');
      // Find the refreshBody by triggering a filter change: simulate input event on search
      // Actually simpler: dispatch change on listStatus (which calls refreshBody in wire-up)
      var s = document.getElementById('listStatus');
      if (s) s.dispatchEvent(new Event('change', { bubbles: true }));
    } catch(e){}
    console.log('[ec-approval-list-v1] filter restored from URL', LS.filter);
  }

  // Watch #listBody for changes to sync URL after re-renders
  var obs = new MutationObserver(function(){
    window._ecSyncApprovalFilterToURL();
  });
  function attachObs(){
    var lb = document.getElementById('listBody');
    if (!lb) { setTimeout(attachObs, 500); return; }
    obs.observe(lb, { childList: true, subtree: false });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ attemptRestore(); attachObs(); });
  } else {
    attemptRestore(); attachObs();
  }
})();
