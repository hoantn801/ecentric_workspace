<style id="ec-mywork-css">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* Frappe's default website chrome is replaced by the shared ERP shell. */
body > header, body > footer, body > nav.navbar, header.navbar,
.web-page-header, #navbarSupportedContent, .navbar-collapse { display:none; }
body { padding:0; margin:0; }
body main { padding-top:0; }
body .main-section, body main.container, body main.fluid { margin:0; padding:0; max-width:100%; }
.ec-mw-shellwrap { display:flex; min-height:100vh; max-width:none; width:100%; }
.ec-mw-shellwrap > main.ec-mw-shellmain { flex:1; min-width:0; padding:0; overflow-x:hidden; }

/* Chi dinh nghia nhung gi drawer KHONG co: khung trang, tieu de, trang thai.
   Ban than cac dong dung .ec-shell-rm-* cua ec_shell.bundle.css -- xem
   ghi chu trong ec-mywork-js. */
.ecw{
  --ink:#141A2E; --ink-2:#4C5372; --ink-3:#7E859E; --navy:#1E2A5A;
  --line:#E4E7F0; --line-2:#EEF0F7; --card:#FFFFFF; --bg:#F5F6FA;
  --red:#B42318; --red-bg:#FDEEF0;
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.ecw *{box-sizing:border-box}
.ecw .wrap{max-width:720px; margin:0 auto; padding:24px 18px 96px}

/* ---------- tieu de + nut gat tren CUNG mot hang ---------- */
.ecw .head{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.ecw h1{margin:0; font-size:clamp(21px,5.4vw,27px); font-weight:780;
  letter-spacing:-.035em; line-height:1.15; white-space:nowrap}
.ecw .mw-switch{
  margin-left:auto; display:inline-flex; gap:2px; padding:3px; flex:0 0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  box-shadow:0 1px 2px rgba(20,26,46,.05);
}
.ecw .mw-switch button{
  border:0; background:transparent; font:inherit; font-size:13px; font-weight:600;
  color:var(--ink-3); padding:6px 12px; border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:background .14s ease, color .14s ease;
}
.ecw .mw-switch button.on{background:var(--navy); color:#fff}
.ecw .mw-switch button:focus-visible{outline:2px solid var(--navy); outline-offset:2px}
.ecw .mw-switch b{font-variant-numeric:tabular-nums; font-weight:700; font-size:12px; opacity:.72}
.ecw .mw-dot{width:6px; height:6px; border-radius:50%; background:#D7263D; display:inline-block}
.ecw .mw-switch button.on .mw-dot{background:#F7C948}
.ecw .mw-dot[hidden]{display:none}

/* ---------- tieu de nhom: nhan + duong ke chay het hang ---------- */
.ecw .mw-sect{margin-bottom:26px}
.ecw .mw-head, .ecw .mw-nbar{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:0 2px 11px; margin:0; background:transparent; border:0; cursor:default;
  font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3);
}
.ecw .mw-head:hover{background:transparent}
.ecw .mw-head::after, .ecw .mw-rule{content:""; flex:1 1 auto; height:1px; background:var(--line)}
.ecw .mw-nbar button{
  border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:650;
  letter-spacing:0; text-transform:none; color:var(--navy); cursor:pointer;
  padding:2px 2px; flex:0 0 auto;
}
.ecw .mw-nbar button:disabled{color:var(--ink-3); cursor:default}

/* ---------- dong = the. Drawer da tao dang san, o day chi doi cho no
     dung tren nen trang thay vi trong mot khung trang khac. ---------- */
.ecw .mw-list{display:flex; flex-direction:column; gap:8px}
.ecw a.ec-shell-rm-item, .ecw a.ec-shell-nc-item{
  margin:0; padding:12px 13px; border-radius:13px;
  background:var(--card); border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(20,26,46,.05);
  transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease;
}
.ecw a.ec-shell-rm-item:hover, .ecw a.ec-shell-nc-item:hover{
  background:var(--card); border-color:#CFD6E6;
  box-shadow:0 2px 4px rgba(20,26,46,.07); transform:none;
}
.ecw a.ec-shell-rm-item.ec-shell-rm-od{background:#FEF3F2; border-color:#F7D2CE}
.ecw a.ec-shell-rm-item.ec-shell-rm-od:hover{background:#FEE9E7; border-color:#F2BDB7}
.ecw a.ec-shell-rm-item.ec-shell-rm-now{background:#FFFAEB; border-color:#F5E3B0}
.ecw a.ec-shell-rm-item.ec-shell-rm-now:hover{background:#FEF4DA; border-color:#EFD68C}
.ecw .ec-shell-rm-ic{width:36px; height:36px; border-radius:11px}
.ecw .ec-shell-rm-ic svg{width:19px; height:19px}
.ecw .ec-shell-rm-title{font-size:14px}
.ecw .ec-shell-rm-meta{font-size:11.5px}
.ecw .ec-shell-rm-due{font-size:12px; font-weight:600; color:var(--ink-3)}
.ecw a.ec-shell-rm-item.ec-shell-rm-od .ec-shell-rm-due{color:var(--red)}
.ecw .ec-shell-rm-chevr{font-size:16px}

/* thong bao: chua doc thi vien dam hon, khong doi mau nen -- de danh mau
   nen cho muc do gap cua LAN VIEC, tranh hai he mau da nhau. */
.ecw a.ec-shell-nc-item{align-items:flex-start; gap:10px}
.ecw a.ec-shell-nc-unread{border-color:#C6D0EE}
.ecw a.ec-shell-nc-item .ec-shell-nc-dot{margin-top:6px; width:7px; height:7px}
.ecw .ec-shell-nc-title{font-size:13.5px; white-space:normal}
.ecw .ec-shell-nc-when{font-size:11.5px}

.ecw .mw-more{
  display:block; width:100%; margin-top:2px; padding:11px; text-align:center;
  border:1px dashed var(--line); border-radius:12px; background:transparent;
  font:inherit; font-size:13.5px; font-weight:650; color:var(--navy); cursor:pointer;
}
.ecw .mw-more:hover{background:var(--card); border-style:solid}
.ecw .mw-more[disabled]{color:var(--ink-3); cursor:default}

/* ---------- trang thai ---------- */
.ecw .empty{text-align:center; padding:52px 20px; color:var(--ink-3)}
.ecw .empty svg{width:84px; height:84px}
.ecw .empty p{margin:16px 0 0; font-size:14.5px; line-height:1.6}
.ecw .err{
  background:var(--red-bg); border:1px solid #F2BDB7; border-radius:13px;
  padding:15px 17px; color:var(--ink); font-size:14px;
}
.ecw .err button{
  margin-top:10px; border:0; background:var(--navy); color:#fff; font:inherit;
  font-size:13.5px; font-weight:650; padding:9px 17px; border-radius:9px; cursor:pointer;
}
.ecw .sk{display:flex; flex-direction:column; gap:8px}
.ecw .sk div{
  display:grid; grid-template-columns:36px minmax(0,1fr); gap:11px; align-items:center;
  padding:12px 13px; background:var(--card); border:1px solid var(--line); border-radius:13px;
}
.ecw .sk i{display:block; border-radius:10px;
  background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));
  background-size:200% 100%; animation:ecw-sh 1.15s linear infinite}
.ecw .sk i.a{width:36px; height:36px}
.ecw .sk i.b{height:12px; width:58%}
@keyframes ecw-sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .ecw .sk i{animation:none} .ecw .mw-switch button{transition:none} }

@media (max-width:420px){
  .ecw .wrap{padding:18px 13px 110px}
  .ecw .head{gap:8px}
  .ecw .mw-switch button{padding:6px 10px; font-size:12.5px}
}
/* May man hinh hep (320px): tieu de + nut gat khong con vua mot hang. Bo con
   so trong nut -- so luong da nam ngay tren tieu de tung nhom ben duoi roi. */
@media (max-width:380px){
  .ecw h1{font-size:19px}
  .ecw .mw-switch{padding:2px}
  .ecw .mw-switch button{padding:6px 9px; font-size:12px; gap:5px}
  .ecw .mw-switch b{display:none}
}
</style>

<script id="ec-mywork-js">
/* Việc của tôi -- trang đầy đủ của drawer o header.
 *
 * DUNG LAI GIAO DIEN CUA DRAWER, KHONG CHEP LAI:
 *   moi dong dung DUNG cac class .ec-shell-rm-* / .ec-shell-nc-* ma drawer
 *   dung, va ec_shell.bundle.css duoc nap tren MOI trang website. Nen trang va
 *   drawer trong giong het nhau, va sua mau/khoang cach o mot cho thi ca hai
 *   doi theo. Chep CSS sang day la cach chac chan de hai ben lech nhau.
 *
 * HAI LAN -> HAI TAB:
 *   tren may tinh drawer dat Viec va Thong bao canh nhau. Tren dien thoai
 *   khong du be ngang cho hai cot, nen chuyen thanh nut gat. Van la HAI lan
 *   TACH BIET nhu drawer: tron chung mot dong thoi gian thi thong bao vun vat
 *   se day viec that ra khoi tam mat.
 *
 * KHONG co logic nghiep vu: phan loai / han / thu tu / phan trang deu do
 * server quyet dinh. Moi dong la mot the <a> tro toi `action_url` server da
 * dung san -- moi thao tac duyet xay ra o TRANG DICH.
 */
(function () {
  "use strict";

  var API = "/api/method/ecentric_workspace.action_center.api.get_action_items";
  var NC = "/api/method/ecentric_workspace.notification_center.api.";
  var PAGE = 30;

  //: nhan giong drawer -- cung mot thu thi phai goi cung mot ten
  var BUCKETS = [
    { key: "overdue",  label: "Quá hạn",    gcls: "ec-shell-rm-overdue" },
    { key: "act_now",  label: "Đang xử lý", gcls: "ec-shell-rm-actnow" },
    { key: "upcoming", label: "Sắp tới",    gcls: "" },
    { key: "undated",  label: "Không hạn",  gcls: "" }
  ];

  //: cung bo icon + tone class drawer dung (ec_shell.js _RM_ICON)
  var ICONS = {
    check:     '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    inbox2:    '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 13h5l1 2h6l1-2h5"/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    chart:     '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    doc:       '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/>'
  };
  var TONE = {
    approval:      ["check", "ec-shell-rm-t-appr"],
    fulfillment:   ["inbox2", "ec-shell-rm-t-ful"],
    task:          ["briefcase", "ec-shell-rm-t-task"],
    weekly_report: ["chart", "ec-shell-rm-t-wtu"],
    generic:       ["doc", "ec-shell-rm-t-gen"]
  };

  var view = "work";
  var W = { items: [], counts: {}, total: 0, cursor: null, loaded: false, loading: false, error: "" };
  var N = { items: [], unread: 0, loaded: false, loading: false, error: "" };

  function el(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function tone(it) {
    var key = (it.action_stage === "fulfillment") ? "fulfillment"
            : (it.source_type || it.source_key || "generic");
    return TONE[key] || TONE.generic;
  }

  /* Han hien theo NGAY. Server tra "" khi khong co han -> hien dung "Khong han"
     thay vi bia ra mot ngay. */
  function dueText(due) {
    var raw = String(due || "");
    return raw ? (raw.slice(8, 10) + "/" + raw.slice(5, 7)) : "Không hạn";
  }

  function rowHtml(it) {
    var ic = tone(it);
    var meta = [it.source_label || "", it.subtitle || ""].filter(Boolean).join(" · ");
    var cls = "ec-shell-rm-item"
            + (it.bucket === "overdue" ? " ec-shell-rm-od" : "")
            + (it.bucket === "act_now" ? " ec-shell-rm-now" : "");
    return '<a class="' + cls + '" href="' + esc(it.action_url || "#") + '">'
      + '<span class="ec-shell-rm-ic ' + ic[1] + '" aria-hidden="true">'
      + '<svg viewBox="0 0 24 24">' + ICONS[ic[0]] + "</svg></span>"
      + '<span class="ec-shell-rm-txt">'
      + '<span class="ec-shell-rm-title">' + esc(it.title || it.reference_name || "Việc cần làm") + "</span>"
      + (meta ? '<span class="ec-shell-rm-meta">' + esc(meta) + "</span>" : "")
      + "</span>"
      + '<span class="ec-shell-rm-due">' + esc(dueText(it.due_at)) + "</span>"
      + '<span class="ec-shell-rm-chevr" aria-hidden="true">›</span></a>';
  }

  function notiHtml(it) {
    var when = esc(it.age || it.creation_display || "");
    return '<a class="ec-shell-nc-item' + (it.is_read ? "" : " ec-shell-nc-unread")
      + '" href="' + esc(it.action_url || "#") + '">'
      + '<span class="ec-shell-nc-dot" aria-hidden="true"></span>'
      + '<span class="ec-shell-nc-txt">'
      + '<span class="ec-shell-nc-title">' + esc(it.title || it.subject || "") + "</span>"
      + (when ? '<span class="ec-shell-nc-when">' + when + "</span>" : "")
      + "</span></a>";
  }

  function mascotHtml(line1, line2) {
    return '<div class="empty">'
      + '<svg viewBox="0 0 64 64" aria-hidden="true">'
      + '<rect x="6" y="10" width="52" height="44" rx="14" fill="#F7C948"/>'
      + '<circle cx="24" cy="30" r="3.2" fill="#1E2A5A"/><circle cx="40" cy="30" r="3.2" fill="#1E2A5A"/>'
      + '<path d="M24 39c3 3 13 3 16 0" stroke="#1E2A5A" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      + "</svg><p>" + esc(line1) + (line2 ? "<br>" + esc(line2) : "") + "</p></div>";
  }

  function errHtml(msg, retryView) {
    return '<div class="err">' + esc(msg)
      + '<br><button type="button" class="mw-retry" data-retry="' + retryView + '">Thử lại</button></div>';
  }

  function skeleton() {
    return '<div class="sk" aria-hidden="true">'
      + '<div><i class="a"></i><i class="b"></i></div>'.repeat(4) + "</div>";
  }

  function renderWork() {
    if (W.loading && !W.loaded) return skeleton();
    if (W.error) return errHtml(W.error, "work");
    if (!W.items.length) return mascotHtml("Không có việc nào đang chờ bạn.", "Xong hết rồi — hiếm lắm đấy.");
    var h = [];
    BUCKETS.forEach(function (b) {
      var rows = W.items.filter(function (it) { return it.bucket === b.key; });
      if (!rows.length) return;
      var n = W.counts[b.key] || rows.length;
      h.push('<section class="mw-sect">'
        + '<h2 class="ec-shell-rm-group ' + b.gcls + ' mw-head">' + esc(b.label)
        + ' <span class="ec-shell-rm-gcount">(' + n + ")</span></h2>"
        + '<div class="mw-list">' + rows.map(rowHtml).join("") + "</div></section>");
    });
    if (W.cursor) {
      h.push('<button type="button" class="ec-shell-rm-more mw-more" id="mw-more">Tải thêm</button>');
    }
    return h.join("");
  }

  function renderNoti() {
    if (N.loading && !N.loaded) return skeleton();
    if (N.error) return errHtml(N.error, "noti");
    if (!N.items.length) return mascotHtml("Chưa có thông báo nào.", "");
    var bar = '<div class="mw-nbar"><span>'
      + (N.unread > 0 ? N.unread + ' chưa đọc' : 'Đã đọc hết')
      + '</span><span class="mw-rule"></span>'
      + (N.unread > 0 ? '<button type="button" id="mw-readall">Đọc hết</button>' : '')
      + '</div>';
    return '<section class="mw-sect">' + bar
      + '<div class="mw-list">' + N.items.map(notiHtml).join("") + "</div></section>";
  }

  function paint() {
    el("mw-body").innerHTML = (view === "work") ? renderWork() : renderNoti();
    var wn = el("mw-n-work");
    wn.textContent = W.loaded ? String(W.total) : "";
    var dot = el("mw-dot");
    dot.hidden = !(N.loaded && N.unread > 0);
  }

  function setView(next) {
    view = next;
    var btns = el("mw-switch").querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].dataset.view === next;
      btns[i].classList.toggle("on", on);
      btns[i].setAttribute("aria-selected", on ? "true" : "false");
    }
    paint();
    if (next === "noti" && !N.loaded && !N.loading) loadNoti();
  }

  async function loadWork(more) {
    if (W.loading) return;
    W.loading = true; W.error = "";
    var btn = el("mw-more");
    if (btn) { btn.disabled = true; btn.textContent = "Đang tải…"; }
    try {
      var url = API + "?limit=" + PAGE + (more && W.cursor
                ? "&cursor=" + encodeURIComponent(W.cursor) : "");
      var res = await fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (res.status === 401 || res.status === 403) {
        location.replace("/login?redirect-to=" + encodeURIComponent(location.pathname));
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = (await res.json()).message || {};
      if (!data.success) throw new Error(data.error || "Không tải được danh sách.");
      W.items  = more ? W.items.concat(data.items || []) : (data.items || []);
      W.counts = data.counts || {};
      W.total  = typeof data.total === "number" ? data.total : W.items.length;
      W.cursor = data.next_cursor || null;
      W.loaded = true;
    } catch (e) {
      if (more) {
        var b = el("mw-more");
        if (b) { b.disabled = false; b.textContent = "Tải thêm — thử lại"; }
        W.loading = false;
        return;
      }
      W.error = "Không tải được danh sách việc. " + (e && e.message ? e.message : "");
      W.loaded = true;
    } finally {
      W.loading = false;
    }
    if (view === "work") paint(); else paint();
  }

  async function loadNoti() {
    if (N.loading) return;
    N.loading = true; N.error = "";
    if (view === "noti") paint();
    try {
      var res = await fetch(NC + "get_notifications?limit=" + PAGE,
        { credentials: "same-origin", headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var m = (await res.json()).message || {};
      N.items = m.items || [];
      N.unread = m.unread || 0;
    } catch (e) {
      N.error = "Không tải được thông báo. " + (e && e.message ? e.message : "");
    } finally {
      N.loading = false;
      N.loaded = true;
    }
    paint();
  }

  async function readAll() {
    var btn = el("mw-readall");
    if (btn) { btn.disabled = true; btn.textContent = "Đang xử lý…"; }
    try {
      await fetch(NC + "mark_all_read", {
        method: "POST", credentials: "same-origin",
        headers: { Accept: "application/json",
                   "X-Frappe-CSRF-Token": (window.frappe && window.frappe.csrf_token) || "" }
      });
      N.items = N.items.map(function (it) { it.is_read = 1; return it; });
      N.unread = 0;
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = "Đọc hết — thử lại"; return; }
    }
    paint();
  }

  document.addEventListener("click", function (ev) {
    if (!ev.target.closest) return;
    var sw = ev.target.closest("#mw-switch button");
    if (sw) { setView(sw.dataset.view); return; }
    if (ev.target.closest("#mw-more")) { loadWork(true); return; }
    if (ev.target.closest("#mw-readall")) { readAll(); return; }
    var rt = ev.target.closest(".mw-retry");
    if (rt) { if (rt.dataset.retry === "noti") { N.loaded = false; loadNoti(); } else { loadWork(false); } }
  });

  loadWork(false);
})();
</script>
</main></div>
