  function dcD(t){return t.exp_end_date?String(t.exp_end_date).slice(0,10):null;}

  /* G4.3: terminal mirrors backend pmperm.is_task_terminal (workflow_state OR status). Backend is the trust boundary; this only hides UI. */
  function pmTerminal(t){return !!t&&(["Done","Cancelled"].indexOf(t.workflow_state)>=0||["Completed","Cancelled","Closed"].indexOf(t.status)>=0);}
  function dcToday10(){return new Date().toISOString().slice(0,10);}
  function dcWeek10(){var e=new Date();e.setDate(e.getDate()+7);return e.toISOString().slice(0,10);}
  function dcIsOverdue(t){var d=dcD(t);return !!(d&&d<dcToday10()&&dcActive(t));}
  function dcIsToday(t){return dcD(t)===dcToday10()&&dcActive(t);}
  function dcIsWeek(t){var d=dcD(t);return !!(d&&d>dcToday10()&&d<=dcWeek10()&&dcActive(t));}
  var DC_REASON={overdue:["Quá hạn","#c0392b","#fcebeb"],blocked:["Blocked","#a32d2d","#fcebeb"],review:["Chờ duyệt","#925f00","#fff7e6"],today:["Hôm nay","#1f2d80","#eef0fb"],week:["Tuần này","#185fa5","#e6f1fb"],noassignee:["Chưa giao","#925f00","#fff7e6"],nodue:["Chưa có hạn","#4b5563","#f3f4f6"]};
  function dcReasonBadge(r){var m=DC_REASON[r]||["","",""];return '<span class="dc-reason" style="color:'+m[1]+';background:'+m[2]+'">'+m[0]+'</span>';}
  function dcReasonOf(t){if(!dcActive(t))return null;
    if(dcIsOverdue(t))return "overdue";
    if(t.workflow_state==="Blocked")return "blocked";
    if(t.workflow_state==="Review")return "review";
    if(dcIsToday(t))return "today";
    if(dcIsWeek(t))return "week";
    if(names(t._assign).length===0)return "noassignee";
    if(!t.exp_end_date)return "nodue";
    return null;}
  function dcProjectHealth(tasks,projs){var by={};
    tasks.forEach(function(t){var p=t.project;if(!p)return;var a=by[p]||(by[p]={open:0,overdue:0,blocked:0,review:0,noass:0,nodue:0,total:0,done:0});
      a.total++;if(t.workflow_state==="Done")a.done++;if(dcActive(t))a.open++;if(dcIsOverdue(t))a.overdue++;if(t.workflow_state==="Blocked")a.blocked++;if(t.workflow_state==="Review")a.review++;if(dcActive(t)&&names(t._assign).length===0)a.noass++;if(dcActive(t)&&!t.exp_end_date)a.nodue++;});
    var out=projs.map(function(p){var a=by[p.name]||{open:0,overdue:0,blocked:0,review:0,noass:0,nodue:0,total:0,done:0};
      var lvl=(a.overdue>0||a.blocked>0)?"high":((a.review>0||a.noass>0)?"attention":"stable");
      return {name:p.name,project_name:p.project_name||p.name,manager:p.ec_manager||"-",progress:(p.progress!=null?p.progress:0),lvl:lvl,a:a};});
    var rank={high:0,attention:1,stable:2};
    out.sort(function(x,y){return (rank[x.lvl]-rank[y.lvl])||(y.a.overdue-x.a.overdue)||(y.a.open-x.a.open);});return out;}
  function dcWorkload(tasks){var wl={};
    tasks.forEach(function(t){names(t._assign).forEach(function(u){var w=wl[u]||(wl[u]={u:u,open:0,overdue:0,today:0,week:0,blocked:0,review:0,nodue:0});
      if(dcActive(t))w.open++;if(dcIsOverdue(t))w.overdue++;if(dcIsToday(t))w.today++;if(dcIsWeek(t))w.week++;if(t.workflow_state==="Blocked")w.blocked++;if(t.workflow_state==="Review")w.review++;if(dcActive(t)&&!t.exp_end_date)w.nodue++;});});
    return Object.keys(wl).map(function(k){return wl[k];}).sort(function(a,b){return b.open-a.open;});}

  function pmTaskMenuHtml(name){if(!pmCanDeleteTask())return "";
    return '<div class="pm-pcard-menu"><button class="pm-pcard-menu-btn" data-tmenu="'+esc(name)+'" aria-label="Tác vụ">⋯</button><div class="pm-pcard-menu-pop" data-tmenupop="'+esc(name)+'"><button class="pm-pcard-mi danger" data-tact="del" data-task="'+esc(name)+'">Xoá nhiệm vụ</button></div></div>';}
  function pmWireTaskMenus(scope){if(!scope)return;
    Array.prototype.forEach.call(scope.querySelectorAll(".pm-pcard-menu-btn[data-tmenu]"),function(b){b.onclick=function(e){e.stopPropagation();var pop=b.parentNode.querySelector(".pm-pcard-menu-pop");var willOpen=!pop.classList.contains("open");pmCloseProjMenus(pop);pop.classList.toggle("open",willOpen);};});
    Array.prototype.forEach.call(scope.querySelectorAll(".pm-pcard-mi[data-tact=del]"),function(b){b.onclick=function(e){e.stopPropagation();if(b.disabled)return;pmCloseProjMenus(null);confirmDeleteTask(b.getAttribute("data-task"));};});}
  function confirmDeleteTask(name){openD();el("pm-drawer").classList.add("pm-d-sm");el("pm-dt").textContent="Xoá nhiệm vụ";var c=el("pm-dbody");c.classList.remove("pm-cols");spin(c);
    api(PM+"tasks.get",{name:name}).then(function(res){var t=(res&&res.task)||{};var subj=t.subject||name;
      c.innerHTML='<div style="padding:2px 0 14px;font-size:13.5px;color:var(--gray-700);line-height:1.5">Bạn sắp xoá vĩnh viễn nhiệm vụ <b>'+esc(subj)+'</b> (<code>'+esc(name)+'</code>).<br><span style="color:#c0392b;font-weight:600">Hành động này không thể hoàn tác.</span></div>'+
        '<div style="display:flex;gap:8px"><button class="pm-btn danger" id="td-del">Xoá vĩnh viễn</button><button class="pm-btn" id="td-cancel">Huỷ</button></div>';
      el("td-cancel").onclick=closeD;
      el("td-del").onclick=function(){var btn=this;btn.disabled=true;btn.textContent="Đang xoá...";
        api(PM+"tasks.delete",{name:name}).then(function(){toast("Đã xoá nhiệm vụ");closeD();refreshTaskContext();}).catch(function(e){toast("Lỗi: "+errOf(e),true);btn.disabled=false;btn.textContent="Xoá vĩnh viễn";});};
    }).catch(function(e){c.innerHTML='<div class="pm-err">'+esc(errOf(e))+'</div>';});}
  function renderProjectCards(c){var rows=pmFilterProjects(); if(!rows.length){return emptyBox(c,"Không có dự án phù hợp.");}
    c.innerHTML='<div class="pm-pcards">'+rows.map(function(p){var prog=(p.progress!=null?p.progress:(p.percent_complete||0));
      return '<div class="pm-pcard" data-proj="'+esc(p.name)+'"><div class="pm-pcard-top"><div class="pm-pcard-name">'+esc(p.project_name||p.name)+'</div><div class="pm-pcard-top-r"><span class="pm-badge '+pst(p.status)+'">'+esc(p.status||"-")+'</span>'+pmProjMenuHtml(p)+'</div></div>'+
        '<div class="pm-pcard-meta"><span>Quản lý: '+esc(p.ec_manager||"-")+'</span>'+(p.ec_department?'<span>Phòng ban: '+esc(p.ec_department)+'</span>':'')+'</div>'+
        '<div class="pm-pcard-tags" style="display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px">'+pmProjTags(p).map(function(tg){var col=pmTagColor(tg);return '<span class="pm-ptag" style="display:inline-flex;align-items:center;gap:5px;background:'+col[0]+';color:'+col[1]+';border-radius:12px;padding:2px 9px;font-size:11px;font-weight:600">'+esc(tg)+'<span class="pm-ptag-x" data-proj="'+esc(p.name)+'" data-tag="'+esc(tg)+'" title="Bỏ nhãn" style="cursor:pointer;color:'+col[1]+';opacity:.55;font-size:10px">✕</span></span>';}).join("")+'<button class="pm-ptag-add" data-proj="'+esc(p.name)+'" title="Thêm nhãn" style="border:1px dashed #cbd5e1;background:none;border-radius:12px;padding:2px 9px;font-size:11px;color:var(--gray-500);cursor:pointer">+ Nhãn</button></div>'+
        '<div class="pm-pcard-prog"><div class="pm-prog"><i style="width:'+prog+'%"></i></div><span class="pm-prog-pct">'+prog+'%</span></div>'+
        '<div class="pm-pcard-sub">'+(p.task_done||0)+'/'+(p.task_total||0)+' nhiệm vụ hoàn thành</div></div>';
    }).join("")+'</div>';
    Array.prototype.forEach.call(c.querySelectorAll(".pm-pcard[data-proj]"),function(x){x.onclick=function(){openProject(x.getAttribute("data-proj"));};});
    Array.prototype.forEach.call(c.querySelectorAll(".pm-ptag-add"),function(b){b.onclick=function(e){e.stopPropagation();pmProjTagAddPopover(b,b.getAttribute("data-proj"));};});
    Array.prototype.forEach.call(c.querySelectorAll(".pm-ptag-x"),function(b){b.onclick=function(e){e.stopPropagation();pmProjTagRemove(b.getAttribute("data-proj"),b.getAttribute("data-tag"));};});
    /* menu wiring: stopPropagation so the card's openProject does not fire */
    Array.prototype.forEach.call(c.querySelectorAll(".pm-pcard-menu-btn"),function(b){b.onclick=function(e){e.stopPropagation();var pop=b.parentNode.querySelector(".pm-pcard-menu-pop");var willOpen=!pop.classList.contains("open");pmCloseProjMenus(pop);pop.classList.toggle("open",willOpen);};});
    Array.prototype.forEach.call(c.querySelectorAll(".pm-pcard-mi"),function(b){b.onclick=function(e){e.stopPropagation();if(b.disabled)return;var nm=b.getAttribute("data-proj");pmCloseProjMenus(null);if(b.getAttribute("data-act")==="edit")editProject(nm);else confirmDeleteProject(nm);};});}

  // Batch B: single project workspace = compact header + always-on health pill strip + in-place view switcher.
  function pdWorkHead(p,d){var lvl=d.risk_level||"low";var prog=Math.round(d.progress||0);
    var L={high:["Rủi ro cao","st-Blocked"],medium:["Cần chú ý","st-Review"],low:["Ổn định","st-Done"]}[lvl]||["Ổn định","st-Done"];
    return '<div class="pd-workhead"><div class="pd-wh-main"><div class="pd-wh-title">'+esc(p.project_name||window._pd.name)+'</div>'+
      '<div class="pd-wh-sub">Quản lý: '+esc(p.ec_manager||"-")+(p.ec_department?(" · "+esc(p.ec_department)):"")+'</div></div>'+
      '<div class="pd-wh-prog"><span class="pm-badge '+L[1]+'">'+L[0]+'</span><div class="pd-wh-bar"><div style="width:'+prog+'%"></div></div><span class="pd-wh-pct">'+prog+'%</span></div>'+
      '<button class="pm-btn primary" id="pm-newt"><svg class="icon icon-sm"><use href="#p-plus"/></svg> Tạo nhiệm vụ</button></div>';}
  function pdHealthPills(d){var rk=d.risk||{};
    var P=[["open","Đang mở",rk.active,"s-navy"],["overdue","Quá hạn",rk.overdue,"s-pink"],["review","Chờ duyệt",rk.review,"s-yellow"],["noassignee","Chưa giao",rk.no_assignee,"s-yellow"],["nodue","Chưa có hạn",rk.no_due,"s-navy"],["completed","Hoàn thành",rk.completed,"s-green"]];
    return P.map(function(p){return '<button class="pd-pill '+p[3]+'" data-card="'+p[0]+'" title="Lọc: '+esc(p[1])+'"><span class="pd-pill-n">'+(p[2]||0)+'</span><span class="pd-pill-l">'+p[1]+'</span></button>';}).join("");}
  function openProject(name){var c=el("pm-view");spin(c);window._pdFilter="";window._pdCurTab="tasks";
    window._pmOpenProject=name;if(typeof pmSetHash==="function")pmSetHash("#project/"+encodeURIComponent(name)); /* G5.2 §7: deep-linkable project detail */
    api(PM+"projects.detail",{name:name}).then(function(d){var p=d.project||{};window._pd={name:name,d:d};
      var VIEWSW=[["tasks","Danh sách"],["board","Kanban"],["calendar","Lịch"],["gantt","Gantt"],["timesheet","Timesheet"]];
      c.innerHTML='<button class="pm-btn" id="pm-back" style="margin-bottom:12px"><svg class="icon icon-sm"><use href="#p-back"/></svg> Dự án</button>'+
        pdWorkHead(p,d)+
        '<div class="pd-health" id="pd-health">'+pdHealthPills(d)+'</div>'+
        '<div class="pd-tabs" id="pd-switch">'+VIEWSW.map(function(t){return '<button class="pd-tab" data-view="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>'+
        '<div id="pd-body"></div>';
      el("pm-back").onclick=showProjects;
      if(el("pm-newt"))el("pm-newt").onclick=function(){newTask(name,null,function(){openProject(name);});}; /* refresh workspace + health after create */
      var sw=c.querySelectorAll("#pd-switch .pd-tab");
      function setView(v){window._pdCurTab=v;Array.prototype.forEach.call(sw,function(b){b.classList.toggle("active",b.getAttribute("data-view")===v);});pdRender(v);}
      window._pdSel=setView; /* metric-click / post-write refresh re-render the current view (keeps _pdFilter) */
      function syncPills(){Array.prototype.forEach.call(c.querySelectorAll("#pd-health .pd-pill[data-card]"),function(x){x.classList.toggle("active",x.getAttribute("data-card")===window._pdFilter);});}
      window._pdSyncPills=syncPills;
      Array.prototype.forEach.call(sw,function(b){b.onclick=function(){var v=b.getAttribute("data-view");if(v==="gantt"||v==="timesheet"||v==="calendar"){window._pdFilter="";}setView(v);syncPills();};}); /* manual switch to Gantt/Lịch/Timesheet clears metric filter */
      Array.prototype.forEach.call(c.querySelectorAll("#pd-health .pd-pill[data-card]"),function(x){x.onclick=function(){
        var k=x.getAttribute("data-card");window._pdFilter=(window._pdFilter===k)?"":k; /* toggle off if same pill */
        if(window._pdFilter&&window._pdCurTab!=="tasks"&&window._pdCurTab!=="board"){setView("tasks");}else{pdRender(window._pdCurTab);}
        syncPills();
      };});
      setView("tasks");syncPills();
    }).catch(function(e){errBox(c,e);});}
  function pdRender(tab){if(!window._pd)return;var name=window._pd.name;var b=el("pd-body");if(!b)return;
    if(tab==="tasks"){spin(b);return api(PM+"tasks.list",{project:name,page_length:500}).then(function(r){b.innerHTML='<div id="pd-tflt"></div><div id="pd-ttbl"></div>';renderPdFilterChip(el("pd-tflt"),(r.rows||[]).length);pdTaskTable(el("pd-ttbl"),r.rows||[]);}).catch(function(e){errBox(b,e);});}
    if(tab==="board"){spin(b);return api(PM+"tasks.list",{project:name,page_length:500}).then(function(r){
      if(["status","person"].indexOf(window._boardGroup)<0)window._boardGroup="status";var g=window._boardGroup;
      b.innerHTML='<div id="pd-bflt"></div><div class="pm-bgrp" style="display:flex;align-items:center;gap:8px;margin:0 0 10px"><span style="font-size:12px;color:var(--gray-500)">Nhóm:</span><div class="seg"><button data-pbg="status" class="'+(g==="status"?"active":"")+'">Trạng thái</button><button data-pbg="person" class="'+(g==="person"?"active":"")+'">Người</button></div></div><div id="pd-board"></div>';
      renderPdFilterChip(el("pd-bflt"),(r.rows||[]).length);
      Array.prototype.forEach.call(b.querySelectorAll("[data-pbg]"),function(x){x.onclick=function(){window._boardGroup=x.getAttribute("data-pbg");pdRender("board");};});
      renderBoardInto(el("pd-board"),pdFilterRows(r.rows||[]),function(){pdRender("board");});}).catch(function(e){errBox(b,e);});}
    if(tab==="calendar"){spin(b);return api(PM+"tasks.gantt",{project:name}).then(function(d){b.innerHTML='<div id="pd-cal"></div>';pdCalendar(el("pd-cal"),d.rows||[]);}).catch(function(e){errBox(b,e);});}
    if(tab==="gantt"){spin(b);return api(PM+"tasks.gantt",{project:name}).then(function(d){b.innerHTML='<div class="panel"><div id="pd-gantt"></div></div>';renderGantt(el("pd-gantt"),d.rows||[]);}).catch(function(e){errBox(b,e);});}
    if(tab==="timesheet"){spin(b);return api(PM+"timesheet.report",{project:name}).then(function(d){pdTimesheet(b,d);}).catch(function(e){errBox(b,e);});}}
  var PDF_LBL={open:"Đang mở",overdue:"Quá hạn",blocked:"Blocked",review:"Chờ duyệt",noassignee:"Chưa giao",nodue:"Chưa có hạn",completed:"Hoàn thành"};
  function pdFilterRows(rows){var k=window._pdFilter;if(!k)return rows||[];return (rows||[]).filter(function(t){
    if(k==="open")return ["Done","Cancelled"].indexOf(t.workflow_state)<0;
    if(k==="overdue")return isOverdue(t);
    if(k==="blocked")return t.workflow_state==="Blocked";
    if(k==="review")return t.workflow_state==="Review";
    if(k==="noassignee")return names(t._assign).length===0;
    if(k==="nodue")return !t.exp_end_date;
    if(k==="completed")return t.workflow_state==="Done";
    return true;});}
  function renderPdFilterChip(host,total){if(!host)return;var k=window._pdFilter;if(!k){host.innerHTML="";return;}
    host.innerHTML='<div style="margin-bottom:10px;display:flex;align-items:center;gap:8px"><span class="cal-pcard">Lọc: '+esc(PDF_LBL[k]||k)+' <span class="x" id="pd-fclear" title="Bỏ lọc">✕</span></span><span style="font-size:11.5px;color:var(--gray-400)">trong '+(total||0)+' nhiệm vụ</span></div>';
    if(el("pd-fclear"))el("pd-fclear").onclick=function(){window._pdFilter="";if(window._pdSel)window._pdSel(window._pdCurTab||"tasks");if(window._pdSyncPills)window._pdSyncPills();};}
  // Project-workspace-only list renderer: hierarchy (parent->child, indented, collapsible) when unfiltered;
  // flat filtered list when a health metric is active. Columns: Nhiệm vụ / Trạng thái / Ưu tiên / Hạn / Người nhận (no Dự án).
  // Does NOT touch the global taskTable used by Công việc + My Work.
  function pdRow(t,depth,hasChildren,childCount,collapsed){var term=(t.workflow_state==="Done"||t.workflow_state==="Cancelled");
    var priDisp=t.priority?'<span class="pm-tag '+({Urgent:"tg-urgent",High:"tg-high",Medium:"tg-medium",Low:"tg-low"}[t.priority]||"tg-low")+'">'+esc(t.priority)+'</span>':'<span class="pm-inline-empty">—</span>';
    var lead=hasChildren?'<span class="pd-tcaret'+(collapsed?' collapsed':'')+'" data-tcol="'+esc(t.name)+'" title="Thu/mở">▾</span>':'<span class="pd-tcaret-sp"></span>';
    var cnt=hasChildren?' <span class="pd-tcount">'+childCount+' nv con</span>':'';
    return '<tr data-task="'+esc(t.name)+'" class="pd-trow'+(depth>0?' pd-child':'')+' '+pmDepthClass(depth)+'"><td class="t-main"><div style="display:flex;align-items:flex-start;gap:9px"><span style="margin-left:'+(depth*20)+'px;flex:0 0 auto">'+pjCheck(t,true,true)+'</span><div style="flex:1;min-width:0"><span class="pd-tname">'+lead+'<span class="pm-open pd-ttitle" data-task="'+esc(t.name)+'" style="cursor:pointer'+(term?';text-decoration:line-through;color:var(--gray-400)':'')+'">'+esc(t.subject||t.name)+'</span>'+cnt+'</span>'+(labelChips(t,2)?'<div class="pm-labels-row" style="margin-top:4px">'+labelChips(t,2)+'</div>':'')+'</div></div></td><td><span class="pm-lstatus" data-task="'+esc(t.name)+'" title="Đổi trạng thái" style="cursor:pointer">'+badge(t.workflow_state)+'</span></td><td><span class="pm-inline pm-lpri" data-inline="priority" data-task="'+esc(t.name)+'" title="Sửa ưu tiên" style="cursor:pointer">'+priDisp+'</span></td><td><span class="pm-inline pm-ldue" data-inline="end" data-task="'+esc(t.name)+'" title="Sửa hạn" style="cursor:pointer">'+esc(fmtEndCell(t))+'</span></td><td><span class="pm-lasg" data-task="'+esc(t.name)+'" title="Thêm người nhận" style="cursor:pointer">'+pmAssignee(t,false)+'</span></td>'+(window._isLeader?'<td class="pm-act-col">'+pmTaskMenuHtml(t.name)+'</td>':'')+'</tr>';}
  function pdTaskTable(host,rows){if(!host)return;rows=rows||[];var lead=!!window._isLeader;var proj=(window._pd&&window._pd.name)||"";var byName={};rows.forEach(function(t){byName[t.name]=t;});
    var head='<div class="pd-tbl-wrap"><table class="pm-tbl pd-tbl"><thead><tr><th>Nhiệm vụ</th><th>Trạng thái</th><th>Ưu tiên</th><th>Hạn</th><th>Người nhận</th>'+(lead?'<th class="pm-act-col"></th>':'')+'</tr></thead><tbody>';
    var body="";
    if(window._pdFilter){ /* filtered -> flat (avoid orphaned children) */
      var fr=pdFilterRows(rows);
      body=fr.length?fr.map(function(t){return pdRow(t,0,false,0,false);}).join(""):'<tr><td colspan="'+(5+(lead?1:0))+'" style="color:var(--gray-400);padding:12px">Không có nhiệm vụ khớp bộ lọc.</td></tr>';
    } else { /* unfiltered -> hierarchy */
      var byId={},byParent={},roots=[];
      rows.forEach(function(t){byId[t.name]=t;});
      rows.forEach(function(t){var p=t.parent_task;if(p&&byId[p]){(byParent[p]=byParent[p]||[]).push(t);}else{roots.push(t);}});
      window._pdTreeCollapsed=window._pdTreeCollapsed||{};
      function walk(t,depth){var kids=byParent[t.name]||[];var hc=kids.length>0;var col=!!window._pdTreeCollapsed[t.name];
        body+=pdRow(t,depth,hc,kids.length,col);
        if(hc&&!col)kids.forEach(function(c){walk(c,depth+1);});}
      roots.forEach(function(t){walk(t,0);});
      if(!rows.length){body='<tr><td colspan="'+(5+(lead?1:0))+'" style="color:var(--gray-400);padding:12px">Chưa có nhiệm vụ.</td></tr>';}
    }
    if(!window._pdFilter){body+='<tr class="pm-addrow"><td colspan="'+(5+(lead?1:0))+'" style="padding:0"><div class="pm-addtask" style="display:flex;align-items:center;gap:6px;padding:9px 12px;color:var(--navy);cursor:pointer;font-size:13px"><span style="font-size:15px;line-height:1">+</span> Thêm nhiệm vụ</div></td></tr>';}
    host.innerHTML=head+body+'</tbody></table></div>';
    function rerender(){pdTaskTable(host,rows);}
    Array.prototype.forEach.call(host.querySelectorAll(".pm-open[data-task]"),function(x){x.onclick=function(e){e.stopPropagation();openTask(x.getAttribute("data-task"));};});
    Array.prototype.forEach.call(host.querySelectorAll(".pd-tcaret[data-tcol]"),function(x){x.onclick=function(e){e.stopPropagation();var id=x.getAttribute("data-tcol");window._pdTreeCollapsed=window._pdTreeCollapsed||{};window._pdTreeCollapsed[id]=!window._pdTreeCollapsed[id];rerender();};});
    Array.prototype.forEach.call(host.querySelectorAll(".pj-check[data-task]"),function(x){x.onclick=function(e){e.stopPropagation();var nm=x.getAttribute("data-task"),term=x.getAttribute("data-term")==="1";
      if(term){api(PM+"tasks.set_status",{name:nm,action:"To Do"}).then(function(){toast(nm+" → To Do");pjSetLocalState(nm,"To Do");rerender();}).catch(function(er){toast("Lỗi: "+errOf(er),true);});}
      else{openDonePopup(nm,"Done",function(){pjSetLocalState(nm,"Done");rerender();});}};});
    Array.prototype.forEach.call(host.querySelectorAll(".pm-inline[data-task]"),function(x){x.onclick=function(e){e.stopPropagation();var t=byName[x.getAttribute("data-task")];if(t)startInline(x,t,t.name);};});
    Array.prototype.forEach.call(host.querySelectorAll(".pm-lstatus[data-task]"),function(x){x.onclick=function(e){e.stopPropagation();pmListStatusPopover(x,x.getAttribute("data-task"),rerender);};});
    Array.prototype.forEach.call(host.querySelectorAll(".pm-lasg[data-task]"),function(x){x.onclick=function(e){e.stopPropagation();var nm=x.getAttribute("data-task");pmListAsgPopover(x,nm,function(r2){if(r2&&r2._assign&&byName[nm])byName[nm]._assign=r2._assign;rerender();});};});
    var addrow=host.querySelector(".pm-addtask");if(addrow){addrow.onclick=function(){var td=addrow.parentNode;
      td.innerHTML='<div style="display:flex;gap:8px;padding:8px 12px"><input class="pm-input" id="pd-addinp" placeholder="Tên nhiệm vụ — Enter để tạo" style="flex:1;padding-left:11px;background-image:none"><button class="pm-btn primary" id="pd-addgo">Tạo</button><button class="pm-btn" id="pd-addcancel">Huỷ</button></div>';
      var inp=host.querySelector("#pd-addinp");if(inp)inp.focus();
      function mk(){var v=(inp.value||"").trim();if(!v){toast("Nhập tên nhiệm vụ",true);return;}var b=host.querySelector("#pd-addgo");b.disabled=true;api(PM+"tasks.create",{subject:v,project:proj}).then(function(){toast("Đã tạo nhiệm vụ");pdRender("tasks");}).catch(function(er){toast("Lỗi: "+errOf(er),true);b.disabled=false;});}
      host.querySelector("#pd-addgo").onclick=mk;host.querySelector("#pd-addcancel").onclick=rerender;
      if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();mk();}else if(e.key==="Escape"){e.preventDefault();rerender();}});
    };}
    pmWireTaskMenus(host);}
  function renderSumInto(host,m){if(!host)return;var ks=Object.keys(m||{}).sort().reverse();if(!ks.length){return emptyBox(host,"Không có dữ liệu.");}
    host.innerHTML='<table class="pm-tbl"><tbody>'+ks.map(function(k){return '<tr><td class="t-main">'+esc(k)+'</td><td style="text-align:right">'+(Math.round(m[k]*100)/100)+'h</td></tr>';}).join("")+'</tbody></table>';}
  function pdTimesheet(b,d){var rows=d.rows||[];var total=Math.round((d.total_hours||0)*100)/100;
    b.innerHTML='<div class="stats-strip" style="grid-template-columns:repeat(3,1fr)">'+sc("s-navy","Tổng giờ",total)+sc("s-green","Số log",rows.length)+sc("s-yellow","Người",uniq(rows.map(function(r){return r.owner;})).length)+'</div>'+
      '<div class="panel"><div class="panel-header"><div class="panel-title">Theo tháng</div></div><div id="pd-ts-sum"></div></div>'+
      '<div class="panel"><div class="panel-header"><div class="panel-title">Chi tiết log</div></div><div id="pd-ts-tbl"></div></div>';
    renderSumInto(el("pd-ts-sum"),d.by_month||{});

  /* Client-side preview of upcoming generation dates (mirrors backend _advance: Daily/Weekly multi-weekday/Monthly-on-day, from start, until end). Approximate, labelled "dự kiến". */
  function recPreviewDates(s){var out=[],today=new Date();today.setHours(0,0,0,0);
    var start=s.start?new Date(s.start+"T00:00:00"):new Date(today);if(isNaN(start))start=new Date(today);if(start<today)start=new Date(today);
    var end=s.end?new Date(s.end+"T00:00:00"):null;if(end)end.setHours(0,0,0,0);
    function ok(d){return !end||d<=end;}
    if(s.freq==="Daily"){var d=new Date(start);for(var i=0;i<800&&out.length<6;i++){if(!ok(d))break;out.push(new Date(d));d.setDate(d.getDate()+1);}}
    else if(s.freq==="Weekly"){var wd=(s.wd&&s.wd.length)?s.wd:[(start.getDay()+6)%7];var d=new Date(start);for(var i=0;i<800&&out.length<6;i++){if(!ok(d))break;if(wd.indexOf((d.getDay()+6)%7)>=0)out.push(new Date(d));d.setDate(d.getDate()+1);}}
    else if(s.freq==="Monthly"){var day=s.monthlyDay||start.getDate();var m=new Date(start.getFullYear(),start.getMonth(),1);for(var i=0;i<80&&out.length<6;i++){var dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();var dd=new Date(m.getFullYear(),m.getMonth(),Math.min(day,dim));if(dd>=start){if(!ok(dd))break;out.push(dd);}m.setMonth(m.getMonth()+1);}}
    return out;}

    var DOW=["CN","T2","T3","T4","T5","T6","CN"];var vn=["CN","T2","T3","T4","T5","T6","T7"];

  function recScheduleCollect(c){

  /* Lightweight searchable dropdown (single or multi). Keeps a hidden input (id) holding the value:
     single = one value; multi = comma-joined. options = [{v,l}]. So callers/save read el(id).value unchanged. */
  function pmWireCombo(comboId,options,o){o=o||{};var multi=!!o.multi;var pick=o.onPick;var canCreate=!!o.allowCreate;var wrap=el(comboId);if(!wrap)return;
    var hidden=wrap.querySelector('input[type=hidden]');var inp=wrap.querySelector('.pm-combo-input');var menu=wrap.querySelector('.pm-combo-menu');var chips=wrap.querySelector('.pm-combo-chips');
    function labelOf(v){for(var i=0;i<options.length;i++)if(options[i].v===v)return options[i].l;return v;}
    function sel(){return ((hidden&&hidden.value)||"").split(",").map(function(x){return x.trim();}).filter(Boolean);}
    function renderChips(){if(!chips)return;var vs=sel();chips.innerHTML=vs.map(function(v){return '<span class="pm-combo-chip">'+esc(labelOf(v))+'<span class="pm-combo-x" data-rm="'+esc(v)+'">✕</span></span>';}).join("");
      Array.prototype.forEach.call(chips.querySelectorAll('[data-rm]'),function(x){x.onmousedown=function(e){e.preventDefault();e.stopPropagation();var v=x.getAttribute('data-rm');hidden.value=sel().filter(function(y){return y!==v;}).join(",");renderChips();};});}
    function close(){menu.style.display="none";}
    function addChip(v){v=(v||"").trim();if(!v)return;if(sel().indexOf(v)<0)hidden.value=sel().concat([v]).join(",");inp.value="";renderChips();render("");}
    function render(q){var ql=(q||"").toLowerCase();var s=sel();var qt=(q||"").trim();
      var list=options.filter(function(op){if(multi&&op.v&&s.indexOf(op.v)>=0)return false;return !ql||((op.l||"").toLowerCase().indexOf(ql)>=0||(op.v||"").toLowerCase().indexOf(ql)>=0);}).slice(0,60);
      var html=list.map(function(op){return '<div class="pm-combo-opt" data-v="'+esc(op.v)+'">'+esc(op.l)+((op.v&&op.l!==op.v)?' <span class="pm-combo-sub">'+esc(op.v)+'</span>':'')+'</div>';}).join("");
      if(canCreate&&qt&&!options.some(function(op){return (op.v||"").toLowerCase()===qt.toLowerCase();})&&s.indexOf(qt)<0)html+='<div class="pm-combo-opt pm-combo-create" data-create="'+esc(qt)+'">＋ Tạo “'+esc(qt)+'”</div>';
      menu.innerHTML=html||'<div class="pm-combo-empty">Không có kết quả</div>';
      Array.prototype.forEach.call(menu.querySelectorAll('.pm-combo-opt'),function(op){op.onmousedown=function(e){e.preventDefault();
        var cr=op.getAttribute('data-create');if(cr!=null){addChip(cr);return;}
        var v=op.getAttribute('data-v');
        if(pick){pick(v);inp.value="";close();return;}
        if(multi)addChip(v);
        else{hidden.value=v;inp.value=v?labelOf(v):"";close();}};});}
    function open(){menu.style.display="block";render(inp.value);}
    inp.addEventListener('focus',open);inp.addEventListener('input',function(){open();render(inp.value);});
    inp.addEventListener('keydown',function(e){if(e.key==="Enter"&&canCreate&&multi){var qt=(inp.value||"").trim();if(qt){e.preventDefault();addChip(qt);}}});
    inp.addEventListener('blur',function(){setTimeout(function(){close();if(!multi){var v=hidden.value;inp.value=v?labelOf(v):"";}},160);});
    if(multi)renderChips();else if(hidden){var v0=hidden.value;if(v0)inp.value=labelOf(v0);}}

    body+=step(3,"g-s3","p-inbox","Giao việc cho người khác",
      'Có hai cách giao việc, tùy bạn muốn giao thẳng hay cần người nhận đồng ý trước.',
      ['<b>Cách 1 — Phân công ngay:</b> trong nhiệm vụ, ô <b>Người thực hiện</b> gõ tên/email để chọn. Việc được giao ngay, người đó thấy trong “Việc của tôi”.',
       'Giao cho <b>nhiều người</b>: là một việc chung — ai hoàn thành thì cả nhóm cùng xong.',
       '<b>Cách 2 — Yêu cầu xác nhận:</b> vào <span class="g-pill">Yêu cầu giao việc</span> → <b>+ Yêu cầu xác nhận</b>, chọn người nhận và đề xuất lịch (ngày + giờ).',
       'Người nhận có thể <b>Đồng ý</b>, <b>Từ chối</b>, hoặc <b>đề xuất lịch khác</b>. Bạn sẽ được nhắc lại khi họ phản hồi.'],

    body+=step(5,"g-s5","p-bell","Việc của tôi & Nhắc việc",
      'Đây là nơi bạn xem mọi việc đang chờ mình xử lý.',
      ['<span class="g-pill">Việc của tôi</span>: tất cả nhiệm vụ được giao cho bạn.',
       'Chuông <b>Nhắc việc</b> ở góc trên: gom việc theo <b>Trễ hạn</b>, <b>Hôm nay</b>, <b>Sắp tới</b>, <b>Không hạn</b>.',
       'Yêu cầu giao việc đang chờ bạn phản hồi cũng xuất hiện ở đây.',

    body+=step(8,"g-s8","p-repeat","Việc lặp lại tự động (Recurring)",
      'Với việc làm đi làm lại theo lịch (hằng ngày/tuần/tháng), tạo một quy tắc — hệ thống tự sinh nhiệm vụ mới.',
      ['Vào <span class="g-pill">Recurring</span> → <b>+ Tạo việc định kỳ</b>.',
       'Điền nội dung nhiệm vụ (tên, mô tả, người thực hiện, checklist, nhiệm vụ con) — đây là “khuôn” cho mỗi lần tạo.',
       'Chọn <b>Tần suất</b> (hằng ngày/tuần/tháng), ngày <b>Bắt đầu áp dụng</b> và <b>Lặp cho tới ngày</b>.',

      setTimeout(function(){ document.addEventListener("mousedown",outside,true); document.addEventListener("keydown",onEsc,true); document.addEventListener("scroll",closePop,true); },0);
    }

      var chips=host._pmSel.map(function(id){ var l=cat(id); return '<span class="pm-lblchip pm-lbl-'+esc(l.color_key||"gray")+'">'+esc(l.label_name||id)+'<button type="button" class="pm-lblchip-x" data-rmlid="'+esc(id)+'" aria-label="Bỏ nhãn">×</button></span>'; }).join("");
      host.innerHTML='<div class="pm-lblwrap">'+chips+'<button type="button" class="pm-lbladd" data-lbladd="1"><svg class="icon icon-sm"><use href="#p-plus"/></svg> Chọn nhãn</button></div><div class="pm-lblpop" hidden></div>';
      Array.prototype.forEach.call(host.querySelectorAll("[data-rmlid]"),function(b){ b.onclick=function(e){ e.stopPropagation(); var id=b.getAttribute("data-rmlid"); host._pmSel=host._pmSel.filter(function(x){return x!==id;}); render(); }; });
      host.querySelector("[data-lbladd]").onclick=function(e){ e.stopPropagation(); openPop(); };
    }
    render();
  }

  function startTimerClock(run){stopTimerClock();if(!run)return;window._tcTick=setInterval(function(){var cl=document.querySelector("#tb-timer .tt-clock");var at=window._activeTimer;if(!cl||!at){stopTimerClock();return;}cl.textContent=fmtDur(at.base+Math.floor((Date.now()-at.t0)/1000));},1000);}

  function ecEnsureGuideNav(){
    try{
      if(document.querySelector('.ec-shell-item[href$="#guide"]')) return;
      var items=document.querySelectorAll('.ec-shell-nav .ec-shell-item[href*="/pm#"]');

      g.setAttribute("href","/pm#guide");
      g.setAttribute("data-ec-shell-key","pm.view.guide");
      g.classList.remove("ec-shell-active");

      last.parentNode.insertBefore(g, last.nextSibling);

  function ecGuideActive(){
    try{
      var map={guide:"#guide", schedule:"#schedule"}, cur=window._curView;
      ["guide","schedule"].forEach(function(v){
        var it=document.querySelector('.ec-shell-item[href$="'+map[v]+'"]'); if(!it) return;

        else { it.classList.remove("ec-shell-active"); }
